e":{"en":"Contractor","t":"ଠିକାଦାର","s":"draft"},"persona.contractor.tagline":{"en":"You price it and deliver it. Margin lives in what's invisible.","t":"ଆପଣ ଦାମ ଠିକ୍ କରନ୍ତି ଆଉ କାମ ବୁଝାଇ ଦିଅନ୍ତି। ଲାଭ ଲୁଚିଥାଏ ଯାହା ଦିଶେ ନାହିଁ ସେଥିରେ।","s":"draft"},"persona.contractor.seat":{"en":"You quoted a number to win the job. Everything below ground is where you find that number again.","t":"କାମଟା ପାଇବା ପାଇଁ ଆପଣ ଗୋଟିଏ ଦାମ କହିଥିଲେ। ମାଟି ତଳର ସବୁ କାମରେ ହିଁ ଆପଣ ସେ ଦାମକୁ ପୁଣି ଖୋଜି ପାଆନ୍ତି।","s":"draft"},"persona.maistry.name":{"en":"Maistry","t":"ମିସ୍ତ୍ରୀ","s":"draft"},"persona.maistry.tagline":{"en":"You actually build it. Your hands, your call, on site.","t":"ଆସଲରେ ଆପଣ ହିଁ ଏହାକୁ ତିଆରି କରନ୍ତି। ସାଇଟ୍‌ରେ ଆପଣଙ୍କ ହାତ, ଆପଣଙ୍କ ନିଷ୍ପତ୍ତି।","s":"draft"},"persona.maistry.seat":{"en":"The drawing ran out three lines above the ground. From here it is memory and habit.","t":"ଡ୍ରଇଂ ମାଟିଠାରୁ ତିନି ଲାଇନ୍ ଉପରେ ସରିଯାଇଛି। ଏଇଠୁ ଆଗକୁ ସବୁ ମନେ ରଖିବା ଆଉ ଅଭ୍ୟାସ।","s":"draft"},"d.organise.section":{"en":"SETTING UP","t":"ଆରମ୍ଭ","s":"draft"},"d.organise.prompt":{"en":"Who's going to organise this build?","t":"ଏ ଘର ତିଆରି କାମ କିଏ ସମ୍ଭାଳିବ?","s":"draft"},"d.organise.opt.maistri":{"en":"A maistry I know — he built my cousin's place","t":"ମୋର ଜଣାଶୁଣା ଜଣେ ମିସ୍ତ୍ରୀ — ସେ ମୋ ଭାଇର ଘର କରିଥିଲା","s":"draft"},"d.organise.opt.contractor":{"en":"A contractor, fixed price, he handles everything","t":"ଜଣେ ଠିକାଦାର, ଦାମ ଫିକ୍ସ, ସବୁ ସେ ସମ୍ଭାଳିବ","s":"draft"},"d.organise.opt.professional":{"en":"An architect and engineer first, then a contractor","t":"ପ୍ରଥମେ ଆର୍କିଟେକ୍ଟ ଆଉ ଇଞ୍ଜିନିୟର, ତା'ପରେ ଠିକାଦାର","s":"draft"},"d.organise.reveal.fact":{"en":"Most peri-urban homes in this belt are built on trust, not on paper. The maistry route is cheaper and faster, and it produces no document at all.","t":"ଏ ଅଞ୍ଚଳରେ ସହର ଧାରର ଅଧିକାଂଶ ଘର କାଗଜ ଉପରେ ନୁହେଁ, ବିଶ୍ୱାସ ଉପରେ ତିଆରି ହୁଏ। ମିସ୍ତ୍ରୀ ରାସ୍ତା ଶସ୍ତା ଆଉ ଫାଷ୍ଟ, ଆଉ ଏଥିରେ ଆଦୌ କୌଣସି କାଗଜ ତିଆରି ହୁଏ ନାହିଁ।","s":"draft"},"d.organise.reveal.cost":{"en":"Indicative: maistry-led saves roughly 4–7% of build cost. It also removes the only person contractually obliged to think about the tank.","t":"ଆନୁମାନିକ: ମିସ୍ତ୍ରୀଙ୍କ ଦ୍ୱାରା କରାଇଲେ ଘର ଖର୍ଚ୍ଚର ପ୍ରାୟ 4–7% ବଞ୍ଚେ। ଏହା ସେହି ଏକମାତ୍ର ଲୋକଙ୍କୁ ବି ହଟାଇ ଦିଏ, ଚୁକ୍ତି ଅନୁସାରେ ଟାଙ୍କି ବିଷୟରେ ଭାବିବା ଯାହାର କାମ।","s":"draft"},"d.organise.reveal.twist":{"en":"The cheapest route isn't the one with no professional. It's the one where the professional is hired and then ignored.","t":"ସବୁଠୁ ଶସ୍ତା ରାସ୍ତା ସେଇଟା ନୁହେଁ ଯେଉଁଠି ପେସାଦାର ଲୋକ ନାହାନ୍ତି। ସେଇଟା, ଯେଉଁଠି ପେସାଦାର ଲୋକ ରଖାଯାଇଛି ଆଉ ପରେ ତାଙ୍କ କଥା ଶୁଣା ଯାଉନାହିଁ।","s":"draft"},"d.organise.reveal.lesson":{"en":"A septic tank has no client. Nobody in the room is paying to make it emptiable. Whoever organises the build inherits that silence by default.","t":"ସେପ୍ଟିକ୍ ଟାଙ୍କିର କୌଣସି ଗ୍ରାହକ ନାହିଁ। ଏହାକୁ ଖାଲି କରିବା ସହଜ କରିବା ପାଇଁ ଏଠି କେହି ଟଙ୍କା ଦେଉନାହାନ୍ତି। ଯିଏ ଘର ତିଆରି ସମ୍ଭାଳେ, ଏ ନୀରବତା ଆପେ ତା ଉପରେ ପଡ଼େ।","s":"draft"},"d.organise.analysis.maistri":{"en":"You chose the relationship over the record. It will probably build you a good house. It leaves nothing behind that explains what's under the driveway.","t":"ଆପଣ କାଗଜ ବଦଳରେ ସମ୍ପର୍କକୁ ବାଛିଲେ। ସମ୍ଭବତଃ ଏଥିରେ ଆପଣଙ୍କର ଭଲ ଘର ହେବ। କିନ୍ତୁ ଗାଡ଼ି ରାସ୍ତା ତଳେ କ'ଣ ଅଛି ତାହା ବୁଝାଇବା ପାଇଁ ଏହା କିଛି ଛାଡ଼ି ଯାଏ ନାହିଁ।","s":"draft"},"d.organise.analysis.contractor":{"en":"You bought a single point of blame. That's real accountability — but only for things written into the quote. Watch what the quote says about the tank.","t":"ଆପଣ ଦୋଷ ଦେବା ପାଇଁ ଗୋଟିଏ ଲୋକ କିଣିଲେ। ସେଇଟା ପ୍ରକୃତ ଜବାବଦିହି — କିନ୍ତୁ କେବଳ କୋଟେସନ୍‌ରେ ଲେଖା ହୋଇଥିବା କଥା ପାଇଁ। କୋଟେସନ୍ ଟାଙ୍କି ବିଷୟରେ କ'ଣ କହୁଛି ଦେଖନ୍ତୁ।","s":"draft"},"d.organise.analysis.professional":{"en":"You've put two people in the room whose job is to know. Whether they use that knowledge is the next twenty minutes of this game.","t":"ଆପଣ ଦୁଇ ଜଣଙ୍କୁ ଆଣିଲେ ଯାହାଙ୍କ କାମ ହେଉଛି ଜାଣିବା। ସେମାନେ ସେ ଜ୍ଞାନ ବ୍ୟବହାର କରିବେ କି ନାହିଁ — ସେଇଟା ଏ ଖେଳର ପରବର୍ତ୍ତୀ କୋଡ଼ିଏ ମିନିଟ୍।","s":"draft"},"d.location.section":{"en":"THE SITE","t":"ସାଇଟ୍","s":"draft"},"d.location.prompt":{"en":"Where does the tank go on the site?","t":"ସାଇଟ୍‌ରେ ଟାଙ୍କି କେଉଁଠି ହେବ?","s":"draft"},"d.location.opt.vastu":{"en":"Where vastu allows — southwest is out, so northwest corner","t":"ଯେଉଁଠି ବାସ୍ତୁ ମାନୁଛି — ଦକ୍ଷିଣ-ପଶ୍ଚିମ ବାଦ, ତେଣୁ ଉତ୍ତର-ପଶ୍ଚିମ କୋଣ","s":"draft"},"d.location.opt.behind":{"en":"Behind the house, out of sight","t":"ଘର ପଛପଟେ, ଆଖିରୁ ଦୂରେ","s":"draft"},"d.location.opt.gate":{"en":"Near the gate, where a truck can actually reach","t":"ଗେଟ୍ ପାଖରେ, ଯେଉଁଠି ଟ୍ରକ୍ ପ୍ରକୃତରେ ପହଞ୍ଚି ପାରିବ","s":"draft"},"d.location.reveal.fact":{"en":"A desludging truck carries 30 m of hose and needs somewhere to stand. When the tank sits behind a built house, the hose either doesn't reach or has to be dragged through the kitchen.","t":"ପଙ୍କ ଉଠାଉଥିବା ଟ୍ରକ୍‌ରେ 30 ମିଟର ହୋଜ୍ ଥାଏ ଆଉ ଠିଆ ହେବାକୁ ଜାଗା ଦରକାର। ଟାଙ୍କି ଯଦି ତିଆରି ହୋଇଥିବା ଘର ପଛରେ ଥାଏ, ତେବେ ହୋଜ୍ ହୁଏତ ପହଞ୍ଚେ ନାହିଁ, ନହେଲେ ରୋଷେଇ ଘର ଦେଇ ଟାଣି ନେବାକୁ ପଡ଼େ।","s":"draft"},"d.location.reveal.cost":{"en":"Indicative: an unreachable tank adds ₹1,500–4,000 per desludging, every time, forever — and is the single most common reason a worker climbs in instead.","t":"ଆନୁମାନିକ: ପହଞ୍ଚି ନ ହେଉଥିବା ଟାଙ୍କି ପାଇଁ ପ୍ରତ୍ୟେକ ଥର ପଙ୍କ ଉଠାଇବାରେ ₹1,500–4,000 ଅଧିକ ଲାଗେ, ପ୍ରତ୍ୟେକ ଥର, ସବୁଦିନ ପାଇଁ — ଆଉ ଏଇଟା ହିଁ ଶ୍ରମିକ ଭିତରକୁ ଓହ୍ଲାଇବାର ସବୁଠୁ ସାଧାରଣ କାରଣ।","s":"draft"},"d.location.reveal.twist":{"en":"Vastu isn't the villain. Vastu plus a compound wall built later is. Most tanks become unreachable years after they were placed.","t":"ବାସ୍ତୁ ଦୋଷୀ ନୁହେଁ। ବାସ୍ତୁ ସହ ପରେ ତିଆରି ହେଉଥିବା ଚାରିକାନ୍ଥ ମିଶିଲେ ଦୋଷ ହୁଏ। ଅଧିକାଂଶ ଟାଙ୍କି ବସିବାର କେତେ ବର୍ଷ ପରେ ପହଞ୍ଚିବା ବାହାରକୁ ଚାଲିଯାଏ।","s":"draft"},"d.location.reveal.lesson":{"en":"Access is decided in the first ten minutes of site planning, by people thinking about the house, not about the tank. It is almost never revisited.","t":"ସାଇଟ୍ ପ୍ଲାନ୍‌ର ପ୍ରଥମ ଦଶ ମିନିଟ୍‌ରେ ପହଞ୍ଚ ଠିକ୍ ହୋଇଯାଏ, ଆଉ ସେ ସମୟରେ ଲୋକେ ଘର ବିଷୟରେ ଭାବୁଥାନ୍ତି, ଟାଙ୍କି ବିଷୟରେ ନୁହେଁ। ଏହା ପରେ ପ୍ରାୟ କେବେ ବି ଫେରି ଦେଖାଯାଏ ନାହିଁ।","s":"draft"},"d.location.analysis.vastu":{"en":"You optimised for the family's sense of rightness about the house. That's a real value. It just happens to be the constraint that most often strands the tank behind a wall.","t":"ଘର ବିଷୟରେ ପରିବାରର ମନ ଶାନ୍ତି ପାଇଁ ଆପଣ ଏହା କଲେ। ସେଇଟା ଏକ ପ୍ରକୃତ ମୂଲ୍ୟ। କେବଳ କଥା ହେଉଛି, ଏଇ ବାଧା ହିଁ ସବୁଠୁ ବେଶି ଥର ଟାଙ୍କିକୁ କାନ୍ଥ ପଛରେ ଫସାଇ ଦିଏ।","s":"draft"},"d.location.analysis.behind":{"en":"Out of sight solves today's problem and creates the 2048 one. Ask yourself where the truck stands — if the answer is 'the road', measure the distance now.","t":"ଆଖିରୁ ଦୂରେ ରଖିଲେ ଆଜିର ସମସ୍ୟା ମେଣ୍ଟେ ଆଉ 2048ର ସମସ୍ୟା ତିଆରି ହୁଏ। ନିଜକୁ ପଚାରନ୍ତୁ ଟ୍ରକ୍ କେଉଁଠି ଠିଆ ହେବ — ଯଦି ଉତ୍ତର 'ରାସ୍ତାରେ', ତେବେ ଏବେ ହିଁ ଦୂରତା ମାପି ନିଅନ୍ତୁ।","s":"draft"},"d.location.analysis.gate":{"en":"You made the truck a design input. This one decision does more for the person emptying this tank than everything else on this list combined.","t":"ଆପଣ ଟ୍ରକ୍‌କୁ ଡିଜାଇନର ଏକ ସର୍ତ୍ତ କରିଦେଲେ। ଏ ଟାଙ୍କି ଖାଲି କରୁଥିବା ଲୋକ ପାଇଁ ଏ ଗୋଟିଏ ନିଷ୍ପତ୍ତି, ଏ ତାଲିକାର ବାକି ସବୁ ମିଶାଇଲେ ଯେତିକି ହୁଅନ୍ତା, ତା'ଠାରୁ ଅଧିକ କାମ କରେ।","s":"draft"},"d.budget_cut.section":{"en":"MONEY","t":"ଟଙ୍କା","s":"draft"},"d.budget_cut.prompt":{"en":"The quote came in ₹1.2 lakh over. Something has to go.","t":"କୋଟେସନ୍ ₹1.2 ଲକ୍ଷ ବେଶି ଆସିଲା। କିଛି ଗୋଟିଏ ଛାଡ଼ିବାକୁ ପଡ଼ିବ।","s":"draft"},"d.budget_cut.opt.tank":{"en":"The septic tank spec. It's buried — nobody will ever see it","t":"ସେପ୍ଟିକ୍ ଟାଙ୍କିର ସ୍ପେକ୍। ତାହା ତ ପୋତା ହୋଇଯିବ — କେହି ଦେଖିବେ ନାହିଁ","s":"draft"},"d.budget_cut.opt.finish":{"en":"The front elevation cladding. Costs the same, shows the most","t":"ଆଗ ଏଲିଭେସନ୍‌ର କ୍ଲାଡିଂ। ଖର୍ଚ୍ଚ ସମାନ, ଦିଶେ ସବୁଠୁ ବେଶି","s":"draft"},"d.budget_cut.opt.delay":{"en":"Nothing. Delay moving in by two months and find the money","t":"କିଛି ନୁହେଁ। ଦୁଇ ମାସ ଡେରିରେ ଘରକୁ ଯିବା ଆଉ ଟଙ୍କା ଯୋଗାଡ଼ କରିବା","s":"draft"},"d.budget_cut.reveal.fact":{"en":"When a build goes over, the cut lands on what can't be seen from the road. Underground work is the first line item to lose its specification and the last to get it back.","t":"ଘର ତିଆରି ବଜେଟ୍ ବଢ଼ିଗଲେ, କଟ୍ ସେଇଠି ପଡ଼େ ଯାହା ରାସ୍ତାରୁ ଦିଶେ ନାହିଁ। ମାଟି ତଳର କାମ ହିଁ ପ୍ରଥମେ ନିଜ ସ୍ପେସିଫିକେସନ୍ ହରାଏ ଆଉ ସବା ଶେଷରେ ତାହା ଫେରି ପାଏ।","s":"draft"},"d.budget_cut.reveal.cost":{"en":"Indicative: the full difference between a bare ring tank and a properly detailed two-chamber tank with covers and vent is ₹25,000–45,000 — roughly a third of that overrun.","t":"ଆନୁମାନିକ: ଖାଲି ରିଙ୍ଗ୍ ଟାଙ୍କି ଆଉ କଭର୍ ଓ ଭେଣ୍ଟ୍ ସହିତ ଠିକ୍ ଭାବେ ତିଆରି ଦୁଇ-ଚାମ୍ବର୍ ଟାଙ୍କି ମଧ୍ୟରେ ପୁରା ପାର୍ଥକ୍ୟ ₹25,000–45,000 — ଅର୍ଥାତ୍ ସେ ବଢ଼ି ଯାଇଥିବା ଟଙ୍କାର ପ୍ରାୟ ଏକ ତୃତୀୟାଂଶ।","s":"draft"},"d.budget_cut.reveal.twist":{"en":"The tank is rarely cut outright. It's downgraded quietly, by removing the covers and the vent, which is where almost all of the worker-safety value sits.","t":"ଟାଙ୍କି କ୍ୱଚିତ୍ ପୁରା କଟେ। ଚୁପ୍‌ଚାପ୍ ତାର ମାନ କମାଇ ଦିଆଯାଏ — କଭର୍ ଆଉ ଭେଣ୍ଟ୍ ବାଦ ଦେଇ, ଆଉ ଶ୍ରମିକ ସୁରକ୍ଷାର ପ୍ରାୟ ସବୁ ମୂଲ୍ୟ ସେଇଠି ହିଁ ଥାଏ।","s":"draft"},"d.budget_cut.reveal.lesson":{"en":"Invisible work loses every budget argument it is in. The only defence is to price the covers and the vent as separate, named lines — so cutting them is a visible act.","t":"ଯେଉଁ କାମ ଦିଶେ ନାହିଁ, ସେ ପ୍ରତ୍ୟେକ ବଜେଟ୍ ଯୁକ୍ତିରେ ହାରେ। ଏକମାତ୍ର ବଞ୍ଚିବା ବାଟ ହେଉଛି କଭର୍ ଆଉ ଭେଣ୍ଟ୍‌କୁ ଅଲଗା, ନାଁ ଲେଖା ଲାଇନ୍ ଭାବେ ଦାମ ଦେବା — ତେବେ ସେଗୁଡ଼ିକ କାଟିଲେ ସେ କଥା ଦେଖା ଯିବ।","s":"draft"},"d.budget_cut.analysis.tank":{"en":"Honest answer, and the most common one. You saved real money on the thing you'll never look at. The cost has been transferred, not removed — to a stranger, in twenty years.","t":"ସଚ୍ଚୋଟ ଉତ୍ତର, ଆଉ ସବୁଠୁ ସାଧାରଣ। ଯାହାକୁ ଆପଣ କେବେ ଦେଖିବେ ନାହିଁ, ସେଥିରୁ ଆପଣ ପ୍ରକୃତ ଟଙ୍କା ବଞ୍ଚାଇଲେ। ଖର୍ଚ୍ଚ ହଟିନାହିଁ, ହସ୍ତାନ୍ତର ହୋଇଛି — ଜଣେ ଅଚିହ୍ନା ଲୋକ ପାଖକୁ, କୋଡ଼ିଏ ବର୍ଷ ପରେ।","s":"draft"},"d.budget_cut.analysis.finish":{"en":"You defended the part of the build nobody would thank you for. The elevation can be clad in year five; the tank cannot be re-cast.","t":"ଆପଣ ଘରର ସେଇ ଅଂଶକୁ ବଞ୍ଚାଇଲେ ଯାହା ପାଇଁ କେହି ଆପଣଙ୍କୁ ଧନ୍ୟବାଦ ଦେବେ ନାହିଁ। ଏଲିଭେସନ୍ ପାଞ୍ଚ ବର୍ଷ ପରେ ବି କ୍ଲାଡ୍ କରିହେବ; ଟାଙ୍କି ପୁଣି ଢଳା ହୋଇପାରିବ ନାହିଁ।","s":"draft"},"d.budget_cut.analysis.delay":{"en":"Expensive in patience and rent. But you refused to let the invisible thing absorb the shortfall — which is the whole mechanism this game is about.","t":"ଧୈର୍ଯ୍ୟ ଆଉ ଭଡ଼ାରେ ଏହା ମହଙ୍ଗା। କିନ୍ତୁ ଆପଣ ନ ଦିଶୁଥିବା ଜିନିଷ ଉପରେ ଏ ଅଭାବ ପକାଇବାକୁ ମନା କଲେ — ଏ ଖେଳ ଯାହା ବିଷୟରେ, ସେଇଟା ଏଇ।","s":"draft"},"d.tanktype.section":{"en":"THE TANK","t":"ଟାଙ୍କି","s":"draft"},"d.tanktype.prompt":{"en":"What do we build the tank out of?","t":"ଟାଙ୍କି କେଉଁଥିରେ ତିଆରି କରିବା?","s":"draft"},"d.tanktype.opt.rings":{"en":"Precast concrete rings — fast, cheap, done by evening","t":"ପ୍ରିକାଷ୍ଟ୍ କଂକ୍ରିଟ୍ ରିଙ୍ଗ୍ — ଫାଷ୍ଟ, ଶସ୍ତା, ସନ୍ଧ୍ୟା ସୁଦ୍ଧା ସରିଯିବ","s":"draft"},"d.tanktype.opt.well":{"en":"Stone-lined, like an old well","t":"ପଥର ଗାନ୍ଥିବା, ପୁରୁଣା କୂଅ ପରି","s":"draft"},"d.tanktype.opt.brick":{"en":"Brick-lined and plastered smooth inside","t":"ଇଟା ଗାନ୍ଥି ଭିତରେ ମସୃଣ ପ୍ଲାଷ୍ଟର୍","s":"draft"},"d.tanktype.opt.twochamber":{"en":"Two chambers with a baffle wall, as per IS 2470","t":"IS 2470 ଅନୁସାରେ ବାଫଲ୍ କାନ୍ଥ ସହ ଦୁଇଟା ଚାମ୍ବର୍","s":"draft"},"d.tanktype.reveal.fact":{"en":"A single-compartment tank doesn't settle solids properly. Sludge carries through to the outlet, the soak pit clogs, and the tank needs emptying far more often than it should.","t":"ଗୋଟିଏ ଚାମ୍ବର୍ ଟାଙ୍କିରେ କଠିନ ପଦାର୍ଥ ଠିକ୍ ଭାବେ ତଳେ ବସେ ନାହିଁ। ପଙ୍କ ଆଉଟ୍‌ଲେଟ୍ ଦେଇ ବାହାରକୁ ଯାଏ, ସୋକ୍ ପିଟ୍ ବନ୍ଦ ହୋଇଯାଏ, ଆଉ ଟାଙ୍କି ଯେତେ ଥର ଖାଲି କରିବା କଥା, ତା'ଠାରୁ ବହୁତ ବେଶି ଥର କରିବାକୁ ପଡ଼େ।","s":"draft"},"d.tanktype.reveal.cost":{"en":"Indicative: two-chamber costs ₹12,000–20,000 more than rings. It roughly halves desludging frequency over the tank's life.","t":"ଆନୁମାନିକ: ରିଙ୍ଗ୍ ତୁଳନାରେ ଦୁଇ-ଚାମ୍ବର୍ ପାଇଁ ₹12,000–20,000 ଅଧିକ ଲାଗେ। ଟାଙ୍କିର ଜୀବନକାଳରେ ଏହା ପଙ୍କ ଉଠାଇବାର ସଂଖ୍ୟା ପ୍ରାୟ ଅଧା କରିଦିଏ।","s":"draft"},"d.tanktype.reveal.twist":{"en":"Rings aren't unsafe because of the material. They're unsafe because the ring diameter decides the opening — and a ring tank almost always ends up with a hole too small for anything but a human body.","t":"ରିଙ୍ଗ୍ ଅସୁରକ୍ଷିତ, ମାଲ୍ ପାଇଁ ନୁହେଁ। ଅସୁରକ୍ଷିତ, କାରଣ ରିଙ୍ଗ୍‌ର ବ୍ୟାସ ହିଁ ମୁହଁର ଆକାର ଠିକ୍ କରେ — ଆଉ ରିଙ୍ଗ୍ ଟାଙ୍କିରେ ପ୍ରାୟ ସବୁବେଳେ ଏମିତି ଏକ ଗାତ ରହେ ଯାହା ଦେଇ ମଣିଷ ଶରୀର ଛଡ଼ା ଆଉ କିଛି ଯାଇପାରେ ନାହିଁ।","s":"draft"},"d.tanktype.reveal.lesson":{"en":"Tank type quietly sets the ceiling on everything downstream: how often it must be opened, what the opening can be, and whether the effluent has anywhere sane to go.","t":"ଟାଙ୍କିର ପ୍ରକାର ଚୁପ୍‌ଚାପ୍ ପରର ସବୁ କଥାର ସୀମା ଠିକ୍ କରିଦିଏ: କେତେ ଥର ଖୋଲିବାକୁ ପଡ଼ିବ, ମୁହଁ କେତେ ବଡ଼ ହୋଇପାରିବ, ଆଉ ବାହାରୁଥିବା ପାଣି ଯିବା ପାଇଁ କୌଣସି ଠିକ୍ ଜାଗା ଅଛି କି ନାହିଁ।","s":"draft"},"d.tanktype.analysis.rings":{"en":"Fast and defensible on cost. But you've just constrained your own next two decisions — the opening and the effluent options narrow sharply from here.","t":"ଫାଷ୍ଟ ଆଉ ଖର୍ଚ୍ଚ ହିସାବରେ ଠିକ୍। କିନ୍ତୁ ଆପଣ ନିଜର ପରବର୍ତ୍ତୀ ଦୁଇଟା ନିଷ୍ପତ୍ତିକୁ ବାନ୍ଧି ଦେଲେ — ଏଇଠୁ ଆଗକୁ ମୁହଁ ଆଉ ପାଣି ବାହାରିବାର ବିକଳ୍ପ ବହୁତ କମି ଯାଏ।","s":"draft"},"d.tanktype.analysis.well":{"en":"Traditional and more generous in section than rings. Stone joints let water and roots move in both directions, though, so expect it to behave more like a pit than a tank.","t":"ପାରମ୍ପରିକ, ଆଉ ରିଙ୍ଗ୍ ତୁଳନାରେ ଭିତରେ ଅଧିକ ଖୋଲା। କିନ୍ତୁ ପଥରର ଫାଙ୍କ ଦେଇ ପାଣି ଆଉ ଚେର ଦୁଇ ଆଡ଼କୁ ଯାଆସେ, ତେଣୁ ଏହା ଟାଙ୍କି ଅପେକ୍ଷା ଗୋଟିଏ ଗାତ ପରି ବେଶି ବ୍ୟବହାର କରିବ।","s":"draft"},"d.tanktype.analysis.brick":{"en":"A solid middle. Smooth plaster means less solids clinging, easier emptying. You still only have one compartment, so the outlet will carry sludge.","t":"ମଝାମଝି ଭଲ ବିକଳ୍ପ। ମସୃଣ ପ୍ଲାଷ୍ଟର୍ ଥିଲେ ଭିତରେ କମ୍ ମଇଳା ଲାଗିଥାଏ, ଖାଲି କରିବା ସହଜ। ତଥାପି ଚାମ୍ବର୍ ଗୋଟିଏ ହିଁ ଅଛି, ତେଣୁ ଆଉଟ୍‌ଲେଟ୍ ଦେଇ ପଙ୍କ ଯିବ।","s":"draft"},"d.tanktype.analysis.twochamber":{"en":"The specification that actually exists in Indian standards, and almost never gets built. Everything downstream just got easier — including the effluent options.","t":"ଏଇଟା ହିଁ ସେ ସ୍ପେସିଫିକେସନ୍ ଯାହା ଭାରତୀୟ ମାନକରେ ଅଛି, ଆଉ ପ୍ରାୟ କେବେ ତିଆରି ହୁଏ ନାହିଁ। ଏହା ପରର ସବୁ କଥା ଏବେ ସହଜ ହୋଇଗଲା — ବାହାରୁଥିବା ପାଣିର ବିକଳ୍ପ ମିଶାଇ।","s":"draft"},"d.openings.section":{"en":"THE TOP","t":"ଉପର ଭାଗ","s":"draft"},"d.openings.prompt":{"en":"How do we close the top?","t":"ଉପର ଭାଗ କିପରି ବନ୍ଦ କରିବା?","s":"draft"},"d.openings.opt.flush":{"en":"One flush slab. Clean finish, nothing sticking up","t":"ଗୋଟିଏ ସମତଳ ସ୍ଲାବ୍। ସଫା ଫିନିସ୍, କିଛି ବାହାରକୁ ବାହାରି ନାହିଁ","s":"draft"},"d.openings.opt.small":{"en":"One small opening, about 1½ feet, plastered over later","t":"ଗୋଟିଏ ଛୋଟ ମୁହଁ, ପ୍ରାୟ 1½ ଫୁଟ, ପରେ ପ୍ଲାଷ୍ଟର୍ କରି ବନ୍ଦ","s":"draft"},"d.openings.opt.covers":{"en":"Two proper covers, 2×2 ft, sitting at ground level","t":"ଦୁଇଟା ଠିକ୍ କଭର୍, 2×2 ଫୁଟ, ମାଟି ସମାନ ଉଚ୍ଚରେ","s":"draft"},"d.openings.reveal.fact":{"en":"This is the decision. A 2×2 ft cover at ground level lets a hose and a rake do the work. A 1½ ft hole lets only an arm — or a person — do it. A flush slab means the first step of every desludging is a hammer.","t":"ଏଇଟା ହିଁ ସେ ନିଷ୍ପତ୍ତି। ମାଟି ସମାନ ଉଚ୍ଚରେ 2×2 ଫୁଟ କଭର୍ ଥିଲେ ହୋଜ୍ ଆଉ ରେକ୍ କାମ ସାରିଦିଏ। 1½ ଫୁଟ ଗାତ ଦେଇ କେବଳ ଗୋଟିଏ ହାତ — କିମ୍ବା ଜଣେ ମଣିଷ — ଯାଇପାରେ। ସମତଳ ସ୍ଲାବ୍ ଥିଲେ ପ୍ରତ୍ୟେକ ଥର ପଙ୍କ ଉଠାଇବାର ପ୍ରଥମ ପାହାଚ ହେଉଛି ହାତୁଡ଼ି।","s":"draft"},"d.openings.reveal.cost":{"en":"Indicative: two covers with frames add ₹4,000–8,000. That is the cheapest line on this entire list and the one most often deleted.","t":"ଆନୁମାନିକ: ଫ୍ରେମ୍ ସହ ଦୁଇଟା କଭର୍‌ରେ ₹4,000–8,000 ଅଧିକ ଲାଗେ। ଏ ପୁରା ତାଲିକାରେ ଏଇଟା ସବୁଠୁ ଶସ୍ତା ଲାଇନ୍, ଆଉ ଏଇଟା ହିଁ ସବୁଠୁ ବେଶି ଥର କଟି ଯାଏ।","s":"draft"},"d.openings.reveal.twist":{"en":"Small openings are usually chosen for safety — so a child doesn't fall in. The result is a tank that can only be cleaned by putting an adult inside it.","t":"ଛୋଟ ମୁହଁ ପ୍ରାୟତଃ ସୁରକ୍ଷା ପାଇଁ ବଛାଯାଏ — ଯେମିତି ପିଲା ପଡ଼ି ନଯାଏ। ଫଳ ହେଉଛି, ଏମିତି ଏକ ଟାଙ୍କି ଯାହା ଭିତରେ ଜଣେ ବଡ଼ ଲୋକଙ୍କୁ ପୂରାଇ ଦେଲେ ହିଁ ସଫା ହୋଇପାରିବ।","s":"draft"},"d.openings.reveal.lesson":{"en":"Almost every case of a worker entering a tank traces back to an opening too small to work through. Not to poverty, not to ignorance — to a hole somebody sized for tidiness.","t":"ଟାଙ୍କି ଭିତରକୁ ଶ୍ରମିକ ଯିବାର ପ୍ରାୟ ପ୍ରତ୍ୟେକ ଘଟଣା ପଛରେ ଥାଏ ଏମିତି ଏକ ମୁହଁ ଯାହା ଦେଇ କାମ କରିବାକୁ ଜାଗା ନାହିଁ। ଗରିବୀ ନୁହେଁ, ଅଜ୍ଞତା ନୁହେଁ — ଦେଖିବାକୁ ପରିପାଟୀ ଲାଗୁ ବୋଲି କେହି ଜଣେ ମାପି ରଖିଥିବା ଗୋଟିଏ ଗାତ।","s":"draft"},"d.openings.analysis.flush":{"en":"You chose the finish. Understandable — a flush slab looks finished and nothing protrudes into the yard. It also means nobody can open this tank without destroying it first.","t":"ଆପଣ ଫିନିସ୍ ବାଛିଲେ। ବୁଝି ହେଉଛି — ସମତଳ ସ୍ଲାବ୍ ସମ୍ପୂର୍ଣ୍ଣ ଦିଶେ ଆଉ ଅଗଣାରେ କିଛି ବାହାରି ନଥାଏ। ଏହାର ଅର୍ଥ ମଧ୍ୟ, ଏ ଟାଙ୍କି ଭାଙ୍ଗି ନ ଦେଇ କେହି ଏହାକୁ ଖୋଲି ପାରିବ ନାହିଁ।","s":"draft"},"d.openings.analysis.small":{"en":"The compromise, and by far the most common built outcome. It's better than a sealed slab and still too small to clean through. This is the shape most entries happen into.","t":"ମଝି ରାସ୍ତା, ଆଉ ଏଇଟା ହିଁ ସବୁଠୁ ବେଶି ତିଆରି ହୁଏ। ବନ୍ଦ ସ୍ଲାବ୍ ଠାରୁ ଭଲ, ତଥାପି ସଫା କରିବା ପାଇଁ ବହୁତ ଛୋଟ। ଅଧିକାଂଶ ଥର ଏଇ ଆକାରର ମୁହଁ ଦେଇ ହିଁ ଲୋକ ଭିତରକୁ ଯାଆନ୍ତି।","s":"draft"},"d.openings.analysis.covers":{"en":"The single highest-value choice available to you. A hose reaches, a rake reaches, and nobody has to. Keep the frames at ground level — raised ones get buried by later landscaping.","t":"ଆପଣଙ୍କ ପାଖରେ ଥିବା ସବୁଠୁ ମୂଲ୍ୟବାନ ବିକଳ୍ପ। ହୋଜ୍ ପହଞ୍ଚେ, ରେକ୍ ପହଞ୍ଚେ, ଆଉ କାହାକୁ ଭିତରକୁ ଯିବାକୁ ପଡ଼େ ନାହିଁ। ଫ୍ରେମ୍ ମାଟି ସମାନ ଉଚ୍ଚରେ ରଖନ୍ତୁ — ଉପରକୁ ଉଠିଥିବା ଫ୍ରେମ୍ ପରେ ବଗିଚା କାମରେ ପୋତି ହୋଇଯାଏ।","s":"draft"},"d.vent.section":{"en":"THE TOP","t":"ଉପର ଭାଗ","s":"draft"},"d.vent.prompt":{"en":"And the vent pipe?","t":"ଆଉ ଭେଣ୍ଟ୍ ପାଇପ୍?","s":"draft"},"d.vent.opt.none":{"en":"Skip it. Nobody ever asks for one","t":"ବାଦ ଦିଅନ୍ତୁ। କେହି ତ ଏହା ମାଗନ୍ତି ନାହିଁ","s":"draft"},"d.vent.opt.short":{"en":"A short one, hidden behind the parapet","t":"ଗୋଟିଏ ଛୋଟ, ପାରାପେଟ୍ ପଛରେ ଲୁଚା","s":"draft"},"d.vent.opt.proper":{"en":"Full height, above the roof line, with a cowl","t":"ପୁରା ଉଚ୍ଚତା, ଛାତ ଉପରକୁ, ଉପରେ କାଉଲ୍ ଲଗାଇ","s":"draft"},"d.vent.reveal.fact":{"en":"A septic tank generates hydrogen sulphide and methane and consumes oxygen. An unvented tank holds that atmosphere indefinitely. Opening the cover does not clear it.","t":"ସେପ୍ଟିକ୍ ଟାଙ୍କି ଭିତରେ ହାଇଡ୍ରୋଜେନ୍ ସଲଫାଇଡ୍ ଆଉ ମିଥେନ୍ ତିଆରି ହୁଏ ଆଉ ଅମ୍ଳଜାନ ଶେଷ ହୋଇଯାଏ। ଭେଣ୍ଟ୍ ନଥିବା ଟାଙ୍କି ଭିତରେ ସେ ହାୱା ସବୁଦିନ ରହିଥାଏ। କଭର୍ ଖୋଲିଲେ ତାହା ସଫା ହୁଏ ନାହିଁ।","s":"draft"},"d.vent.reveal.cost":{"en":"Indicative: a proper vent is ₹1,500–3,000 of PVC. It is the cheapest life-safety item in the entire build.","t":"ଆନୁମାନିକ: ଠିକ୍ ଭେଣ୍ଟ୍ ପାଇଁ ₹1,500–3,000ର PVC ଲାଗେ। ପୁରା ଘର ତିଆରିରେ ଏଇଟା ହିଁ ସବୁଠୁ ଶସ୍ତା ଜୀବନ ରକ୍ଷା ଜିନିଷ।","s":"draft"},"d.vent.reveal.twist":{"en":"Hydrogen sulphide destroys your sense of smell within seconds at dangerous concentrations. The warning stops exactly when the danger starts — which is why people say 'it didn't smell bad' afterwards.","t":"ବିପଜ୍ଜନକ ମାତ୍ରାରେ ହାଇଡ୍ରୋଜେନ୍ ସଲଫାଇଡ୍ କେଇ ସେକେଣ୍ଡ ଭିତରେ ଗନ୍ଧ ଚିହ୍ନିବା ଶକ୍ତି ନଷ୍ଟ କରିଦିଏ। ଠିକ୍ ଯେଉଁ ମୁହୂର୍ତ୍ତରେ ବିପଦ ଆରମ୍ଭ ହୁଏ, ସେଇ ମୁହୂର୍ତ୍ତରେ ଚେତାବନୀ ବନ୍ଦ ହୋଇଯାଏ — ସେଥିପାଇଁ ପରେ ଲୋକେ କୁହନ୍ତି 'ଗନ୍ଧ ତ ଖରାପ ଲାଗୁ ନଥିଲା'.","s":"draft"},"d.vent.reveal.lesson":{"en":"A vent is not for the smell. It is the only thing standing between a confined space and a breathable one, and it is left off precisely because its benefit is invisible.","t":"ଭେଣ୍ଟ୍ ଗନ୍ଧ ପାଇଁ ନୁହେଁ। ଏକ ବନ୍ଦ ଜାଗା ଆଉ ନିଶ୍ୱାସ ନେବା ଯୋଗ୍ୟ ଜାଗା ମଧ୍ୟରେ ଏକମାତ୍ର ଏଇଟା ହିଁ ଛିଡ଼ା ହୋଇଥାଏ, ଆଉ ଏଇଟା ଛାଡ଼ି ଦିଆଯାଏ ଠିକ୍ ସେଥିପାଇଁ ଯେ ଏହାର ଲାଭ ଦିଶେ ନାହିଁ।","s":"draft"},"d.vent.analysis.none":{"en":"The most common outcome, and the one that turns an awkward job into a fatal one. Everything good you did with the covers is undone by the atmosphere behind them.","t":"ସବୁଠୁ ସାଧାରଣ ଫଳ, ଆଉ ଏଇଟା ହିଁ ଏକ ଅସୁବିଧାଜନକ କାମକୁ ଜୀବନ ନେବା କାମରେ ବଦଳାଇ ଦିଏ। କଭର୍ ନେଇ ଆପଣ ଯାହା ଭଲ କଲେ, ତା ପଛର ହାୱା ସେ ସବୁ ନଷ୍ଟ କରିଦିଏ।","s":"draft"},"d.vent.analysis.short":{"en":"Better than nothing — there is a path for gas to leave. Hidden behind a parapet it will vent into a pocket of still air, and it will be the first thing sealed during any future renovation.","t":"କିଛି ନ ଥିବାଠାରୁ ଭଲ — ଗ୍ୟାସ୍ ବାହାରିବାର ଗୋଟିଏ ବାଟ ଅଛି। କିନ୍ତୁ ପାରାପେଟ୍ ପଛରେ ଲୁଚିଥିଲେ ଏହା ସ୍ଥିର ହାୱାର ଏକ କୋଣରେ ଛାଡ଼ିବ, ଆଉ ଭବିଷ୍ୟତରେ ମରାମତି ବେଳେ ଏଇଟା ହିଁ ପ୍ରଥମେ ବନ୍ଦ ହେବ।","s":"draft"},"d.vent.analysis.proper":{"en":"Correct. Above the roof line, away from windows, with a cowl so it doesn't block. This is the difference between a confined space and a tank.","t":"ଠିକ୍। ଛାତ ଉପରକୁ, ଝରକାରୁ ଦୂରେ, ଉପରେ କାଉଲ୍ ଲଗାଇ ଯେମିତି ବନ୍ଦ ନହୁଏ। ଏକ ବନ୍ଦ ଜାଗା ଆଉ ଏକ ଟାଙ୍କି ମଧ୍ୟରେ ଏଇଟା ହିଁ ପାର୍ଥକ୍ୟ।","s":"draft"},"d.effluent.section":{"en":"THE OUTLET","t":"ଆଉଟ୍‌ଲେଟ୍","s":"draft"},"d.effluent.prompt":{"en":"Where does the water leaving the tank go?","t":"ଟାଙ୍କିରୁ ବାହାରୁଥିବା ପାଣି କେଉଁଠି ଯିବ?","s":"draft"},"d.effluent.opt.storm":{"en":"Into the storm drain out front","t":"ଆଗ ରାସ୍ତାର ବର୍ଷା ପାଣି ନାଳରେ","s":"draft"},"d.effluent.opt.soak":{"en":"A soak pit right next to the tank","t":"ଟାଙ୍କି ଠିକ୍ ପାଖରେ ଗୋଟିଏ ସୋକ୍ ପିଟ୍","s":"draft"},"d.effluent.opt.dispersion":{"en":"A dispersion trench, sized for the soil","t":"ମାଟି ଅନୁସାରେ ମାପ କରାଯାଇଥିବା ଗୋଟିଏ ଡିସପର୍ସନ୍ ଟ୍ରେଞ୍ଚ୍","s":"draft"},"d.effluent.reveal.fact":{"en":"Septic effluent is not treated water. Into a storm drain it becomes an open sewage channel; into an undersized soak pit it clogs, backs up, and forces the tank to be opened years early.","t":"ସେପ୍ଟିକ୍ ଟାଙ୍କିରୁ ବାହାରୁଥିବା ପାଣି ଶୁଦ୍ଧ ପାଣି ନୁହେଁ। ବର୍ଷା ପାଣି ନାଳରେ ଗଲେ ତାହା ଖୋଲା ମଇଳା ନାଳ ହୋଇଯାଏ; ଛୋଟ ସୋକ୍ ପିଟ୍‌ରେ ଗଲେ ବନ୍ଦ ହୋଇଯାଏ, ପାଣି ଫେରି ଆସେ, ଆଉ ଟାଙ୍କି ସମୟ ପୂର୍ବରୁ ଖୋଲିବାକୁ ପଡ଼େ।","s":"draft"},"d.effluent.reveal.cost":{"en":"Indicative: a properly sized dispersion trench is ₹15,000–30,000. A clogged soak pit costs a desludging every few months and eventually has to be dug out by hand.","t":"ଆନୁମାନିକ: ଠିକ୍ ମାପର ଡିସପର୍ସନ୍ ଟ୍ରେଞ୍ଚ୍ ₹15,000–30,000. ବନ୍ଦ ହୋଇଯାଇଥିବା ସୋକ୍ ପିଟ୍ ପାଇଁ କେଇ ମାସ ଅନ୍ତରରେ ପଙ୍କ ଉଠାଇବାକୁ ପଡ଼େ ଆଉ ଶେଷରେ ହାତରେ ଖୋଳିବାକୁ ପଡ଼େ।","s":"draft"},"d.effluent.reveal.twist":{"en":"A soak pit that fails doesn't announce itself. The tank simply fills faster. By the time anyone investigates, the failure is ten years deep and someone is going into the pit to find it.","t":"ସୋକ୍ ପିଟ୍ ଖରାପ ହେଲେ ତାହା ଜଣାଏ ନାହିଁ। ଟାଙ୍କି ଖାଲି ଆହୁରି ଜଲଦି ଭରିଯାଏ। ଯେତେବେଳକୁ କେହି ଦେଖେ, ସେତେବେଳକୁ ଦଶ ବର୍ଷ ଚାଲିଯାଇଥାଏ ଆଉ କେହି ଜଣେ ପିଟ୍ ଭିତରକୁ ଓହ୍ଲାଇ ଖୋଜୁଥାଏ।","s":"draft"},"d.effluent.reveal.lesson":{"en":"Where the water goes decides how often the tank is opened. Frequency is exposure. Every avoidable desludging is another entry into somebody's working year.","t":"ପାଣି କେଉଁଠି ଯିବ, ସେଇଟା ହିଁ ଠିକ୍ କରେ ଟାଙ୍କି କେତେ ଥର ଖୋଲିବ। ଥର ସଂଖ୍ୟା ହିଁ ସଂସ୍ପର୍ଶ। ଏଡ଼ାଇ ହେଉଥିବା ପ୍ରତ୍ୟେକ ପଙ୍କ ଉଠାଇବା କାମ ହେଉଛି କାହାର କାମ ବର୍ଷରେ ଆଉ ଗୋଟିଏ ଥର ଭିତରକୁ ଯିବା।","s":"draft"},"d.effluent.analysis.storm":{"en":"It works, immediately and completely, and it moves the problem into the street. Whoever cleans that drain now meets your sewage without knowing it's sewage.","t":"ଏହା ତୁରନ୍ତ ଆଉ ପୁରା କାମ କରେ, ଆଉ ସମସ୍ୟାକୁ ରାସ୍ତାକୁ ଠେଲି ଦିଏ। ଯିଏ ସେ ନାଳ ସଫା କରେ, ସେ ଏବେ ଆପଣଙ୍କ ମଇଳାକୁ ଭେଟୁଛି — ଆଉ ଏହା ମଇଳା ବୋଲି ସେ ଜାଣି ନାହିଁ।","s":"draft"},"d.effluent.analysis.soak":{"en":"The standard answer and a reasonable one — if it's sized for the soil and set back from the tank. Most aren't, and the clogging shows up as a tank that mysteriously fills fast.","t":"ଚଳନ୍ତି ଉତ୍ତର ଆଉ ଠିକ୍ ବି — ଯଦି ମାଟି ଅନୁସାରେ ମାପ ହୋଇଥାଏ ଆଉ ଟାଙ୍କିଠାରୁ ଦୂରେ ଥାଏ। ଅଧିକାଂଶ ସେମିତି ନୁହେଁ, ଆଉ ବନ୍ଦ ହେବା କଥା ଏମିତି ଜଣାପଡ଼େ ଯେ ଟାଙ୍କି ହଠାତ୍ ଜଲଦି ଭରିଯାଉଛି।","s":"draft"},"d.effluent.analysis.dispersion":{"en":"The right answer where soil allows, and it's only available to you because you built a tank whose outlet water is clean enough to disperse. The earlier choice paid for itself here.","t":"ମାଟି ଅନୁମତି ଦେଲେ ଏଇଟା ହିଁ ଠିକ୍ ଉତ୍ତର, ଆଉ ଏଇଟା ଆପଣଙ୍କୁ କେବଳ ସେଥିପାଇଁ ମିଳିଲା ଯେ ଆପଣ ଏମିତି ଟାଙ୍କି ତିଆରି କଲେ ଯାହାର ବାହାରୁଥିବା ପାଣି ଛଡ଼ାଇବା ଯୋଗ୍ୟ ସଫା। ଆଗର ନିଷ୍ପତ୍ତି ଏଇଠି ନିଜ ଦାମ ଫେରାଇ ଦେଲା।","s":"draft"},"d.drawing.section":{"en":"ON PAPER","t":"କାଗଜରେ","s":"draft"},"d.drawing.prompt":{"en":"What actually goes on the drawing for the tank?","t":"ଟାଙ୍କି ପାଇଁ ଡ୍ରଇଂରେ ଆସଲରେ କ'ଣ ରହେ?","s":"draft"},"d.drawing.opt.st":{"en":"'ST' with a rectangle. Everyone knows what that means","t":"ଗୋଟିଏ ଆୟତାକାର ଘର ଭିତରେ 'ST'. ଏହାର ମାନେ ସମସ୍ତେ ଜାଣନ୍ତି","s":"draft"},"d.drawing.opt.detail":{"en":"A full section — chambers, covers, vent, invert levels","t":"ପୁରା ସେକ୍ସନ୍ — ଚାମ୍ବର୍, କଭର୍, ଭେଣ୍ଟ୍, ଇନଭର୍ଟ୍ ଲେଭେଲ୍","s":"draft"},"d.drawing.reveal.fact":{"en":"On most sanctioned drawings in this region the septic tank appears as two letters and a rectangle. Nothing about compartments, cover size, vent or outlet is drawn — so nothing about them is checked, priced, or built.","t":"ଏ ଅଞ୍ଚଳରେ ମଞ୍ଜୁର ହେଉଥିବା ଅଧିକାଂଶ ଡ୍ରଇଂରେ ସେପ୍ଟିକ୍ ଟାଙ୍କି ଦୁଇଟା ଅକ୍ଷର ଆଉ ଗୋଟିଏ ଆୟତାକାର ଘର ଭାବେ ରହେ। ଚାମ୍ବର୍, କଭର୍‌ର ମାପ, ଭେଣ୍ଟ୍ କି ଆଉଟ୍‌ଲେଟ୍ ବିଷୟରେ କିଛି ଆଙ୍କା ଯାଏ ନାହିଁ — ତେଣୁ ସେ ସବୁ ବିଷୟରେ କିଛି ଯାଞ୍ଚ ହୁଏ ନାହିଁ, ଦାମ ଧରାଯାଏ ନାହିଁ, କି ତିଆରି ହୁଏ ନାହିଁ।","s":"draft"},"d.drawing.reveal.cost":{"en":"Indicative: a proper section is one extra sheet and perhaps two hours of drafting time.","t":"ଆନୁମାନିକ: ଠିକ୍ ସେକ୍ସନ୍ ପାଇଁ ଅଧିକ ଗୋଟିଏ ସିଟ୍ ଆଉ ହୁଏତ ଦୁଇ ଘଣ୍ଟାର ଡ୍ରାଫ୍ଟିଂ ସମୟ।","s":"draft"},"d.drawing.reveal.twist":{"en":"The rectangle is not laziness. It's what gets approved fastest. Detailing the tank invites questions from an authority that has no mechanism to evaluate the answer.","t":"ଆୟତାକାର ଘରଟା ଅଳସୁଆପଣ ନୁହେଁ। ଏଇଟା ହିଁ ସବୁଠୁ ଜଲଦି ମଞ୍ଜୁର ହୁଏ। ଟାଙ୍କିର ବିବରଣୀ ଦେଲେ ଏମିତି ଏକ ଅଫିସରୁ ପ୍ରଶ୍ନ ଆସେ ଯାହା ପାଖରେ ଉତ୍ତର ଯାଞ୍ଚ କରିବାର କୌଣସି ବ୍ୟବସ୍ଥା ନାହିଁ।","s":"draft"},"d.drawing.reveal.lesson":{"en":"What is not drawn is not built, not priced, and not anybody's fault. The rectangle is how a responsibility disappears without anyone deciding to drop it.","t":"ଯାହା ଆଙ୍କା ହୁଏ ନାହିଁ, ତାହା ତିଆରି ହୁଏ ନାହିଁ, ତାର ଦାମ ଧରାଯାଏ ନାହିଁ, ଆଉ ତାହା କାହାର ଦୋଷ ବି ନୁହେଁ। କେହି ଛାଡ଼ି ଦେବାକୁ ନିଷ୍ପତ୍ତି ନ ନେଇ ବି ଗୋଟିଏ ଦାୟିତ୍ୱ କିପରି ଉଭାନ୍ ହୋଇଯାଏ — ସେଇଟା ହେଉଛି ଏଇ ଆୟତାକାର ଘର।","s":"draft"},"d.drawing.analysis.st":{"en":"You did what the sanction process rewards. The tank is now entirely in the maistry's memory, and that memory has no cover size in it.","t":"ମଞ୍ଜୁରୀ ପ୍ରକ୍ରିୟା ଯାହା ପାଇଁ ପୁରସ୍କାର ଦିଏ, ଆପଣ ତାହା କଲେ। ଟାଙ୍କି ଏବେ ପୁରା ମିସ୍ତ୍ରୀଙ୍କ ମନେ ରଖିବା ଉପରେ ନିର୍ଭର, ଆଉ ସେ ମନେ ରଖିବାରେ କଭର୍‌ର ମାପ ନାହିଁ।","s":"draft"},"d.drawing.analysis.detail":{"en":"You created the one artefact that survives everyone on this project. In 2048 somebody can find out what's down there without a hammer.","t":"ଆପଣ ଏମିତି ଗୋଟିଏ ଜିନିଷ ତିଆରି କଲେ ଯାହା ଏ ପ୍ରୋଜେକ୍ଟର ସବୁ ଲୋକଙ୍କ ପରେ ବି ରହିବ। 2048ରେ କେହି ହାତୁଡ଼ି ନ ଧରି ଜାଣି ପାରିବ ତଳେ କ'ଣ ଅଛି।","s":"draft"},"d.oc.section":{"en":"AFTER","t":"ପରେ","s":"draft"},"d.oc.prompt":{"en":"The house is ready. Do you go through the Occupancy Certificate?","t":"ଘର ପ୍ରସ୍ତୁତ। ଆପଣ OC (ଅକ୍ୟୁପାନ୍ସି ସାର୍ଟିଫିକେଟ୍) ପାଇଁ ଯିବେ କି?","s":"draft"},"d.oc.opt.movein":{"en":"Just move in. Nobody in this layout has an OC","t":"ସିଧା ରହିବାକୁ ଚାଲିଯାଆନ୍ତୁ। ଏ ଲେଆଉଟ୍‌ରେ କାହାରି OC ନାହିଁ","s":"draft"},"d.oc.opt.getoc":{"en":"Apply for the OC, whatever it takes","t":"ଯାହା ଲାଗୁ, OC ପାଇଁ ଆବେଦନ କରନ୍ତୁ","s":"draft"},"d.oc.reveal.fact":{"en":"The Occupancy Certificate is the only point at which anyone official is supposed to look at what was actually built, including the sanitation, versus what was approved.","t":"OC ହିଁ ଏକମାତ୍ର ସମୟ ଯେତେବେଳେ ସରକାରୀ ତରଫରୁ କେହି ଦେଖିବା କଥା ଯେ ଆସଲରେ କ'ଣ ତିଆରି ହୋଇଛି — ସାନିଟେସନ୍ ମିଶାଇ — ଆଉ ଯାହା ମଞ୍ଜୁର ହୋଇଥିଲା।","s":"draft"},"d.oc.reveal.cost":{"en":"Indicative: weeks of follow-up, and in practice a system most owners route around entirely.","t":"ଆନୁମାନିକ: କେଇ ସପ୍ତାହର ଦୌଡ଼ାଦୌଡ଼ି, ଆଉ ବାସ୍ତବରେ ଏମିତି ଏକ ବ୍ୟବସ୍ଥା ଯାହାକୁ ଅଧିକାଂଶ ମାଲିକ ପୁରା ଏଡ଼ାଇ ଯାଆନ୍ତି।","s":"draft"},"d.oc.reveal.twist":{"en":"Skipping the OC doesn't only avoid scrutiny — it removes the building from the record. An unrecorded building is one nobody can later be required to fix.","t":"OC ଛାଡ଼ିଦେଲେ କେବଳ ଯାଞ୍ଚରୁ ବଞ୍ଚିବା ନୁହେଁ — ଘରଟା ରେକର୍ଡରୁ ହିଁ ବାହାରି ଯାଏ। ରେକର୍ଡରେ ନ ଥିବା ଘରକୁ ପରେ ଠିକ୍ କରିବାକୁ କେହି କାହାକୁ କହି ପାରିବେ ନାହିଁ।","s":"draft"},"d.oc.reveal.lesson":{"en":"Accountability isn't a feeling. It's whether a document exists with somebody's name on it. Every step that skips the paperwork removes a future person's ability to ask why.","t":"ଜବାବଦିହି କୌଣସି ଅନୁଭବ ନୁହେଁ। କାହାରି ନାଁ ଲେଖା ଗୋଟିଏ କାଗଜ ଅଛି କି ନାହିଁ — ସେଇଟା ହିଁ ଜବାବଦିହି। କାଗଜ ଏଡ଼ାଇ ଦେଉଥିବା ପ୍ରତ୍ୟେକ ପାହାଚ ଭବିଷ୍ୟତର ଜଣେ ଲୋକଙ୍କୁ 'କାହିଁକି' ପଚାରିବାର ଅଧିକାରରୁ ବଞ୍ଚିତ କରେ।","s":"draft"},"d.oc.analysis.movein":{"en":"Pragmatic and near-universal. You've also ensured no independent eye ever compared the tank as built to the tank as approved.","t":"ବ୍ୟବହାରିକ ଆଉ ପ୍ରାୟ ସମସ୍ତେ ତାହା କରନ୍ତି। ଏହା ସହ ଆପଣ ନିଶ୍ଚିତ କଲେ ଯେ ତିଆରି ଟାଙ୍କି ଆଉ ମଞ୍ଜୁର ଟାଙ୍କିକୁ କୌଣସି ବାହାର ଆଖି କେବେ ମିଳାଇ ଦେଖିଲା ନାହିଁ।","s":"draft"},"d.oc.analysis.getoc":{"en":"Slow, tedious, and the only mechanism in this entire chain where an outsider checks the work. You kept the tank inside the system of record.","t":"ଧୀର, ବିରକ୍ତିକର, ଆଉ ଏ ପୁରା ଶୃଙ୍ଖଳାରେ ଏଇଟା ହିଁ ଏକମାତ୍ର ବ୍ୟବସ୍ଥା ଯେଉଁଠି ଜଣେ ବାହାର ଲୋକ କାମ ଯାଞ୍ଚ କରେ। ଆପଣ ଟାଙ୍କିକୁ ରେକର୍ଡ ବ୍ୟବସ୍ଥା ଭିତରେ ରଖିଲେ।","s":"draft"},"d.client_push.section":{"en":"THE BRIEF","t":"ବ୍ରିଫ୍","s":"draft"},"d.client_push.prompt":{"en":"The client says: \"Sir, don't complicate the sanitation. The maistry knows.\"","t":"କ୍ଲାଏଣ୍ଟ କହୁଛନ୍ତି: \"ସାର୍, ସାନିଟେସନ୍‌କୁ ଜଟିଳ କରନ୍ତୁ ନାହିଁ। ମିସ୍ତ୍ରୀ ଜାଣିଛି.\"","s":"draft"},"d.client_push.opt.agree":{"en":"Agree. Not worth the argument — I'll focus on the elevation","t":"ମାନି ଯାଆନ୍ତୁ। ଯୁକ୍ତି କରିବା ଠିକ୍ ନୁହେଁ — ମୁଁ ଏଲିଭେସନ୍ ଉପରେ ଧ୍ୟାନ ଦେବି","s":"draft"},"d.client_push.opt.note":{"en":"Put a note on the drawing and move on","t":"ଡ୍ରଇଂରେ ଗୋଟିଏ ନୋଟ୍ ଲେଖି ଆଗକୁ ବଢ଼ନ୍ତୁ","s":"draft"},"d.client_push.opt.explain":{"en":"Sit them down and explain who opens this tank in twenty years","t":"ତାଙ୍କୁ ବସାଇ ବୁଝାନ୍ତୁ, କୋଡ଼ିଏ ବର୍ଷ ପରେ ଏ ଟାଙ୍କି କିଏ ଖୋଲିବ","s":"draft"},"d.client_push.reveal.fact":{"en":"Architects are hired and judged on the visible house. Sanitation sits outside the fee conversation, so professional attention drains away from it exactly where it's most needed.","t":"ଆର୍କିଟେକ୍ଟଙ୍କୁ ଦିଶୁଥିବା ଘର ପାଇଁ ରଖାଯାଏ ଆଉ ସେଥିରେ ହିଁ ବିଚାର କରାଯାଏ। ସାନିଟେସନ୍ ଫି ଆଲୋଚନା ବାହାରେ ରହେ, ତେଣୁ ଠିକ୍ ଯେଉଁଠି ସବୁଠୁ ବେଶି ଦରକାର, ସେଇଠୁ ହିଁ ପେସାଦାର ଧ୍ୟାନ ସରିଯାଏ।","s":"draft"},"d.client_push.reveal.cost":{"en":"Indicative: the conversation costs twenty minutes and some goodwill. Losing it costs nothing you'll ever be told about.","t":"ଆନୁମାନିକ: ଏ କଥାବାର୍ତ୍ତାରେ କୋଡ଼ିଏ ମିନିଟ୍ ଆଉ ଟିକିଏ ସଦ୍‌ଭାବନା ଖର୍ଚ୍ଚ ହୁଏ। ନ କଲେ ଯାହା ଯାଏ, ସେ କଥା ଆପଣଙ୍କୁ କେହି କେବେ କହିବେ ନାହିଁ।","s":"draft"},"d.client_push.reveal.twist":{"en":"Clients almost never refuse the covers and the vent on cost. They refuse them because nobody framed them as being about a person. Framed that way, most say yes.","t":"କ୍ଲାଏଣ୍ଟ ପ୍ରାୟ କେବେ ଦାମ ଦେଖି କଭର୍ ଆଉ ଭେଣ୍ଟ୍‌କୁ ମନା କରନ୍ତି ନାହିଁ। ମନା କରନ୍ତି କାରଣ କେହି ଏହାକୁ ଜଣେ ମଣିଷ ସହ ଯୋଡ଼ି କହି ନଥାଏ। ସେମିତି କହିଲେ ଅଧିକାଂଶ ହଁ କୁହନ୍ତି।","s":"draft"},"d.client_push.reveal.lesson":{"en":"The professional's real product here isn't the drawing — it's the one conversation where the invisible worker is named out loud. Skip it and the expertise is simply unused.","t":"ଏଠି ପେସାଦାର ଲୋକଙ୍କ ପ୍ରକୃତ ଉତ୍ପାଦ ଡ୍ରଇଂ ନୁହେଁ — ଏହା ସେହି ଗୋଟିଏ କଥାବାର୍ତ୍ତା ଯେଉଁଠି ନ ଦିଶୁଥିବା ଶ୍ରମିକଙ୍କ ନାଁ ମୁହଁରେ ଆସେ। ଏହା ଛାଡ଼ିଦେଲେ ସେ ଜ୍ଞାନ କେବଳ ଅବ୍ୟବହୃତ ରହିଯାଏ।","s":"draft"},"d.client_push.analysis.agree":{"en":"You preserved the relationship and gave up the only leverage you had. The expertise is still in your head, which is precisely where it does no good.","t":"ଆପଣ ସମ୍ପର୍କ ବଞ୍ଚାଇଲେ ଆଉ ଆପଣଙ୍କ ପାଖରେ ଥିବା ଏକମାତ୍ର ଜୋର୍ ଛାଡ଼ି ଦେଲେ। ଜ୍ଞାନ ଏବେ ବି ଆପଣଙ୍କ ମୁଣ୍ଡରେ ଅଛି, ଆଉ ଠିକ୍ ସେଇଠି ତାହା କୌଣସି କାମରେ ଆସେ ନାହିଁ।","s":"draft"},"d.client_push.analysis.note":{"en":"A note is a real thing — it survives, it's evidence, it shifts liability. It also gets read by nobody on site. Half a step.","t":"ନୋଟ୍ ଗୋଟିଏ ପ୍ରକୃତ ଜିନିଷ — ଏହା ରହିଥାଏ, ଏହା ପ୍ରମାଣ, ଏହା ଦାୟିତ୍ୱ ସରାଇ ଦିଏ। କିନ୍ତୁ ସାଇଟ୍‌ରେ ଏହା କେହି ପଢ଼ନ୍ତି ନାହିଁ। ଅଧା ପାହାଚ।","s":"draft"},"d.client_push.analysis.explain":{"en":"You spent your credibility on the part of the project nobody was going to defend. This is what being the professional in the room actually costs.","t":"ପ୍ରୋଜେକ୍ଟର ଯେଉଁ ଅଂଶକୁ କେହି ବଞ୍ଚାଇବାକୁ ଯାଉ ନଥିଲେ, ଆପଣ ସେଥିପାଇଁ ନିଜ ବିଶ୍ୱାସଯୋଗ୍ୟତା ଖର୍ଚ୍ଚ କଲେ। ଘରେ ପେସାଦାର ଲୋକ ହେବାର ଆସଲ ଦାମ ଏଇଟା।","s":"draft"},"d.handover.section":{"en":"TO SITE","t":"ସାଇଟ୍‌କୁ","s":"draft"},"d.handover.prompt":{"en":"What does the maistry actually get from you?","t":"ମିସ୍ତ୍ରୀ ଆପଣଙ୍କଠାରୁ ଆସଲରେ କ'ଣ ପାଏ?","s":"draft"},"d.handover.opt.print":{"en":"An A3 print of the plan. He'll work the rest out","t":"ପ୍ଲାନ୍‌ର ଗୋଟିଏ A3 ପ୍ରିଣ୍ଟ୍। ବାକି ସେ ବୁଝି ନେବ","s":"draft"},"d.handover.opt.verbal":{"en":"The print, plus ten minutes on site explaining it","t":"ପ୍ରିଣ୍ଟ୍, ସାଙ୍ଗରେ ସାଇଟ୍‌ରେ ଦଶ ମିନିଟ୍ ବୁଝାଇବା","s":"draft"},"d.handover.opt.marked":{"en":"Print, site walk, and I chalk the cover positions myself","t":"ପ୍ରିଣ୍ଟ୍, ସାଇଟ୍ ବୁଲିବା, ଆଉ କଭର୍ କେଉଁଠି ହେବ ମୁଁ ନିଜେ ଚକ୍‌ରେ ଦାଗ ଦେବି","s":"draft"},"d.handover.reveal.fact":{"en":"The gap between a drawing and a built tank is a conversation that usually doesn't happen. The maistry builds from habit wherever the drawing is silent — and on the tank, the drawing is almost always silent.","t":"ଡ୍ରଇଂ ଆଉ ତିଆରି ଟାଙ୍କି ମଧ୍ୟରେ ଥିବା ଫାଙ୍କ ହେଉଛି ଗୋଟିଏ କଥାବାର୍ତ୍ତା, ଯାହା ସାଧାରଣତଃ ହୁଏ ନାହିଁ। ଡ୍ରଇଂ ଯେଉଁଠି ଚୁପ୍, ମିସ୍ତ୍ରୀ ସେଇଠି ଅଭ୍ୟାସ ଅନୁସାରେ ତିଆରି କରେ — ଆଉ ଟାଙ୍କି ବିଷୟରେ ଡ୍ରଇଂ ପ୍ରାୟ ସବୁବେଳେ ଚୁପ୍।","s":"draft"},"d.handover.reveal.cost":{"en":"Indicative: one site visit. Perhaps an hour.","t":"ଆନୁମାନିକ: ଗୋଟିଏ ସାଇଟ୍ ଭିଜିଟ୍। ହୁଏତ ଏକ ଘଣ୍ଟା।","s":"draft"},"d.handover.reveal.twist":{"en":"Maistries very often know more about tanks than the drawing says, and less about why the details matter. The visit works in both directions — you'll learn the site constraint you drew through.","t":"ମିସ୍ତ୍ରୀମାନେ ପ୍ରାୟତଃ ଟାଙ୍କି ବିଷୟରେ ଡ୍ରଇଂଠାରୁ ବେଶି ଜାଣନ୍ତି, ଆଉ ବିବରଣୀ କାହିଁକି ଜରୁରୀ ସେ କଥା କମ୍ ଜାଣନ୍ତି। ଭିଜିଟ୍ ଦୁଇ ଆଡ଼କୁ କାମ କରେ — ଆପଣ ଜାଣିବେ ସାଇଟ୍‌ର ସେ ବାଧା, ଯାହା ଉପର ଦେଇ ଆପଣ ଆଙ୍କି ଦେଇଥିଲେ।","s":"draft"},"d.handover.reveal.lesson":{"en":"Design intent doesn't travel on paper alone in an oral building culture. If you didn't say it out loud, standing on the spot, you didn't specify it.","t":"ମୌଖିକ ନିର୍ମାଣ ସଂସ୍କୃତିରେ ଡିଜାଇନର ଉଦ୍ଦେଶ୍ୟ କେବଳ କାଗଜରେ ଯାଏ ନାହିଁ। ଯଦି ଆପଣ ସେଇ ଜାଗାରେ ଠିଆ ହୋଇ ମୁହଁରେ କହିନାହାନ୍ତି, ତେବେ ଆପଣ ତାହା ନିର୍ଦ୍ଦିଷ୍ଟ କରିନାହାନ୍ତି।","s":"draft"},"d.handover.analysis.print":{"en":"The drawing is now competing with thirty years of habit and losing. Whatever you detailed about the covers will be built the way the last tank was built.","t":"ଡ୍ରଇଂ ଏବେ ତିରିଶ ବର୍ଷର ଅଭ୍ୟାସ ସହ ଲଢ଼ୁଛି ଆଉ ହାରୁଛି। କଭର୍ ବିଷୟରେ ଆପଣ ଯାହା ଆଙ୍କିଥିଲେ, ତାହା ଆଗ ଟାଙ୍କି ଯେମିତି ହୋଇଥିଲା ସେମିତି ହିଁ ହେବ।","s":"draft"},"d.handover.analysis.verbal":{"en":"The ten minutes is the actual specification. This is where intent transfers in a building culture that runs on speech.","t":"ସେ ଦଶ ମିନିଟ୍ ହିଁ ଆସଲ ସ୍ପେସିଫିକେସନ୍। କଥା ଉପରେ ଚାଲୁଥିବା ନିର୍ମାଣ ସଂସ୍କୃତିରେ ଉଦ୍ଦେଶ୍ୟ ଏଇଠି ହିଁ ହସ୍ତାନ୍ତର ହୁଏ।","s":"draft"},"d.handover.analysis.marked":{"en":"Chalk on the ground outranks any drawing. You've put the cover positions into the one medium the person casting the slab is actually looking at.","t":"ମାଟିରେ ଚକ୍ ଦାଗ ଯେକୌଣସି ଡ୍ରଇଂଠାରୁ ବଡ଼। ସ୍ଲାବ୍ ଢାଳୁଥିବା ଲୋକ ଆସଲରେ ଯାହା ଦେଖୁଛି, ଆପଣ କଭର୍‌ର ଜାଗା ସେଇ ମାଧ୍ୟମରେ ରଖିଦେଲେ।","s":"draft"},"d.sizing.section":{"en":"THE NUMBERS","t":"ହିସାବ","s":"draft"},"d.sizing.prompt":{"en":"How do you size the tank?","t":"ଟାଙ୍କିର ମାପ କିପରି ଠିକ୍ କରନ୍ତି?","s":"draft"},"d.sizing.opt.thumb":{"en":"Thumb rule. 8×4×5 feet does it for a family","t":"ଚଳନ୍ତି ନିୟମ। ଗୋଟିଏ ପରିବାର ପାଇଁ 8×4×5 ଫୁଟ ଯଥେଷ୍ଟ","s":"draft"},"d.sizing.opt.oversize":{"en":"Build it big. Bigger tank, fewer trips","t":"ବଡ଼ କରି ତିଆରି କରନ୍ତୁ। ବଡ଼ ଟାଙ୍କି, କମ୍ ଥର ଆସିବାକୁ ପଡ଼ିବ","s":"draft"},"d.sizing.opt.std":{"en":"IS 2470 — persons × litres × desludging interval","t":"IS 2470 — ଲୋକ ସଂଖ୍ୟା × ଲିଟର × ପଙ୍କ ଉଠାଇବାର ବ୍ୟବଧାନ","s":"draft"},"d.sizing.reveal.fact":{"en":"IS 2470 sizes a tank from occupancy, flow and a chosen desludging interval — typically two to three years. The thumb rule sizes it from what fits the corner of the plot.","t":"IS 2470 ଅନୁସାରେ ଟାଙ୍କିର ମାପ ଠିକ୍ ହୁଏ କେତେ ଲୋକ ରହିବେ, କେତେ ପାଣି ଯିବ ଆଉ କେତେ ଦିନ ଅନ୍ତରରେ ପଙ୍କ ଉଠାଯିବ ତା ଉପରେ — ସାଧାରଣତଃ ଦୁଇରୁ ତିନି ବର୍ଷ। ଚଳନ୍ତି ନିୟମରେ ମାପ ଠିକ୍ ହୁଏ ଜମିର କୋଣରେ ଯେତେ ଧରୁଛି ସେଇଥିରେ।","s":"draft"},"d.sizing.reveal.cost":{"en":"Indicative: nil. Correct sizing is arithmetic, not money.","t":"ଆନୁମାନିକ: ଶୂନ। ଠିକ୍ ମାପ କରିବା ଅଙ୍କ, ଟଙ୍କା ନୁହେଁ।","s":"draft"},"d.sizing.reveal.twist":{"en":"Oversizing can make things worse. A very deep tank is no easier to empty and much harder to get out of, and the sludge at the bottom of a 7-foot tank is beyond the reach of any hose held from above.","t":"ବେଶି ବଡ଼ କଲେ ଅବସ୍ଥା ଆହୁରି ଖରାପ ହୋଇପାରେ। ବହୁତ ଗଭୀର ଟାଙ୍କି ଖାଲି କରିବା ସହଜ ନୁହେଁ ଆଉ ଭିତରୁ ବାହାରିବା ବହୁତ କଷ୍ଟ, ଆଉ 7 ଫୁଟ ଟାଙ୍କିର ତଳର ପଙ୍କ ପାଖରେ ଉପରୁ ଧରିଥିବା କୌଣସି ହୋଜ୍ ପହଞ୍ଚେ ନାହିଁ।","s":"draft"},"d.sizing.reveal.lesson":{"en":"Capacity is the parameter engineers reach for because it's the one with a formula. Depth and opening size decide the worker's day, and neither appears in the capacity calculation.","t":"ଇଞ୍ଜିନିୟରମାନେ କ୍ୟାପାସିଟି ଧରନ୍ତି କାରଣ ସେଇଟାର ଗୋଟିଏ ସୂତ୍ର ଅଛି। କିନ୍ତୁ ଗଭୀରତା ଆଉ ମୁହଁର ମାପ ହିଁ ଶ୍ରମିକର ଦିନ ଠିକ୍ କରେ, ଆଉ ଏ ଦୁଇଟାରୁ କୌଣସିଟା କ୍ୟାପାସିଟି ହିସାବରେ ଆସେ ନାହିଁ।","s":"draft"},"d.sizing.analysis.thumb":{"en":"It'll broadly work — thumb rules encode real experience. It just carries no reasoning anyone can check, adjust, or inherit.","t":"ମୋଟାମୋଟି ଚାଲିଯିବ — ଚଳନ୍ତି ନିୟମ ଭିତରେ ପ୍ରକୃତ ଅଭିଜ୍ଞତା ଥାଏ। କେବଳ ଏଥିରେ ଏମିତି କୌଣସି ଯୁକ୍ତି ନାହିଁ ଯାହା କେହି ଯାଞ୍ଚ କରିପାରିବ, ବଦଳାଇ ପାରିବ କି ଆଗକୁ ନେଇପାରିବ।","s":"draft"},"d.sizing.analysis.oversize":{"en":"Generous on capacity and quietly hostile on depth. Ask yourself whether a hose can reach the bottom; if not, you've designed in an entry.","t":"କ୍ୟାପାସିଟିରେ ଉଦାର, ଗଭୀରତାରେ ଚୁପ୍‌ଚାପ୍ ବିପଦ। ନିଜକୁ ପଚାରନ୍ତୁ ହୋଜ୍ ତଳ ପର୍ଯ୍ୟନ୍ତ ପହଞ୍ଚିବ କି; ଯଦି ନା, ତେବେ ଆପଣ ଡିଜାଇନରେ ହିଁ ଭିତରକୁ ଓହ୍ଲାଇବାର ବ୍ୟବସ୍ଥା କରିଦେଲେ।","s":"draft"},"d.sizing.analysis.std":{"en":"You used the standard that exists and is almost never invoked. Now hold the desludging interval you assumed — it's the number that justifies everything else.","t":"ଯେଉଁ ମାନକ ଅଛି ଆଉ ପ୍ରାୟ କେବେ ବ୍ୟବହାର ହୁଏ ନାହିଁ, ଆପଣ ତାହା ବ୍ୟବହାର କଲେ। ଏବେ ଯେଉଁ ପଙ୍କ ଉଠାଇବାର ବ୍ୟବଧାନ ଧରିଥିଲେ, ତାହା ମାନି ଚାଲନ୍ତୁ — ବାକି ସବୁ ସେଇ ସଂଖ୍ୟା ଉପରେ ଠିଆ।","s":"draft"},"d.site_visit.section":{"en":"DURING","t":"କାମ ଚାଲିଥିବା ବେଳେ","s":"draft"},"d.site_visit.prompt":{"en":"The tank gets cast on a Tuesday. You're on three other sites.","t":"ମଙ୍ଗଳବାର ଦିନ ଟାଙ୍କି ଢଳା ହେବ। ଆପଣ ଆଉ ତିନିଟା ସାଇଟ୍‌ରେ ବ୍ୟସ୍ତ।","s":"draft"},"d.site_visit.opt.photos":{"en":"Ask for photos on WhatsApp","t":"ହ୍ୱାଟ୍ସଆପ୍‌ରେ ଫଟୋ ମାଗନ୍ତୁ","s":"draft"},"d.site_visit.opt.after":{"en":"Go after work, once the slab is on","t":"କାମ ପରେ ଯାଆନ୍ତୁ, ସ୍ଲାବ୍ ପଡ଼ିଗଲା ପରେ","s":"draft"},"d.site_visit.opt.during":{"en":"Be there before they cast. That's the only hour it can be fixed","t":"ଢଳା ହେବା ଆଗରୁ ସେଠି ରୁହନ୍ତୁ। ଠିକ୍ କରିବାର ସେଇଟା ହିଁ ଏକମାତ୍ର ଘଣ୍ଟା","s":"draft"},"d.site_visit.reveal.fact":{"en":"A septic tank is correctable for about one hour — between the shuttering going up and the concrete going in. After that, changing the cover size means demolition.","t":"ସେପ୍ଟିକ୍ ଟାଙ୍କି ପ୍ରାୟ ଏକ ଘଣ୍ଟା ପାଇଁ ହିଁ ସୁଧାରି ହୁଏ — ସଟରିଂ ଉଠିବା ଆଉ କଂକ୍ରିଟ୍ ପଡ଼ିବା ମଧ୍ୟରେ। ତା'ପରେ କଭର୍‌ର ମାପ ବଦଳାଇବା ମାନେ ଭାଙ୍ଗିବା।","s":"draft"},"d.site_visit.reveal.cost":{"en":"Indicative: one site visit, timed right.","t":"ଆନୁମାନିକ: ଗୋଟିଏ ସାଇଟ୍ ଭିଜିଟ୍, ଠିକ୍ ସମୟରେ।","s":"draft"},"d.site_visit.reveal.twist":{"en":"Photos arrive after the pour, essentially always. The request for photos is genuinely well-intentioned and structurally guaranteed to be too late.","t":"ଫଟୋ ପ୍ରାୟ ସବୁବେଳେ ଢଳା ପରେ ହିଁ ଆସେ। ଫଟୋ ମାଗିବା ପଛରେ ମନ ଠିକ୍ ଥାଏ, କିନ୍ତୁ ବ୍ୟବସ୍ଥା ହିଁ ଏମିତି ଯେ ତାହା ଡେରି ହୋଇଯିବ।","s":"draft"},"d.site_visit.reveal.lesson":{"en":"Supervision has a window, and for underground work that window is measured in hours. Inspection outside the window is documentation, not control.","t":"ତଦାରଖର ଗୋଟିଏ ସମୟସୀମା ଥାଏ, ଆଉ ମାଟି ତଳର କାମ ପାଇଁ ସେ ସମୟ ଘଣ୍ଟାରେ ମାପି ହୁଏ। ସେ ସମୟ ବାହାରେ ଯାଞ୍ଚ ହେଉଛି କେବଳ ରେକର୍ଡ, ନିୟନ୍ତ୍ରଣ ନୁହେଁ।","s":"draft"},"d.site_visit.analysis.photos":{"en":"You'll receive a clear photograph of an irreversible decision. It's a record, not a check.","t":"ଆପଣଙ୍କୁ ଏକ ଅପରିବର୍ତ୍ତନୀୟ ନିଷ୍ପତ୍ତିର ସ୍ପଷ୍ଟ ଫଟୋ ମିଳିବ। ଏହା ରେକର୍ଡ, ଯାଞ୍ଚ ନୁହେଁ।","s":"draft"},"d.site_visit.analysis.after":{"en":"You'll see what was built and be able to raise it. Whether anything changes depends on whether the client will pay to break a slab. They won't.","t":"ଯାହା ତିଆରି ହୋଇଛି ଆପଣ ଦେଖିବେ ଆଉ କଥା ଉଠାଇ ପାରିବେ। କିଛି ବଦଳିବ କି ନାହିଁ, ତାହା ନିର୍ଭର କରେ କ୍ଲାଏଣ୍ଟ ସ୍ଲାବ୍ ଭାଙ୍ଗିବା ପାଇଁ ଟଙ୍କା ଦେବେ କି ନାହିଁ। ଦେବେ ନାହିଁ।","s":"draft"},"d.site_visit.analysis.during":{"en":"The only option that can change the outcome. Everything else on this list is you finding out.","t":"ଫଳ ବଦଳାଇ ପାରୁଥିବା ଏକମାତ୍ର ବିକଳ୍ପ। ଏ ତାଲିକାର ବାକି ସବୁ କେବଳ ଆପଣଙ୍କ ଜାଣିବା।","s":"draft"},"d.truck_access.section":{"en":"THE SITE","t":"ସାଇଟ୍","s":"draft"},"d.truck_access.prompt":{"en":"Have you checked a desludging truck can actually get here?","t":"ପଙ୍କ ଉଠାଉଥିବା ଟ୍ରକ୍ ଆସଲରେ ଏଠିକି ଆସିପାରିବ କି, ଦେଖିଛନ୍ତି?","s":"draft"},"d.truck_access.opt.assume":{"en":"The road's 20 feet wide. It'll manage","t":"ରାସ୍ତା 20 ଫୁଟ ଚଉଡ଼ା। ହୋଇଯିବ","s":"draft"},"d.truck_access.opt.measure":{"en":"Measure the turning radius and the gate width","t":"ଟର୍ନିଂ ରେଡିଅସ୍ ଆଉ ଗେଟ୍‌ର ଚଉଡ଼ା ମାପନ୍ତୁ","s":"draft"},"d.truck_access.opt.hose":{"en":"Measure it, and keep the tank within 30 m of where the truck can stand","t":"ମାପନ୍ତୁ, ଆଉ ଟ୍ରକ୍ ଠିଆ ହେଉଥିବା ଜାଗାଠାରୁ 30 ମିଟର ଭିତରେ ଟାଙ୍କି ରଖନ୍ତୁ","s":"draft"},"d.truck_access.reveal.fact":{"en":"A desludging truck needs roughly 3 m of width, space to turn, and its suction hose reaches about 30 m at best — less with bends and any lift.","t":"ପଙ୍କ ଉଠାଉଥିବା ଟ୍ରକ୍ ପାଇଁ ପ୍ରାୟ 3 ମିଟର ଚଉଡ଼ା ଦରକାର, ମୋଡ଼ିବା ପାଇଁ ଜାଗା ଦରକାର, ଆଉ ତାର ସକ୍ସନ୍ ହୋଜ୍ ବେଶିରେ ପ୍ରାୟ 30 ମିଟର ଯାଏ — ମୋଡ଼ ଆଉ ଉଚ୍ଚତା ଥିଲେ ଆହୁରି କମ୍।","s":"draft"},"d.truck_access.reveal.cost":{"en":"Indicative: nil at design stage. Impossible to fix afterwards.","t":"ଆନୁମାନିକ: ଡିଜାଇନ୍ ବେଳେ ଶୂନ। ପରେ ଠିକ୍ କରିବା ଅସମ୍ଭବ।","s":"draft"},"d.truck_access.reveal.twist":{"en":"The access that exists during construction is not the access that will exist later. The road gets narrowed by parking, the gate gets a pillar, the neighbour builds. Design for worse than today.","t":"ତିଆରି ବେଳେ ଯେଉଁ ପହଞ୍ଚ ଥାଏ, ପରେ ସେଇଟା ରହେ ନାହିଁ। ଗାଡ଼ି ରଖିବାରେ ରାସ୍ତା ସଙ୍କୁଚିତ ହୁଏ, ଗେଟ୍‌ରେ ଖମ୍ବ ଆସେ, ପଡ଼ୋଶୀ ଘର କରନ୍ତି। ଆଜିଠାରୁ ଖରାପ ଅବସ୍ଥା ଧରି ଡିଜାଇନ୍ କରନ୍ତୁ।","s":"draft"},"d.truck_access.reveal.lesson":{"en":"Truck access is a design input that appears on no checklist and in no drawing. When it fails, the fallback is not a smaller truck — it's a person with a bucket.","t":"ଟ୍ରକ୍ ପହଞ୍ଚ ଏମିତି ଏକ ଡିଜାଇନ୍ ସର୍ତ୍ତ ଯାହା କୌଣସି ଚେକ୍‌ଲିଷ୍ଟ କି ଡ୍ରଇଂରେ ନାହିଁ। ଏହା ବିଫଳ ହେଲେ ବିକଳ୍ପ ଛୋଟ ଟ୍ରକ୍ ନୁହେଁ — ବିକଳ୍ପ ହେଉଛି ବାଲ୍ଟି ଧରି ଜଣେ ମଣିଷ।","s":"draft"},"d.truck_access.analysis.assume":{"en":"Twenty feet today. Ask what it is after both neighbours park. The gap between 'it'll manage' and 'it didn't' is where manual emptying lives.","t":"ଆଜି କୋଡ଼ିଏ ଫୁଟ। ଦୁଇ ପଡ଼ୋଶୀ ଗାଡ଼ି ରଖିଲା ପରେ କେତେ ରହିବ ପଚାରନ୍ତୁ। 'ହୋଇଯିବ' ଆଉ 'ହେଲା ନାହିଁ' ମଧ୍ୟରେ ଥିବା ଫାଙ୍କରେ ହିଁ ହାତରେ ଖାଲି କରିବା ରହେ।","s":"draft"},"d.truck_access.analysis.measure":{"en":"You turned an assumption into a number. That number can now be checked by somebody else, which is the whole point.","t":"ଆପଣ ଏକ ଅନୁମାନକୁ ଏକ ସଂଖ୍ୟାରେ ବଦଳାଇଲେ। ସେ ସଂଖ୍ୟା ଏବେ ଆଉ କେହି ଯାଞ୍ଚ କରିପାରିବେ, ଆଉ ପୂରା କଥା ସେଇଟା ହିଁ।","s":"draft"},"d.truck_access.analysis.hose":{"en":"You designed to the hose, not to the truck. That's the constraint that actually binds, and almost nobody thinks about it.","t":"ଆପଣ ଟ୍ରକ୍ ନୁହେଁ, ହୋଜ୍ ଧରି ଡିଜାଇନ୍ କଲେ। ଆସଲରେ ସେଇଟା ହିଁ ପ୍ରକୃତ ବାଧା, ଆଉ ପ୍ରାୟ କେହି ସେ କଥା ଭାବନ୍ତି ନାହିଁ।","s":"draft"},"d.quote_line.section":{"en":"THE QUOTE","t":"କୋଟେସନ୍","s":"draft"},"d.quote_line.prompt":{"en":"How does the septic tank appear in your quote?","t":"ଆପଣଙ୍କ କୋଟେସନ୍‌ରେ ସେପ୍ଟିକ୍ ଟାଙ୍କି କିପରି ଆସେ?","s":"draft"},"d.quote_line.opt.lumpsum":{"en":"\"Sanitation works — lump sum.\" One line","t":"\"ସାନିଟେସନ୍ କାମ — ଲମ୍ପସମ୍.\" ଗୋଟିଏ ଲାଇନ୍","s":"draft"},"d.quote_line.opt.optional":{"en":"Base price without covers and vent. Those go in as extras","t":"କଭର୍ ଆଉ ଭେଣ୍ଟ୍ ବିନା ବେସ୍ ଦାମ। ସେ ଦୁଇଟା ଅତିରିକ୍ତ ଭାବେ","s":"draft"},"d.quote_line.opt.itemised":{"en":"Itemised: tank, covers, vent, soak pit — each priced separately","t":"ଆଇଟମ୍ ଅନୁସାରେ: ଟାଙ୍କି, କଭର୍, ଭେଣ୍ଟ୍, ସୋକ୍ ପିଟ୍ — ପ୍ରତ୍ୟେକର ଅଲଗା ଦାମ","s":"draft"},"d.quote_line.reveal.fact":{"en":"A lump-sum line lets the contractor choose the cheapest interpretation, legitimately. The client compared your number to another number; neither of them described the same tank.","t":"ଲମ୍ପସମ୍ ଲାଇନ୍ ଠିକାଦାରଙ୍କୁ ସବୁଠୁ ଶସ୍ତା ମାନେ ବାଛିବାର ଅଧିକାର ଦିଏ, ଆଉ ସେଥିରେ ଭୁଲ୍ କିଛି ନାହିଁ। କ୍ଲାଏଣ୍ଟ ଆପଣଙ୍କ ସଂଖ୍ୟାକୁ ଆଉ ଏକ ସଂଖ୍ୟା ସହ ମିଳାଇଲେ; ଦୁଇଟା ଯାକ ସମାନ ଟାଙ୍କି ବିଷୟରେ ନଥିଲା।","s":"draft"},"d.quote_line.reveal.cost":{"en":"Indicative: the covers and vent together are ₹6,000–11,000 — under 1% of a typical build, invisible inside a lump sum.","t":"ଆନୁମାନିକ: କଭର୍ ଆଉ ଭେଣ୍ଟ୍ ମିଶି ₹6,000–11,000 — ସାଧାରଣ ଘର ଖର୍ଚ୍ଚର 1%ରୁ କମ୍, ଆଉ ଲମ୍ପସମ୍ ଭିତରେ ଏହା ଦିଶେ ନାହିଁ।","s":"draft"},"d.quote_line.reveal.twist":{"en":"Itemising can lose you the job, because a competitor's lump sum will look cheaper than your honest total. The market actively penalises the transparent quote.","t":"ଆଇଟମ୍ ଅନୁସାରେ ଦେଲେ କାମଟା ହାତରୁ ଯାଇପାରେ, କାରଣ ଆଉ ଜଣଙ୍କର ଲମ୍ପସମ୍ ଆପଣଙ୍କ ସଚ୍ଚୋଟ ମୋଟଠାରୁ ଶସ୍ତା ଦିଶିବ। ବଜାର ସଚ୍ଚୋଟ କୋଟେସନ୍‌କୁ ହିଁ ଦଣ୍ଡ ଦିଏ।","s":"draft"},"d.quote_line.reveal.lesson":{"en":"Competitive quoting drives out exactly the items nobody can see. Unless the safety components are named lines, the bidding process deletes them on everyone's behalf.","t":"ପ୍ରତିଯୋଗିତାମୂଳକ କୋଟେସନ୍ ଠିକ୍ ସେଇ ଜିନିଷଗୁଡ଼ିକୁ ବାହାର କରିଦିଏ ଯାହା କେହି ଦେଖି ପାରନ୍ତି ନାହିଁ। ସୁରକ୍ଷା ଜିନିଷଗୁଡ଼ିକ ନାଁ ଲେଖା ଅଲଗା ଲାଇନ୍ ନ ହେଲେ, ବିଡ୍ ପ୍ରକ୍ରିୟା ସମସ୍ତଙ୍କ ତରଫରୁ ସେଗୁଡ଼ିକୁ ବାଦ ଦେଇଦିଏ।","s":"draft"},"d.quote_line.analysis.lumpsum":{"en":"Standard practice, and it hands you the discretion to build the cheapest compliant tank. You will use it, because your margin is in there.","t":"ଚଳନ୍ତି ପ୍ରଥା, ଆଉ ଏହା ଆପଣଙ୍କୁ ସବୁଠୁ ଶସ୍ତା ଟାଙ୍କି ତିଆରି କରିବାର ଛୁଟ୍ ଦିଏ। ଆପଣ ତାହା ବ୍ୟବହାର କରିବେ, କାରଣ ଆପଣଙ୍କ ଲାଭ ସେଇଠି ଅଛି।","s":"draft"},"d.quote_line.analysis.optional":{"en":"The worst of both. You've named the covers and the vent, which makes them a visible cost the client can now consciously decline. Most will.","t":"ଦୁଇ ଆଡ଼ୁ ଖରାପ। ଆପଣ କଭର୍ ଆଉ ଭେଣ୍ଟ୍‌ର ନାଁ ଲେଖିଲେ, ତେଣୁ ଏବେ ସେଗୁଡ଼ିକ ଏକ ଦିଶୁଥିବା ଖର୍ଚ୍ଚ ଯାହାକୁ କ୍ଲାଏଣ୍ଟ ଜାଣି ଶୁଣି ମନା କରିପାରିବେ। ଅଧିକାଂଶ ମନା କରିବେ।","s":"draft"},"d.quote_line.analysis.itemised":{"en":"You made the invisible items visible and quotable. It may cost you this job. It's also the only version where the client is genuinely choosing.","t":"ଆପଣ ନ ଦିଶୁଥିବା ଜିନିଷଗୁଡ଼ିକୁ ଦିଶିବା ଓ ଦାମଯୋଗ୍ୟ କରିଦେଲେ। ଏଥିରେ ଏ କାମ ହାତରୁ ଯାଇପାରେ। କିନ୍ତୁ ଏଇଟା ହିଁ ଏକମାତ୍ର ରୂପ ଯେଉଁଠି କ୍ଲାଏଣ୍ଟ ପ୍ରକୃତରେ ବାଛୁଛନ୍ତି।","s":"draft"},"d.labour_in_pit.section":{"en":"ON SITE","t":"ସାଇଟ୍‌ରେ","s":"draft"},"d.labour_in_pit.prompt":{"en":"Someone has to go down and plaster the inside. Today.","t":"କେହି ଜଣେ ତଳକୁ ଓହ୍ଲାଇ ଭିତରେ ପ୍ଲାଷ୍ଟର୍ କରିବାକୁ ପଡ଼ିବ। ଆଜି।","s":"draft"},"d.labour_in_pit.opt.whoever":{"en":"Whoever's free. It's ten minutes","t":"ଯିଏ ଖାଲି ଅଛି। ଦଶ ମିନିଟର କଥା","s":"draft"},"d.labour_in_pit.opt.rope":{"en":"Our regular man, with a rope tied around him","t":"ଆମର ନିୟମିତ ଲୋକ, ଅଣ୍ଟାରେ ଦଉଡ଼ି ବାନ୍ଧି","s":"draft"},"d.labour_in_pit.opt.kit":{"en":"Nobody goes down until it's aired out, and he has boots, gloves and a harness","t":"ହାୱା ସଫା ନ ହେଲା ଯାଏ କେହି ଓହ୍ଲାଇବେ ନାହିଁ, ଆଉ ତା ପାଖରେ ବୁଟ୍, ଗ୍ଲୋଭ୍ସ ଆଉ ହାର୍ନେସ୍ ରହିବ","s":"draft"},"d.labour_in_pit.reveal.fact":{"en":"The first person to enter the tank isn't the desludger in twenty years — it's a construction worker, this week, plastering it. A new tank is clean, so it feels like it isn't a confined space.","t":"ଟାଙ୍କି ଭିତରକୁ ପ୍ରଥମେ ଯାଉଥିବା ଲୋକ କୋଡ଼ିଏ ବର୍ଷ ପରର ପଙ୍କ ଉଠାଉଥିବା ଲୋକ ନୁହେଁ — ସେ ଏ ସପ୍ତାହରେ ଭିତରେ ପ୍ଲାଷ୍ଟର୍ କରୁଥିବା ଜଣେ ନିର୍ମାଣ ଶ୍ରମିକ। ନୂଆ ଟାଙ୍କି ସଫା ଥାଏ, ତେଣୁ ଏହା ବନ୍ଦ ଜାଗା ପରି ଲାଗେ ନାହିଁ।","s":"draft"},"d.labour_in_pit.reveal.cost":{"en":"Indicative: a blower and basic PPE is a few thousand rupees, reusable across every job you'll ever run.","t":"ଆନୁମାନିକ: ଗୋଟିଏ ବ୍ଲୋଅର୍ ଆଉ ସାଧାରଣ PPE ପାଇଁ କେଇ ହଜାର ଟଙ୍କା, ଆଉ ତାହା ଆପଣଙ୍କ ପ୍ରତ୍ୟେକ କାମରେ ପୁଣି ପୁଣି ବ୍ୟବହାର ହେବ।","s":"draft"},"d.labour_in_pit.reveal.twist":{"en":"A rope around the waist is worse than nothing in a real emergency. An unconscious adult cannot be pulled vertically out of a narrow opening by one person — and the rescuer is usually the second casualty.","t":"ପ୍ରକୃତ ବିପଦ ସମୟରେ ଅଣ୍ଟାରେ ଦଉଡ଼ି କିଛି ନ ଥିବାଠାରୁ ଖରାପ। ଅଚେତ ହୋଇଯାଇଥିବା ଜଣେ ବଡ଼ ଲୋକଙ୍କୁ ସଂକୀର୍ଣ୍ଣ ମୁହଁ ଦେଇ ଜଣେ ଲୋକ ସିଧା ଉପରକୁ ଟାଣି ପାରିବ ନାହିଁ — ଆଉ ବଞ୍ଚାଇବାକୁ ଯାଉଥିବା ଲୋକ ହିଁ ପ୍ରାୟତଃ ଦ୍ୱିତୀୟ ମୃତ୍ୟୁ।","s":"draft"},"d.labour_in_pit.reveal.lesson":{"en":"The habits set during construction become the habits of maintenance. If a person goes in casually while the tank is clean, a person will go in when it isn't.","t":"ତିଆରି ବେଳେ ଯେଉଁ ଅଭ୍ୟାସ ହୁଏ, ସେଇଟା ହିଁ ପରେ ରକ୍ଷଣାବେକ୍ଷଣର ଅଭ୍ୟାସ ହୁଏ। ଟାଙ୍କି ସଫା ଥିବା ବେଳେ ଯଦି ଜଣେ ଏମିତି ଭିତରକୁ ଯାଏ, ତେବେ ସଫା ନ ଥିବା ବେଳେ ବି ଜଣେ ଯିବ।","s":"draft"},"d.labour_in_pit.analysis.whoever":{"en":"It is ten minutes, and it's almost always fine. 'Almost always fine' is exactly the shape of the risk — the practice is normalised long before the day it isn't.","t":"ହଁ, ଦଶ ମିନିଟର କଥା, ଆଉ ପ୍ରାୟ ସବୁବେଳେ କିଛି ହୁଏ ନାହିଁ। 'ପ୍ରାୟ ସବୁବେଳେ କିଛି ହୁଏ ନାହିଁ' — ଠିକ୍ ଏଇଟା ହିଁ ବିପଦର ଆକାର। ଯେଉଁ ଦିନ ହୁଏ, ତା ବହୁତ ଆଗରୁ ଏ ଅଭ୍ୟାସ ସାଧାରଣ ହୋଇଯାଇଥାଏ।","s":"draft"},"d.labour_in_pit.analysis.rope":{"en":"The instinct is right and the mechanism doesn't work. Plan how you'd get him out unconscious; if the answer involves pulling, it isn't a plan.","t":"ମନ ଠିକ୍ ଅଛି, କିନ୍ତୁ ବ୍ୟବସ୍ଥା କାମ କରେ ନାହିଁ। ଭାବନ୍ତୁ ସେ ଅଚେତ ହୋଇଗଲେ ଆପଣ କିପରି ବାହାର କରିବେ; ଯଦି ଉତ୍ତରରେ 'ଟାଣିବା' ଅଛି, ତେବେ ସେଇଟା ଯୋଜନା ନୁହେଁ।","s":"draft"},"d.labour_in_pit.analysis.kit":{"en":"You treated a clean new tank as a confined space, which is the only correct reading of it. This is also the moment your crew learns that's the rule.","t":"ଆପଣ ଏକ ସଫା ନୂଆ ଟାଙ୍କିକୁ ବନ୍ଦ ଜାଗା ଭାବେ ଧରିଲେ, ଆଉ ସେଇଟା ହିଁ ଏକମାତ୍ର ଠିକ୍ ବୁଝିବା। ଆଉ ଏଇ ମୁହୂର୍ତ୍ତରେ ହିଁ ଆପଣଙ୍କ ଦଳ ଶିଖେ ଯେ ନିୟମ ଏଇଟା।","s":"draft"},"d.slab_call.section":{"en":"THE TOP","t":"ଉପର ଭାଗ","s":"draft"},"d.slab_call.prompt":{"en":"The drawing says nothing about the top. You're casting tomorrow.","t":"ଉପର ଭାଗ ବିଷୟରେ ଡ୍ରଇଂରେ କିଛି ନାହିଁ। କାଲି ଢଳା ହେବ।","s":"draft"},"d.slab_call.opt.flush":{"en":"Flush slab. That's how we've always done it","t":"ସମତଳ ସ୍ଲାବ୍। ଆମେ ସବୁବେଳେ ଏମିତି ହିଁ କରିଆସିଛୁ","s":"draft"},"d.slab_call.opt.ask":{"en":"Call the engineer and ask","t":"ଇଞ୍ଜିନିୟରଙ୍କୁ ଫୋନ୍ କରି ପଚାରନ୍ତୁ","s":"draft"},"d.slab_call.opt.covers":{"en":"Leave two covers. Costs me half a bag of cement, saves somebody's day later","t":"ଦୁଇଟା କଭର୍ ଛାଡ଼ନ୍ତୁ। ମୋର ଅଧା ବ୍ୟାଗ୍ ସିମେଣ୍ଟ ଯିବ, ପରେ କାହାର ଦିନ ବଞ୍ଚିବ","s":"draft"},"d.slab_call.reveal.fact":{"en":"Where the drawing is silent, the maistry decides — and this is the single highest-leverage uninstructed decision on the whole site. Nobody will review it, and it is permanent the moment the concrete sets.","t":"ଡ୍ରଇଂ ଯେଉଁଠି ଚୁପ୍, ସେଠି ମିସ୍ତ୍ରୀ ନିଷ୍ପତ୍ତି ନିଏ — ଆଉ ପୂରା ସାଇଟ୍‌ରେ ବିନା ନିର୍ଦ୍ଦେଶରେ ନିଆଯାଉଥିବା ନିଷ୍ପତ୍ତି ଭିତରେ ଏଇଟା ହିଁ ସବୁଠୁ ବଡ଼। ଏହାକୁ କେହି ଯାଞ୍ଚ କରିବେ ନାହିଁ, ଆଉ କଂକ୍ରିଟ୍ ଜମିବା ମାତ୍ରେ ଏହା ସ୍ଥାୟୀ।","s":"draft"},"d.slab_call.reveal.cost":{"en":"Indicative: two cover frames are ₹4,000–8,000 and one extra hour of shuttering.","t":"ଆନୁମାନିକ: ଦୁଇଟା କଭର୍ ଫ୍ରେମ୍ ପାଇଁ ₹4,000–8,000 ଆଉ ଅତିରିକ୍ତ ଏକ ଘଣ୍ଟାର ସଟରିଂ।","s":"draft"},"d.slab_call.reveal.twist":{"en":"Maistries who leave covers often get asked to remove them, because the owner thinks they look unfinished. The safety feature reads as incomplete work.","t":"ଯେଉଁ ମିସ୍ତ୍ରୀ କଭର୍ ଛାଡ଼ନ୍ତି, ତାଙ୍କୁ ପ୍ରାୟତଃ ସେଗୁଡ଼ିକ ହଟାଇବାକୁ କୁହାଯାଏ, କାରଣ ମାଲିକଙ୍କୁ ଲାଗେ କାମ ଅସମ୍ପୂର୍ଣ୍ଣ ଦିଶୁଛି। ସୁରକ୍ଷାର ଜିନିଷଟା ଅଧା କାମ ପରି ଦିଶେ।","s":"draft"},"d.slab_call.reveal.lesson":{"en":"The person with the least formal authority makes the decision with the most consequence, under time pressure, with no instruction and no one to ask. That is the system, not an accident.","t":"ଯାହା ପାଖରେ ସବୁଠୁ କମ୍ ଅଧିକାର, ସେ ହିଁ ସବୁଠୁ ବଡ଼ ପରିଣାମ ଥିବା ନିଷ୍ପତ୍ତି ନିଏ — ସମୟର ଚାପରେ, ବିନା ନିର୍ଦ୍ଦେଶରେ, ଆଉ ପଚାରିବାକୁ କେହି ନଥାଇ। ଏଇଟା ଦୁର୍ଘଟଣା ନୁହେଁ, ଏଇଟା ହିଁ ବ୍ୟବସ୍ଥା।","s":"draft"},"d.slab_call.analysis.flush":{"en":"Habit, and habit is usually good engineering compressed into muscle memory. Not here — this habit formed when tanks were shallower and nobody costed the person opening them.","t":"ଅଭ୍ୟାସ, ଆଉ ଅଭ୍ୟାସ ସାଧାରଣତଃ ହାତରେ ଚାପି ହୋଇଥିବା ଭଲ ଇଞ୍ଜିନିୟରିଂ। କିନ୍ତୁ ଏଠି ନୁହେଁ — ଏ ଅଭ୍ୟାସ ସେତେବେଳେ ତିଆରି ହୋଇଥିଲା ଯେତେବେଳେ ଟାଙ୍କି କମ୍ ଗଭୀର ଥିଲା ଆଉ ଖୋଲୁଥିବା ଲୋକର ହିସାବ କେହି ଧରୁ ନଥିଲେ।","s":"draft"},"d.slab_call.analysis.ask":{"en":"You escalated an uninstructed decision to the person who should have instructed it. Whether they pick up is the test of whether the chain works at all.","t":"ବିନା ନିର୍ଦ୍ଦେଶର ଏକ ନିଷ୍ପତ୍ତିକୁ ଆପଣ ସେହି ଲୋକଙ୍କ ପାଖକୁ ପଠାଇଲେ ଯାହାର ନିର୍ଦ୍ଦେଶ ଦେବା କଥା ଥିଲା। ସେ ଫୋନ୍ ଉଠାନ୍ତି କି ନାହିଁ — ଏଇଟା ହିଁ ପରୀକ୍ଷା ଯେ ଏ ଶୃଙ୍ଖଳା ଆଦୌ କାମ କରୁଛି କି ନାହିଁ।","s":"draft"},"d.slab_call.analysis.covers":{"en":"You spent your own margin on somebody you'll never meet. If the owner asks you to plaster over them, this is the argument worth having.","t":"ଆପଣ କେବେ ନ ଭେଟିଥିବା ଜଣେ ଲୋକ ପାଇଁ ନିଜ ଲାଭରୁ ଖର୍ଚ୍ଚ କଲେ। ମାଲିକ ଯଦି ସେଗୁଡ଼ିକ ଉପରେ ପ୍ଲାଷ୍ଟର୍ କରିବାକୁ କୁହନ୍ତି, ତେବେ ଏ ଯୁକ୍ତି କରିବା ଯୋଗ୍ୟ।","s":"draft"},"d.depth.section":{"en":"THE DIG","t":"ଖୋଳା","s":"draft"},"d.depth.prompt":{"en":"How deep do you dig?","t":"କେତେ ଗଭୀର ଖୋଳିବେ?","s":"draft"},"d.depth.opt.deep":{"en":"As deep as the soil allows. More capacity, fewer complaints","t":"ମାଟି ଯେତେ ଅନୁମତି ଦେଉଛି ସେତେ ଗଭୀର। ଅଧିକ କ୍ୟାପାସିଟି, କମ୍ ଅଭିଯୋଗ","s":"draft"},"d.depth.opt.standard":{"en":"Standard depth. Deeper than this and a man can't work in it","t":"ସାଧାରଣ ଗଭୀରତା। ଏଥିରୁ ଅଧିକ ହେଲେ ଭିତରେ ଲୋକ କାମ କରିପାରିବ ନାହିଁ","s":"draft"},"d.depth.opt.shallow":{"en":"Shallow and wide. Harder to dig, easier to reach into","t":"କମ୍ ଗଭୀର ଆଉ ଚଉଡ଼ା। ଖୋଳିବା କଷ୍ଟ, ଭିତରକୁ ପହଞ୍ଚିବା ସହଜ","s":"draft"},"d.depth.reveal.fact":{"en":"Depth is chosen for capacity in a tight plot. But suction hoses lose lift with depth, and beyond roughly 2 m the sludge at the bottom stops coming up reliably.","t":"ଛୋଟ ଜମିରେ କ୍ୟାପାସିଟି ପାଇଁ ଗଭୀରତା ବଛାଯାଏ। କିନ୍ତୁ ଗଭୀରତା ବଢ଼ିଲେ ସକ୍ସନ୍ ହୋଜ୍‌ର ଟାଣିବା ଶକ୍ତି କମେ, ଆଉ ପ୍ରାୟ 2 ମିଟରରୁ ତଳେ ଥିବା ପଙ୍କ ଠିକ୍ ଭାବେ ଉପରକୁ ଆସେ ନାହିଁ।","s":"draft"},"d.depth.reveal.cost":{"en":"Indicative: shallow-and-wide costs more to excavate and takes more plot area. It is the trade almost nobody makes.","t":"ଆନୁମାନିକ: କମ୍ ଗଭୀର ଓ ଚଉଡ଼ା କରିବାରେ ଖୋଳା ଖର୍ଚ୍ଚ ବେଶି ଆଉ ଜମି ବେଶି ଲାଗେ। ଏ ଅଦଳବଦଳ ପ୍ରାୟ କେହି କରନ୍ତି ନାହିଁ।","s":"draft"},"d.depth.reveal.twist":{"en":"Depth is invisible after backfilling. The desludger arriving in 2048 has no way to know how deep this tank is until the hose comes up empty — and then the decision to climb in gets made in thirty seconds.","t":"ମାଟି ପୂରାଇ ଦେଲା ପରେ ଗଭୀରତା ଦିଶେ ନାହିଁ। 2048ରେ ଆସୁଥିବା ପଙ୍କ ଉଠାଉଥିବା ଲୋକ ପାଖରେ ଏ ଟାଙ୍କି କେତେ ଗଭୀର ଜାଣିବାର କୌଣସି ବାଟ ନାହିଁ, ଯେ ପର୍ଯ୍ୟନ୍ତ ହୋଜ୍ ଖାଲି ଉଠି ନ ଆସେ — ଆଉ ତା'ପରେ ଭିତରକୁ ଓହ୍ଲାଇବାର ନିଷ୍ପତ୍ତି ତିରିଶ ସେକେଣ୍ଡରେ ହୋଇଯାଏ।","s":"draft"},"d.depth.reveal.lesson":{"en":"Every metre of depth converts a hose job into a body job. Capacity is a number on paper; depth is a number in somebody's lungs.","t":"ପ୍ରତି ମିଟର ଗଭୀରତା ଏକ ହୋଜ୍‌ର କାମକୁ ଏକ ଶରୀରର କାମରେ ବଦଳାଇ ଦିଏ। କ୍ୟାପାସିଟି କାଗଜର ଏକ ସଂଖ୍ୟା; ଗଭୀରତା କାହାର ଫୁସ୍‌ଫୁସ୍‌ର ଏକ ସଂଖ୍ୟା।","s":"draft"},"d.depth.analysis.deep":{"en":"Maximum capacity for the footprint, and you've put the sludge below the reach of suction. This is the geometry that most often ends in an entry.","t":"ସେଇ ଜାଗା ପାଇଁ ସର୍ବାଧିକ କ୍ୟାପାସିଟି, ଆଉ ଆପଣ ପଙ୍କକୁ ସକ୍ସନ୍ ପହଞ୍ଚ ବାହାରେ ପକାଇ ଦେଲେ। ଏଇ ଆକାରରେ ହିଁ ସବୁଠୁ ବେଶି ଥର ଲୋକ ଭିତରକୁ ଯାଆନ୍ତି।","s":"draft"},"d.depth.analysis.standard":{"en":"A sound compromise, and notice your own reasoning — you already sized it around a man being in there. Worth asking why he's in there at all.","t":"ଭଲ ମଝି ରାସ୍ତା, ଆଉ ନିଜ ଯୁକ୍ତିକୁ ଟିକିଏ ଦେଖନ୍ତୁ — ଆପଣ ଆଗରୁ ହିଁ ଭିତରେ ଜଣେ ଲୋକ ରହିବ ଧରି ମାପ କରିଛନ୍ତି। ସେ ଆଦୌ ଭିତରେ କାହିଁକି ରହିବ, ସେ କଥା ପଚାରିବା ଦରକାର।","s":"draft"},"d.depth.analysis.shallow":{"en":"More digging, more plot, and a tank a hose can actually clear. You optimised for the job nobody pays you to think about.","t":"ଅଧିକ ଖୋଳା, ଅଧିକ ଜମି, ଆଉ ଏମିତି ଟାଙ୍କି ଯାହା ହୋଜ୍ ଆସଲରେ ସଫା କରିପାରିବ। ଯେଉଁ କାମ ବିଷୟରେ ଭାବିବା ପାଇଁ ଆପଣଙ୍କୁ କେହି ଟଙ୍କା ଦେଉ ନାହାନ୍ତି, ଆପଣ ସେଇଟା ପାଇଁ ଡିଜାଇନ୍ କଲେ।","s":"draft"},"d.speak_up.section":{"en":"THE ROOM","t":"କଥାବାର୍ତ୍ତା","s":"draft"},"d.speak_up.prompt":{"en":"You know the flush slab is wrong. The owner is standing right there.","t":"ସମତଳ ସ୍ଲାବ୍ ଭୁଲ୍ ବୋଲି ଆପଣ ଜାଣନ୍ତି। ମାଲିକ ଠିକ୍ ସେଇଠି ଠିଆ ହୋଇଛନ୍ତି।","s":"draft"},"d.speak_up.opt.quiet":{"en":"Say nothing. He's paying, and he wants it clean","t":"କିଛି କୁହନ୍ତୁ ନାହିଁ। ସେ ଟଙ୍କା ଦେଉଛନ୍ତି, ଆଉ ସେ ସଫା ଚାହୁଁଛନ୍ତି","s":"draft"},"d.speak_up.opt.mention":{"en":"Mention it once. If he says no, it's on him","t":"ଥରେ କହିଦିଅନ୍ତୁ। ସେ ନା କହିଲେ, ସେଇଟା ତାଙ୍କ ଉପରେ","s":"draft"},"d.speak_up.opt.insist":{"en":"Tell him plainly: in ten years somebody breaks this open with a hammer","t":"ସିଧା କୁହନ୍ତୁ: ଦଶ ବର୍ଷ ପରେ କେହି ଜଣେ ଏଇଟାକୁ ହାତୁଡ଼ିରେ ଭାଙ୍ଗିବ","s":"draft"},"d.speak_up.reveal.fact":{"en":"Site knowledge is real and almost entirely unspoken. The people who best understand what a buried tank does are furthest down the hierarchy that decides what gets built.","t":"ସାଇଟ୍‌ର ଜ୍ଞାନ ପ୍ରକୃତ, ଆଉ ପ୍ରାୟ ପୁରା ଅବ୍ୟକ୍ତ। ପୋତା ଟାଙ୍କି କ'ଣ କରେ ସେ କଥା ଯେଉଁମାନେ ସବୁଠୁ ଭଲ ଜାଣନ୍ତି, କ'ଣ ତିଆରି ହେବ ଠିକ୍ କରୁଥିବା କ୍ରମରେ ସେମାନେ ସବୁଠୁ ତଳେ।","s":"draft"},"d.speak_up.reveal.cost":{"en":"Indicative: nothing, except the risk of being seen as difficult by the person who pays you and refers you.","t":"ଆନୁମାନିକ: କିଛି ନୁହେଁ, କେବଳ ଯିଏ ଆପଣଙ୍କୁ ଟଙ୍କା ଦିଏ ଆଉ କାମ ପଠାଏ, ତାଙ୍କ ଆଖିରେ ଝାମେଲାର ଲୋକ ହେବାର ଡର।","s":"draft"},"d.speak_up.reveal.twist":{"en":"When maistries do speak up, owners frequently agree — the objection was never really about money. But the maistry rarely finds out, because he only raises it once and reads the pause as a no.","t":"ମିସ୍ତ୍ରୀ ଯେତେବେଳେ କୁହନ୍ତି, ମାଲିକ ପ୍ରାୟତଃ ମାନି ଯାଆନ୍ତି — ଆପତ୍ତି ଆସଲରେ କେବେ ଟଙ୍କା ନେଇ ନଥାଏ। କିନ୍ତୁ ମିସ୍ତ୍ରୀ ତାହା ଜାଣି ପାରନ୍ତି ନାହିଁ, କାରଣ ସେ ଥରେ ମାତ୍ର କୁହନ୍ତି ଆଉ ଚୁପ୍‌ଚାପ୍‌କୁ 'ନା' ବୋଲି ଧରି ନିଅନ୍ତି।","s":"draft"},"d.speak_up.reveal.lesson":{"en":"The information needed to build this tank well is already on the site. What's missing is a channel where it can be said without professional cost to the person saying it.","t":"ଏ ଟାଙ୍କି ଭଲ ଭାବେ ତିଆରି କରିବା ପାଇଁ ଦରକାରୀ ସୂଚନା ଆଗରୁ ହିଁ ସାଇଟ୍‌ରେ ଅଛି। ନାହିଁ କେବଳ ଏମିତି ଏକ ବାଟ ଯେଉଁଠି କହିଲେ କହୁଥିବା ଲୋକର କାମ ନ ଯାଏ।","s":"draft"},"d.speak_up.analysis.quiet":{"en":"Rational. You're protecting a livelihood built on referrals, and being the difficult maistry is expensive. The knowledge stays with you and dies there.","t":"ଯୁକ୍ତିଯୁକ୍ତ। ଆପଣ ମୁହଁ ଶୁଣା ଉପରେ ଚାଲୁଥିବା ଜୀବିକା ବଞ୍ଚାଉଛନ୍ତି, ଆଉ ଝାମେଲାର ମିସ୍ତ୍ରୀ ହେବା ମହଙ୍ଗା। ଜ୍ଞାନ ଆପଣଙ୍କ ପାଖରେ ରହିଯାଏ ଆଉ ସେଇଠି ମରିଯାଏ।","s":"draft"},"d.speak_up.analysis.mention":{"en":"You transferred the decision, and with it the responsibility. That's fair — and 'mentioned once, quietly' is a low bar for a permanent outcome.","t":"ଆପଣ ନିଷ୍ପତ୍ତି, ଆଉ ସାଙ୍ଗରେ ଦାୟିତ୍ୱ, ସରାଇ ଦେଲେ। ସେଇଟା ଠିକ୍ — କିନ୍ତୁ ଏକ ସ୍ଥାୟୀ ପରିଣାମ ପାଇଁ 'ଥରେ, ଧୀରେ କହିଦେଲି' ବହୁତ କମ୍।","s":"draft"},"d.speak_up.analysis.insist":{"en":"You put a human being into the conversation, which is the only framing that reliably moves an owner. You may also have made this job harder for yourself.","t":"ଆପଣ କଥାବାର୍ତ୍ତା ଭିତରକୁ ଜଣେ ମଣିଷଙ୍କୁ ଆଣିଲେ, ଆଉ ମାଲିକଙ୍କୁ ଏଇଟା ହିଁ ସବୁଠୁ ଭରସାଯୋଗ୍ୟ ଭାବେ ଟଳାଏ। ସାଙ୍ଗରେ ଆପଣ ନିଜ ପାଇଁ ଏ କାମଟା କଷ୍ଟ କରି ଦେଇଥାଇ ପାରନ୍ତି।","s":"draft"},"d.record.section":{"en":"AFTER","t":"ପରେ","s":"draft"},"d.record.prompt":{"en":"Once it's buried, the only record of what's down there is in your head.","t":"ପୋତି ଦେଲା ପରେ, ତଳେ କ'ଣ ଅଛି ତାର ଏକମାତ୍ର ରେକର୍ଡ ଆପଣଙ୍କ ମୁଣ୍ଡରେ।","s":"draft"},"d.record.opt.nothing":{"en":"Nothing. I'll remember","t":"କିଛି ନୁହେଁ। ମୋର ମନେ ରହିବ","s":"draft"},"d.record.opt.photo":{"en":"Take photos on my phone before backfilling","t":"ମାଟି ପୂରାଇବା ଆଗରୁ ଫୋନ୍‌ରେ ଫଟୋ ଉଠାଇବି","s":"draft"},"d.record.opt.mark":{"en":"Photos, and a marker stone set over each cover","t":"ଫଟୋ, ଆଉ ପ୍ରତ୍ୟେକ କଭର୍ ଉପରେ ଗୋଟିଏ ଚିହ୍ନ ପଥର","s":"draft"},"d.record.reveal.fact":{"en":"There is no as-built record for household sanitation anywhere in this chain. The tank's depth, chamber layout and cover positions exist only as memory, and memory moves away or dies.","t":"ଏ ପୁରା ଶୃଙ୍ଖଳାରେ ଘରୋଇ ସାନିଟେସନ୍ ପାଇଁ କୌଣସି ଆସ୍-ବିଲ୍ଟ୍ ରେକର୍ଡ ନାହିଁ। ଟାଙ୍କିର ଗଭୀରତା, ଚାମ୍ବର୍ ସଜ୍ଜା ଆଉ କଭର୍‌ର ଜାଗା କେବଳ ମନେ ରଖିବାରେ ଅଛି, ଆଉ ମନେ ରଖିବା ଦୂରକୁ ଚାଲିଯାଏ କିମ୍ବା ମରିଯାଏ।","s":"draft"},"d.record.reveal.cost":{"en":"Indicative: nil. A phone and ten minutes before the backfill.","t":"ଆନୁମାନିକ: ଶୂନ। ମାଟି ପୂରାଇବା ଆଗରୁ ଗୋଟିଏ ଫୋନ୍ ଆଉ ଦଶ ମିନିଟ୍।","s":"draft"},"d.record.reveal.twist":{"en":"The first task of most desludging visits is finding the tank. Workers probe the yard with rods, then break the slab where it sounds hollow — a search that routinely takes longer than the emptying.","t":"ଅଧିକାଂଶ ପଙ୍କ ଉଠାଇବା ଭିଜିଟ୍‌ର ପ୍ରଥମ କାମ ହେଉଛି ଟାଙ୍କି ଖୋଜିବା। ଶ୍ରମିକମାନେ ଅଗଣାରେ ରଡ୍ ପୂରାଇ ଦେଖନ୍ତି, ତା'ପରେ ଯେଉଁଠି ଫମ୍ପା ଶୁଭେ ସେଠି ସ୍ଲାବ୍ ଭାଙ୍ଗନ୍ତି — ଏ ଖୋଜା ପ୍ରାୟତଃ ଖାଲି କରିବାଠାରୁ ଅଧିକ ସମୟ ନିଏ।","s":"draft"},"d.record.reveal.lesson":{"en":"Twenty-two years is longer than any memory on this site will last. Without a record, the next person starts by guessing, and guessing with a hammer is how the covers you built get destroyed.","t":"ଏ ସାଇଟ୍‌ର କୌଣସି ମନେ ରଖିବା ବାଇଶି ବର୍ଷ ଚଳିବ ନାହିଁ। ରେକର୍ଡ ନଥିଲେ ପରର ଲୋକ ଅନୁମାନରୁ ଆରମ୍ଭ କରେ, ଆଉ ହାତୁଡ଼ି ଧରି ଅନୁମାନ କରିବାରେ ହିଁ ଆପଣଙ୍କ ତିଆରି କଭର୍ ଭାଙ୍ଗିଯାଏ।","s":"draft"},"d.record.analysis.nothing":{"en":"You will remember, for a while. You won't be reachable in 2048, and the house will have changed hands at least once.","t":"କିଛି ଦିନ ଆପଣଙ୍କ ମନେ ରହିବ। 2048ରେ ଆପଣଙ୍କ ପାଖରେ କେହି ପହଞ୍ଚି ପାରିବେ ନାହିଁ, ଆଉ ଘର ଅନ୍ତତଃ ଥରେ ହାତ ବଦଳି ସାରିଥିବ।","s":"draft"},"d.record.analysis.photo":{"en":"Ten minutes of phone storage becomes the only as-built document this tank will ever have. Send them to the owner — your phone won't survive twenty-two years either.","t":"ଫୋନ୍‌ର ଦଶ ମିନିଟ୍ ଏ ଟାଙ୍କିର ଏକମାତ୍ର ଆସ୍-ବିଲ୍ଟ୍ କାଗଜ ହୋଇଯିବ। ସେଗୁଡ଼ିକ ମାଲିକଙ୍କୁ ପଠାଇ ଦିଅନ୍ତୁ — ଆପଣଙ୍କ ଫୋନ୍ ବି ବାଇଶି ବର୍ଷ ଚଳିବ ନାହିଁ।","s":"draft"},"d.record.analysis.mark":{"en":"Photos plus a physical marker. The marker is the part that works, because it speaks to the person standing in the yard with a rod and no information.","t":"ଫଟୋ ସହିତ ଏକ ଦେଖା ଯାଉଥିବା ଚିହ୍ନ। କାମ କରୁଥିବା ଅଂଶ ହେଉଛି ସେଇ ଚିହ୍ନ, କାରଣ ଅଗଣାରେ ରଡ୍ ଧରି କିଛି ନ ଜାଣି ଠିଆ ହୋଇଥିବା ଲୋକକୁ ସେଇଟା କଥା କହେ।","s":"draft"},"verdict.safe.title":{"en":"Emptiable","t":"ଖାଲି କରାଯାଇପାରିବ","s":"draft"},"verdict.safe.body":{"en":"A truck can reach this. A hose can clear it. The atmosphere is vented before anyone lifts a cover. In 2048 this is a job, done from the outside, in forty minutes.","t":"ଏଠିକି ଟ୍ରକ୍ ପହଞ୍ଚି ପାରିବ। ହୋଜ୍ ଏହାକୁ ସଫା କରିପାରିବ। କେହି କଭର୍ ଉଠାଇବା ଆଗରୁ ଭିତରର ହାୱା ବାହାରି ଯାଇଥିବ। 2048ରେ ଏଇଟା ଗୋଟିଏ କାମ, ବାହାରୁ ହିଁ, ଚାଳିଶ ମିନିଟରେ ସରିଯିବ।","s":"draft"},"verdict.difficult.title":{"en":"Difficult","t":"କଷ୍ଟ","s":"draft"},"verdict.difficult.body":{"en":"It can be emptied, but not easily, and not every time. Somewhere in here is a gap — the hose doesn't quite reach, or the opening is tight, or the air is bad. Each visit, somebody decides whether to work around it or climb in. Most days they work around it.","t":"ଏହା ଖାଲି କରାଯାଇପାରିବ, କିନ୍ତୁ ସହଜରେ ନୁହେଁ, ଆଉ ପ୍ରତ୍ୟେକ ଥର ନୁହେଁ। ଏଇ ଭିତରେ କୌଣସି ଏକ ଫାଙ୍କ ଅଛି — ହୋଜ୍ ଠିକ୍ ପହଞ୍ଚୁ ନାହିଁ, କିମ୍ବା ମୁହଁ ସଙ୍କୁଚିତ, କିମ୍ବା ହାୱା ଖରାପ। ପ୍ରତ୍ୟେକ ଥର କେହି ଜଣେ ଠିକ୍ କରେ, ବାହାରୁ ସମ୍ଭାଳିବ ନା ଭିତରକୁ ଓହ୍ଲାଇବ। ଅଧିକାଂଶ ଦିନ ବାହାରୁ ସମ୍ଭାଳନ୍ତି।","s":"draft"},"verdict.unsafe.title":{"en":"Someone goes in","t":"କେହି ଜଣେ ଭିତରକୁ ଯାଏ","s":"draft"},"verdict.unsafe.body":{"en":"There is no version of emptying this tank that doesn't put a person inside it. Not because anyone chose that — because every route that avoided it was closed by a decision made above ground, years earlier, by someone thinking about something else.","t":"ଏ ଟାଙ୍କି ଖାଲି କରିବାର ଏମିତି କୌଣସି ଉପାୟ ନାହିଁ ଯେଉଁଥିରେ ଜଣେ ମଣିଷ ଭିତରକୁ ନ ଯାଏ। କେହି ତାହା ବାଛି ନଥିଲେ — ବରଂ ତାହା ଏଡ଼ାଇବାର ପ୍ରତ୍ୟେକ ବାଟ ମାଟି ଉପରେ ନିଆଯାଇଥିବା ଗୋଟି ber to win the job. Everything below ground is where you find that number again.","t":"কামটো পাবলৈ আপুনি এটা সংখ্যা কৈছিল। মাটিৰ তলৰ সকলোবোৰেই হ'ল সেই সংখ্যাটো ঘূৰাই উলিওৱাৰ ঠাই।","s":"draft"},"persona.maistry.name":{"en":"Maistry","t":"মিস্ত্ৰী","s":"draft"},"persona.maistry.tagline":{"en":"You actually build it. Your hands, your call, on site.","t":"আচলতে আপুনিয়েই বনায়। আপোনাৰ হাত, আপোনাৰ সিদ্ধান্ত, ছাইটতে।","s":"draft"},"persona.maistry.seat":{"en":"The drawing ran out three lines above the ground. From here it is memory and habit.","t":"ড্ৰয়িংখন মাটিৰ ওপৰতে তিনিটা ৰেখাত শেষ হৈ গৈছে। ইয়াৰ পৰা আগলৈ সকলো মনত থকা কথা আৰু অভ্যাস।","s":"draft"},"d.organise.section":{"en":"SETTING UP","t":"আৰম্ভণি","s":"draft"},"d.organise.prompt":{"en":"Who's going to organise this build?","t":"এই নিৰ্মাণৰ কামটো কোনে চম্ভালিব?","s":"draft"},"d.organise.opt.maistri":{"en":"A maistry I know — he built my cousin's place","t":"মই চিনি পোৱা এজন মিস্ত্ৰী — মোৰ আত্মীয় এজনৰ ঘৰটো তেৱেঁই বনাইছিল","s":"draft"},"d.organise.opt.contractor":{"en":"A contractor, fixed price, he handles everything","t":"এজন ঠিকাদাৰ, ফিক্সড দাম, সকলো তেৱেঁই চাব","s":"draft"},"d.organise.opt.professional":{"en":"An architect and engineer first, then a contractor","t":"প্ৰথমে আৰ্কিটেক্ট আৰু ইঞ্জিনিয়াৰ, তাৰ পিছত ঠিকাদাৰ","s":"draft"},"d.organise.reveal.fact":{"en":"Most peri-urban homes in this belt are built on trust, not on paper. The maistry route is cheaper and faster, and it produces no document at all.","t":"এই অঞ্চলৰ দাঁতিকাষৰীয়া বেছিভাগ ঘৰেই বনে বিশ্বাসৰ ওপৰত, কাগজৰ ওপৰত নহয়। মিস্ত্ৰীৰ বাটটো সস্তা আৰু সোনকালে হয়, আৰু ইয়াত একো কাগজ-পত্ৰই নোলায়।","s":"draft"},"d.organise.reveal.cost":{"en":"Indicative: maistry-led saves roughly 4–7% of build cost. It also removes the only person contractually obliged to think about the tank.","t":"আন্দাজি হিচাপ: মিস্ত্ৰীৰ হাতত দিলে নিৰ্মাণ খৰচৰ প্ৰায় 4–7% ৰাহি হয়। লগতে টেংকটোৰ কথা ভাবিবলৈ চুক্তিৰে বান্ধ খোৱা একমাত্ৰ মানুহজনকো ইয়ে আঁতৰাই দিয়ে।","s":"draft"},"d.organis
