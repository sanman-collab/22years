_cut.reveal.cost":{"en":"Indicative: the full difference between a bare ring tank and a properly detailed two-chamber tank with covers and vent is ₹25,000–45,000 — roughly a third of that overrun.","t":"আন্দাজি হিচাপ: খালী ৰিং টেংক এটা আৰু কভাৰ-ভেণ্টসহ ভালদৰে বনোৱা দুই চেম্বাৰৰ টেংক এটাৰ মাজৰ গোটেই পাৰ্থক্যটো ₹25,000–45,000 — সেই বাঢ়তি খৰচৰ প্ৰায় এক তৃতীয়াংশ।","s":"draft"},"d.budget_cut.reveal.twist":{"en":"The tank is rarely cut outright. It's downgraded quietly, by removing the covers and the vent, which is where almost all of the worker-safety value sits.","t":"টেংকটো সম্পূৰ্ণকৈ কটা প্ৰায় নহয়। ইয়াক লাহেকৈ কম কৰি দিয়া হয় — কভাৰ আৰু ভেণ্ট আঁতৰাই দি। আৰু শ্ৰমিকৰ সুৰক্ষাৰ প্ৰায় গোটেই মূল্যটো ওলমি থাকে সেই দুটাতেই।","s":"draft"},"d.budget_cut.reveal.lesson":{"en":"Invisible work loses every budget argument it is in. The only defence is to price the covers and the vent as separate, named lines — so cutting them is a visible act.","t":"দেখা নোপোৱা কামে বাজেটৰ প্ৰতিটো তৰ্কতে হাৰে। একমাত্ৰ বচাৰ উপায় হ'ল কভাৰ আৰু ভেণ্টৰ দাম পৃথক, নাম দিয়া লাইনত ধৰা — যাতে সেইবোৰ কাটিলে সেইটো সকলোৱে দেখা পায়।","s":"draft"},"d.budget_cut.analysis.tank":{"en":"Honest answer, and the most common one. You saved real money on the thing you'll never look at. The cost has been transferred, not removed — to a stranger, in twenty years.","t":"সৎ উত্তৰ, আৰু আটাইতকৈ সাধাৰণ উত্তৰো এইটোৱেই। যিটো বস্তু আপুনি কেতিয়াও নাচাব, তাৰ ওপৰত আপুনি সঁচা টকা ৰাহি কৰিলে। খৰচটো আঁতৰোৱা হোৱা নাই, কেৱল ঠেলি দিয়া হৈছে — কুৰি বছৰৰ পিছত, এজন অচিনাকি মানুহলৈ।","s":"draft"},"d.budget_cut.analysis.finish":{"en":"You defended the part of the build nobody would thank you for. The elevation can be clad in year five; the tank cannot be re-cast.","t":"নিৰ্মাণৰ যিটো অংশৰ বাবে কোনেও আপোনাক ধন্যবাদ নিদিয়ে, আপুনি সেইটোকে ৰক্ষা কৰিলে। এলিভেছনৰ ক্লেডিং পাঁচ বছৰ পিছতো কৰিব পাৰি; টেংকটো আকৌ ঢালিব নোৱাৰি।","s":"draft"},"d.budget_cut.analysis.delay":{"en":"Expensive in patience and rent. But you refused to let the invisible thing absorb the shortfall — which is the whole mechanism this game is about.","t":"ধৈৰ্য আৰু ভাড়াৰ ফালৰ পৰা মহঙা। কিন্তু টকাৰ অভাৱটো দেখা নোপোৱা বস্তুটোৰ ওপৰত পেলাবলৈ আপুনি মান্তি নহ'ল — এই খেলখন গোটেইটোৱেই সেই কথাটোৰেই।","s":"draft"},"d.tanktype.section":{"en":"THE TANK","t":"টেংক","s":"draft"},"d.tanktype.prompt":{"en":"What do we build the tank out of?","t":"টেংকটো কিহেৰে বনাম?","s":"draft"},"d.tanktype.opt.rings":{"en":"Precast concrete rings — fast, cheap, done by evening","t":"প্ৰিকাষ্ট কংক্ৰিট ৰিং — সোনকালে, সস্তা, গধূলিৰ ভিতৰতে শেষ","s":"draft"},"d.tanktype.opt.well":{"en":"Stone-lined, like an old well","t":"শিলেৰে বন্ধা, পুৰণি কুঁৱা এটাৰ দৰে","s":"draft"},"d.tanktype.opt.brick":{"en":"Brick-lined and plastered smooth inside","t":"ইটাৰে বন্ধা আৰু ভিতৰফালে মিহিকৈ প্লাষ্টাৰ কৰা","s":"draft"},"d.tanktype.opt.twochamber":{"en":"Two chambers with a baffle wall, as per IS 2470","t":"বেফল দেৱালসহ দুটা চেম্বাৰ, IS 2470 অনুসৰি","s":"draft"},"d.tanktype.reveal.fact":{"en":"A single-compartment tank doesn't settle solids properly. Sludge carries through to the outlet, the soak pit clogs, and the tank needs emptying far more often than it should.","t":"এটা চেম্বাৰৰ টেংকত গোটা বস্তুবোৰ ভালদৰে তল নপৰে। পাঁক ওলোৱা মুখেৰে ওলাই যায়, ছক পিট বন্ধ হৈ পৰে, আৰু টেংকটো যিমান দৰকাৰ তাতকৈ বহু বেছিবাৰ খালী কৰিব লগা হয়।","s":"draft"},"d.tanktype.reveal.cost":{"en":"Indicative: two-chamber costs ₹12,000–20,000 more than rings. It roughly halves desludging frequency over the tank's life.","t":"আন্দাজি হিচাপ: দুই চেম্বাৰৰ টেংকৰ খৰচ ৰিংতকৈ ₹12,000–20,000 বেছি। টেংকটোৰ গোটেই জীৱনকালত পাঁক উলিওৱাৰ সংখ্যা ইয়াৰ দ্বাৰা প্ৰায় আধা হৈ যায়।","s":"draft"},"d.tanktype.reveal.twist":{"en":"Rings aren't unsafe because of the material. They're unsafe because the ring diameter decides the opening — and a ring tank almost always ends up with a hole too small for anything but a human body.","t":"ৰিং অসুৰক্ষিত হোৱাৰ কাৰণ সামগ্ৰী নহয়। অসুৰক্ষিত হোৱাৰ কাৰণ হ'ল ৰিঙৰ ব্যাসেই মুখটোৰ জোখ ঠিক কৰে — আৰু ৰিং টেংক এটাত প্ৰায় সদায়েই এনে এটা ফুটা থাকি যায় যিটো সঁজুলিৰ বাবে সৰু, কিন্তু মানুহ এজনৰ শৰীৰৰ বাবে ঠিকেই।","s":"draft"},"d.tanktype.reveal.lesson":{"en":"Tank type quietly sets the ceiling on everything downstream: how often it must be opened, what the opening can be, and whether the effluent has anywhere sane to go.","t":"টেংকৰ ধৰণে লাহেকৈ বাকী সকলোবোৰৰ সীমা বান্ধি দিয়ে: কিমান সঘনাই ইয়াক খুলিব লাগিব, মুখটো কেনেকুৱা হ'ব পাৰে, আৰু ওলোৱা পানীখিনি যোৱাৰ কোনো ভাল ঠাই আছেনে নাই।","s":"draft"},"d.tanktype.analysis.rings":{"en":"Fast and defensible on cost. But you've just constrained your own next two decisions — the opening and the effluent options narrow sharply from here.","t":"সোনকাল আৰু খৰচৰ ফালৰ পৰা যুক্তিসংগত। কিন্তু আপুনি নিজৰ পৰৱৰ্তী দুটা সিদ্ধান্তকে সীমিত কৰি পেলালে — ইয়াৰ পৰা মুখটো আৰু ওলোৱা পানীৰ বিকল্পবোৰ বহুত সৰু হৈ যায়।","s":"draft"},"d.tanktype.analysis.well":{"en":"Traditional and more generous in section than rings. Stone joints let water and roots move in both directions, though, so expect it to behave more like a pit than a tank.","t":"পৰম্পৰাগত, আৰু ৰিংতকৈ ভিতৰৰ ঠাই বেছি। কিন্তু শিলৰ সংযোগবোৰেৰে পানী আৰু গছৰ শিপা দুয়োফালে যাব-আহিব পাৰে, গতিকে ইয়াক টেংকতকৈ এটা গাঁতৰ দৰেই ধৰি লওক।","s":"draft"},"d.tanktype.analysis.brick":{"en":"A solid middle. Smooth plaster means less solids clinging, easier emptying. You still only have one compartment, so the outlet will carry sludge.","t":"মজবুত মাজৰ বাট। মিহি প্লাষ্টাৰ মানে গোটা বস্তু কম লাগি থাকে, খালী কৰাটোও সহজ। তথাপি চেম্বাৰ এটাই আছে, গতিকে ওলোৱা মুখেৰে পাঁক ওলাই যাব।","s":"draft"},"d.tanktype.analysis.twochamber":{"en":"The specification that actually exists in Indian standards, and almost never gets built. Everything downstream just got easier — including the effluent options.","t":"ভাৰতীয় মানদণ্ডত সঁচাকৈয়ে থকা স্পেচিফিকেছনটো, যিটো প্ৰায় কেতিয়াও বনোৱা নহয়। ইয়াৰ পিছৰ সকলোবোৰ এতিয়া সহজ হৈ গ'ল — ওলোৱা পানীৰ বিকল্পবোৰো।","s":"draft"},"d.openings.section":{"en":"THE TOP","t":"ওপৰফাল","s":"draft"},"d.openings.prompt":{"en":"How do we close the top?","t":"ওপৰটো কেনেকৈ বন্ধ কৰোঁ?","s":"draft"},"d.openings.opt.flush":{"en":"One flush slab. Clean finish, nothing sticking up","t":"এখন ফ্লাচ শ্লেব। পৰিষ্কাৰ ফিনিছ, একো ওলাই নাথাকে","s":"draft"},"d.openings.opt.small":{"en":"One small opening, about 1½ feet, plastered over later","t":"এটা সৰু মুখ, প্ৰায় 1½ ফুট, পিছত প্লাষ্টাৰ কৰি বন্ধ কৰি দিয়া হ'ব","s":"draft"},"d.openings.opt.covers":{"en":"Two proper covers, 2×2 ft, sitting at ground level","t":"দুটা ঠিকঠাক কভাৰ, 2×2 ফুট, মাটিৰ সমানে বহা","s":"draft"},"d.openings.reveal.fact":{"en":"This is the decision. A 2×2 ft cover at ground level lets a hose and a rake do the work. A 1½ ft hole lets only an arm — or a person — do it. A flush slab means the first step of every desludging is a hammer.","t":"এইটোৱেই আচল সিদ্ধান্ত। মাটিৰ সমানে থকা 2×2 ফুট কভাৰ এটাই হ'জ পাইপ আৰু ৰেকেৰে কামটো কৰিব দিয়ে। 1½ ফুটৰ ফুটা এটাই কেৱল এখন হাত — বা এজন মানুহকহে কামটো কৰিব দিয়ে। ফ্লাচ শ্লেব মানে প্ৰতিবাৰ পাঁক উলিওৱাৰ প্ৰথম পদক্ষেপটোৱেই হাতুৰী।","s":"draft"},"d.openings.reveal.cost":{"en":"Indicative: two covers with frames add ₹4,000–8,000. That is the cheapest line on this entire list and the one most often deleted.","t":"আন্দাজি হিচাপ: ফ্ৰেমসহ দুটা কভাৰত ₹4,000–8,000 অতিৰিক্ত লাগে। এই গোটেই তালিকাখনৰ ভিতৰত এইটোৱেই আটাইতকৈ সস্তা লাইন, আৰু এইটোৱেই আটাইতকৈ বেছি কটা যায়।","s":"draft"},"d.openings.reveal.twist":{"en":"Small openings are usually chosen for safety — so a child doesn't fall in. The result is a tank that can only be cleaned by putting an adult inside it.","t":"সৰু মুখ সাধাৰণতে সুৰক্ষাৰ বাবেই বছা হয় — যাতে ল'ৰা-ছোৱালী ভিতৰত নপৰে। ফলত এনে এটা টেংক হয় যিটো এজন ডাঙৰ মানুহক ভিতৰত সুমুৱাইহে পৰিষ্কাৰ কৰিব পাৰি।","s":"draft"},"d.openings.reveal.lesson":{"en":"Almost every case of a worker entering a tank traces back to an opening too small to work through. Not to poverty, not to ignorance — to a hole somebody sized for tidiness.","t":"টেংকৰ ভিতৰত শ্ৰমিক সোমোৱাৰ প্ৰায় প্ৰতিটো ঘটনাৰ মূলতে আছে কাম কৰিব নোৱাৰাকৈ সৰু এটা মুখ। দৰিদ্ৰতা নহয়, অজ্ঞতাও নহয় — কোনোবাই পৰিপাটিৰ বাবে ঠিক কৰি দিয়া এটা ফুটা।","s":"draft"},"d.openings.analysis.flush":{"en":"You chose the finish. Understandable — a flush slab looks finished and nothing protrudes into the yard. It also means nobody can open this tank without destroying it first.","t":"আপুনি ফিনিছটো বাছি ল'লে। বুজিব পৰা কথা — ফ্লাচ শ্লেব দেখাত সম্পূৰ্ণ লাগে আৰু চোতালত একো ওলাই নাথাকে। ইয়াৰ মানে এইটোও যে এই টেংকটো প্ৰথমে নাভাঙাকৈ কোনেও খুলিব নোৱাৰিব।","s":"draft"},"d.openings.analysis.small":{"en":"The compromise, and by far the most common built outcome. It's better than a sealed slab and still too small to clean through. This is the shape most entries happen into.","t":"মাজৰ বাটটো, আৰু বাস্তৱত আটাইতকৈ বেছি বনোৱা ধৰণটোও এইটোৱেই। বন্ধ শ্লেবতকৈ ভাল, তথাপি ইয়াৰ মাজেৰে পৰিষ্কাৰ কৰিবলৈ বৰ সৰু। বেছিভাগ মানুহে ভিতৰত সোমায় এই আকৃতিটোৰ মাজেৰেই।","s":"draft"},"d.openings.analysis.covers":{"en":"The single highest-value choice available to you. A hose reaches, a rake reaches, and nobody has to. Keep the frames at ground level — raised ones get buried by later landscaping.","t":"আপোনাৰ হাতত থকা আটাইতকৈ মূল্যৱান সিদ্ধান্তটো। হ'জ পাইপ পায়, ৰেক পায়, আৰু কোনো মানুহ নামিব নালাগে। ফ্ৰেমবোৰ মাটিৰ সমানে ৰাখক — ওপৰলৈ উঠি থকাবোৰ পিছত চোতাল সজাওঁতে মাটিৰ তলত পৰি যায়।","s":"draft"},"d.vent.section":{"en":"THE TOP","t":"ওপৰফাল","s":"draft"},"d.vent.prompt":{"en":"And the vent pipe?","t":"আৰু ভেণ্ট পাইপটো?","s":"draft"},"d.vent.opt.none":{"en":"Skip it. Nobody ever asks for one","t":"বাদ দিওঁ। কোনেও কেতিয়াও সেইটো বিচাৰি নাহে","s":"draft"},"d.vent.opt.short":{"en":"A short one, hidden behind the parapet","t":"এটা চুটি, পেৰাপেটৰ আঁৰত লুকুৱাই","s":"draft"},"d.vent.opt.proper":{"en":"Full height, above the roof line, with a cowl","t":"পূৰা উচ্চতা, ছাদৰ ওপৰলৈ, মূৰত এটা কাউল দি","s":"draft"},"d.vent.reveal.fact":{"en":"A septic tank generates hydrogen sulphide and methane and consumes oxygen. An unvented tank holds that atmosphere indefinitely. Opening the cover does not clear it.","t":"ছেপ্টিক টেংক এটাই হাইড্ৰ'জেন ছালফাইড আৰু মিথেন উৎপন্ন কৰে আৰু অক্সিজেন খাই পেলায়। ভেণ্ট নথকা টেংক এটাই সেই বতাহখিনি বছৰৰ পিছত বছৰ ধৰি ৰাখে। কভাৰটো খুলিলেই সেয়া আঁতৰি নাযায়।","s":"draft"},"d.vent.reveal.cost":{"en":"Indicative: a proper vent is ₹1,500–3,000 of PVC. It is the cheapest life-safety item in the entire build.","t":"আন্দাজি হিচাপ: এটা ঠিকঠাক ভেণ্ট মানে ₹1,500–3,000 ৰ PVC। গোটেই নিৰ্মাণটোৰ ভিতৰত জীৱন ৰক্ষাৰ আটাইতকৈ সস্তা বস্তুটো এইটোৱেই।","s":"draft"},"d.vent.reveal.twist":{"en":"Hydrogen sulphide destroys your sense of smell within seconds at dangerous concentrations. The warning stops exactly when the danger starts — which is why people say 'it didn't smell bad' afterwards.","t":"বিপদজনক মাত্ৰাত হাইড্ৰ'জেন ছালফাইডে কেইছেকেণ্ডমানৰ ভিতৰতে আপোনাৰ গোন্ধ পোৱা শক্তি নষ্ট কৰি দিয়ে। ঠিক যেতিয়া বিপদ আৰম্ভ হয়, তেতিয়াই সতৰ্কবাণীটো বন্ধ হৈ যায় — সেইবাবেই মানুহে পিছত কয়, 'গোন্ধ তো বেয়া লগা নাছিল'।","s":"draft"},"d.vent.reveal.lesson":{"en":"A vent is not for the smell. It is the only thing standing between a confined space and a breathable one, and it is left off precisely because its benefit is invisible.","t":"ভেণ্ট গোন্ধৰ বাবে নহয়। এটা বন্ধ ঠাই আৰু উশাহ ল'ব পৰা ঠাই এটাৰ মাজত থিয় হৈ থকা একমাত্ৰ বস্তুৱেই সেইটো, আৰু ইয়াক বাদ দিয়া হয় ঠিক এই কাৰণেই যে ইয়াৰ লাভটো চকুৰে দেখা নাযায়।","s":"draft"},"d.vent.analysis.none":{"en":"The most common outcome, and the one that turns an awkward job into a fatal one. Everything good you did with the covers is undone by the atmosphere behind them.","t":"আটাইতকৈ সাধাৰণ পৰিণাম, আৰু এইটোৱেই এটা টান কামক প্ৰাণঘাতী কাম কৰি তোলে। কভাৰেৰে আপুনি কৰা সকলো ভাল কামখিনি তাৰ আঁৰৰ বতাহখিনিয়ে নষ্ট কৰি দিয়ে।","s":"draft"},"d.vent.analysis.short":{"en":"Better than nothing — there is a path for gas to leave. Hidden behind a parapet it will vent into a pocket of still air, and it will be the first thing sealed during any future renovation.","t":"একো নথকাতকৈ ভাল — গেছ ওলাই যোৱাৰ এটা বাট আছে। কিন্তু পেৰাপেটৰ আঁৰত লুকুৱাই থ'লে সেয়া বন্ধ হৈ থকা বতাহৰ এটা চুকতেই ওলাব, আৰু ভৱিষ্যতে যিকোনো মেৰামতিৰ সময়ত এইটোৱেই প্ৰথমে বন্ধ কৰি দিয়া হ'ব।","s":"draft"},"d.vent.analysis.proper":{"en":"Correct. Above the roof line, away from windows, with a cowl so it doesn't block. This is the difference between a confined space and a tank.","t":"শুদ্ধ। ছাদৰ ওপৰত, খিৰিকীৰ পৰা আঁতৰত, আৰু বন্ধ নহ'বলৈ মূৰত এটা কাউল। এইটোৱেই এটা বন্ধ ঠাই আৰু এটা টেংকৰ মাজৰ পাৰ্থক্য।","s":"draft"},"d.effluent.section":{"en":"THE OUTLET","t":"ওলোৱা মুখ","s":"draft"},"d.effluent.prompt":{"en":"Where does the water leaving the tank go?","t":"টেংকৰ পৰা ওলোৱা পানীখিনি ক'লৈ যায়?","s":"draft"},"d.effluent.opt.storm":{"en":"Into the storm drain out front","t":"আগফালৰ নলাটোলৈ","s":"draft"},"d.effluent.opt.soak":{"en":"A soak pit right next to the tank","t":"টেংকৰ কাষতেই এটা ছক পিট","s":"draft"},"d.effluent.opt.dispersion":{"en":"A dispersion trench, sized for the soil","t":"মাটিৰ ধৰণ অনুসৰি জোখ কৰা এটা ডিছপাৰ্ছন ট্ৰেঞ্চ","s":"draft"},"d.effluent.reveal.fact":{"en":"Septic effluent is not treated water. Into a storm drain it becomes an open sewage channel; into an undersized soak pit it clogs, backs up, and forces the tank to be opened years early.","t":"ছেপ্টিক টেংকৰ পৰা ওলোৱা পানী পৰিষ্কাৰ কৰা পানী নহয়। নলাত পেলালে সেইটো এটা খোলা পয়ঃপ্ৰণালী হৈ পৰে; সৰু ছক পিটত পেলালে সেইটো বন্ধ হয়, উভতি আহে, আৰু টেংকটো বছৰ কেইটামান আগতেই খুলিবলৈ বাধ্য কৰে।","s":"draft"},"d.effluent.reveal.cost":{"en":"Indicative: a properly sized dispersion trench is ₹15,000–30,000. A clogged soak pit costs a desludging every few months and eventually has to be dug out by hand.","t":"আন্দাজি হিচাপ: ঠিক জোখৰ এটা ডিছপাৰ্ছন ট্ৰেঞ্চৰ খৰচ ₹15,000–30,000। বন্ধ হৈ যোৱা ছক পিট এটাৰ বাবে কেইমাহমানৰ মূৰে মূৰে পাঁক উলিয়াব লাগে, আৰু শেষত হাতেৰেই খান্দি উলিয়াব লগা হয়।","s":"draft"},"d.effluent.reveal.twist":{"en":"A soak pit that fails doesn't announce itself. The tank simply fills faster. By the time anyone investigates, the failure is ten years deep and someone is going into the pit to find it.","t":"ছক পিট এটা বেয়া হ'লে সেইটো নিজে জনাই নিদিয়ে। টেংকটো কেৱল সোনকালে ভৰি যায়। যেতিয়ালৈকে কোনোবাই চাবলৈ ধৰে, তেতিয়ালৈ সমস্যাটো দহ বছৰ পুৰণি হৈ গৈছে, আৰু সেইটো বিচাৰিবলৈ কোনোবা এজন পিটটোৰ ভিতৰত নামিছে।","s":"draft"},"d.effluent.reveal.lesson":{"en":"Where the water goes decides how often the tank is opened. Frequency is exposure. Every avoidable desludging is another entry into somebody's working year.","t":"পানীখিনি ক'লৈ যায় সেইটোৱেই ঠিক কৰে টেংকটো কিমান সঘনাই খোলা হ'ব। সঘনতাই মানে এক্সপ'জাৰ। বচাব পৰা প্ৰতিটো পাঁক উলিওৱাৰ কামেই কোনোবা এজনৰ কামৰ বছৰটোত আৰু এবাৰ ভিতৰত সোমোৱা।","s":"draft"},"d.effluent.analysis.storm":{"en":"It works, immediately and completely, and it moves the problem into the street. Whoever cleans that drain now meets your sewage without knowing it's sewage.","t":"এইটোৱে কাম কৰে, লগে লগে আৰু সম্পূৰ্ণকৈ, আৰু সমস্যাটো ৰাস্তালৈ ঠেলি দিয়ে। এতিয়া যিয়ে সেই নলাটো পৰিষ্কাৰ কৰে, তেওঁ আপোনাৰ পয়ঃবৰ্জ্যৰ সন্মুখীন হয়, আৰু সেয়া পয়ঃবৰ্জ্য বুলিও নাজানে।","s":"draft"},"d.effluent.analysis.soak":{"en":"The standard answer and a reasonable one — if it's sized for the soil and set back from the tank. Most aren't, and the clogging shows up as a tank that mysteriously fills fast.","t":"সাধাৰণ উত্তৰ, আৰু যুক্তিসংগতো — যদিহে ইয়াৰ জোখ মাটিৰ ধৰণ অনুসৰি হয় আৰু টেংকৰ পৰা আঁতৰত থাকে। বেছিভাগেই তেনেকুৱা নহয়, আৰু বন্ধ হোৱাটো ধৰা পৰে এনেকৈ যে টেংকটো কিয় জানো সোনকালে ভৰি যায়।","s":"draft"},"d.effluent.analysis.dispersion":{"en":"The right answer where soil allows, and it's only available to you because you built a tank whose outlet water is clean enough to disperse. The earlier choice paid for itself here.","t":"মাটিয়ে অনুমতি দিলে এইটোৱেই শুদ্ধ উত্তৰ, আৰু এই বিকল্পটো আপুনি পাইছে কেৱল সেই কাৰণে যে আপুনি এনে এটা টেংক বনাইছে যাৰ ওলোৱা পানী সিঁচি দিব পৰাকৈ পৰিষ্কাৰ। আগৰ সিদ্ধান্তটোৱে ইয়াতে নিজৰ দাম উলিয়াই দিলে।","s":"draft"},"d.drawing.section":{"en":"ON PAPER","t":"কাগজত","s":"draft"},"d.drawing.prompt":{"en":"What actually goes on the drawing for the tank?","t":"টেংকটোৰ বাবে ড্ৰয়িঙত আচলতে কি থাকে?","s":"draft"},"d.drawing.opt.st":{"en":"'ST' with a rectangle. Everyone knows what that means","t":"এটা আয়তক্ষেত্ৰৰ ভিতৰত 'ST'। সেইটোৰ মানে সকলোৱে জানে","s":"draft"},"d.drawing.opt.detail":{"en":"A full section — chambers, covers, vent, invert levels","t":"এটা সম্পূৰ্ণ ছেকচন — চেম্বাৰ, কভাৰ, ভেণ্ট, ইনভাৰ্ট লেভেল","s":"draft"},"d.drawing.reveal.fact":{"en":"On most sanctioned drawings in this region the septic tank appears as two letters and a rectangle. Nothing about compartments, cover size, vent or outlet is drawn — so nothing about them is checked, priced, or built.","t":"এই অঞ্চলৰ বেছিভাগ অনুমোদিত ড্ৰয়িঙতে ছেপ্টিক টেংকটো থাকে দুটা আখৰ আৰু এটা আয়তক্ষেত্ৰ হিচাপে। চেম্বাৰ, কভাৰৰ জোখ, ভেণ্ট বা ওলোৱা মুখৰ বিষয়ে একো অঁকা নাথাকে — গতিকে সেইবোৰৰ একোৱেই পৰীক্ষা কৰা নহয়, দাম ধৰা নহয়, বনোৱাও নহয়।","s":"draft"},"d.drawing.reveal.cost":{"en":"Indicative: a proper section is one extra sheet and perhaps two hours of drafting time.","t":"আন্দাজি হিচাপ: এটা ঠিকঠাক ছেকচন মানে অতিৰিক্ত এখন শ্বীট আৰু হয়তো দুঘণ্টামান ড্ৰাফটিঙৰ সময়।","s":"draft"},"d.drawing.reveal.twist":{"en":"The rectangle is not laziness. It's what gets approved fastest. Detailing the tank invites questions from an authority that has no mechanism to evaluate the answer.","t":"আয়তক্ষেত্ৰটো এলাহৰ ফল নহয়। সেইটোৱেই আটাইতকৈ সোনকালে অনুমোদন পায়। টেংকটোৰ বিৱৰণ দিলে এনে এটা কৰ্তৃপক্ষৰ পৰা প্ৰশ্ন আহে, যাৰ সেই উত্তৰ জুখি চোৱাৰ কোনো ব্যৱস্থাই নাই।","s":"draft"},"d.drawing.reveal.lesson":{"en":"What is not drawn is not built, not priced, and not anybody's fault. The rectangle is how a responsibility disappears without anyone deciding to drop it.","t":"যিটো অঁকা নহয়, সেইটো বনোৱাও নহয়, তাৰ দামো ধৰা নহয়, আৰু সেইটো কাৰো দোষো নহয়। কোনেও এৰি দিয়াৰ সিদ্ধান্ত নোলোৱাকৈয়ে এটা দায়িত্ব কেনেকৈ নোহোৱা হৈ যায় — সেই উপায়টোৱেই এই আয়তক্ষেত্ৰটো।","s":"draft"},"d.drawing.analysis.st":{"en":"You did what the sanction process rewards. The tank is now entirely in the maistry's memory, and that memory has no cover size in it.","t":"অনুমোদন প্ৰক্ৰিয়াই যিটো কামৰ পুৰস্কাৰ দিয়ে, আপুনি সেইটোৱেই কৰিলে। টেংকটো এতিয়া সম্পূৰ্ণকৈ মিস্ত্ৰীৰ মনত, আৰু সেই মনটোত কভাৰৰ জোখ বুলি একো নাই।","s":"draft"},"d.drawing.analysis.detail":{"en":"You created the one artefact that survives everyone on this project. In 2048 somebody can find out what's down there without a hammer.","t":"এই প্ৰজেক্টৰ সকলোতকৈ বেছি দিন থাকিব পৰা বস্তুটো আপুনি বনালে। 2048 চনত কোনোবাই হাতুৰী নলগাকৈয়ে তলত কি আছে জানিব পাৰিব।","s":"draft"},"d.oc.section":{"en":"AFTER","t":"পিছত","s":"draft"},"d.oc.prompt":{"en":"The house is ready. Do you go through the Occupancy Certificate?","t":"ঘৰটো সাজু হ'ল। আপুনি OC (অকুপেন্সি চাৰ্টিফিকেট) ৰ প্ৰক্ৰিয়াটো কৰিবনে?","s":"draft"},"d.oc.opt.movein":{"en":"Just move in. Nobody in this layout has an OC","t":"সোমাই যাওঁ। এই লে-আউটত কাৰো OC নাই","s":"draft"},"d.oc.opt.getoc":{"en":"Apply for the OC, whatever it takes","t":"যি নহওক, OC ৰ বাবে আবেদন কৰোঁ","s":"draft"},"d.oc.reveal.fact":{"en":"The Occupancy Certificate is the only point at which anyone official is supposed to look at what was actually built, including the sanitation, versus what was approved.","t":"OC হ'ল একমাত্ৰ ঠাই য'ত চৰকাৰী কোনোবা এজনে অনুমোদন হোৱাটোৰ লগত আচলতে কি বনোৱা হ'ল — ছেনিটেছনকে ধৰি — সেইটো মিলাই চোৱাৰ কথা।","s":"draft"},"d.oc.reveal.cost":{"en":"Indicative: weeks of follow-up, and in practice a system most owners route around entirely.","t":"আন্দাজি হিচাপ: কেইসপ্তাহমান লগ লাগি থাকিব লাগিব, আৰু বাস্তৱত বেছিভাগ মালিকে এই ব্যৱস্থাটো সম্পূৰ্ণকৈ এৰাই চলে।","s":"draft"},"d.oc.reveal.twist":{"en":"Skipping the OC doesn't only avoid scrutiny — it removes the building from the record. An unrecorded building is one nobody can later be required to fix.","t":"OC বাদ দিলে কেৱল পৰীক্ষাটোৱেই এৰোৱা নহয় — ঘৰটোৱেই ৰেকৰ্ডৰ পৰা ওলাই যায়। ৰেকৰ্ডত নথকা ঘৰ এটা পিছত ঠিক কৰিবলৈ কাকো বাধ্য কৰিব নোৱাৰি।","s":"draft"},"d.oc.reveal.lesson":{"en":"Accountability isn't a feeling. It's whether a document exists with somebody's name on it. Every step that skips the paperwork removes a future person's ability to ask why.","t":"জবাবদিহি কোনো অনুভৱ নহয়। কাৰোবাৰ নাম দিয়া এখন কাগজ আছেনে নাই — সেইটোৱেই জবাবদিহি। কাগজৰ কামটো এৰি যোৱা প্ৰতিটো পদক্ষেপে ভৱিষ্যতৰ কোনোবা এজনৰ 'কিয়' বুলি সোধাৰ ক্ষমতাটো কাঢ়ি লয়।","s":"draft"},"d.oc.analysis.movein":{"en":"Pragmatic and near-universal. You've also ensured no independent eye ever compared the tank as built to the tank as approved.","t":"ব্যৱহাৰিক, আৰু প্ৰায় সকলোৱে এইটোৱেই কৰে। লগতে আপুনি এইটোও নিশ্চিত কৰিলে যে বনোৱা টেংকটো আৰু অনুমোদন হোৱা টেংকটো কোনো নিৰপেক্ষ চকুৱে কেতিয়াও মিলাই নাচালে।","s":"draft"},"d.oc.analysis.getoc":{"en":"Slow, tedious, and the only mechanism in this entire chain where an outsider checks the work. You kept the tank inside the system of record.","t":"লেহেম, বিৰক্তিকৰ, আৰু এই গোটেই শৃংখলটোৰ একমাত্ৰ ব্যৱস্থা য'ত বাহিৰৰ এজনে কামটো পৰীক্ষা কৰে। আপুনি টেংকটো ৰেকৰ্ডৰ ভিতৰতে ৰাখিলে।","s":"draft"},"d.client_push.section":{"en":"THE BRIEF","t":"ব্ৰিফ","s":"draft"},"d.client_push.prompt":{"en":"The client says: \"Sir, don't complicate the sanitation. The maistry knows.\"","t":"গ্ৰাহকে কয়: \"ছাৰ, ছেনিটেছনটো জটিল নকৰিব। মিস্ত্ৰীয়ে জানে।\"","s":"draft"},"d.client_push.opt.agree":{"en":"Agree. Not worth the argument — I'll focus on the elevation","t":"মান্তি হওঁ। তৰ্ক কৰাৰ মূল্য নাই — মই এলিভেছনতে মন দিম","s":"draft"},"d.client_push.opt.note":{"en":"Put a note on the drawing and move on","t":"ড্ৰয়িঙত এটা টোকা লিখি দি আগবাঢ়োঁ","s":"draft"},"d.client_push.opt.explain":{"en":"Sit them down and explain who opens this tank in twenty years","t":"তেওঁক বহুৱাই বুজাওঁ যে কুৰি বছৰৰ পিছত এই টেংকটো কোনে খুলিব","s":"draft"},"d.client_push.reveal.fact":{"en":"Architects are hired and judged on the visible house. Sanitation sits outside the fee conversation, so professional attention drains away from it exactly where it's most needed.","t":"আৰ্কিটেক্টক ৰখা হয় আৰু জোখা হয় চকুৱে দেখা ঘৰটোৰ ওপৰত। ছেনিটেছন ফীৰ কথা-বতৰাৰ বাহিৰত থাকে, গতিকে ঠিক য'ত পেছাদাৰী মনোযোগ আটাইতকৈ বেছি দৰকাৰ, তাৰ পৰাই সেইটো আঁতৰি যায়।","s":"draft"},"d.client_push.reveal.cost":{"en":"Indicative: the conversation costs twenty minutes and some goodwill. Losing it costs nothing you'll ever be told about.","t":"আন্দাজি হিচাপ: কথা-বতৰাটোত কুৰি মিনিট আৰু অলপ সদিচ্ছা খৰচ হয়। সেই কথাখিনি হেৰুৱালে যি খৰচ হয়, সেই খৰচৰ কথা আপোনাক কোনেও কেতিয়াও নকয়।","s":"draft"},"d.client_push.reveal.twist":{"en":"Clients almost never refuse the covers and the vent on cost. They refuse them because nobody framed them as being about a person. Framed that way, most say yes.","t":"গ্ৰাহকে কভাৰ আৰু ভেণ্ট প্ৰায় কেতিয়াও খৰচৰ কাৰণে নাকচ নকৰে। নাকচ কৰে কাৰণ কোনেও সেইটো এজন মানুহৰ কথা বুলি কৈ নিদিয়ে। সেইদৰে ক'লে বেছিভাগেই হয় বুলি কয়।","s":"draft"},"d.client_push.reveal.lesson":{"en":"The professional's real product here isn't the drawing — it's the one conversation where the invisible worker is named out loud. Skip it and the expertise is simply unused.","t":"ইয়াত পেছাদাৰী মানুহজনৰ আচল সামগ্ৰীটো ড্ৰয়িং নহয় — সেইটো হ'ল সেই এটা কথা-বতৰা য'ত চকুৱে নেদেখা শ্ৰমিকজনৰ নাম মুখেৰে লোৱা হয়। সেইটো এৰি গ'লে সেই জ্ঞানখিনি কেৱল অব্যৱহৃতেই থাকি যায়।","s":"draft"},"d.client_push.analysis.agree":{"en":"You preserved the relationship and gave up the only leverage you had. The expertise is still in your head, which is precisely where it does no good.","t":"আপুনি সম্পৰ্কটো ৰাখিলে আৰু হাতত থকা একমাত্ৰ শক্তিটো এৰি দিলে। জ্ঞানখিনি এতিয়াও আপোনাৰ মূৰতে আছে, আৰু ঠিক সেই ঠাইতেই সেইটোৰ কোনো লাভ নাই।","s":"draft"},"d.client_push.analysis.note":{"en":"A note is a real thing — it survives, it's evidence, it shifts liability. It also gets read by nobody on site. Half a step.","t":"টোকা এটা সঁচা বস্তু — সেইটো থাকি যায়, সেইটো প্ৰমাণ, সেইটোৱে দায়িত্ব সলনি কৰে। লগতে ছাইটত সেইটো কোনেও নপঢ়ে। আধা খোজ।","s":"draft"},"d.client_push.analysis.explain":{"en":"You spent your credibility on the part of the project nobody was going to defend. This is what being the professional in the room actually costs.","t":"প্ৰজেক্টৰ যিটো অংশৰ হৈ কোনেও মাত মতা নাছিল, আপুনি নিজৰ বিশ্বাসযোগ্যতা সেইটোতেই খৰচ কৰিলে। কোঠাটোত পেছাদাৰী মানুহজন হৈ থকাৰ আচল দাম এইটোৱেই।","s":"draft"},"d.handover.section":{"en":"TO SITE","t":"ছাইটলৈ","s":"draft"},"d.handover.prompt":{"en":"What does the maistry actually get from you?","t":"মিস্ত্ৰীয়ে আপোনাৰ পৰা আচলতে কি পায়?","s":"draft"},"d.handover.opt.print":{"en":"An A3 print of the plan. He'll work the rest out","t":"প্লেনখনৰ এখন A3 প্ৰিণ্ট। বাকীখিনি তেৱেঁই বুজি ল'ব","s":"draft"},"d.handover.opt.verbal":{"en":"The print, plus ten minutes on site explaining it","t":"প্ৰিণ্টখন, লগতে ছাইটত দহ মিনিট বুজাই দিয়া","s":"draft"},"d.handover.opt.marked":{"en":"Print, site walk, and I chalk the cover positions myself","t":"প্ৰিণ্ট, ছাইট ঘূৰি চোৱা, আৰু কভাৰৰ ঠাইবোৰ মই নিজে চকেৰে দাগ দিয়া","s":"draft"},"d.handover.reveal.fact":{"en":"The gap between a drawing and a built tank is a conversation that usually doesn't happen. The maistry builds from habit wherever the drawing is silent — and on the tank, the drawing is almost always silent.","t":"এখন ড্ৰয়িং আৰু বনোৱা টেংক এটাৰ মাজৰ ফাঁকটো হ'ল এটা কথা-বতৰা, যিটো সাধাৰণতে নহয়। ড্ৰয়িং য'ত নিমাত, তাত মিস্ত্ৰীয়ে অভ্যাসৰ পৰাই বনায় — আৰু টেংকটোৰ বিষয়ে ড্ৰয়িং প্ৰায় সদায়েই নিমাত।","s":"draft"},"d.handover.reveal.cost":{"en":"Indicative: one site visit. Perhaps an hour.","t":"আন্দাজি হিচাপ: ছাইটলৈ এবাৰ যোৱা। হয়তো এঘণ্টা।","s":"draft"},"d.handover.reveal.twist":{"en":"Maistries very often know more about tanks than the drawing says, and less about why the details matter. The visit works in both directions — you'll learn the site constraint you drew through.","t":"ড্ৰয়িঙত থকাতকৈ টেংকৰ বিষয়ে মিস্ত্ৰীয়ে প্ৰায়েই বেছি জানে, কিন্তু বিৱৰণবোৰ কিয় গুৰুত্বপূৰ্ণ সেইটো কম জানে। ছাইটলৈ যোৱাটোৱে দুয়োফালে কাম কৰে — ড্ৰয়িং কৰোঁতে আপুনি গম নোপোৱা ছাইটৰ বাধাটোৰ কথা আপুনি জানিব।","s":"draft"},"d.handover.reveal.lesson":{"en":"Design intent doesn't travel on paper alone in an oral building culture. If you didn't say it out loud, standing on the spot, you didn't specify it.","t":"মুখৰ কথাৰে চলা নিৰ্মাণ সংস্কৃতিত ডিজাইনৰ উদ্দেশ্য কেৱল কাগজেৰে নাযায়। ঠাইখনত থিয় হৈ আপুনি যদি মুখেৰে কোৱা নাই, তেন্তে আপুনি সেইটো স্পেচিফাই কৰা নাই।","s":"draft"},"d.handover.analysis.print":{"en":"The drawing is now competing with thirty years of habit and losing. Whatever you detailed about the covers will be built the way the last tank was built.","t":"ড্ৰয়িংখন এতিয়া ত্ৰিশ বছৰৰ অভ্যাসৰ লগত প্ৰতিযোগিতা কৰি আছে, আৰু হাৰি আছে। কভাৰৰ বিষয়ে আপুনি যি লিখিলে, সেইটো যোৱাবাৰৰ টেংকটো যেনেকৈ বনাইছিল, তেনেকৈয়ে বনোৱা হ'ব।","s":"draft"},"d.handover.analysis.verbal":{"en":"The ten minutes is the actual specification. This is where intent transfers in a building culture that runs on speech.","t":"সেই দহ মিনিটেই আচল স্পেচিফিকেছন। মুখৰ কথাৰে চলা নিৰ্মাণ সংস্কৃতিত উদ্দেশ্য ইয়াতেই হস্তান্তৰ হয়।","s":"draft"},"d.handover.analysis.marked":{"en":"Chalk on the ground outranks any drawing. You've put the cover positions into the one medium the person casting the slab is actually looking at.","t":"মাটিত দিয়া চকৰ দাগ যিকোনো ড্ৰয়িংতকৈ ওপৰত। শ্লেবটো ঢালি থকা মানুহজনে আচলতে যিটো চাই আছে, আপুনি কভাৰৰ ঠাইবোৰ সেই মাধ্যমটোতেই দিলে।","s":"draft"},"d.sizing.section":{"en":"THE NUMBERS","t":"হিচাপ","s":"draft"},"d.sizing.prompt":{"en":"How do you size the tank?","t":"টেংকটোৰ জোখ আপুনি কেনেকৈ ঠিক কৰে?","s":"draft"},"d.sizing.opt.thumb":{"en":"Thumb rule. 8×4×5 feet does it for a family","t":"থাম্ব ৰুল। এটা পৰিয়ালৰ বাবে 8×4×5 ফুটেই হয়","s":"draft"},"d.sizing.opt.oversize":{"en":"Build it big. Bigger tank, fewer trips","t":"ডাঙৰকৈ বনাওঁ। টেংক ডাঙৰ হ'লে ট্ৰাক কম আহিব","s":"draft"},"d.sizing.opt.std":{"en":"IS 2470 — persons × litres × desludging interval","t":"IS 2470 — মানুহৰ সংখ্যা × লিটাৰ × পাঁক উলিওৱাৰ ব্যৱধান","s":"draft"},"d.sizing.reveal.fact":{"en":"IS 2470 sizes a tank from occupancy, flow and a chosen desludging interval — typically two to three years. The thumb rule sizes it from what fits the corner of the plot.","t":"IS 2470 এ টেংকৰ জোখ উলিয়ায় কিমান মানুহ থাকে, কিমান পানী ওলায় আৰু পাঁক উলিওৱাৰ বাছি লোৱা ব্যৱধানৰ পৰা — সাধাৰণতে দুই-তিনি বছৰ। থাম্ব ৰুলে জোখ উলিয়ায় মাটিৰ চুকটোত যিমান খাপ খায় তাৰ পৰা।","s":"draft"},"d.sizing.reveal.cost":{"en":"Indicative: nil. Correct sizing is arithmetic, not money.","t":"আন্দাজি হিচাপ: শূন্য। শুদ্ধ জোখ উলিওৱাটো পাটীগণিত, টকা নহয়।","s":"draft"},"d.sizing.reveal.twist":{"en":"Oversizing can make things worse. A very deep tank is no easier to empty and much harder to get out of, and the sludge at the bottom of a 7-foot tank is beyond the reach of any hose held from above.","t":"বেছি ডাঙৰ কৰিলে কথা আৰু বেয়া হ'ব পাৰে। বহুত গভীৰ টেংক এটা খালী কৰাটো সহজ নহয় আৰু তাৰ পৰা ওলাই অহাটো বহুত টান, আৰু 7 ফুট গভীৰ টেংক এটাৰ তলৰ পাঁকখিনিত ওপৰৰ পৰা ধৰি থকা কোনো হ'জ পাইপেই নাপায়।","s":"draft"},"d.sizing.reveal.lesson":{"en":"Capacity is the parameter engineers reach for because it's the one with a formula. Depth and opening size decide the worker's day, and neither appears in the capacity calculation.","t":"ইঞ্জিনিয়াৰে ধাৰণক্ষমতাৰ কথাটোৱেই ধৰে কাৰণ সেইটোৰেই এটা সূত্ৰ আছে। কিন্তু শ্ৰমিকজনৰ দিনটো ঠিক কৰে গভীৰতা আৰু মুখৰ জোখে, আৰু ধাৰণক্ষমতাৰ হিচাপত এই দুটাৰ এটাও নাথাকে।","s":"draft"},"d.sizing.analysis.thumb":{"en":"It'll broadly work — thumb rules encode real experience. It just carries no reasoning anyone can check, adjust, or inherit.","t":"মোটামুটি কাম কৰিব — থাম্ব ৰুলত সঁচা অভিজ্ঞতাই থাকে। কেৱল ইয়াৰ লগত এনে কোনো যুক্তি নাথাকে যিটো কোনোবাই পৰীক্ষা কৰিব, সলনি কৰিব বা আগলৈ লৈ যাব পাৰে।","s":"draft"},"d.sizing.analysis.oversize":{"en":"Generous on capacity and quietly hostile on depth. Ask yourself whether a hose can reach the bottom; if not, you've designed in an entry.","t":"ধাৰণক্ষমতাৰ ফালৰ পৰা উদাৰ, আৰু গভীৰতাৰ ফালৰ পৰা নিমাতে ক্ষতিকাৰক। নিজকে সুধিয়ক হ'জ পাইপ এডাল তললৈ পায়নে; যদি নাপায়, তেন্তে আপুনি ডিজাইনতেই এজন মানুহ নমাৰ ব্যৱস্থা কৰি থ'লে।","s":"draft"},"d.sizing.analysis.std":{"en":"You used the standard that exists and is almost never invoked. Now hold the desludging interval you assumed — it's the number that justifies everything else.","t":"যিটো মানদণ্ড আছে আৰু প্ৰায় কেতিয়াও ব্যৱহাৰ কৰা নহয়, আপুনি সেইটোৱেই ব্যৱহাৰ কৰিলে। এতিয়া পাঁক উলিওৱাৰ যিটো ব্যৱধান ধৰি লৈছিল, সেইটো ধৰি ৰাখক — বাকী সকলোবোৰক যুক্তি দিয়া সংখ্যাটো সেইটোৱেই।","s":"draft"},"d.site_visit.section":{"en":"DURING","t":"কাম চলি থকা সময়ত","s":"draft"},"d.site_visit.prompt":{"en":"The tank gets cast on a Tuesday. You're on three other sites.","t":"মঙলবাৰে টেংকটো ঢলা হ'ব। আপুনি আন তিনিটা ছাইটত ব্যস্ত।","s":"draft"},"d.site_visit.opt.photos":{"en":"Ask for photos on WhatsApp","t":"WhatsApp ত ফটো পঠিয়াবলৈ কওঁ","s":"draft"},"d.site_visit.opt.after":{"en":"Go after work, once the slab is on","t":"কামৰ পিছত যাওঁ, শ্লেবটো বহোৱাৰ পিছত","s":"draft"},"d.site_visit.opt.during":{"en":"Be there before they cast. That's the only hour it can be fixed","t":"ঢলাৰ আগতে তাত উপস্থিত থাকোঁ। ঠিক কৰিব পৰা একমাত্ৰ ঘণ্টাটো সেইটোৱেই","s":"draft"},"d.site_visit.reveal.fact":{"en":"A septic tank is correctable for about one hour — between the shuttering going up and the concrete going in. After that, changing the cover size means demolition.","t":"ছেপ্টিক টেংক এটা ঠিক কৰিব পাৰি প্ৰায় এঘণ্টা সময়ৰ ভিতৰত — শ্বাটাৰিং উঠাৰ পিছৰ পৰা কংক্ৰিট ঢলাৰ আগলৈকে। তাৰ পিছত কভাৰৰ জোখ সলনি কৰা মানে ভাঙিব লাগিব।","s":"draft"},"d.site_visit.reveal.cost":{"en":"Indicative: one site visit, timed right.","t":"আন্দাজি হিচাপ: ছাইটলৈ এবাৰ যোৱা, ঠিক সময়ত।","s":"draft"},"d.site_visit.reveal.twist":{"en":"Photos arrive after the pour, essentially always. The request for photos is genuinely well-intentioned and structurally guaranteed to be too late.","t":"ফটো আহে ঢলাৰ পিছতহে, প্ৰায় সদায়েই। ফটো বিচৰাটো সঁচাকৈয়ে ভাল উদ্দেশ্যৰে কৰা, আৰু ব্যৱস্থাটোৰ গঠনৰ কাৰণেই সেইটো নিশ্চিতভাৱে বৰ দেৰি হয়।","s":"draft"},"d.site_visit.reveal.lesson":{"en":"Supervision has a window, and for underground work that window is measured in hours. Inspection outside the window is documentation, not control.","t":"তদাৰকৰ এটা সময়ৰ খিৰিকী থাকে, আৰু মাটিৰ তলৰ কামৰ বাবে সেই খিৰিকীখন ঘণ্টাৰে জোখা হয়। সেই খিৰিকীৰ বাহিৰত কৰা পৰীক্ষা হ'ল কেৱল ৰেকৰ্ড ৰখা, নিয়ন্ত্ৰণ নহয়।","s":"draft"},"d.site_visit.analysis.photos":{"en":"You'll receive a clear photograph of an irreversible decision. It's a record, not a check.","t":"আৰু সলনি কৰিব নোৱাৰা এটা সিদ্ধান্তৰ পৰিষ্কাৰ ফটো এখন আপুনি পাব। সেইটো এটা ৰেকৰ্ড, পৰীক্ষা নহয়।","s":"draft"},"d.site_visit.analysis.after":{"en":"You'll see what was built and be able to raise it. Whether anything changes depends on whether the client will pay to break a slab. They won't.","t":"কি বনোৱা হ'ল আপুনি দেখিব আৰু কথাটো উঠাব পাৰিব। কিবা সলনি হয়নে নহয় সেইটো নিৰ্ভৰ কৰে গ্ৰাহকে শ্লেব এখন ভাঙিবলৈ টকা দিবনে নিদিয়ে তাৰ ওপৰত। তেওঁ নিদিয়ে।","s":"draft"},"d.site_visit.analysis.during":{"en":"The only option that can change the outcome. Everything else on this list is you finding out.","t":"পৰিণামটো সলনি কৰিব পৰা একমাত্ৰ বিকল্প। এই তালিকাৰ বাকী সকলোবোৰ হ'ল আপুনি কেৱল গম পোৱা।","s":"draft"},"d.truck_access.section":{"en":"THE SITE","t":"ছাইট","s":"draft"},"d.truck_access.prompt":{"en":"Have you checked a desludging truck can actually get here?","t":"পাঁক উলিওৱা ট্ৰাক এখন সঁচাকৈ ইয়ালৈ আহিব পাৰেনে, সেইটো আপুনি চাইছেনে?","s":"draft"},"d.truck_access.opt.assume":{"en":"The road's 20 feet wide. It'll manage","t":"ৰাস্তাটো 20 ফুট বহল। হৈ যাব","s":"draft"},"d.truck_access.opt.measure":{"en":"Measure the turning radius and the gate width","t":"ঘূৰাৰ ঠাই আৰু গেটৰ বহলতা জুখি লওঁ","s":"draft"},"d.truck_access.opt.hose":{"en":"Measure it, and keep the tank within 30 m of where the truck can stand","t":"জুখি লওঁ, আৰু ট্ৰাকখন ৰ'ব পৰা ঠাইৰ পৰা 30 মিটাৰৰ ভিতৰতে টেংকটো ৰাখোঁ","s":"draft"},"d.truck_access.reveal.fact":{"en":"A desludging truck needs roughly 3 m of width, space to turn, and its suction hose reaches about 30 m at best — less with bends and any lift.","t":"পাঁক উলিওৱা ট্ৰাক এখনক প্ৰায় 3 মিটাৰ বহল ঠাই লাগে, ঘূৰিবলৈ ঠাই লাগে, আৰু ইয়াৰ ছাকচন হ'জ পাইপ বেছি হ'লে প্ৰায় 30 মিটাৰ যায় — বেঁকা থাকিলে আৰু ওপৰলৈ টানিব লাগিলে তাতকৈও কম।","s":"draft"},"d.truck_access.reveal.cost":{"en":"Indicative: nil at design stage. Impossible to fix afterwards.","t":"আন্দাজি হিচাপ: ডিজাইনৰ সময়ত শূন্য। পিছত ঠিক কৰাটো অসম্ভৱ।","s":"draft"},"d.truck_access.reveal.twist":{"en":"The access that exists during construction is not the access that will exist later. The road gets narrowed by parking, the gate gets a pillar, the neighbour builds. Design for worse than today.","t":"নিৰ্মাণৰ সময়ত যিটো এক্সেছ থাকে, সেইটোৱেই পিছলৈ নাথাকে। গাড়ী ৰখাই ৰাস্তা ঠেক কৰে, গেটত এটা স্তম্ভ ওলায়, চুবুৰীয়াই ঘৰ বনায়। আজিতকৈ বেয়া অৱস্থাৰ কথা ভাবি ডিজাইন কৰক।","s":"draft"},"d.truck_access.reveal.lesson":{"en":"Truck access is a design input that appears on no checklist and in no drawing. When it fails, the fallback is not a smaller truck — it's a person with a bucket.","t":"ট্ৰাকৰ এক্সেছ ডিজাইনৰ এনে এটা কথা যিটো কোনো চেকলিষ্টতো নাথাকে, কোনো ড্ৰয়িঙতো নাথাকে। এইটো বিফল হ'লে বিকল্পটো সৰু ট্ৰাক এখন নহয় — বিকল্পটো হ'ল বাল্টি হাতত এজন মানুহ।","s":"draft"},"d.truck_access.analysis.assume":{"en":"Twenty feet today. Ask what it is after both neighbours park. The gap between 'it'll manage' and 'it didn't' is where manual emptying lives.","t":"আজি 20 ফুট। দুয়োফালৰ চুবুৰীয়াই গাড়ী ৰখাৰ পিছত কিমান থাকে সেইটো সুধিয়ক। 'হৈ যাব' আৰু 'নহ'ল' — এই দুটাৰ মাজৰ ফাঁকতেই হাতেৰে খালী কৰা কামটো থাকে।","s":"draft"},"d.truck_access.analysis.measure":{"en":"You turned an assumption into a number. That number can now be checked by somebody else, which is the whole point.","t":"আপুনি এটা ধাৰণাক এটা সংখ্যালৈ সলনি কৰিলে। সেই সংখ্যাটো এতিয়া আন কোনোবাই পৰীক্ষা কৰিব পাৰিব, আৰু আচল কথাটো সেইটোৱেই।","s":"draft"},"d.truck_access.analysis.hose":{"en":"You designed to the hose, not to the truck. That's the constraint that actually binds, and almost nobody thinks about it.","t":"আপুনি ট্ৰাকখন নহয়, হ'জ পাইপডালৰ হিচাপত ডিজাইন কৰিলে। আচলতে সেইডালেই আচল বাধা, আৰু সেইটোৰ কথা প্ৰায় কোনেও নাভাবে।","s":"draft"},"d.quote_line.section":{"en":"THE QUOTE","t":"কোটেছন","s":"draft"},"d.quote_line.prompt":{"en":"How does the septic tank appear in your quote?","t":"আপোনাৰ কোটেছনত ছেপ্টিক টেংকটো কেনেকৈ ওলায়?","s":"draft"},"d.quote_line.opt.lumpsum":{"en":"\"Sanitation works — lump sum.\" One line","t":"\"ছেনিটেছন ৱৰ্ক — লাম্প ছাম।\" এটা লাইন","s":"draft"},"d.quote_line.opt.optional":{"en":"Base price without covers and vent. Those go in as extras","t":"কভাৰ আৰু ভেণ্ট নোহোৱাকৈ বেছ দাম। সেই দুটা অতিৰিক্ত হিচাপে যাব","s":"draft"},"d.quote_line.opt.itemised":{"en":"Itemised: tank, covers, vent, soak pit — each priced separately","t":"বস্তু ধৰি ধৰি: টেংক, কভাৰ, ভেণ্ট, ছক পিট — প্ৰতিটোৰে পৃথক দাম","s":"draft"},"d.quote_line.reveal.fact":{"en":"A lump-sum line lets the contractor choose the cheapest interpretation, legitimately. The client compared your number to another number; neither of them described the same tank.","t":"লাম্প ছাম লাইন এটাই ঠিকাদাৰক আইনগতভাৱেই আটাইতকৈ সস্তা অৰ্থটো বাছি ল'ব দিয়ে। গ্ৰাহকে আপোনাৰ সংখ্যাটো আন এটা সংখ্যাৰ লগত মিলাই চালে; কিন্তু দুয়োটা সংখ্যাই একেটা টেংকৰ কথা কোৱা নাছিল।","s":"draft"},"d.quote_line.reveal.cost":{"en":"Indicative: the covers and vent together are ₹6,000–11,000 — under 1% of a typical build, invisible inside a lump sum.","t":"আন্দাজি হিচাপ: কভাৰ আৰু ভেণ্ট দুয়োটা মিলি ₹6,000–11,000 — সাধাৰণ এটা নিৰ্মাণৰ 1% তকৈও কম, আৰু লাম্প ছামৰ ভিতৰত একেবাৰে দেখা নাযায়।","s":"draft"},"d.quote_line.reveal.twist":{"en":"Itemising can lose you the job, because a competitor's lump sum will look cheaper than your honest total. The market actively penalises the transparent quote.","t":"বস্তু ধৰি ধৰি দাম দিলে কামটো হাতৰ পৰা যাব পাৰে, কাৰণ প্ৰতিযোগী এজনৰ লাম্প ছামটো আপোনাৰ সৎ মুঠতকৈ সস্তা দেখাব। বজাৰখনে স্বচ্ছ কোটেছনক শাস্তিয়েই দিয়ে।","s":"draft"},"d.quote_line.reveal.lesson":{"en":"Competitive quoting drives out exactly the items nobody can see. Unless the safety components are named lines, the bidding process deletes them on everyone's behalf.","t":"প্ৰতিযোগিতামূলক কোটেছনে ঠিক সেই বস্তুবোৰকে খেদি পঠিয়ায় যিবোৰ কোনেও দেখা নাপায়। সুৰক্ষাৰ অংশবোৰ নাম দিয়া লাইন হৈ নাথাকিলে, টেণ্ডাৰৰ প্ৰক্ৰিয়াটোৱে সকলোৰে হৈ সেইবোৰ কাটি পেলায়।","s":"draft"},"d.quote_line.analysis.lumpsum":{"en":"Standard practice, and it hands you the discretion to build the cheapest compliant tank. You will use it, because your margin is in there.","t":"সাধাৰণ ৰীতি, আৰু ইয়াৰ দ্বাৰা আটাইতকৈ সস্তা কিন্তু নিয়ম মনা টেংক এটা বনোৱাৰ স্বাধীনতা আপোনাৰ হাতত আহে। আপুনি সেইটো ব্যৱহাৰ কৰিবই, কাৰণ আপোনাৰ লাভটো তাতেই আছে।","s":"draft"},"d.quote_line.analysis.optional":{"en":"The worst of both. You've named the covers and the vent, which makes them a visible cost the client can now consciously decline. Most will.","t":"দুয়োটাৰে আটাইতকৈ বেয়া ফালটো। আপুনি কভাৰ আৰু ভেণ্টৰ নাম ল'লে, আৰু তাৰ ফলত সেই দুটা এনে এটা দেখা পোৱা খৰচ হ'ল যিটো গ্ৰাহকে এতিয়া জানি-বুজি নাকচ কৰিব পাৰে। বেছিভাগেই নাকচ কৰিব।","s":"draft"},"d.quote_line.analysis.itemised":{"en":"You made the invisible items visible and quotable. It may cost you this job. It's also the only version where the client is genuinely choosing.","t":"দেখা নোপোৱা বস্তুবোৰক আপুনি দেখা পোৱা আৰু দাম ধৰিব পৰা কৰি তুলিলে। ইয়াৰ বাবে এই কামটো হাতৰ পৰা যাব পাৰে। লগতে এইটোৱেই একমাত্ৰ ধৰণ য'ত গ্ৰাহকে সঁচাকৈয়ে বাছি লৈছে।","s":"draft"},"d.labour_in_pit.section":{"en":"ON SITE","t":"ছাইটত","s":"draft"},"d.labour_in_pit.prompt":{"en":"Someone has to go down and plaster the inside. Today.","t":"কোনোবা এজনে তললৈ নামি ভিতৰখন প্লাষ্টাৰ কৰিব লাগিব। আজিয়েই।","s":"draft"},"d.labour_in_pit.opt.whoever":{"en":"Whoever's free. It's ten minutes","t":"যিয়েই খালী আছে। দহ মিনিটৰ কাম","s":"draft"},"d.labour_in_pit.opt.rope":{"en":"Our regular man, with a rope tied around him","t":"আমাৰ নিয়মীয়া মানুহজন, কঁকালত এডাল ৰছী বান্ধি","s":"draft"},"d.labour_in_pit.opt.kit":{"en":"Nobody goes down until it's aired out, and he has boots, gloves and a harness","t":"ভিতৰৰ বতাহ নোলোৱালৈকে কোনেও নানামে, আৰু তেওঁৰ বুট, হাতমোজা আৰু হাৰনেছ থাকিব লাগিব","s":"draft"},"d.labour_in_pit.reveal.fact":{"en":"The first person to enter the tank isn't the desludger in twenty years — it's a construction worker, this week, plastering it. A new tank is clean, so it feels like it isn't a confined space.","t":"টেংকটোৰ ভিতৰত প্ৰথমে সোমোৱা মানুহজন কুৰি বছৰ পিছৰ পাঁক উলিওৱা মানুহজন নহয় — সেইজন এই সপ্তাহতেই ভিতৰখন প্লাষ্টাৰ কৰা এজন নিৰ্মাণ শ্ৰমিক। নতুন টেংক পৰিষ্কাৰ, গতিকে সেইটো এটা বন্ধ ঠাই বুলিয়েই নালাগে।","s":"draft"},"d.labour_in_pit.reveal.cost":{"en":"Indicative: a blower and basic PPE is a few thousand rupees, reusable across every job you'll ever run.","t":"আন্দাজি হিচাপ: এটা ব্ল'ৱাৰ আৰু সাধাৰণ PPE ত কেইহাজাৰমান টকা লাগে, আৰু সেইবোৰ আপুনি কৰিব লগা প্ৰতিটো কামতে আকৌ আকৌ ব্যৱহাৰ কৰিব পাৰি।","s":"draft"},"d.labour_in_pit.reveal.twist":{"en":"A rope around the waist is worse than nothing in a real emergency. An unconscious adult cannot be pulled vertically out of a narrow opening by one person — and the rescuer is usually the second casualty.","t":"সঁচা বিপদৰ সময়ত কঁকালত বন্ধা ৰছী এডাল একো নথকাতকৈও বেয়া। অজ্ঞান হৈ পৰা ডাঙৰ মানুহ এজনক ঠেক মুখ এটাৰ পৰা সোজাকৈ ওপৰলৈ এজন মানুহে টানি উলিয়াব নোৱাৰে — আৰু উদ্ধাৰ কৰিবলৈ যোৱাজনেই সাধাৰণতে দ্বিতীয়জন মৃত হয়।","s":"draft"},"d.labour_in_pit.reveal.lesson":{"en":"The habits set during construction become the habits of maintenance. If a person goes in casually while the tank is clean, a person will go in when it isn't.","t":"নিৰ্মাণৰ সময়ত গঢ় লোৱা অভ্যাসেই পিছলৈ ৰক্ষণাবেক্ষণৰ অভ্যাস হৈ পৰে। টেংকটো পৰিষ্কাৰ থাকোঁতে যদি মানুহ এজন এনেয়ে ভিতৰত সোমায়, তেন্তে পৰিষ্কাৰ নাথাকিলেও মানুহ এজন ভিতৰত সোমাব।","s":"draft"},"d.labour_in_pit.analysis.whoever":{"en":"It is ten minutes, and it's almost always fine. 'Almost always fine' is exactly the shape of the risk — the practice is normalised long before the day it isn't.","t":"দহ মিনিটৰেই কাম, আৰু প্ৰায় সদায়েই একো নহয়। 'প্ৰায় সদায়েই একো নহয়' — বিপদটোৰ আকৃতি ঠিক এইটোৱেই। যিদিনা কিবা এটা হয়, তাৰ বহু আগতেই এই কামটো সাধাৰণ হৈ যায়।","s":"draft"},"d.labour_in_pit.analysis.rope":{"en":"The instinct is right and the mechanism doesn't work. Plan how you'd get him out unconscious; if the answer involves pulling, it isn't a plan.","t":"ভাবনাটো শুদ্ধ, কিন্তু উপায়টোৱে কাম নকৰে। তেওঁ অজ্ঞান হৈ পৰিলে কেনেকৈ উলিয়াব, সেইটো ভাবি থওক; উত্তৰটোত যদি 'টানি উলিওৱা' থাকে, তেন্তে সেইটো কোনো প্লেনেই নহয়।","s":"draft"},"d.labour_in_pit.analysis.kit":{"en":"You treated a clean new tank as a confined space, which is the only correct reading of it. This is also the moment your crew learns that's the rule.","t":"পৰিষ্কাৰ নতুন টেংক এটাকো আপুনি বন্ধ ঠাই বুলি ধৰিলে, আৰু সেইটোৱেই ইয়াক বুজাৰ একমাত্ৰ শুদ্ধ ধৰণ। লগতে এইটোৱেই সেই মুহূৰ্ত যেতিয়া আপোনাৰ দলটোৱে শিকে যে নিয়মটো এইটোৱেই।","s":"draft"},"d.slab_call.section":{"en":"THE TOP","t":"ওপৰফাল","s":"draft"},"d.slab_call.prompt":{"en":"The drawing says nothing about the top. You're casting tomorrow.","t":"ওপৰফালৰ বিষয়ে ড্ৰয়িঙত একো কোৱা নাই। কাইলৈ আপুনি ঢালিব।","s":"draft"},"d.slab_call.opt.flush":{"en":"Flush slab. That's how we've always done it","t":"ফ্লাচ শ্লেব। আমি সদায় এনেকৈয়ে কৰি আহিছোঁ","s":"draft"},"d.slab_call.opt.ask":{"en":"Call the engineer and ask","t":"ইঞ্জিনিয়াৰক ফোন কৰি সুধিওঁ","s":"draft"},"d.slab_call.opt.covers":{"en":"Leave two covers. Costs me half a bag of cement, saves somebody's day later","t":"দুটা কভাৰ এৰি দিওঁ। মোৰ আধা বস্তা চিমেণ্ট লাগিব, পিছত কাৰোবাৰ দিনটো বাচিব","s":"draft"},"d.slab_call.reveal.fact":{"en":"Where the drawing is silent, the maistry decides — and this is the single highest-leverage uninstructed decision on the whole site. Nobody will review it, and it is permanent the moment the concrete sets.","t":"ড্ৰয়িং য'ত নিমাত, তাত মিস্ত্ৰীয়েই সিদ্ধান্ত লয় — আৰু গোটেই ছাইটখনত নিৰ্দেশ নথকা সিদ্ধান্তবোৰৰ ভিতৰত এইটোৰেই ফল আটাইতকৈ বেছি। এইটো কোনেও পৰীক্ষা নকৰে, আৰু কংক্ৰিটটো জমাৰ লগে লগেই এইটো চিৰস্থায়ী।","s":"draft"},"d.slab_call.reveal.cost":{"en":"Indicative: two cover frames are ₹4,000–8,000 and one extra hour of shuttering.","t":"আন্দাজি হিচাপ: দুটা কভাৰ ফ্ৰেমত ₹4,000–8,000 আৰু অতিৰিক্ত এঘণ্টা শ্বাটাৰিঙৰ কাম।","s":"draft"},"d.slab_call.reveal.twist":{"en":"Maistries who leave covers often get asked to remove them, because the owner thinks they look unfinished. The safety feature reads as incomplete work.","t":"যিসকল মিস্ত্ৰীয়ে কভাৰ এৰি দিয়ে, তেওঁলোকক প্ৰায়েই সেইবোৰ আঁতৰাবলৈ কোৱা হয়, কাৰণ মালিকে ভাবে যে দেখাত কামটো শেষ হোৱা নাই। সুৰক্ষাৰ ব্যৱস্থাটোক অসমাপ্ত কাম যেন লাগে।","s":"draft"},"d.slab_call.reveal.lesson":{"en":"The person with the least formal authority makes the decision with the most consequence, under time pressure, with no instruction and no one to ask. That is the system, not an accident.","t":"যিজন মানুহৰ আনুষ্ঠানিক ক্ষমতা আটাইতকৈ কম, তেৱেঁই আটাইতকৈ বেছি ফল থকা সিদ্ধান্তটো লয় — সময়ৰ হেঁচাত, কোনো নিৰ্দেশ নোহোৱাকৈ আৰু সুধিবলৈ কোনো নোহোৱাকৈ। এইটো ব্যৱস্থাটোৰেই ধৰণ, দুৰ্ঘটনা নহয়।","s":"draft"},"d.slab_call.analysis.flush":{"en":"Habit, and habit is usually good engineering compressed into muscle memory. Not here — this habit formed when tanks were shallower and nobody costed the person opening them.","t":"অভ্যাস, আৰু অভ্যাস সাধাৰণতে ভাল ইঞ্জিনিয়াৰিং হাতৰ অভ্যাসত সোমাই যোৱাহে। কিন্তু ইয়াত নহয় — এই অভ্যাসটো গঢ় লৈছিল যেতিয়া টেংকবোৰ কম গভীৰ আছিল আৰু সেইবোৰ খোলা মানুহজনৰ হিচাপ কোনেও ধৰা নাছিল।","s":"draft"},"d.slab_call.analysis.ask":{"en":"You escalated an uninstructed decision to the person who should have instructed it. Whether they pick up is the test of whether the chain works at all.","t":"নিৰ্দেশ নথকা এটা সিদ্ধান্ত আপুনি সেইজন মানুহৰ ওচৰলৈ পঠিয়ালে যিজনে নিৰ্দেশটো দিব লাগিছিল। তেওঁ ফোনটো ধৰেনে নধৰে — সেইটোৱেই এই শৃংখলটোৱে আদৌ কাম কৰেনে নকৰে তাৰ পৰীক্ষা।","s":"draft"},"d.slab_call.analysis.covers":{"en":"You spent your own margin on somebody you'll never meet. If the owner asks you to plaster over them, this is the argument worth having.","t":"আপুনি কেতিয়াও লগ নাপাব এজন মানুহৰ বাবে নিজৰ লাভৰ পৰা খৰচ কৰিলে। মালিকে যদি সেইবোৰ প্লাষ্টাৰ কৰি বন্ধ কৰিবলৈ কয়, তেন্তে এই তৰ্কটো কৰাৰ মূল্য আছে।","s":"draft"},"d.depth.section":{"en":"THE DIG","t":"খন্দা","s":"draft"},"d.depth.prompt":{"en":"How deep do you dig?","t":"কিমান গভীৰকৈ খান্দিব?","s":"draft"},"d.depth.opt.deep":{"en":"As deep as the soil allows. More capacity, fewer complaints","t":"মাটিয়ে যিমান দিয়ে সিমান গভীৰ। ধাৰণক্ষমতা বেছি, অভিযোগ কম","s":"draft"},"d.depth.opt.standard":{"en":"Standard depth. Deeper than this and a man can't work in it","t":"সাধাৰণ গভীৰতা। ইয়াতকৈ গভীৰ হ'লে ভিতৰত মানুহে কাম কৰিব নোৱাৰে","s":"draft"},"d.depth.opt.shallow":{"en":"Shallow and wide. Harder to dig, easier to reach into","t":"কম গভীৰ আৰু বহল। খান্দিবলৈ টান, ভিতৰলৈ হাত পাবলৈ সহজ","s":"draft"},"d.depth.reveal.fact":{"en":"Depth is chosen for capacity in a tight plot. But suction hoses lose lift with depth, and beyond roughly 2 m the sludge at the bottom stops coming up reliably.","t":"সৰু মাটিত ধাৰণক্ষমতা পাবলৈকে গভীৰতা বছা হয়। কিন্তু গভীৰতা বাঢ়িলে ছাকচন হ'জ পাইপৰ টনা শক্তি কমি যায়, আৰু প্ৰায় 2 মিটাৰৰ তলৰ পাঁকখিনি ভালদৰে ওপৰলৈ আহিব নোখোজে।","s":"draft"},"d.depth.reveal.cost":{"en":"Indicative: shallow-and-wide costs more to excavate and takes more plot area. It is the trade almost nobody makes.","t":"আন্দাজি হিচাপ: কম গভীৰ আৰু বহলকৈ কৰিলে খন্দাৰ খৰচ বেছি হয় আৰু মাটিও বেছি লাগে। এই বিনিময়টো প্ৰায় কোনেও নকৰে।","s":"draft"},"d.depth.reveal.twist":{"en":"Depth is invisible after backfilling. The desludger arriving in 2048 has no way to know how deep this tank is until the hose comes up empty — and then the decision to climb in gets made in thirty seconds.","t":"মাটি ভৰাই দিয়াৰ পিছত গভীৰতা দেখা নাযায়। 2048 চনত অহা পাঁক উলিওৱা মানুহজনে এই টেংকটো কিমান গভীৰ জানিবলৈ কোনো উপায় নাপায়, যেতিয়ালৈকে হ'জ পাইপডাল খালী হৈ ওপৰলৈ নাহে — আৰু তাৰ পিছত ভিতৰলৈ নমাৰ সিদ্ধান্তটো ত্ৰিশ ছেকেণ্ডতে লোৱা হয়।","s":"draft"},"d.depth.reveal.lesson":{"en":"Every metre of depth converts a hose job into a body job. Capacity is a number on paper; depth is a number in somebody's lungs.","t":"গভীৰতাৰ প্ৰতি মিটাৰেই হ'জ পাইপৰ কামটোক শৰীৰৰ কামলৈ সলনি কৰে। ধাৰণক্ষমতা কাগজত থকা এটা সংখ্যা; গভীৰতা হ'ল কাৰোবাৰ হাঁওফাঁওত থকা এটা সংখ্যা।","s":"draft"},"d.depth.analysis.deep":{"en":"Maximum capacity for the footprint, and you've put the sludge below the reach of suction. This is the geometry that most often ends in an entry.","t":"মাটিৰ পৰিমাণৰ হিচাপত সৰ্বোচ্চ ধাৰণক্ষমতা, আৰু আপুনি পাঁকখিনি ছাকচনে নোপোৱা ঠাইত ৰাখি দিলে। বেছিভাগ সময়তে মানুহ ভিতৰত সোমোৱাত শেষ হোৱা আকৃতিটো এইটোৱেই।","s":"draft"},"d.depth.analysis.standard":{"en":"A sound compromise, and notice your own reasoning — you already sized it around a man being in there. Worth asking why he's in there at all.","t":"ভাল মাজৰ বাট, আৰু নিজৰ যুক্তিটো এবাৰ লক্ষ্য কৰক — আপুনি ইতিমধ্যে ভিতৰত এজন মানুহ থাকিব বুলি ধৰিয়েই জোখ কৰিলে। তেওঁ আদৌ ভিতৰত কিয় থাকিব, সেইটো সোধাৰ মূল্য আছে।","s":"draft"},"d.depth.analysis.shallow":{"en":"More digging, more plot, and a tank a hose can actually clear. You optimised for the job nobody pays you to think about.","t":"বেছি খন্দা, বেছি মাটি, আৰু এনে এটা টেংক যিটো হ'জ পাইপেই সঁচাকৈ পৰিষ্কাৰ কৰিব পাৰে। যিটো কামৰ কথা ভাবিবলৈ কোনেও আপোনাক টকা নিদিয়ে, আপুনি সেইটোৰ বাবেই ভাল কৰি দিলে।","s":"draft"},"d.speak_up.section":{"en":"THE ROOM","t":"কোঠাটো","s":"draft"},"d.speak_up.prompt":{"en":"You know the flush slab is wrong. The owner is standing right there.","t":"ফ্লাচ শ্লেবটো ভুল বুলি আপুনি জানে। মালিকজন ঠিক তাতেই থিয় হৈ আছে।","s":"draft"},"d.speak_up.opt.quiet":{"en":"Say nothing. He's paying, and he wants it clean","t":"একো নকওঁ। টকা তেৱেঁই দিছে, আৰু তেওঁ পৰিষ্কাৰ বিচাৰে","s":"draft"},"d.speak_up.opt.mention":{"en":"Mention it once. If he says no, it's on him","t":"এবাৰ কৈ দিওঁ। তেওঁ নহয় ক'লে, দায়িত্ব তেওঁৰ","s":"draft"},"d.speak_up.opt.insist":{"en":"Tell him plainly: in ten years somebody breaks this open with a hammer","t":"স্পষ্টকৈ কৈ দিওঁ: দহ বছৰৰ পিছত কোনোবাই হাতুৰীৰে এইটো ভাঙি খুলিব","s":"draft"},"d.speak_up.reveal.fact":{"en":"Site knowledge is real and almost entirely unspoken. The people who best understand what a buried tank does are furthest down the hierarchy that decides what gets built.","t":"ছাইটৰ জ্ঞান সঁচা, আৰু প্ৰায় সম্পূৰ্ণকৈ নকোৱা। মাটিৰ তলত থকা টেংক এটাই কি কৰে সেইটো যিসকলে আটাইতকৈ ভালকৈ বুজে, কি বনোৱা হ'ব সেইটো ঠিক কৰা শৃংখলটোৰ আটাইতকৈ তলত তেওঁলোকেই থাকে।","s":"draft"},"d.speak_up.reveal.cost":{"en":"Indicative: nothing, except the risk of being seen as difficult by the person who pays you and refers you.","t":"আন্দাজি হিচাপ: একো নাই, কেৱল যিজনে আপোনাক টকা দিয়ে আৰু আনক আপোনাৰ নাম কয়, তেওঁৰ চকুত আপুনি আওকণীয়া মানুহ হৈ পৰাৰ ভয়টোৰ বাহিৰে।","s":"draft"},"d.speak_up.reveal.twist":{"en":"When maistries do speak up, owners frequently agree — the objection was never really about money. But the maistry rarely finds out, because he only raises it once and reads the pause as a no.","t":"মিস্ত্ৰীয়ে যেতিয়া মাত মাতে, মালিকে প্ৰায়েই মান্তি হয় — আপত্তিটো আচলতে কেতিয়াও টকাৰ কাৰণে নাছিল। কিন্তু মিস্ত্ৰীয়ে সেইটো প্ৰায় গমেই নাপায়, কাৰণ তেওঁ কথাটো এবাৰহে উঠায় আৰু মালিকৰ চুপ হৈ থকাটোক 'নহয়' বুলি বুজি লয়।","s":"draft"},"d.speak_up.reveal.lesson":{"en":"The information needed to build this tank well is already on the site. What's missing is a channel where it can be said without professional cost to the person saying it.","t":"এই টেংকটো ভালকৈ বনাবলৈ যিখিনি কথা জানিব লাগে, সেইখিনি ইতিমধ্যে ছাইটতেই আছে। নাই কেৱল এনে এটা বাট য'ত কথাটো কোৱাজনৰ কামৰ ক্ষতি নোহোৱাকৈ সেইটো ক'ব পাৰি।","s":"draft"},"d.speak_up.analysis.quiet":{"en":"Rational. You're protecting a livelihood built on referrals, and being the difficult maistry is expensive. The knowledge stays with you and dies there.","t":"যুক্তিসংগত। মুখৰ কথাৰে পোৱা কামৰ ওপৰত থিয় হোৱা জীৱিকা এটা আপুনি ৰক্ষা কৰি আছে, আৰু আওকণীয়া মিস্ত্ৰী হৈ পৰাটো মহঙা। জ্ঞানখিনি আপোনাৰ লগতেই থাকে আৰু তাতেই মৰি যায়।","s":"draft"},"d.speak_up.analysis.mention":{"en":"You transferred the decision, and with it the responsibility. That's fair — and 'mentioned once, quietly' is a low bar for a permanent outcome.","t":"আপুনি সিদ্ধান্তটো আৰু তাৰ লগতে দায়িত্বটোও আনৰ হাতত দিলে। সেইটো ন্যায্য — আৰু 'এবাৰ, লাহেকৈ কৈছিলোঁ' বুলিলে চিৰস্থায়ী এটা ফলৰ বাবে সেইটো বৰ কম।","s":"draft"},"d.speak_up.analysis.insist":{"en":"You put a human being into the conversation, which is the only framing that reliably moves an owner. You may also have made this job harder for yourself.","t":"আপুনি কথা-বতৰাটোৰ ভিতৰত এজন মানুহক আনিলে, আৰু মালিক এজনক নিশ্চিতভাৱে লৰচৰ কৰিব পৰা একমাত্ৰ ধৰণ সেইটোৱেই। লগতে আপুনি এই কামটো নিজৰ বাবে টান কৰিও তুলিব পাৰে।","s":"draft"},"d.record.section":{"en":"AFTER","t":"পিছত","s":"draft"},"d.record.prompt":{"en":"Once it's buried, the only record of what's down there is in your head.","t":"মাটিৰ তলত সোমোৱাৰ পিছত, তলত কি আছে তাৰ একমাত্ৰ ৰেকৰ্ড আপোনাৰ মূৰতেই।","s":"draft"},"d.record.opt.nothing":{"en":"Nothing. I'll remember","t":"একো নকৰোঁ। মোৰ মনত থাকিব","s":"draft"},"d.record.opt.photo":{"en":"Take photos on my phone before backfilling","t":"মাটি ভৰাই দিয়াৰ আগতে ফোনত ফটো তুলি ৰাখোঁ","s":"draft"},"d.record.opt.mark":{"en":"Photos, and a marker stone set over each cover","t":"ফটো, আৰু প্ৰতিটো কভাৰৰ ওপৰত এটাকৈ চিন দিয়া শিল বহুৱাই দিয়া","s":"draft"},"d.record.reveal.fact":{"en":"There is no as-built record for household sanitation anywhere in this chain. The tank's depth, chamber layout and cover positions exist only as memory, and memory moves away or dies.","t":"এই গোটেই শৃংখলটোৰ ক'তো ঘৰুৱা ছেনিটেছনৰ 'যেনেকৈ বনোৱা হ'ল' তেনে কোনো ৰেকৰ্ড নাই। টেংকৰ গভীৰতা, চেম্বাৰৰ গঠন আৰু কভাৰৰ ঠাই কেৱল মনতেই থাকে, আৰু মনটো হয় আন ঠাইলৈ গুচি যায়, নহয় মৰি যায়।","s":"draft"},"d.record.reveal.cost":{"en":"Indicative: nil. A phone and ten minutes before the backfill.","t":"আন্দাজি হিচাপ: শূন্য। মাটি ভৰোৱাৰ আগতে এটা ফোন আৰু দহ মিনিট।","s":"draft"},"d.record.reveal.twist":{"en":"The first task of most desludging visits is finding the tank. Workers probe the yard with rods, then break the slab where it sounds hollow — a search that routinely takes longer than the emptying.","t":"বেছিভাগ পাঁক উলিওৱা কামৰ প্ৰথম কামটোৱেই হ'ল টেংকটো বিচাৰি উলিওৱা। শ্ৰমিকে ৰডেৰে চোতালখন খুচৰি চায়, তাৰ পিছত য'ত ফোপোলা শব্দ হয় তাতেই শ্লেবটো ভাঙে — আৰু এই বিচৰা কামটোতে সাধাৰণতে খালী কৰাতকৈ বেছি সময় লাগে।","s":"draft"},"d.record.reveal.lesson":{"en":"Twenty-two years is longer than any memory on this site will last. Without a record, the next person starts by guessing, and guessing with a hammer is how the covers you built get destroyed.","t":"এই ছাইটৰ যিকোনো মানুহৰ মনত থকা কথাতকৈ বাইছ বছৰ বেছি দীঘল। ৰেকৰ্ড নাথাকিলে পিছৰজনে আন্দাজেৰেই আৰম্ভ কৰে, আৰু হাতুৰী লৈ আন্দাজ কৰিলেই আপুনি বনোৱা কভাৰকেইটা ভাঙি যায়।","s":"draft"},"d.record.analysis.nothing":{"en":"You will remember, for a while. You won't be reachable in 2048, and the house will have changed hands at least once.","t":"কিছুদিন আপোনাৰ মনত থাকিব। কিন্তু 2048 চনত আপোনাক পোৱা নাযাব, আৰু ঘৰটোৰ মালিকো অন্ততঃ এবাৰ সলনি হৈ যাব।","s":"draft"},"d.record.analysis.photo":{"en":"Ten minutes of phone storage becomes the only as-built document this tank will ever have. Send them to the owner — your phone won't survive twenty-two years either.","t":"ফোনত ৰখা দহ মিনিটৰ ফটোখিনিয়েই এই টেংকটোৰ একমাত্ৰ 'যেনেকৈ বনোৱা হ'ল' কাগজ হৈ পৰে। সেইবোৰ মালিকক পঠিয়াই দিয়ক — আপোনাৰ ফোনটোৱেও বাইছ বছৰ নাথাকে।","s":"draft"},"d.record.analysis.mark":{"en":"Photos plus a physical marker. The marker is the part that works, because it speaks to the person standing in the yard with a rod and no information.","t":"ফটো, লগতে হাতে চুই চাব পৰা এটা চিন। কাম কৰা অংশটো হ'ল সেই চিনটোৱেই, কাৰণ হাতত ৰড লৈ আৰু একো তথ্য নোহোৱাকৈ চোতালত থিয় হৈ থকা মানুহজনৰ লগত সেইটোৱেই কথা পাতে।","s":"draft"},"verdict.safe.title":{"en":"Emptiable","t":"খালী কৰিব পৰা","s":"draft"},"verdict.safe.body":{"en":"A truck can reach this. A hose can clear it. The atmosphere is vented before anyone lifts a cover. In 2048 this is a job, done from the outside, in forty minutes.","t":"ইয়ালৈ ট্ৰাক আহিব পাৰে। হ'জ পাইপে ইয়াক পৰিষ্কাৰ কৰিব পাৰে। কোনোবাই কভাৰ তোলাৰ আগতেই ভিতৰৰ বতাহখিনি ওলাই যায়। 2048 চনত এইটো এটা কাম — বাহিৰৰ পৰাই, চল্লিশ মিনিটত শেষ।","s":"draft"},"verdict.difficult.title":{"en":"Difficult","t":"টান","s":"draft"},"verdict.difficult.body":{"en":"It can be emptied, but not easily, and not every time. Somewhere in here is a gap — the hose doesn't quite reach, or the opening is tight, or the air is bad. Each visit, somebody decides whether to work around it or climb in. Most days they work around it.","t":"খালী কৰিব পাৰি, কিন্তু সহজে নহয়, আৰু প্ৰতিবাৰেও নহয়। ইয়াত ক'ৰবাত এটা ফাঁক আছে — হয় হ'জ পাইপ পূৰাকৈ নাপায়, নহয় মুখটো ঠেক, নহয় ভিতৰৰ বতাহ বেয়া। প্ৰতিবাৰ আহোঁতে কোনোবা এজনে ঠিক কৰে — বাহিৰৰ পৰাই কিবা এটা কৰিব নে ভিতৰলৈ নামিব। বেছিভাগ দিনেই তেওঁলোকে বাহিৰৰ পৰাই কৰে।","s":"draft"},"verdict.unsafe.title":{"en":"Someone goes in","t":"কোনোবা এজন ভিতৰত সোমায়","s":"draft"},"verdict.unsafe.body":{"en":"There is no version of emptying this tank that doesn't put a person inside it. Not because anyone chose that — because every route that avoided it was closed by a decision made above ground, years earlier, by someone thinking about something else.","t":"এই টেংকটো খালী কৰাৰ এনে কোনো উপায় নাই য'ত এজন মানুহ ভিতৰত সোমাব লগা নহয়। কোনোবাই সেইটো বিচাৰিছিল বুলি নহয় — সেইটো এৰাই যাব পৰা প্ৰতিটো বাটেই বন্ধ হৈ গৈছিল মাটিৰ ওপৰত লোৱা এটা সিদ্ধান্তত, বহু বছৰ আগতে, আন কিবা এটাৰ কথা ভাবি থকা কোনোবা এজনৰ দ্বাৰা।","s":"draft"},"verdict.escalation.title":{"en":"And the atmosphere is unvented.","t":"আৰু ভিতৰৰ বতাহ ওলাই যোৱাৰ বাট নাই।","s":"draft"},"verdict.escalation.body":{"en":"This is the specific combination behind most sanitation worker deaths in India: a confined space, no ventilation, and an opening only a body fits through. Nobody on this site intended it. Everybody on this site contributed to it.","t":"ভাৰতত ছেনিটেছন শ্ৰমিকৰ বেছিভাগ মৃত্যুৰ আঁৰত ঠিক এই মিশ্ৰণটোৱেই থাকে: এটা বন্ধ ঠাই, ভেণ্টিলেছন নাই, আৰু এনে এটা মুখ যাৰ মাজেৰে কেৱল এটা শৰীৰহে সোমায়। এই ছাইটৰ কোনেও সেইটো বিচৰা নাছিল। এই ছাইটৰ সকলোৱেই তাত অংশ দিছিল।","s":"draft"},"end.heading":{"en":"L function langList(){var s=BASE||C;return (s&&s.config&&s.config.languages)||[{code:'en',name:'English',script:'latin',enabled:true}]}
function langMeta(c){var l=langList().filter(function(x){return x.code===c});return l[0]||null}
function offeredLangs(){return langList().filter(function(l){return S.review||l.enabled!==false})}
function buildContent(code){
  var n=JSON.parse(JSON.stringify(BASE));
  if(code==='en')return n;
  var ov=OVERLAYS[code]; if(!ov||!ov.strings)return n;
  var ok=S.review?{draft:1,edited:1,approved:1}:{edited:1,approved:1};
  walkStrings(n,function(p,_e,set){var e=ov.strings[p];
    if(!e||!e.t||!String(e.t).trim())return; if(!ok[e.s||'draft'])return; set(e.t)});
  return n;
}
var SCRIPT_FONT={latin:'',taml:'"Noto Sans Tamil",sans-serif',deva:'"Noto Sans Devanagari",sans-serif',
  orya:'"Noto Sans Oriya",sans-serif',beng:'"Noto Sans Bengali",sans-serif'};
var FONT_HREF={taml:'https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;800&display=swap',
  deva:'https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;800&display=swap',
  orya:'https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;700;800&display=swap',
  beng:'https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;800&display=swap'};
function applyScript(code){
  var m=langMeta(code)||{script:'latin'},sc=m.script||'latin';
  document.documentElement.setAttribute('lang',code);
  document.documentElement.setAttribute('data-script',sc);
  if(sc!=='latin'&&FONT_HREF[sc]&&!document.getElementById('f-'+sc)){
    var l=document.createElement('link');l.id='f-'+sc;l.rel='stylesheet';l.href=FONT_HREF[sc];
    document.head.appendChild(l)}
  var st=document.getElementById('scriptcss')||(function(){var s=document.createElement('style');
    s.id='scriptcss';document.head.appendChild(s);return s})();

function loadOverlay(c){
  if(c==='en'||OVERLAYS[c])return Promise.resolve();
  if(EMBEDDED_I18N&&EMBEDDED_I18N[c]){OVERLAYS[c]=EMBEDDED_I18N[c];return Promise.resolve()}
  return fetch('i18n/'+c+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){OVERLAYS[c]=j}).catch(function(){});

/* ---------- model ---------- */
function gateOk(req){
  if(!req||!req.length)return true;
  for(var i=0;i<req.length;i++){var c=req[i],ok=true;
    for(var k in c){if(!c.hasOwnProperty(k))continue;if(c[k].indexOf(S.answers[k])===-1){ok=false;break}}
    if(ok)return true}
  return false;
}
function allSteps(){var p=getPersona(S.persona);return p?p.steps:[]}
function activeSteps(){return allSteps().filter(function(s){return gateOk(s.requires_any)})}
function activeOptions(d){return d.options.filter(function(o){return gateOk(o.requires_any)})}
function currentStep(){return activeSteps()[S.stepIdx]||null}

/* Options are shuffled once per run per decision, then that order is kept and
   logged, so analysis can show position did not drive the answer. */
function shownOptions(id){
  var d=C.decisions[id], avail=activeOptions(d);
  if(!S.shuffle[id]){
    var ids=avail.map(function(o){return o.id});
    if(BASE.config.randomiseOptions!==false){
      for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}
    }
    S.shuffle[id]=ids;
  }
  var byId={};avail.forEach(function(o){byId[o.id]=o});
  return S.shuffle[id].map(function(x){return byId[x]}).filter(Boolean);
}
function optionById(id,oid){var d=C.decisions[id];
  for(var i=0;i<d.options.length;i++)if(d.options[i].id===oid)return d.options[i];return null}

function score(){
  var t={A:0,M:0,E:0,K:0};
  for(var id in S.answers){if(!S.answers.hasOwnProperty(id))continue;
    var o=optionById(id,S.answers[id]); if(!o)continue;
    var fx=o.fx||{}; for(var k in t)if(fx[k])t[k]+=fx[k]}
  return t;
}
function ceiling(){
  var t={A:0,M:0,E:0,K:0};
  allSteps().forEach(function(st){var d=C.decisions[st.id];if(!d)return;
    var b={A:0,M:0,E:0,K:0};
    d.options.forEach(function(o){var fx=o.fx||{};for(var k in b)if((fx[k]||0)>b[k])b[k]=fx[k]||0});
    for(var k in t)t[k]+=b[k]});
  return t;
}
function scaled(){var r=score(),c=ceiling(),o={};
  for(var k in CANON)o[k]=c[k]>0?Math.round(r[k]/c[k]*CANON[k]):0;return o}
function verdict(){
  var s=scaled(),key;
  if(s.A<=1||s.E===0||(s.A<=2&&s.E<=1))key='unsafe';
  else if(s.A>=3&&s.E>=3)key='safe'; else key='difficult';
  return {key:key,v:C.verdict[key],s:s,escalation:(s.A<=1&&s.E===0)};
}

/* ---------- boot ---------- */
function boot(){
  var q=new URLSearchParams(location.search);
  S.review=REVIEW_BUILD||q.get('review')==='1';
  function go(j){BASE=j;after(q)}
  var local=null;try{local=JSON.parse(localStorage.getItem('t22_content_override')||'null')}catch(e){}
  if(local)return go(local);
  if(EMBEDDED_CONTENT)return go(EMBEDDED_CONTENT);
  fetch('content-v6.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(go).catch(function(){
      fetch('content.json',{cache:'no-store'}).then(function(r){return r.json()}).then(go)
        .catch(function(){document.getElementById('app').innerHTML=
          '<div style="padding:40px;text-align:center;color:#9A918A">Could not load content</div>'})});
}
function after(q){
  var codes=offeredLangs().map(function(l){return l.code}).filter(function(c){return c!=='en'});
  Promise.all(codes.map(loadOverlay)).then(function(){
    var want=q.get('lang'),remembered=false;
    if(!want){try{want=localStorage.getItem('t22_lang');remembered=!!want}catch(e){}}
    if(!want||!langMeta(want))want='en';
    if(want!=='en'&&!S.review){var m=langMeta(want);if(m&&m.enabled===false){want='en';remembered=false}}
    setLang(want);
    S.sid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    S.startedAt=new Date().toISOString();
    var lp=(BASE.config&&BASE.config.languagePage)||{};
    var showLang=lp.enabled!==false&&offeredLangs().length>1&&!q.get('lang')&&!remembered;
    S.phase=showLang?'language':'intro';
    render();
  });
}

/* ---------- images ----------
   Two ways to add one, and you never have to edit JSON for the common case:

   1. BY FILENAME (easiest). Drop a file in img/ named after the slot and it
      is picked up automatically:
         img/<decision>.<ext>                     above the question
         img/<decision>-<option>.<ext>            on the option itself
         img/<decision>-<option>-result.<ext>     inside the consequence
      .png .jpg .webp .svg are all tried in turn.

   2. BY PATH. Put any path in content-v6.json at media.question,
      options[].image or media.result[<option>] and it wins over the filename.

   A slot with no file renders nothing at all, so images can be added one at a
   time without anything looking broken in between.                        */
var IMG_EXT = ['png','jpg','webp','svg'];

function mediaEl(src, conv, cls, tag){
  if(!src && !conv) return '';
  var c = (tag==='thumb' ? 'thumb' : 'media' + (cls ? ' ' + cls : ''));
  var el = tag==='thumb' ? 'span' : 'div';
  // explicit path wins; otherwise hand the convention stem to the resolver
  var attr = src ? ' data-img="'+esc(src)+'"' : ' data-stem="'+esc(conv)+'"';
  return '<'+el+' class="'+c+'" style="display:none"'+attr+'></'+el+'>';
}
function media(src,cls,conv){ return mediaEl(src,conv,cls,'media') }
function thumb(src,conv){ return mediaEl(src,conv,'','thumb') }

/* Resolve every slot after render: try the explicit path, else walk the
   extensions for the convention stem. SVG is fetched and inlined so it
   inherits currentColor; everything else becomes an <img>. */
function hydrateImages(){
  var nodes=document.querySelectorAll('[data-img],[data-stem]');
  Array.prototype.forEach.call(nodes,function(n){
    var explicit=n.getAttribute('data-img');
    var stem=n.getAttribute('data-stem');
    n.removeAttribute('data-img'); n.removeAttribute('data-stem');
    var tries = explicit ? [explicit] : IMG_EXT.map(function(e){ return stem+'.'+e });
    var i=0;
    (function next(){
      if(i>=tries.length) return;            // nothing found, stays hidden
      var url=tries[i++];
      if(/\.svg$/i.test(url)){
        fetch(url).then(function(r){ if(!r.ok) throw 0; return r.text() })
          .then(function(t){ n.innerHTML=t; n.style.display='' })
          .catch(next);
      } else {
        var im=new Image();
        im.onload=function(){ n.appendChild(im); n.style.display='' };
        im.onerror=next;
        im.alt=''; im.loading='lazy'; im.src=url;
      }
    })();
  });
}

    var sel='<select data-act="demo" data-id="'+esc(dm.id)+'"><option value="">—</option>';
    dm.options.forEach(function(lbl,k){var val=canon[k]!=null?canon[k]:lbl;
      sel+='<option value="'+esc(val)+'"'+(S.demo[dm.id]===val?' selected':'')+'>'+esc(lbl)+'</option>'});
    h+='<div class="field"><label>'+esc(dm.label)+'</label>'+sel+'</select></div>'});
  return topbar(true)+'<div class="screen">'+
    '<h1 class="qtext" style="margin-top:16px">'+esc(e.heading)+'</h1>'+
    '<p class="lead">'+esc(e.factorPrompt)+'</p>'+h+
    '<div class="consent">'+esc(C.config.consent)+'</div>'+
    '<div class="ctawrap"><button class="cta" data-act="finish">'+esc(C.strings.submit||'Finish')+'</button></div></div>';
}

function vResult(){
  var V=verdict(),s=V.s,p=getPersona(S.persona);
  var h='<div class="verdict '+V.key+'"><div class="vi">'+esc(V.v.icon)+'</div>'+
    '<h2>'+esc(V.v.title)+'</h2><p>'+esc(V.v.body)+'</p></div>';
  if(V.escalation)h+='<div class="escal"><h3>'+esc(C.verdict.escalation.title)+'</h3>'+
    '<p>'+esc(C.verdict.escalation.body)+'</p></div>';
  h+='<div class="bars"><h4>'+esc(C.strings.scoreHelp||'What the four numbers mean')+'</h4>';
  ['A','E','M','K'].forEach(function(k){
    var pa=C.params[k],pct=Math.round(s[k]/CANON[k]*100);
    h+='<div class="bar"><div class="bh"><b>'+esc(pa.label)+'</b><span>'+s[k]+' / '+CANON[k]+'</span></div>'+
      '<div class="tr"><div class="fl" style="width:'+pct+'%"></div></div>'+
      '<small>'+esc(pa.scale||pa.help)+'</small></div>'});
  h+='</div><div class="savenote">'+esc(S.saveMsg)+'</div>'+
    '<div class="ctawrap"><button class="cta" data-act="restart">'+esc(C.strings.restart||'Play another seat')+'</button></div>'+
    '<div class="foot">'+esc(C.license)+' &middot; v'+esc(C.version)+'</div>';
  return topbar(false)+'<div class="screen">'+
    '<div class="hero" style="padding-top:4px"><div class="mark">'+esc(p.icon)+'</div>'+
    '<h1 style="font-size:21px">'+esc(p.name)+'</h1></div>'+h+'</div>';
}

/* ---------- events ---------- */
function bind(){
  var root=document.getElementById('app');
  root.onclick=function(ev){
    var t=ev.target.closest('[data-act]'); if(!t)return;
    var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');

    if(a==='pickLang')loadOverlay(id).then(function(){setLang(id);S.phase='intro';render()});
    else if(a==='toSeat'){S.phase='seat';S.pending=null;render()}
    else if(a==='pickSeat'){S.pending=id;render()}
    else if(a==='confirmSeat'){
      S.persona=S.pending;S.pending=null;S.stepIdx=0;S.answers={};S.order=[];S.shuffle={};
      S.phase='scene';render()}
    else if(a==='begin'){S.phase='thread';render()}
    else if(a==='opt'){S.pending=id;render()}
    else if(a==='more'){
      var k=id+':'+t.getAttribute('data-k');
      S.expanded[k]=!S.expanded[k];
      S.keepScroll=window.scrollY; render();
    }
    else if(a==='confirm'){
      var st=currentStep(); if(!st)return;
      S.answers[st.id]=S.pending;
      if(S.order.indexOf(st.id)===-1)S.order.push(st.id);
      S.pending=null;
      var steps=activeSteps();
      if(S.stepIdx>=steps.length-1){S.phase='end';render()}
      // land on the consequence of what they just picked, not the top of the card
      else{S.stepIdx++;S.scrollTo='unf-'+st.id;render()}}
    else if(a==='factor'){var i=S.factors.indexOf(id);
      if(i>-1)S.factors.splice(i,1); else if(S.factors.length<3)S.factors.push(id);
      render()}
    else if(a==='finish')finish();
    else if(a==='restart'){S.phase='seat';S.persona=null;S.pending=null;S.stepIdx=0;
      S.answers={};S.order=[];S.shuffle={};S.factors=[];S.demo={};S.saveMsg='';
      S.sid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      S.startedAt=new Date().toISOString();render()}
    else if(a==='back')goBack();
  };
  root.onchange=function(ev){var t=ev.target.closest('[data-act="demo"]');
    if(t)S.demo[t.getAttribute('data-id')]=t.value};
}
function goBack(){
  if(S.phase==='seat'){S.phase='intro';S.pending=null}
  else if(S.phase==='scene'){S.phase='seat';S.pending=S.persona;S.persona=null}
  else if(S.phase==='thread'){
    if(S.stepIdx===0){S.phase='scene'}
    else{S.stepIdx--;var last=S.order.pop();if(last){S.pending=S.answers[last];delete S.answers[last]}}}
  else if(S.phase==='end'){S.phase='thread';var steps=activeSteps();S.stepIdx=Math.max(0,steps.length-1);
    var last=S.order.pop();if(last){S.pending=S.answers[last];delete S.answers[last]}}
  else if(S.phase==='intro'){var lp=(BASE.config&&BASE.config.languagePage)||{};
    if(lp.enabled!==false&&offeredLangs().length>1)S.phase='language'; else return}
  render();
}

/* ---------- capture ---------- */
function buildRow(){
  var V=verdict(),raw=score(),cap=ceiling();
  var row={ts:new Date().toISOString(),started:S.startedAt,sid:S.sid,version:C.version,
    persona:S.persona,lang:S.lang,lang_review:S.review?1:0,device_lang:(navigator.language||''),
    steps_seen:S.order.length,last_step:S.order.length?S.order[S.order.length-1]:'',
    outcome:V.key,escalation:V.escalation?1:0,
    raw_A:raw.A,raw_M:raw.M,raw_E:raw.E,raw_K:raw.K,
    cap_A:cap.A,cap_M:cap.M,cap_E:cap.E,cap_K:cap.K,
    sc_A:V.s.A,sc_M:V.s.M,sc_E:V.s.E,sc_K:V.s.K,
    factor_1:S.factors[0]||'',factor_2:S.factors[1]||'',factor_3:S.factors[2]||''};
  C.endscreen.demographics.forEach(function(dm){row['demo_'+dm.id]=S.demo[dm.id]||''});
  for(var id in C.decisions){ if(!C.decisions.hasOwnProperty(id))continue;
    row['q_'+id]=S.answers[id]||'';
    // what position the chosen option occupied on screen, so analysis can show
    // that shuffled order did not drive the answer
    row['pos_'+id]=(S.shuffle[id]&&S.answers[id])?(S.shuffle[id].indexOf(S.answers[id])+1):'';
  }
  return row;
}
function finish(){
  var row=buildRow();
  try{var a=JSON.parse(localStorage.getItem('t22_runs')||'[]');a.push(row);
    localStorage.setItem('t22_runs',JSON.stringify(a.slice(-500)))}catch(e){}
  S.saveMsg=C.strings.sending||'Saving…'; S.phase='result'; render();
  var url=(BASE.config&&BASE.config.endpoint)||'';
  if(!url||BASE.config.captureEnabled===false){
    S.saveMsg='Stored on this device.';
    var n=document.querySelector('.savenote'); if(n)n.textContent=S.saveMsg; return}
  var b=new URLSearchParams(); b.set('action','run'); b.set('payload',JSON.stringify(row));
  fetch(url,{method:'POST',body:b,mode:'no-cors'})
    .then(function(){S.saveMsg=C.strings.sent||'Saved. Thank you.'})
    .catch(function(){S.saveMsg=C.strings.sendFail||'Stored on this device.'})
    .then(function(){var n=document.querySelector('.savenote');if(n)n.textContent=S.saveMsg});
}

boot();
</script>
