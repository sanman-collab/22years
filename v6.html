ughly 4–7% of build cost. It also removes the only person contractually obliged to think about the tank.","t":"தோராயமா: மேஸ்திரி வழில கட்டுமான செலவுல சுமார் 4–7% மிச்சம். அதே நேரம், டேங்க்கைப் பத்தி யோசிக்க ஒப்பந்தப்படி கடமைப்பட்ட ஒரே ஆளையும் அது எடுத்துடுது.","s":"draft"},"d.organise.reveal.twist":{"en":"The cheapest route isn't the one with no professional. It's the one where the professional is hired and then ignored.","t":"எல்லாத்துலயும் மலிவான வழி, புரொஃபஷனலே இல்லாத வழி இல்ல. புரொஃபஷனலை வேலைக்கு வெச்சுட்டு அப்புறம் அவரை சட்டை பண்ணாத வழி தான்.","s":"draft"},"d.organise.reveal.lesson":{"en":"A septic tank has no client. Nobody in the room is paying to make it emptiable. Whoever organises the build inherits that silence by default.","t":"செப்டிக் டேங்க்குக்கு கிளையண்டே கிடையாது. அதை காலி பண்ணக் கூடியதா ஆக்க இந்த அறைல யாரும் காசு கொடுக்கல. கட்டுமானத்தை ஒழுங்கு பண்ணுறவர் யாரோ, அந்த மௌனம் தானா அவருக்கு வந்து சேரும்.","s":"draft"},"d.organise.analysis.maistri":{"en":"You chose the relationship over the record. It will probably build you a good house. It leaves nothing behind that explains what's under the driveway.","t":"ரெக்கார்டைவிட உறவை தேர்ந்தெடுத்தீங்க. நல்ல வீடு கட்டி கிடைக்கலாம். ஆனா டிரைவ்வேக்கு கீழ என்ன இருக்குன்னு சொல்ற ஒண்ணும் மிச்சம் இருக்காது.","s":"draft"},"d.organise.analysis.contractor":{"en":"You bought a single point of blame. That's real accountability — but only for things written into the quote. Watch what the quote says about the tank.","t":"குத்தம் சொல்ல ஒரே ஒரு ஆளை வாங்கியிருக்கீங்க. அது நிஜமான பொறுப்பு தான் — ஆனா எஸ்டிமேட்ல எழுதியிருக்கறதுக்கு மட்டும். டேங்க்கைப் பத்தி எஸ்டிமேட் என்ன சொல்லுதுன்னு பாருங்க.","s":"draft"},"d.organise.analysis.professional":{"en":"You've put two people in the room whose job is to know. Whether they use that knowledge is the next twenty minutes of this game.","t":"தெரிஞ்சிருக்கறதே வேலையா இருக்கற ரெண்டு பேரை உள்ள வெச்சிருக்கீங்க. அந்த தெரிதலை அவங்க பயன்படுத்துவாங்களான்னு தான் இந்த கேம்ல அடுத்த இருபது நிமிஷம்.","s":"draft"},"d.location.section":{"en":"THE SITE","t":"சைட்","s":"draft"},"d.location.prompt":{"en":"Where does the tank go on the site?","t":"சைட்ல டேங்க் எங்க வரும்?","s":"draft"},"d.location.opt.vastu":{"en":"Where vastu allows — southwest is out, so northwest corner","t":"வாஸ்து அனுமதிக்கற இடத்துல — தென்மேற்கு கூடாது, அதனால வடமேற்கு மூலை","s":"draft"},"d.location.opt.behind":{"en":"Behind the house, out of sight","t":"வீட்டுக்கு பின்னாடி, கண்ணுல படாம","s":"draft"},"d.location.opt.gate":{"en":"Near the gate, where a truck can actually reach","t":"கேட் பக்கத்துல, லாரி நிஜமாவே வர முடியுற இடத்துல","s":"draft"},"d.location.reveal.fact":{"en":"A desludging truck carries 30 m of hose and needs somewhere to stand. When the tank sits behind a built house, the hose either doesn't reach or has to be dragged through the kitchen.","t":"டீஸ்லட்ஜிங் லாரில 30 m ஹோஸ் தான் இருக்கும், நிக்க ஒரு இடமும் வேணும். கட்டி முடிச்ச வீட்டுக்கு பின்னாடி டேங்க் இருந்தா, ஹோஸ் எட்டாது, இல்லன்னா கிச்சன் வழியா இழுத்துட்டு வரணும்.","s":"draft"},"d.location.reveal.cost":{"en":"Indicative: an unreachable tank adds ₹1,500–4,000 per desludging, every time, forever — and is the single most common reason a worker climbs in instead.","t":"தோராயமா: எட்டாத டேங்க், ஒவ்வொரு தடவை காலி பண்ணும்போதும் ₹1,500–4,000 கூட ஆகும் — எப்பவும், எப்பவுமே. அதுக்கு பதிலா ஒரு தொழிலாளி உள்ள இறங்கறதுக்கு இது தான் மிக மிக சாதாரணமான காரணம்.","s":"draft"},"d.location.reveal.twist":{"en":"Vastu isn't the villain. Vastu plus a compound wall built later is. Most tanks become unreachable years after they were placed.","t":"வாஸ்து வில்லன் இல்ல. வாஸ்து, கூட அப்புறம் கட்டுற கம்பவுண்ட் சுவரு — அது தான். பெரும்பாலான டேங்க்குகள் வெச்ச சில வருஷம் கழிச்சு தான் எட்டாததா ஆகுது.","s":"draft"},"d.location.reveal.lesson":{"en":"Access is decided in the first ten minutes of site planning, by people thinking about the house, not about the tank. It is almost never revisited.","t":"சைட் பிளானிங்கோட முதல் பத்து நிமிஷத்துலயே ஆக்சஸ் முடிவாயிடுது — டேங்க்கைப் பத்தி இல்லாம வீட்டைப் பத்தி யோசிக்கறவங்களால. அதை திரும்ப பாக்கறதே கிடையாது.","s":"draft"},"d.location.analysis.vastu":{"en":"You optimised for the family's sense of rightness about the house. That's a real value. It just happens to be the constraint that most often strands the tank behind a wall.","t":"வீட்டைப் பத்தி குடும்பத்துக்கு இருக்கற 'சரி'ங்கிற உணர்வுக்காக முடிவு பண்ணீங்க. அது ஒரு நிஜமான மதிப்பு தான். ஆனா டேங்க்கை சுவத்துக்கு பின்னாடி மாட்டி விடுற கட்டுப்பாடும் பெரும்பாலும் அது தான்.","s":"draft"},"d.location.analysis.behind":{"en":"Out of sight solves today's problem and creates the 2048 one. Ask yourself where the truck stands — if the answer is 'the road', measure the distance now.","t":"கண்ணுல படாம வெக்கறது இன்னிக்கு பிரச்சினையை தீர்க்குது, 2048-ல ஒண்ணை உண்டாக்குது. லாரி எங்க நிக்கும்னு உங்களையே கேளுங்க — பதில் 'ரோட்ல'ன்னா, தூரத்தை இப்பவே அளந்து வெச்சுக்குங்க.","s":"draft"},"d.location.analysis.gate":{"en":"You made the truck a design input. This one decision does more for the person emptying this tank than everything else on this list combined.","t":"லாரியை ஒரு டிசைன் இன்புட்டா ஆக்கியிருக்கீங்க. இந்த லிஸ்ட்ல இருக்கற மத்த எல்லாத்தையும் சேர்த்து வெச்சாலும், இந்த டேங்க்கை காலி பண்றவருக்கு இந்த ஒரு முடிவு அதைவிட அதிகம் செய்யுது.","s":"draft"},"d.budget_cut.section":{"en":"MONEY","t":"பணம்","s":"draft"},"d.budget_cut.prompt":{"en":"The quote came in ₹1.2 lakh over. Something has to go.","t":"எஸ்டிமேட் ₹1.2 லட்சம் அதிகமா வந்திருக்கு. எதையாவது வெட்டணும்.","s":"draft"},"d.budget_cut.opt.tank":{"en":"The septic tank spec. It's buried — nobody will ever see it","t":"செப்டிக் டேங்க் ஸ்பெக். அது மண்ணுக்கு கீழ — யாரும் பாக்கவே போறதில்ல","s":"draft"},"d.budget_cut.opt.finish":{"en":"The front elevation cladding. Costs the same, shows the most","t":"முன் எலிவேஷன் கிளாடிங். அதே செலவு தான், ஆனா அது தான் அதிகம் தெரியும்","s":"draft"},"d.budget_cut.opt.delay":{"en":"Nothing. Delay moving in by two months and find the money","t":"எதுவும் வேண்டாம். ரெண்டு மாசம் தள்ளிப் போட்டு காசை ஏற்பாடு பண்ணிக்கறேன்","s":"draft"},"d.budget_cut.reveal.fact":{"en":"When a build goes over, the cut lands on what can't be seen from the road. Underground work is the first line item to lose its specification and the last to get it back.","t":"பட்ஜெட் தாண்டினா, வெட்டு ரோட்ல இருந்து தெரியாத விஷயத்துல தான் விழும். மண்ணுக்கு கீழ வேலை தான் முதல்ல ஸ்பெசிஃபிகேஷனை இழக்கும், கடைசியா தான் திரும்ப பெறும்.","s":"draft"},"d.budget_cut.reveal.cost":{"en":"Indicative: the full difference between a bare ring tank and a properly detailed two-chamber tank with covers and vent is ₹25,000–45,000 — roughly a third of that overrun.","t":"தோராயமா: வெறும் ரிங் டேங்க்குக்கும், கவர், வென்ட் எல்லாம் சரியா டீடெயில் பண்ணின ரெண்டு சேம்பர் டேங்க்குக்கும் இடையே மொத்த வித்தியாசம் ₹25,000–45,000 — அந்த தாண்டின தொகைல மூணுல ஒரு பங்கு.","s":"draft"},"d.budget_cut.reveal.twist":{"en":"The tank is rarely cut outright. It's downgraded quietly, by removing the covers and the vent, which is where almost all of the worker-safety value sits.","t":"டேங்க்கை முழுசா வெட்டறது அபூர்வம். கவரையும் வென்ட்டையும் எடுத்துட்டு அமைதியா தரம் தாழ்த்திடுவாங்க — தொழிலாளி பாதுகாப்பு மதிப்பு கிட்டத்தட்ட முழுக்க இருக்கறது அங்க தான்.","s":"draft"},"d.budget_cut.reveal.lesson":{"en":"Invisible work loses every budget argument it is in. The only defence is to price the covers and the vent as separate, named lines — so cutting them is a visible act.","t":"கண்ணுக்குத் தெரியாத வேலை, அது இருக்கற ஒவ்வொரு பட்ஜெட் வாதத்துலயும் தோத்துப் போகும். ஒரே தற்காப்பு — கவரையும் வென்ட்டையும் தனித்தனி, பேரு போட்ட லைன்களா விலை போடுறது. அப்போ அதை வெட்டறது கண்ணுக்குத் தெரியற ஒரு செயலா ஆகும்.","s":"draft"},"d.budget_cut.analysis.tank":{"en":"Honest answer, and the most common one. You saved real money on the thing you'll never look at. The cost has been transferred, not removed — to a stranger, in twenty years.","t":"நேர்மையான பதில், எல்லாரும் சொல்ற பதிலும் இது தான். நீங்க எப்பவும் பாக்கப் போறதில்லாத விஷயத்துல நிஜமா காசு மிச்சம் பண்ணீங்க. செலவு போகல, மாத்தப்பட்டிருக்கு — இருபது வருஷம் கழிச்சு, தெரியாத ஒருத்தருக்கு.","s":"draft"},"d.budget_cut.analysis.finish":{"en":"You defended the part of the build nobody would thank you for. The elevation can be clad in year five; the tank cannot be re-cast.","t":"யாரும் உங்களுக்கு நன்றி சொல்லப் போறதில்லாத பகுதியை காப்பாத்தினீங்க. எலிவேஷனுக்கு அஞ்சாவது வருஷத்துல கிளாடிங் போடலாம்; டேங்க்கை திரும்ப வார்க்க முடியாது.","s":"draft"},"d.budget_cut.analysis.delay":{"en":"Expensive in patience and rent. But you refused to let the invisible thing absorb the shortfall — which is the whole mechanism this game is about.","t":"பொறுமைலயும் வாடகைலயும் விலை அதிகம். ஆனா கண்ணுக்குத் தெரியாத விஷயம் பற்றாக்குறையை சுமக்கறதை நீங்க விடல — இந்த கேம் முழுக்க பேசுறது அந்த ஒரு விஷயத்தைப் பத்தி தான்.","s":"draft"},"d.tanktype.section":{"en":"THE TANK","t":"டேங்க்","s":"draft"},"d.tanktype.prompt":{"en":"What do we build the tank out of?","t":"டேங்க்கை எதுல கட்டுறது?","s":"draft"},"d.tanktype.opt.rings":{"en":"Precast concrete rings — fast, cheap, done by evening","t":"பிரீகாஸ்ட் கான்கிரீட் ரிங் — வேகம், மலிவு, சாயங்காலத்துக்குள்ள முடிஞ்சிடும்","s":"draft"},"d.tanktype.opt.well":{"en":"Stone-lined, like an old well","t":"பழைய கிணறு மாதிரி கல்லு கட்டி","s":"draft"},"d.tanktype.opt.brick":{"en":"Brick-lined and plastered smooth inside","t":"செங்கல் கட்டி, உள்ள மெழுகா பூசி","s":"draft"},"d.tanktype.opt.twochamber":{"en":"Two chambers with a baffle wall, as per IS 2470","t":"IS 2470 படி, பஃபிள் சுவருடன் ரெண்டு சேம்பர்","s":"draft"},"d.tanktype.reveal.fact":{"en":"A single-compartment tank doesn't settle solids properly. Sludge carries through to the outlet, the soak pit clogs, and the tank needs emptying far more often than it should.","t":"ஒரே அறை டேங்க்ல திடக்கழிவு ஒழுங்கா தங்காது. ஸ்லட்ஜ் அவுட்லெட் வரைக்கும் போயிடும், சோக் பிட் அடைச்சுக்கும், தேவைப்படுறதைவிட ரொம்ப அடிக்கடி டேங்க்கை காலி பண்ணணும்.","s":"draft"},"d.tanktype.reveal.cost":{"en":"Indicative: two-chamber costs ₹12,000–20,000 more than rings. It roughly halves desludging frequency over the tank's life.","t":"தோராயமா: ரிங்கைவிட ரெண்டு சேம்பர் ₹12,000–20,000 அதிகம். டேங்க்கோட ஆயுள் முழுக்க, காலி பண்ற தடவைகளை கிட்டத்தட்ட பாதியா குறைக்கும்.","s":"draft"},"d.tanktype.reveal.twist":{"en":"Rings aren't unsafe because of the material. They're unsafe because the ring diameter decides the opening — and a ring tank almost always ends up with a hole too small for anything but a human body.","t":"ரிங் பாதுகாப்பில்லாதது மெட்டீரியல் காரணமா இல்ல. ரிங்கோட விட்டம் தான் திறப்பை முடிவு பண்ணுது — அதனால தான். ரிங் டேங்க்ல கிட்டத்தட்ட எப்பவுமே கடைசில கிடைக்கறது, மனுஷ உடம்பைத் தவிர வேற எதுவும் நுழைய முடியாத அளவு சின்ன ஓட்டை தான்.","s":"draft"},"d.tanktype.reveal.lesson":{"en":"Tank type quietly sets the ceiling on everything downstream: how often it must be opened, what the opening can be, and whether the effluent has anywhere sane to go.","t":"டேங்க் வகை, அதுக்கு அப்புறம் வர எல்லாத்துக்கும் அமைதியா ஒரு உச்சவரம்பு வெச்சிடுது: எத்தனை தடவை திறக்கணும், திறப்பு எவ்வளவு இருக்க முடியும், வெளியேறுற தண்ணிக்கு ஒழுங்கான இடம் இருக்கான்னு.","s":"draft"},"d.tanktype.analysis.rings":{"en":"Fast and defensible on cost. But you've just constrained your own next two decisions — the opening and the effluent options narrow sharply from here.","t":"வேகம், செலவுலயும் நியாயப்படுத்தலாம். ஆனா உங்களோட அடுத்த ரெண்டு முடிவுகளையும் நீங்களே கட்டுப்படுத்திட்டீங்க — திறப்பும், வெளியேறுற தண்ணி வழிகளும் இங்கிருந்து கடுமையா சுருங்குது.","s":"draft"},"d.tanktype.analysis.well":{"en":"Traditional and more generous in section than rings. Stone joints let water and roots move in both directions, though, so expect it to behave more like a pit than a tank.","t":"பாரம்பரியமானது, ரிங்கைவிட உள்ள இடம் அதிகம். ஆனா கல்லு இணைப்பு வழியா தண்ணியும் வேரும் ரெண்டு பக்கமும் போகும், அதனால இது டேங்க் மாதிரி இல்லாம பிட் மாதிரி நடந்துக்கும்னு எதிர்பாருங்க.","s":"draft"},"d.tanktype.analysis.brick":{"en":"A solid middle. Smooth plaster means less solids clinging, easier emptying. You still only have one compartment, so the outlet will carry sludge.","t":"நல்ல நடுத்தர தேர்வு. மெழுகான பூச்சுன்னா திடக்கழிவு ஒட்டிக்கறது குறைவு, காலி பண்றது சுலபம். ஆனா இன்னும் ஒரே அறை தான், அதனால அவுட்லெட்ல ஸ்லட்ஜ் போயிட்டே இருக்கும்.","s":"draft"},"d.tanktype.analysis.twochamber":{"en":"The specification that actually exists in Indian standards, and almost never gets built. Everything downstream just got easier — including the effluent options.","t":"இந்திய தரநிலைகள்ல நிஜமாவே இருக்கற ஸ்பெசிஃபிகேஷன், ஆனா கட்டப்படறதே இல்ல. இதுக்கு அப்புறம் வர எல்லாமே சுலபமாயிடுச்சு — வெளியேறுற தண்ணி வழிகள் உட்பட.","s":"draft"},"d.openings.section":{"en":"THE TOP","t":"மேல் பகுதி","s":"draft"},"d.openings.prompt":{"en":"How do we close the top?","t":"மேல பகுதியை எப்படி மூடுறது?","s":"draft"},"d.openings.opt.flush":{"en":"One flush slab. Clean finish, nothing sticking up","t":"ஒரே ஃபிளஷ் ஸ்லாப். சுத்தமான ஃபினிஷ், மேல எதுவும் தெரியாது","s":"draft"},"d.openings.opt.small":{"en":"One small opening, about 1½ feet, plastered over later","t":"ஒரு சின்ன திறப்பு, சுமார் 1½ அடி, அப்புறம் பூசி மூடிடலாம்","s":"draft"},"d.openings.opt.covers":{"en":"Two proper covers, 2×2 ft, sitting at ground level","t":"ரெண்டு சரியான கவர், 2×2 ft, தரை மட்டத்துல","s":"draft"},"d.openings.reveal.fact":{"en":"This is the decision. A 2×2 ft cover at ground level lets a hose and a rake do the work. A 1½ ft hole lets only an arm — or a person — do it. A flush slab means the first step of every desludging is a hammer.","t":"இது தான் அந்த முடிவு. தரை மட்டத்துல 2×2 ft கவர் இருந்தா, ஹோஸ்ஸும் ரேக்கும் வேலையை பண்ணிடும். 1½ ft ஓட்டைன்னா ஒரு கை — இல்ல ஒரு மனுஷன் — மட்டும் தான் பண்ண முடியும். ஃபிளஷ் ஸ்லாப்ன்னா, ஒவ்வொரு தடவை காலி பண்ணும்போதும் முதல் வேலை சுத்தி தான்.","s":"draft"},"d.openings.reveal.cost":{"en":"Indicative: two covers with frames add ₹4,000–8,000. That is the cheapest line on this entire list and the one most often deleted.","t":"தோராயமா: ஃபிரேம் சேர்த்து ரெண்டு கவர் ₹4,000–8,000 கூட ஆகும். இந்த லிஸ்ட்லயே மலிவான லைன் அது தான், அதிகமா நீக்கப்படுறதும் அது தான்.","s":"draft"},"d.openings.reveal.twist":{"en":"Small openings are usually chosen for safety — so a child doesn't fall in. The result is a tank that can only be cleaned by putting an adult inside it.","t":"சின்ன திறப்பை பாதுகாப்புக்காக தான் தேர்ந்தெடுக்கறாங்க — குழந்தை விழுந்துடக் கூடாதுன்னு. விளைவு: ஒரு பெரியவரை உள்ள இறக்கினா தான் சுத்தம் பண்ண முடியுற டேங்க்.","s":"draft"},"d.openings.reveal.lesson":{"en":"Almost every case of a worker entering a tank traces back to an opening too small to work through. Not to poverty, not to ignorance — to a hole somebody sized for tidiness.","t":"ஒரு தொழிலாளி டேங்க் உள்ள இறங்குற கிட்டத்தட்ட ஒவ்வொரு சம்பவமும் போய் நிக்கறது, வெளியே இருந்து வேலை பண்ண முடியாத அளவு சின்ன திறப்புல தான். வறுமைல இல்ல, அறியாமைல இல்ல — நேர்த்தியா இருக்கணும்னு யாரோ ஒருத்தர் அளவு வெச்ச ஒரு ஓட்டைல.","s":"draft"},"d.openings.analysis.flush":{"en":"You chose the finish. Understandable — a flush slab looks finished and nothing protrudes into the yard. It also means nobody can open this tank without destroying it first.","t":"ஃபினிஷை தேர்ந்தெடுத்தீங்க. புரியுது — ஃபிளஷ் ஸ்லாப் முடிஞ்ச மாதிரி தெரியுது, முத்தத்துல எதுவும் தூக்கி நிக்காது. அதே நேரம், இந்த டேங்க்கை முதல்ல உடைக்காம யாரும் திறக்க முடியாது.","s":"draft"},"d.openings.analysis.small":{"en":"The compromise, and by far the most common built outcome. It's better than a sealed slab and still too small to clean through. This is the shape most entries happen into.","t":"சமரசம் — கட்டி முடிக்கறதுல மிக மிக சாதாரணமா நடக்கறது இது தான். மூடின ஸ்லாப்பைவிட பரவாயில்ல, ஆனா வெளியே இருந்து சுத்தம் பண்ண இன்னும் ரொம்ப சின்னது. உள்ள இறங்குற சம்பவங்கள்ல பெரும்பாலானவை இந்த வடிவத்துக்குள்ள தான்.","s":"draft"},"d.openings.analysis.covers":{"en":"The single highest-value choice available to you. A hose reaches, a rake reaches, and nobody has to. Keep the frames at ground level — raised ones get buried by later landscaping.","t":"உங்களுக்கு இருக்கற தேர்வுகள்ல மிக அதிக மதிப்புள்ளது இது தான். ஹோஸ் எட்டும், ரேக் எட்டும், யாரும் இறங்க வேண்டியதில்ல. ஃபிரேமை தரை மட்டத்துலயே வெச்சுக்குங்க — தூக்கி வெச்சா, அப்புறம் வர லேண்ட்ஸ்கேப்பிங்ல புதைஞ்சிடும்.","s":"draft"},"d.vent.section":{"en":"THE TOP","t":"மேல் பகுதி","s":"draft"},"d.vent.prompt":{"en":"And the vent pipe?","t":"வென்ட் பைப்?","s":"draft"},"d.vent.opt.none":{"en":"Skip it. Nobody ever asks for one","t":"வேண்டாம். அதை யாரும் கேக்கறதே இல்ல","s":"draft"},"d.vent.opt.short":{"en":"A short one, hidden behind the parapet","t":"ஒரு குட்டையா, பாரபெட்டுக்கு பின்னாடி மறைச்சு","s":"draft"},"d.vent.opt.proper":{"en":"Full height, above the roof line, with a cowl","t":"முழு உயரம், மொட்ட மாடிக்கு மேல, கௌல் போட்டு","s":"draft"},"d.vent.reveal.fact":{"en":"A septic tank generates hydrogen sulphide and methane and consumes oxygen. An unvented tank holds that atmosphere indefinitely. Opening the cover does not clear it.","t":"செப்டிக் டேங்க் ஹைட்ரஜன் சல்பைடும் மீத்தேனும் உண்டாக்குது, ஆக்சிஜனை எடுத்துக்குது. வென்ட் இல்லாத டேங்க் அந்த காத்தை எவ்வளவு காலமும் வெச்சிருக்கும். கவரை திறந்தா அது போயிடாது.","s":"draft"},"d.vent.reveal.cost":{"en":"Indicative: a proper vent is ₹1,500–3,000 of PVC. It is the cheapest life-safety item in the entire build.","t":"தோராயமா: சரியான வென்ட்டுக்கு ₹1,500–3,000 PVC. கட்டுமானம் முழுக்க, உயிர் காக்கற பொருள்ளயே மலிவானது இது தான்.","s":"draft"},"d.vent.reveal.twist":{"en":"Hydrogen sulphide destroys your sense of smell within seconds at dangerous concentrations. The warning stops exactly when the danger starts — which is why people say 'it didn't smell bad' afterwards.","t":"ஆபத்தான அளவுல ஹைட்ரஜன் சல்பைடு நொடில வாசனை உணர்வை அழிச்சிடும். ஆபத்து ஆரம்பிக்கற அதே இடத்துல எச்சரிக்கை நின்னுடுது — அதனால தான் அப்புறம் 'நாத்தமே அடிக்கல' ன்னு சொல்றாங்க.","s":"draft"},"d.vent.reveal.lesson":{"en":"A vent is not for the smell. It is the only thing standing between a confined space and a breathable one, and it is left off precisely because its benefit is invisible.","t":"வென்ட் நாத்தத்துக்காக இல்ல. அடைபட்ட இடத்துக்கும் மூச்சு விட முடியுற இடத்துக்கும் இடையே நிக்கற ஒரே விஷயம் அது தான். அதோட பலன் கண்ணுக்குத் தெரியாதுங்கறதாலயே அது விடப்படுது.","s":"draft"},"d.vent.analysis.none":{"en":"The most common outcome, and the one that turns an awkward job into a fatal one. Everything good you did with the covers is undone by the atmosphere behind them.","t":"மிக சாதாரணமா நடக்கறது இது தான், சிரமமான ஒரு வேலையை உயிர் போற வேலையா மாத்துறதும் இது தான். கவர்ல நீங்க பண்ணின எல்லா நல்லதும், அதுக்கு பின்னாடி இருக்கற காத்தால அழிஞ்சு போகுது.","s":"draft"},"d.vent.analysis.short":{"en":"Better than nothing — there is a path for gas to leave. Hidden behind a parapet it will vent into a pocket of still air, and it will be the first thing sealed during any future renovation.","t":"இல்லாததைவிட பரவாயில்ல — கேஸ் வெளியே போக ஒரு வழி இருக்கு. ஆனா பாரபெட்டுக்கு பின்னாடி மறைஞ்சு இருந்தா, அசையாத காத்து இருக்கற ஒரு மூலைக்குள்ள தான் வெளியேறும். அப்புறம் எப்ப ரெனோவேஷன் பண்ணாலும் முதல்ல மூடப்படுறதும் அது தான்.","s":"draft"},"d.vent.analysis.proper":{"en":"Correct. Above the roof line, away from windows, with a cowl so it doesn't block. This is the difference between a confined space and a tank.","t":"சரி. மொட்ட மாடிக்கு மேல, ஜன்னல்ல இருந்து விலகி, அடைச்சுக்காம இருக்க கௌல் போட்டு. அடைபட்ட இடத்துக்கும் ஒரு டேங்க்குக்கும் உள்ள வித்தியாசம் இது தான்.","s":"draft"},"d.effluent.section":{"en":"THE OUTLET","t":"அவுட்லெட்","s":"draft"},"d.effluent.prompt":{"en":"Where does the water leaving the tank go?","t":"டேங்க்ல இருந்து வெளியேறுற தண்ணி எங்க போகுது?","s":"draft"},"d.effluent.opt.storm":{"en":"Into the storm drain out front","t":"வீட்டு முன்னாடி இருக்கற மழைநீர் ஓடைக்கு","s":"draft"},"d.effluent.opt.soak":{"en":"A soak pit right next to the tank","t":"டேங்க் பக்கத்துலயே ஒரு சோக் பிட்","s":"draft"},"d.effluent.opt.dispersion":{"en":"A dispersion trench, sized for the soil","t":"மண்ணுக்கு ஏத்த அளவுல ஒரு டிஸ்பர்ஷன் டிரெஞ்ச்","s":"draft"},"d.effluent.reveal.fact":{"en":"Septic effluent is not treated water. Into a storm drain it becomes an open sewage channel; into an undersized soak pit it clogs, backs up, and forces the tank to be opened years early.","t":"செப்டிக் டேங்க்ல இருந்து வர தண்ணி சுத்திகரிச்ச தண்ணி இல்ல. மழைநீர் ஓடைல விட்டா அது திறந்த சாக்கடையா மாறிடும்; அளவு போதாத சோக் பிட்ல விட்டா அடைச்சுக்கும், திரும்ப வரும், டேங்க்கை வருஷக்கணக்குல முன்னாடியே திறக்க வெச்சிடும்.","s":"draft"},"d.effluent.reveal.cost":{"en":"Indicative: a properly sized dispersion trench is ₹15,000–30,000. A clogged soak pit costs a desludging every few months and eventually has to be dug out by hand.","t":"தோராயமா: சரியான அளவுல ஒரு டிஸ்பர்ஷன் டிரெஞ்ச் ₹15,000–30,000. அடைச்சுக்கிட்ட சோக் பிட், சில மாசத்துக்கு ஒரு தடவை காலி பண்ண வெக்கும், கடைசில கையாலயே தோண்டி எடுக்க வேண்டியிருக்கும்.","s":"draft"},"d.effluent.reveal.twist":{"en":"A soak pit that fails doesn't announce itself. The tank simply fills faster. By the time anyone investigates, the failure is ten years deep and someone is going into the pit to find it.","t":"சோக் பிட் வேலை செய்யாம போனா அது சொல்லிட்டு போகாது. டேங்க் வேகமா நிரம்பும், அவ்வளவு தான். யாராவது விசாரிக்கறதுக்குள்ள அந்த பழுது பத்து வருஷம் ஆழம், அதை கண்டுபிடிக்க யாரோ ஒருத்தர் பிட் உள்ள இறங்குறாரு.","s":"draft"},"d.effluent.reveal.lesson":{"en":"Where the water goes decides how often the tank is opened. Frequency is exposure. Every avoidable desludging is another entry into somebody's working year.","t":"தண்ணி எங்க போகுதுங்கறது தான், டேங்க் எத்தனை தடவை திறக்கப்படும்னு முடிவு பண்ணுது. அடிக்கடிங்கறது தான் எக்ஸ்போஷர். தவிர்க்க முடியுற ஒவ்வொரு காலி பண்ணுதலும், யாரோ ஒருத்தரோட வேலை வருஷத்துல இன்னொரு இறக்கம்.","s":"draft"},"d.effluent.analysis.storm":{"en":"It works, immediately and completely, and it moves the problem into the street. Whoever cleans that drain now meets your sewage without knowing it's sewage.","t":"உடனே, முழுசா வேலை செய்யும் — பிரச்சினையை தெருவுக்கு நகர்த்தும். இனிமே அந்த ஓடையை சுத்தம் பண்றவர் யாரோ, அது கழிவுன்னு தெரியாமலேயே உங்க கழிவை சந்திக்கிறார்.","s":"draft"},"d.effluent.analysis.soak":{"en":"The standard answer and a reasonable one — if it's sized for the soil and set back from the tank. Most aren't, and the clogging shows up as a tank that mysteriously fills fast.","t":"வழக்கமான பதில், நியாயமானதும் கூட — மண்ணுக்கு ஏத்த அளவுல இருந்து, டேங்க்ல இருந்து விலகி வெச்சா. பெரும்பாலானவை அப்படி இல்ல, அடைப்பு வெளியே தெரியறது டேங்க் ஏனோ வேகமா நிரம்புதுங்கற மாதிரி.","s":"draft"},"d.effluent.analysis.dispersion":{"en":"The right answer where soil allows, and it's only available to you because you built a tank whose outlet water is clean enough to disperse. The earlier choice paid for itself here.","t":"மண் அனுமதிக்கற இடத்துல இது தான் சரியான பதில். அவுட்லெட் தண்ணி பரவுற அளவுக்கு சுத்தமா இருக்கற டேங்க்கை கட்டுனதால தான் இந்த வழி உங்களுக்கு கிடைச்சிருக்கு. முன்னாடி எடுத்த முடிவு இங்க தன் விலையை திரும்ப கொடுத்திருக்கு.","s":"draft"},"d.drawing.section":{"en":"ON PAPER","t":"பேப்பர்ல","s":"draft"},"d.drawing.prompt":{"en":"What actually goes on the drawing for the tank?","t":"டேங்க்குக்காக டிராயிங்ல நிஜமா என்ன வரும்?","s":"draft"},"d.drawing.opt.st":{"en":"'ST' with a rectangle. Everyone knows what that means","t":"'ST' ன்னு போட்டு ஒரு செவ்வகம். அது என்னன்னு எல்லாருக்கும் தெரியும்","s":"draft"},"d.drawing.opt.detail":{"en":"A full section — chambers, covers, vent, invert levels","t":"முழு செக்ஷன் — சேம்பர், கவர், வென்ட், இன்வர்ட் லெவல்","s":"draft"},"d.drawing.reveal.fact":{"en":"On most sanctioned drawings in this region the septic tank appears as two letters and a rectangle. Nothing about compartments, cover size, vent or outlet is drawn — so nothing about them is checked, priced, or built.","t":"இந்த பகுதில அனுமதி வாங்குன பெரும்பாலான டிராயிங்ல செப்டிக் டேங்க் ரெண்டு எழுத்தும் ஒரு செவ்வகமும் தான். அறைகள், கவர் அளவு, வென்ட், அவுட்லெட் — எதையும் வரையறதில்ல. அதனால அதை எதையும் செக் பண்றதும் இல்ல, விலை போடறதும் இல்ல, கட்டறதும் இல்ல.","s":"draft"},"d.drawing.reveal.cost":{"en":"Indicative: a proper section is one extra sheet and perhaps two hours of drafting time.","t":"தோராயமா: சரியான ஒரு செக்ஷன்னா, ஒரு எக்ஸ்ட்ரா ஷீட், ஒருவேளை ரெண்டு மணி நேர டிராஃப்டிங்.","s":"draft"},"d.drawing.reveal.twist":{"en":"The rectangle is not laziness. It's what gets approved fastest. Detailing the tank invites questions from an authority that has no mechanism to evaluate the answer.","t":"அந்த செவ்வகம் சோம்பேறித்தனம் இல்ல. அது தான் ரொம்ப வேகமா அப்ரூவல் வாங்குது. டேங்க்கை டீடெயில் பண்ணா, பதிலை மதிப்பிட வழியே இல்லாத ஒரு அதிகார அமைப்புல இருந்து கேள்விகள் வரும்.","s":"draft"},"d.drawing.reveal.lesson":{"en":"What is not drawn is not built, not priced, and not anybody's fault. The rectangle is how a responsibility disappears without anyone deciding to drop it.","t":"வரையாதது கட்டப்படாது, விலை போடப்படாது, யார் தப்புமா இருக்காது. யாரும் கைவிட முடிவு பண்ணாமலேயே ஒரு பொறுப்பு காணாம போற வழி தான் அந்த செவ்வகம்.","s":"draft"},"d.drawing.analysis.st":{"en":"You did what the sanction process rewards. The tank is now entirely in the maistry's memory, and that memory has no cover size in it.","t":"அனுமதி வாங்கற நடைமுறை எதுக்கு பரிசு கொடுக்குதோ அதை பண்ணீங்க. டேங்க் இப்ப முழுக்க மேஸ்திரியோட ஞாபகத்துல தான் இருக்கு — அந்த ஞாபகத்துல கவர் அளவுங்கறதே கிடையாது.","s":"draft"},"d.drawing.analysis.detail":{"en":"You created the one artefact that survives everyone on this project. In 2048 somebody can find out what's down there without a hammer.","t":"இந்த ப்ராஜெக்ட்ல இருக்கற எல்லாரையும் தாண்டி மிஞ்சுற ஒரே விஷயத்தை உருவாக்கியிருக்கீங்க. 2048-ல ஒருத்தர், சுத்தி இல்லாம, கீழ என்ன இருக்குன்னு கண்டுபிடிக்க முடியும்.","s":"draft"},"d.oc.section":{"en":"AFTER","t":"அதுக்கு அப்புறம்","s":"draft"},"d.oc.prompt":{"en":"The house is ready. Do you go through the Occupancy Certificate?","t":"வீடு ரெடி. Occupancy Certificate (OC) வாங்குற வழில போறீங்களா?","s":"draft"},"d.oc.opt.movein":{"en":"Just move in. Nobody in this layout has an OC","t":"சும்மா குடி போயிடலாம். இந்த லேஅவுட்ல யாருக்குமே OC கிடையாது","s":"draft"},"d.oc.opt.getoc":{"en":"Apply for the OC, whatever it takes","t":"எவ்வளவு சிரமம்னாலும் OC-க்கு அப்ளை பண்ணுவேன்","s":"draft"},"d.oc.reveal.fact":{"en":"The Occupancy Certificate is the only point at which anyone official is supposed to look at what was actually built, including the sanitation, versus what was approved.","t":"அனுமதி வாங்கினதுக்கும் நிஜமா கட்டினதுக்கும் — சானிட்டேஷன் உட்பட — உள்ள வித்தியாசத்தை அரசாங்கத்துல யாராவது பாக்கணும்னு சொல்லப்பட்ட ஒரே இடம் Occupancy Certificate தான்.","s":"draft"},"d.oc.reveal.cost":{"en":"Indicative: weeks of follow-up, and in practice a system most owners route around entirely.","t":"தோராயமா: வாரக்கணக்குல ஃபாலோ-அப். நடைமுறைல, பெரும்பாலான ஓனர்கள் முழுசா சுத்திட்டு போற ஒரு அமைப்பு.","s":"draft"},"d.oc.reveal.twist":{"en":"Skipping the OC doesn't only avoid scrutiny — it removes the building from the record. An unrecorded building is one nobody can later be required to fix.","t":"OC-யை தவிர்க்கறது சோதனையை மட்டும் தவிர்க்கல — கட்டிடத்தையே ரெக்கார்ட்ல இருந்து எடுத்துடுது. ரெக்கார்ட்ல இல்லாத கட்டிடத்தை அப்புறம் சரி பண்ணச் சொல்லி யாரையும் கேக்க முடியாது.","s":"draft"},"d.oc.reveal.lesson":{"en":"Accountability isn't a feeling. It's whether a document exists with somebody's name on it. Every step that skips the paperwork removes a future person's ability to ask why.","t":"பொறுப்புங்கறது ஒரு உணர்வு இல்ல. யாரோட பேரோட ஒரு டாக்குமெண்ட் இருக்கா இல்லையாங்கறது தான். பேப்பர் வேலையை தவிர்க்கற ஒவ்வொரு அடியும், 'ஏன்'னு கேக்கற திறனை அப்புறம் வர ஒருத்தர்கிட்ட இருந்து பறிக்குது.","s":"draft"},"d.oc.analysis.movein":{"en":"Pragmatic and near-universal. You've also ensured no independent eye ever compared the tank as built to the tank as approved.","t":"நடைமுறைக்கு ஏத்தது, கிட்டத்தட்ட எல்லாரும் பண்றது. அதே நேரம், அனுமதி வாங்கின டேங்க்கையும் கட்டின டேங்க்கையும் வெளியாள் யாரும் ஒப்பிட்டு பாக்கல — அதை நீங்க உறுதி பண்ணிட்டீங்க.","s":"draft"},"d.oc.analysis.getoc":{"en":"Slow, tedious, and the only mechanism in this entire chain where an outsider checks the work. You kept the tank inside the system of record.","t":"மெதுவானது, சலிப்பானது — ஆனா இந்த முழு சங்கிலிலயும் வெளியாள் ஒருத்தர் வேலையை செக் பண்ற ஒரே வழி இது தான். டேங்க்கை ரெக்கார்ட் அமைப்புக்குள்ளயே வெச்சிருக்கீங்க.","s":"draft"},"d.client_push.section":{"en":"THE BRIEF","t":"ப்ரீஃப்","s":"draft"},"d.client_push.prompt":{"en":"The client says: \"Sir, don't complicate the sanitation. The maistry knows.\"","t":"கிளையண்ட் சொல்றாரு: \"சார், சானிட்டேஷனை சிக்கலாக்காதீங்க. மேஸ்திரிக்கு தெரியும்.\"","s":"draft"},"d.client_push.opt.agree":{"en":"Agree. Not worth the argument — I'll focus on the elevation","t":"சரின்னு சொல்லிடுவேன். வாதம் பண்ண மாட்டேன் — எலிவேஷன்ல கவனம் வெப்பேன்","s":"draft"},"d.client_push.opt.note":{"en":"Put a note on the drawing and move on","t":"டிராயிங்ல ஒரு நோட் போட்டுட்டு அடுத்ததுக்கு போவேன்","s":"draft"},"d.client_push.opt.explain":{"en":"Sit them down and explain who opens this tank in twenty years","t":"உட்கார வெச்சு, இருபது வருஷம் கழிச்சு இந்த டேங்க்கை யாரு திறப்பாங்கன்னு விளக்குவேன்","s":"draft"},"d.client_push.reveal.fact":{"en":"Architects are hired and judged on the visible house. Sanitation sits outside the fee conversation, so professional attention drains away from it exactly where it's most needed.","t":"ஆர்க்கிடெக்ட்கள வேலைக்கு வெக்கறதும் எடை போடறதும் கண்ணுக்குத் தெரியற வீட்டை வெச்சு தான். சானிட்டேஷன் ஃபீஸ் பேச்சுக்கு வெளியே இருக்கு. அதனால எங்க அதிகம் தேவையோ சரியா அங்கயே புரொஃபஷனல் கவனம் வடிஞ்சு போயிடுது.","s":"draft"},"d.client_push.reveal.cost":{"en":"Indicative: the conversation costs twenty minutes and some goodwill. Losing it costs nothing you'll ever be told about.","t":"தோராயமா: அந்த பேச்சுக்கு இருபது நிமிஷமும் கொஞ்சம் நல்லெண்ணமும் செலவு. அதை விட்டுட்டா ஆகுற செலவு, உங்க காதுக்கு எப்பவுமே வராது.","s":"draft"},"d.client_push.reveal.twist":{"en":"Clients almost never refuse the covers and the vent on cost. They refuse them because nobody framed them as being about a person. Framed that way, most say yes.","t":"கவரையும் வென்ட்டையும் கிளையண்ட் செலவுக்காக மறுக்கறதே கிடையாது. அது ஒரு மனுஷனைப் பத்தினதுன்னு யாரும் சொல்லாததால தான் மறுக்கறாங்க. அப்படி சொன்னா, பெரும்பாலானவங்க சரின்னு சொல்றாங்க.","s":"draft"},"d.client_push.reveal.lesson":{"en":"The professional's real product here isn't the drawing — it's the one conversation where the invisible worker is named out loud. Skip it and the expertise is simply unused.","t":"இங்க புரொஃபஷனலோட நிஜமான பொருள் டிராயிங் இல்ல — கண்ணுக்குத் தெரியாத அந்த தொழிலாளியை வாய் விட்டு பேரு சொல்லுற அந்த ஒரு பேச்சு தான். அதை தவிர்த்தா, அந்த நிபுணத்துவம் வெறுமனே பயன்படாம கிடக்குது.","s":"draft"},"d.client_push.analysis.agree":{"en":"You preserved the relationship and gave up the only leverage you had. The expertise is still in your head, which is precisely where it does no good.","t":"உறவை காப்பாத்தினீங்க, உங்ககிட்ட இருந்த ஒரே பலத்தை விட்டுக் கொடுத்தீங்க. நிபுணத்துவம் இன்னும் உங்க தலைக்குள்ளயே இருக்கு — அங்க இருந்தா அது ஒரு பயனும் இல்ல.","s":"draft"},"d.client_push.analysis.note":{"en":"A note is a real thing — it survives, it's evidence, it shifts liability. It also gets read by nobody on site. Half a step.","t":"நோட்டு ஒரு நிஜமான விஷயம் தான் — அது மிஞ்சும், அது ஆதாரம், பொறுப்பை மாத்தும். அதே நேரம் சைட்ல அதை யாரும் படிக்க மாட்டாங்க. அரை அடி.","s":"draft"},"d.client_push.analysis.explain":{"en":"You spent your credibility on the part of the project nobody was going to defend. This is what being the professional in the room actually costs.","t":"யாரும் ஆதரிக்கப் போறதில்லாத பகுதிக்காக உங்க நம்பகத்தன்மையை செலவு பண்ணீங்க. அறைல புரொஃபஷனலா இருக்கறது நிஜமா இவ்வளவு விலை தான்.","s":"draft"},"d.handover.section":{"en":"TO SITE","t":"சைட்டுக்கு","s":"draft"},"d.handover.prompt":{"en":"What does the maistry actually get from you?","t":"மேஸ்திரிக்கு உங்ககிட்ட இருந்து நிஜமா என்ன கிடைக்குது?","s":"draft"},"d.handover.opt.print":{"en":"An A3 print of the plan. He'll work the rest out","t":"பிளானோட ஒரு A3 பிரிண்ட். மீதியை அவரே பாத்துக்குவாரு","s":"draft"},"d.handover.opt.verbal":{"en":"The print, plus ten minutes on site explaining it","t":"பிரிண்ட், கூட சைட்ல பத்து நிமிஷம் விளக்கம்","s":"draft"},"d.handover.opt.marked":{"en":"Print, site walk, and I chalk the cover positions myself","t":"பிரிண்ட், சைட் சுத்தி பாக்குறது, கவர் எங்க வரணும்னு நானே சாக்பீஸ்ல போட்டு காட்டுறது","s":"draft"},"d.handover.reveal.fact":{"en":"The gap between a drawing and a built tank is a conversation that usually doesn't happen. The maistry builds from habit wherever the drawing is silent — and on the tank, the drawing is almost always silent.","t":"டிராயிங்குக்கும் கட்டின டேங்க்குக்கும் இடையே இருக்கற இடைவெளி, பொதுவா நடக்காத ஒரு பேச்சு. டிராயிங் எங்க மௌனமா இருக்கோ அங்க மேஸ்திரி பழக்கத்தை வெச்சு கட்டுவாரு — டேங்க் விஷயத்துல டிராயிங் கிட்டத்தட்ட எப்பவுமே மௌனம் தான்.","s":"draft"},"d.handover.reveal.cost":{"en":"Indicative: one site visit. Perhaps an hour.","t":"தோராயமா: ஒரு சைட் விசிட். ஒருவேளை ஒரு மணி நேரம்.","s":"draft"},"d.handover.reveal.twist":{"en":"Maistries very often know more about tanks than the drawing says, and less about why the details matter. The visit works in both directions — you'll learn the site constraint you drew through.","t":"டிராயிங் சொல்றதைவிட டேங்க்கைப் பத்தி மேஸ்திரிக்கு அதிகமா தெரியும், ஆனா அந்த டீடெயில் ஏன் முக்கியம்னு குறைவா தான் தெரியும். அந்த விசிட் ரெண்டு பக்கமும் வேலை செய்யும் — நீங்க வரைஞ்சு தாண்டிப் போன சைட் கட்டுப்பாடு உங்களுக்குத் தெரிய வரும்.","s":"draft"},"d.handover.reveal.lesson":{"en":"Design intent doesn't travel on paper alone in an oral building culture. If you didn't say it out loud, standing on the spot, you didn't specify it.","t":"வாய்மொழியா ஓடுற கட்டுமான கலாச்சாரத்துல, டிசைன் நோக்கம் பேப்பர்ல மட்டும் பயணிக்காது. அந்த இடத்துல நின்னு வாய் விட்டு சொல்லலன்னா, நீங்க அதை ஸ்பெசிஃபை பண்ணலை.","s":"draft"},"d.handover.analysis.print":{"en":"The drawing is now competing with thirty years of habit and losing. Whatever you detailed about the covers will be built the way the last tank was built.","t":"டிராயிங் இப்ப முப்பது வருஷ பழக்கத்தோட போட்டி போடுது, தோத்துட்டும் இருக்கு. கவரைப் பத்தி நீங்க என்ன டீடெயில் பண்ணியிருந்தாலும், கடைசியா கட்டின டேங்க் எப்படியோ அப்படி தான் கட்டப்படும்.","s":"draft"},"d.handover.analysis.verbal":{"en":"The ten minutes is the actual specification. This is where intent transfers in a building culture that runs on speech.","t":"அந்த பத்து நிமிஷம் தான் நிஜமான ஸ்பெசிஃபிகேஷன். பேச்சுல ஓடுற கட்டுமான கலாச்சாரத்துல நோக்கம் கடத்தப்படுறது இங்க தான்.","s":"draft"},"d.handover.analysis.marked":{"en":"Chalk on the ground outranks any drawing. You've put the cover positions into the one medium the person casting the slab is actually looking at.","t":"தரைல போட்ட சாக்பீஸ் கோடு எந்த டிராயிங்கையும் மிஞ்சிடும். ஸ்லாப் வார்க்கறவர் நிஜமா எதை பாத்துட்டு இருக்காரோ, அந்த ஒரே ஊடகத்துல கவர் இடங்களை போட்டு வெச்சிருக்கீங்க.","s":"draft"},"d.sizing.section":{"en":"THE NUMBERS","t":"கணக்கு","s":"draft"},"d.sizing.prompt":{"en":"How do you size the tank?","t":"டேங்க் அளவை எப்படி முடிவு பண்றீங்க?","s":"draft"},"d.sizing.opt.thumb":{"en":"Thumb rule. 8×4×5 feet does it for a family","t":"தம்ப் ரூல். ஒரு குடும்பத்துக்கு 8×4×5 அடி போதும்","s":"draft"},"d.sizing.opt.oversize":{"en":"Build it big. Bigger tank, fewer trips","t":"பெரிசா கட்டுங்க. டேங்க் பெரிசா இருந்தா லாரி வர்ற தடவை குறையும்","s":"draft"},"d.sizing.opt.std":{"en":"IS 2470 — persons × litres × desludging interval","t":"IS 2470 — ஆள் × லிட்டர் × காலி பண்ற இடைவெளி","s":"draft"},"d.sizing.reveal.fact":{"en":"IS 2470 sizes a tank from occupancy, flow and a chosen desludging interval — typically two to three years. The thumb rule sizes it from what fits the corner of the plot.","t":"IS 2470, டேங்க் அளவை எத்தனை பேர், எவ்வளவு தண்ணி, எவ்வளவு இடைவெளில காலி பண்ணுவோம்ங்கிறதை வெச்சு கணக்கு போடுது — பொதுவா ரெண்டு மூணு வருஷம். தம்ப் ரூல், மனையோட மூலைல எது அடங்குதோ அதை வெச்சு அளவு போடுது.","s":"draft"},"d.sizing.reveal.cost":{"en":"Indicative: nil. Correct sizing is arithmetic, not money.","t":"தோராயமா: ஒண்ணும் இல்ல. சரியான அளவுங்கறது கணக்கு, காசு இல்ல.","s":"draft"},"d.sizing.reveal.twist":{"en":"Oversizing can make things worse. A very deep tank is no easier to empty and much harder to get out of, and the sludge at the bottom of a 7-foot tank is beyond the reach of any hose held from above.","t":"பெரிசா கட்டறது விஷயத்தை மோசமாக்கலாம். ரொம்ப ஆழமான டேங்க்கை காலி பண்றது சுலபம் இல்ல, உள்ள இருந்து வெளிய வர்றது இன்னும் கஷ்டம். 7 அடி டேங்க்கோட அடில இருக்கற ஸ்லட்ஜ், மேல இருந்து பிடிக்கற எந்த ஹோஸ்ஸுக்கும் எட்டாது.","s":"draft"},"d.sizing.reveal.lesson":{"en":"Capacity is the parameter engineers reach for because it's the one with a formula. Depth and opening size decide the worker's day, and neither appears in the capacity calculation.","t":"ஃபார்முலா இருக்கறது அதுக்கு தான்ங்கறதால, இஞ்சினியர்கள் கொள்ளளவை தான் பிடிச்சுக்கறாங்க. ஆனா தொழிலாளியோட நாளை முடிவு பண்றது ஆழமும் திறப்பு அளவும் தான் — கொள்ளளவு கணக்குல அந்த ரெண்டுமே வராது.","s":"draft"},"d.sizing.analysis.thumb":{"en":"It'll broadly work — thumb rules encode real experience. It just carries no reasoning anyone can check, adjust, or inherit.","t":"பொதுவா வேலை செய்யும் — தம்ப் ரூல்ல நிஜமான அனுபவம் இருக்கு. ஆனா அதுல யாரும் செக் பண்ண, மாத்த, அல்லது எடுத்துட்டு போக கூடிய காரணம் எதுவும் இல்ல.","s":"draft"},"d.sizing.analysis.oversize":{"en":"Generous on capacity and quietly hostile on depth. Ask yourself whether a hose can reach the bottom; if not, you've designed in an entry.","t":"கொள்ளளவுல தாராளம், ஆழத்துல அமைதியான விரோதம். அடி வரைக்கும் ஹோஸ் எட்டுமான்னு உங்களையே கேளுங்க; எட்டலன்னா, ஒருத்தர் உள்ள இறங்குறதை நீங்களே டிசைன் பண்ணியிருக்கீங்க.","s":"draft"},"d.sizing.analysis.std":{"en":"You used the standard that exists and is almost never invoked. Now hold the desludging interval you assumed — it's the number that justifies everything else.","t":"இருக்கற, ஆனா யாரும் பயன்படுத்தாத தரநிலையை பயன்படுத்தினீங்க. இப்ப நீங்க எடுத்துக்கிட்ட காலி பண்ற இடைவெளியை பிடிச்சு வெச்சுக்குங்க — மத்த எல்லாத்தையும் நியாயப்படுத்துற நம்பர் அது தான்.","s":"draft"},"d.site_visit.section":{"en":"DURING","t":"வேலை நடக்கும்போது","s":"draft"},"d.site_visit.prompt":{"en":"The tank gets cast on a Tuesday. You're on three other sites.","t":"செவ்வாய்க்கிழமை டேங்க் வார்க்கப்படுது. நீங்க வேற மூணு சைட்ல இருக்கீங்க.","s":"draft"},"d.site_visit.opt.photos":{"en":"Ask for photos on WhatsApp","t":"WhatsApp-ல ஃபோட்டோ அனுப்பச் சொல்லுங்க","s":"draft"},"d.site_visit.opt.after":{"en":"Go after work, once the slab is on","t":"வேலை முடிஞ்சு, ஸ்லாப் போட்டதுக்கு அப்புறம் போங்க","s":"draft"},"d.site_visit.opt.during":{"en":"Be there before they cast. That's the only hour it can be fixed","t":"வார்க்குறதுக்கு முன்னாடி அங்க இருங்க. சரி பண்ண முடியுற ஒரே மணி நேரம் அது தான்","s":"draft"},"d.site_visit.reveal.fact":{"en":"A septic tank is correctable for about one hour — between the shuttering going up and the concrete going in. After that, changing the cover size means demolition.","t":"செப்டிக் டேங்க்கை சரி பண்ண முடியுறது சுமார் ஒரு மணி நேரம் தான் — ஷட்டரிங் போட்டதுக்கும் கான்கிரீட் ஊத்துறதுக்கும் இடையே. அதுக்கு அப்புறம் கவர் அளவை மாத்தணும்னா, இடிக்கணும்.","s":"draft"},"d.site_visit.reveal.cost":{"en":"Indicative: one site visit, timed right.","t":"தோராயமா: ஒரு சைட் விசிட், சரியான நேரத்துல.","s":"draft"},"d.site_visit.reveal.twist":{"en":"Photos arrive after the pour, essentially always. The request for photos is genuinely well-intentioned and structurally guaranteed to be too late.","t":"ஃபோட்டோ வர்றது கான்கிரீட் ஊத்தினதுக்கு அப்புறம் தான் — கிட்டத்தட்ட எப்பவுமே. ஃபோட்டோ கேக்கறது நல்ல எண்ணத்துல தான், ஆனா அமைப்பு ரீதியா அது தாமதமா தான் வரும்னு உறுதி.","s":"draft"},"d.site_visit.reveal.lesson":{"en":"Supervision has a window, and for underground work that window is measured in hours. Inspection outside the window is documentation, not control.","t":"மேற்பார்வைக்கு ஒரு நேர இடைவெளி இருக்கு; மண்ணுக்கு கீழ வேலைக்கு அந்த இடைவெளி மணிக்கணக்குல தான் அளக்கப்படுது. அந்த இடைவெளிக்கு வெளியே பாக்கறது ஆவணப்படுத்தல், கட்டுப்பாடு இல்ல.","s":"draft"},"d.site_visit.analysis.photos":{"en":"You'll receive a clear photograph of an irreversible decision. It's a record, not a check.","t":"திருப்ப முடியாத ஒரு முடிவோட தெளிவான ஃபோட்டோ உங்களுக்கு கிடைக்கும். அது ஒரு ரெக்கார்ட், செக் இல்ல.","s":"draft"},"d.site_visit.analysis.after":{"en":"You'll see what was built and be able to raise it. Whether anything changes depends on whether the client will pay to break a slab. They won't.","t":"என்ன கட்டியிருக்காங்கன்னு பாப்பீங்க, அதை எழுப்பவும் முடியும். ஏதாவது மாறுமான்னு, ஸ்லாப்பை உடைக்க கிளையண்ட் காசு கொடுப்பாரான்னு பொறுத்தது. கொடுக்க மாட்டாரு.","s":"draft"},"d.site_visit.analysis.during":{"en":"The only option that can change the outcome. Everything else on this list is you finding out.","t":"முடிவை மாத்தக் கூடிய ஒரே வழி. இந்த லிஸ்ட்ல இருக்கற மத்ததெல்லாம், நீங்க தெரிஞ்சுக்கறது மட்டும் தான்.","s":"draft"},"d.truck_access.section":{"en":"THE SITE","t":"சைட்","s":"draft"},"d.truck_access.prompt":{"en":"Have you checked a desludging truck can actually get here?","t":"காலி பண்ற லாரி நிஜமா இங்க வர முடியுமான்னு செக் பண்ணீங்களா?","s":"draft"},"d.truck_access.opt.assume":{"en":"The road's 20 feet wide. It'll manage","t":"ரோடு 20 அடி அகலம். சமாளிச்சுடும்","s":"draft"},"d.truck_access.opt.measure":{"en":"Measure the turning radius and the gate width","t":"டர்னிங் ரேடியஸையும் கேட் அகலத்தையும் அளக்கணும்","s":"draft"},"d.truck_access.opt.hose":{"en":"Measure it, and keep the tank within 30 m of where the truck can stand","t":"அளக்கணும் — லாரி நிக்கற இடத்துல இருந்து 30 m-க்குள்ளயே டேங்க்கை வெக்கணும்","s":"draft"},"d.truck_access.reveal.fact":{"en":"A desludging truck needs roughly 3 m of width, space to turn, and its suction hose reaches about 30 m at best — less with bends and any lift.","t":"காலி பண்ற லாரிக்கு சுமார் 3 m அகலம் வேணும், திரும்ப இடம் வேணும், அதோட சக்ஷன் ஹோஸ் அதிகபட்சம் சுமார் 30 m தான் எட்டும் — வளைவும் ஏத்தமும் இருந்தா அதுக்கும் குறைவு.","s":"draft"},"d.truck_access.reveal.cost":{"en":"Indicative: nil at design stage. Impossible to fix afterwards.","t":"தோராயமா: டிசைன் நேரத்துல ஒண்ணும் இல்ல. அப்புறம் சரி பண்ணவே முடியாது.","s":"draft"},"d.truck_access.reveal.twist":{"en":"The access that exists during construction is not the access that will exist later. The road gets narrowed by parking, the gate gets a pillar, the neighbour builds. Design for worse than today.","t":"கட்டுமான நேரத்துல இருக்கற ஆக்சஸ், அப்புறம் இருக்கப் போற ஆக்சஸ் இல்ல. வண்டி நிறுத்துறதால ரோடு குறுகும், கேட்டுக்கு ஒரு தூண் வரும், பக்கத்து வீட்டுக்காரர் கட்டுவாரு. இன்னிக்கு இருக்கறதைவிட மோசமா இருக்கும்னு வெச்சு டிசைன் பண்ணுங்க.","s":"draft"},"d.truck_access.reveal.lesson":{"en":"Truck access is a design input that appears on no checklist and in no drawing. When it fails, the fallback is not a smaller truck — it's a person with a bucket.","t":"லாரி ஆக்சஸ்ங்கறது, எந்த செக்லிஸ்ட்லயும் எந்த டிராயிங்கிலயும் வராத ஒரு டிசைன் இன்புட். அது தோத்துப் போனா, மாற்று வழி சின்ன லாரி இல்ல — வாளியோட ஒரு மனுஷன் தான்.","s":"draft"},"d.truck_access.analysis.assume":{"en":"Twenty feet today. Ask what it is after both neighbours park. The gap between 'it'll manage' and 'it didn't' is where manual emptying lives.","t":"இன்னிக்கு இருபது அடி. ரெண்டு பக்கத்து வீட்டுக்காரங்களும் வண்டி நிறுத்தினதுக்கு அப்புறம் எவ்வளவுன்னு கேளுங்க. 'சமாளிச்சுடும்'ங்கறதுக்கும் 'சமாளிக்கல'ங்கறதுக்கும் இடைல இருக்கற இடைவெளில தான் கையால காலி பண்றது இருக்கு.","s":"draft"},"d.truck_access.analysis.measure":{"en":"You turned an assumption into a number. That number can now be checked by somebody else, which is the whole point.","t":"ஒரு ஊகத்தை ஒரு நம்பரா மாத்தியிருக்கீங்க. அந்த நம்பரை இப்ப வேற ஒருத்தர் செக் பண்ண முடியும் — அது தான் முக்கியமே.","s":"draft"},"d.truck_access.analysis.hose":{"en":"You designed to the hose, not to the truck. That's the constraint that actually binds, and almost nobody thinks about it.","t":"லாரியை வெச்சு இல்ல, ஹோஸை வெச்சு டிசைன் பண்ணீங்க. நிஜமா கட்டுப்படுத்துறது அது தான் — அதைப் பத்தி யாருமே யோசிக்கறதில்ல.","s":"draft"},"d.quote_line.section":{"en":"THE QUOTE","t":"எஸ்டிமேட்","s":"draft"},"d.quote_line.prompt":{"en":"How does the septic tank appear in your quote?","t":"உங்க எஸ்டிமேட்ல செப்டிக் டேங்க் எப்படி வரும்?","s":"draft"},"d.quote_line.opt.lumpsum":{"en":"\"Sanitation works — lump sum.\" One line","t":"\"சானிட்டேஷன் வொர்க்ஸ் — லம்ப் சம்.\" ஒரே லைன்","s":"draft"},"d.quote_line.opt.optional":{"en":"Base price without covers and vent. Those go in as extras","t":"கவர், வென்ட் இல்லாம பேஸ் விலை. அது ரெண்டும் எக்ஸ்ட்ராவா வரும்","s":"draft"},"d.quote_line.opt.itemised":{"en":"Itemised: tank, covers, vent, soak pit — each priced separately","t":"ஐட்டம் வாரியா: டேங்க், கவர், வென்ட், சோக் பிட் — ஒவ்வொண்ணுக்கும் தனி விலை","s":"draft"},"d.quote_line.reveal.fact":{"en":"A lump-sum line lets the contractor choose the cheapest interpretation, legitimately. The client compared your number to another number; neither of them described the same tank.","t":"லம்ப் சம் லைன், மலிவான அர்த்தத்தை எடுத்துக்க கான்ட்ராக்டருக்கு முறையான வழி கொடுக்குது. கிளையண்ட் உங்க நம்பரை இன்னொரு நம்பரோட ஒப்பிட்டாரு; அந்த ரெண்டு நம்பரும் ஒரே டேங்க்கைப் பத்தி சொல்லல.","s":"draft"},"d.quote_line.reveal.cost":{"en":"Indicative: the covers and vent together are ₹6,000–11,000 — under 1% of a typical build, invisible inside a lump sum.","t":"தோராயமா: கவரும் வென்ட்டும் சேர்ந்து ₹6,000–11,000 — சாதாரண கட்டுமானத்துல 1%-க்கும் குறைவு, லம்ப் சம்முக்குள்ள கண்ணுக்கே தெரியாது.","s":"draft"},"d.quote_line.reveal.twist":{"en":"Itemising can lose you the job, because a competitor's lump sum will look cheaper than your honest total. The market actively penalises the transparent quote.","t":"ஐட்டம் வாரியா போட்டா வேலையே போயிடலாம் — ஏன்னா போட்டியாளரோட லம்ப் சம், உங்க நேர்மையான மொத்தத்தைவிட மலிவா தெரியும். வெளிப்படையான எஸ்டிமேட்டை மார்க்கெட் தண்டிக்குது.","s":"draft"},"d.quote_line.reveal.lesson":{"en":"Competitive quoting drives out exactly the items nobody can see. Unless the safety components are named lines, the bidding process deletes them on everyone's behalf.","t":"போட்டி எஸ்டிமேட், யாருக்கும் தெரியாத ஐட்டங்களை சரியா அதையே வெளியே தள்ளுது. பாதுகாப்பு பொருட்கள் பேரு போட்ட லைன்களா இல்லாட்டி, டெண்டர் நடைமுறை எல்லார் சார்பாவும் அதை நீக்கிடும்.","s":"draft"},"d.quote_line.analysis.lumpsum":{"en":"Standard practice, and it hands you the discretion to build the cheapest compliant tank. You will use it, because your margin is in there.","t":"வழக்கமான நடைமுறை — மலிவான, விதிக்கு ஒத்துப்போற டேங்க்கை கட்டுற சுதந்திரத்தை அது உங்களுக்கு கொடுக்குது. நீங்க அதை பயன்படுத்துவீங்க, ஏன்னா உங்க மார்ஜின் அதுக்குள்ள தான் இருக்கு.","s":"draft"},"d.quote_line.analysis.optional":{"en":"The worst of both. You've named the covers and the vent, which makes them a visible cost the client can now consciously decline. Most will.","t":"ரெண்டுலயும் மோசமானது. கவரையும் வென்ட்டையும் பேரு போட்டு சொல்லிட்டீங்க — அதனால அது கண்ணுக்குத் தெரியற ஒரு செலவா ஆகுது, கிளையண்ட் தெரிஞ்சே வேண்டாம்னு சொல்லலாம். பெரும்பாலானவங்க சொல்லுவாங்க.","s":"draft"},"d.quote_line.analysis.itemised":{"en":"You made the invisible items visible and quotable. It may cost you this job. It's also the only version where the client is genuinely choosing.","t":"கண்ணுக்குத் தெரியாத ஐட்டங்களை தெரியறதா, விலை போடக் கூடியதா ஆக்கியிருக்கீங்க. இந்த வேலை போயிடலாம். அதே நேரம், கிளையண்ட் நிஜமாவே தேர்ந்தெடுக்கற ஒரே வடிவம் இது தான்.","s":"draft"},"d.labour_in_pit.section":{"en":"ON SITE","t":"சைட்ல","s":"draft"},"d.labour_in_pit.prompt":{"en":"Someone has to go down and plaster the inside. Today.","t":"யாராவது உள்ள இறங்கி உள்பக்கம் பூசணும். இன்னிக்கே.","s":"draft"},"d.labour_in_pit.opt.whoever":{"en":"Whoever's free. It's ten minutes","t":"யாரு ஃப்ரீயா இருக்காங்களோ அவங்க. பத்து நிமிஷ வேலை தான்","s":"draft"},"d.labour_in_pit.opt.rope":{"en":"Our regular man, with a rope tied around him","t":"நம்ம வழக்கமான ஆளு, இடுப்புல கயிறு கட்டி","s":"draft"},"d.labour_in_pit.opt.kit":{"en":"Nobody goes down until it's aired out, and he has boots, gloves and a harness","t":"காத்து முழுசா போகற வரைக்கும் யாரும் இறங்கக் கூடாது; பூட்ஸ், கிளவுஸ், ஹார்னெஸ் இருக்கணும்","s":"draft"},"d.labour_in_pit.reveal.fact":{"en":"The first person to enter the tank isn't the desludger in twenty years — it's a construction worker, this week, plastering it. A new tank is clean, so it feels like it isn't a confined space.","t":"டேங்க் உள்ள முதல்ல இறங்குறவர், இருபது வருஷம் கழிச்சு வர்ற காலி பண்ற ஆளு இல்ல — இந்த வாரம், பூச வர்ற கட்டுமான தொழிலாளி தான். புது டேங்க் சுத்தமா இருக்கும், அதனால அது அடைபட்ட இடமே இல்ல மாதிரி தோணுது.","s":"draft"},"d.labour_in_pit.reveal.cost":{"en":"Indicative: a blower and basic PPE is a few thousand rupees, reusable across every job you'll ever run.","t":"தோராயமா: ஒரு ப்ளோவரும் அடிப்படை PPE-யும் சில ஆயிரம் ரூபாய். நீங்க பண்ற ஒவ்வொரு வேலைலயும் திரும்ப திரும்ப பயன்படுத்தலாம்.","s":"draft"},"d.labour_in_pit.reveal.twist":{"en":"A rope around the waist is worse than nothing in a real emergency. An unconscious adult cannot be pulled vertically out of a narrow opening by one person — and the rescuer is usually the second casualty.","t":"நிஜமான அவசர நேரத்துல, இடுப்புல கட்டின கயிறு இல்லாததைவிட மோசம். மயங்கி கிடக்கற ஒரு பெரியவரை, குறுகின திறப்பு வழியா ஒரே ஆளால செங்குத்தா இழுத்து எடுக்க முடியாது — காப்பாத்த போறவர் தான் பொதுவா ரெண்டாவது பலி.","s":"draft"},"d.labour_in_pit.reveal.lesson":{"en":"The habits set during construction become the habits of maintenance. If a person goes in casually while the tank is clean, a person will go in when it isn't.","t":"கட்டுமான நேரத்துல உண்டாகற பழக்கம் தான் அப்புறம் மெயிண்டனன்ஸ் பழக்கமா ஆகுது. டேங்க் சுத்தமா இருக்கும்போது ஒருத்தர் சாதாரணமா உள்ள இறங்கினா, சுத்தமா இல்லாதப்பவும் ஒருத்தர் இறங்குவாரு.","s":"draft"},"d.labour_in_pit.analysis.whoever":{"en":"It is ten minutes, and it's almost always fine. 'Almost always fine' is exactly the shape of the risk — the practice is normalised long before the day it isn't.","t":"பத்து நிமிஷம் தான், கிட்டத்தட்ட எப்பவும் ஒண்ணும் ஆகாது. 'கிட்டத்தட்ட எப்பவும் ஒண்ணும் ஆகாது'ங்கறது தான் அந்த ரிஸ்கோட சரியான வடிவம் — ஏதாவது ஆகுற நாளுக்கு ரொம்ப முன்னாடியே அந்த பழக்கம் சகஜமாயிடுது.","s":"draft"},"d.labour_in_pit.analysis.rope":{"en":"The instinct is right and the mechanism doesn't work. Plan how you'd get him out unconscious; if the answer involves pulling, it isn't a plan.","t":"உள்ளுணர்வு சரி, ஆனா அந்த ஏற்பாடு வேலை செய்யாது. அவரு மயங்கி விழுந்தா எப்படி வெளிய எடுப்பீங்கன்னு திட்டம் போடுங்க; பதில்ல 'இழுப்போம்'ன்னு வந்தா, அது திட்டமே இல்ல.","s":"draft"},"d.labour_in_pit.analysis.kit":{"en":"You treated a clean new tank as a confined space, which is the only correct reading of it. This is also the moment your crew learns that's the rule.","t":"சுத்தமான புது டேங்க்கையும் அடைபட்ட இடமாவே பாத்தீங்க — அது தான் ஒரே சரியான பார்வை. அது தான் விதின்னு உங்க ஆளுங்க கத்துக்கற தருணமும் இது தான்.","s":"draft"},"d.slab_call.section":{"en":"THE TOP","t":"மேல் பகுதி","s":"draft"},"d.slab_call.prompt":{"en":"The drawing says nothing about the top. You're casting tomorrow.","t":"மேல் பகுதியைப் பத்தி டிராயிங்ல ஒண்ணுமே இல்ல. நாளைக்கு வார்க்கப் போறீங்க.","s":"draft"},"d.slab_call.opt.flush":{"en":"Flush slab. That's how we've always done it","t":"ஃபிளஷ் ஸ்லாப். எப்பவும் அப்படி தான் பண்ணியிருக்கோம்","s":"draft"},"d.slab_call.opt.ask":{"en":"Call the engineer and ask","t":"இஞ்சினியரை கூப்பிட்டு கேக்கலாம்","s":"draft"},"d.slab_call.opt.covers":{"en":"Leave two covers. Costs me half a bag of cement, saves somebody's day later","t":"ரெண்டு கவர் விட்டுடுவேன். எனக்கு அரை மூட்டை சிமெண்ட் தான் செலவு, அப்புறம் யாரோ ஒருத்தரோட நாளை காப்பாத்தும்","s":"draft"},"d.slab_call.reveal.fact":{"en":"Where the drawing is silent, the maistry decides — and this is the single highest-leverage uninstructed decision on the whole site. Nobody will review it, and it is permanent the moment the concrete sets.","t":"டிராயிங் மௌனமா இருக்கற இடத்துல மேஸ்திரி தான் முடிவு பண்றாரு — சைட் முழுக்க, யாரும் சொல்லாம எடுக்கப்படுற முடிவுகள்ல மிக அதிக தாக்கம் உள்ளது இது தான். யாரும் இதை மறுபரிசீலனை பண்ண மாட்டாங்க, கான்கிரீட் இறுகின நொடிலயே அது நிரந்தரம்.","s":"draft"},"d.slab_call.reveal.cost":{"en":"Indicative: two cover frames are ₹4,000–8,000 and one extra hour of shuttering.","t":"தோராயமா: ரெண்டு கவர் ஃபிரேம் ₹4,000–8,000, கூட ஒரு மணி நேரம் அதிக ஷட்டரிங்.","s":"draft"},"d.slab_call.reveal.twist":{"en":"Maistries who leave covers often get asked to remove them, because the owner thinks they look unfinished. The safety feature reads as incomplete work.","t":"கவர் விட்டு வெக்கற மேஸ்திரிகிட்ட, அதை எடுத்துடுங்கன்னு அடிக்கடி சொல்றாங்க — ஓனருக்கு அது வேலை முடியாத மாதிரி தெரியுது. பாதுகாப்பு அம்சம், முடிக்காத வேலையா படிக்கப்படுது.","s":"draft"},"d.slab_call.reveal.lesson":{"en":"The person with the least formal authority makes the decision with the most consequence, under time pressure, with no instruction and no one to ask. That is the system, not an accident.","t":"அதிகாரபூர்வமா மிக குறைஞ்ச அதிகாரம் இருக்கறவர் தான், மிக அதிக விளைவுள்ள முடிவை எடுக்கறாரு — நேர நெருக்கடில, எந்த அறிவுறுத்தலும் இல்லாம, கேக்க ஒரு ஆளும் இல்லாம. இது விபத்து இல்ல, இது தான் அந்த அமைப்பு.","s":"draft"},"d.slab_call.analysis.flush":{"en":"Habit, and habit is usually good engineering compressed into muscle memory. Not here — this habit formed when tanks were shallower and nobody costed the person opening them.","t":"பழக்கம். பொதுவா பழக்கம்ங்கறது, நல்ல இஞ்சினியரிங் சுருங்கி கைப்பழக்கமா ஆனது தான். இங்க இல்ல — டேங்க் ஆழம் குறைவா இருந்த காலத்துல, அதை திறக்கறவரை யாரும் கணக்குல வெக்காத காலத்துல உண்டான பழக்கம் இது.","s":"draft"},"d.slab_call.analysis.ask":{"en":"You escalated an uninstructed decision to the person who should have instructed it. Whether they pick up is the test of whether the chain works at all.","t":"யாரும் சொல்லாத ஒரு முடிவை, சொல்லியிருக்க வேண்டியவர்கிட்டயே கொண்டு போனீங்க. அவரு எடுத்து பேசுறாரா இல்லையாங்கறது தான், இந்த சங்கிலி வேலை செய்யுதா இல்லையாங்கறதுக்கான சோதனை.","s":"draft"},"d.slab_call.analysis.covers":{"en":"You spent your own margin on somebody you'll never meet. If the owner asks you to plaster over them, this is the argument worth having.","t":"நீங்க எப்பவும் சந்திக்கப் போறதில்லாத ஒருத்தருக்காக உங்க சொந்த மார்ஜினை செலவு பண்ணீங்க. அதை பூசி மூடுங்கன்னு ஓனர் சொன்னா, வாதம் பண்ணி பாக்க வேண்டிய இடம் இது தான்.","s":"draft"},"d.depth.section":{"en":"THE DIG","t":"குழி","s":"draft"},"d.depth.prompt":{"en":"How deep do you dig?","t":"எவ்வளவு ஆழம் தோண்டுறீங்க?","s":"draft"},"d.depth.opt.deep":{"en":"As deep as the soil allows. More capacity, fewer complaints","t":"மண் அனுமதிக்கற வரைக்கும் ஆழமா. கொள்ளளவு அதிகம், புகார் குறைவு","s":"draft"},"d.depth.opt.standard":{"en":"Standard depth. Deeper than this and a man can't work in it","t":"வழக்கமான ஆழம். இதைவிட ஆழம்னா உள்ள ஒரு ஆளால வேலை பண்ண முடியாது","s":"draft"},"d.depth.opt.shallow":{"en":"Shallow and wide. Harder to dig, easier to reach into","t":"ஆழம் குறைவா, அகலமா. தோண்டறது கஷ்டம், உள்ள கை எட்டறது சுலபம்","s":"draft"},"d.depth.reveal.fact":{"en":"Depth is chosen for capacity in a tight plot. But suction hoses lose lift with depth, and beyond roughly 2 m the sludge at the bottom stops coming up reliably.","t":"இடம் குறைஞ்ச மனைல கொள்ளளவுக்காக ஆழத்தை தேர்ந்தெடுக்கறாங்க. ஆனா ஆழம் கூடக் கூட சக்ஷன் ஹோஸோட இழுக்கும் சக்தி குறையுது. சுமார் 2 m தாண்டினா, அடில இருக்கற ஸ்லட்ஜ் சரியா மேல வர்றது நின்னுடும்.","s":"draft"},"d.depth.reveal.cost":{"en":"Indicative: shallow-and-wide costs more to excavate and takes more plot area. It is the trade almost nobody makes.","t":"தோராயமா: ஆழம் குறைச்சு அகலமா பண்றதுக்கு தோண்டுற செலவு அதிகம், மனைல இடமும் அதிகம் போகும். இந்த மாற்றை யாருமே பண்றதில்ல.","s":"draft"},"d.depth.reveal.twist":{"en":"Depth is invisible after backfilling. The desludger arriving in 2048 has no way to know how deep this tank is until the hose comes up empty — and then the decision to climb in gets made in thirty seconds.","t":"மண்ணை மூடினதுக்கு அப்புறம் ஆழம் கண்ணுக்குத் தெரியாது. 2048-ல வர்ற காலி பண்ற ஆளுக்கு, ஹோஸ் வெறுமனே மேல வர்ற வரைக்கும் இந்த டேங்க் எவ்வளவு ஆழம்னு தெரிய வழியே இல்ல — அப்புறம், உள்ள இறங்கலாமான்னு முடிவு முப்பது நொடில எடுக்கப்படுது.","s":"draft"},"d.depth.reveal.lesson":{"en":"Every metre of depth converts a hose job into a body job. Capacity is a number on paper; depth is a number in somebody's lungs.","t":"ஒவ்வொரு மீட்டர் ஆழமும், ஹோஸ் வேலையை உடம்பு வேலையா மாத்துது. கொள்ளளவு பேப்பர்ல இருக்கற ஒரு நம்பர்; ஆழம் யாரோ ஒருத்தரோட நுரையீரல்ல இருக்கற நம்பர்.","s":"draft"},"d.depth.analysis.deep":{"en":"Maximum capacity for the footprint, and you've put the sludge below the reach of suction. This is the geometry that most often ends in an entry.","t":"இருக்கற இடத்துக்கு அதிகபட்ச கொள்ளளவு — அதே நேரம் ஸ்லட்ஜை சக்ஷன் எட்டாத ஆழத்துல வெச்சிருக்கீங்க. ஒருத்தர் உள்ள இறங்கறதுல முடியுறது பெரும்பாலும் இந்த வடிவம் தான்.","s":"draft"},"d.depth.analysis.standard":{"en":"A sound compromise, and notice your own reasoning — you already sized it around a man being in there. Worth asking why he's in there at all.","t":"நல்ல சமரசம். ஆனா உங்க சொந்த காரணத்தை கவனிங்க — உள்ள ஒரு ஆளு இருப்பாருங்கற அடிப்படைலயே நீங்க அளவு போட்டிருக்கீங்க. அவரு ஏன் உள்ள இருக்கணும்னு கேட்டுப் பாக்க வேண்டியது.","s":"draft"},"d.depth.analysis.shallow":{"en":"More digging, more plot, and a tank a hose can actually clear. You optimised for the job nobody pays you to think about.","t":"அதிகம் தோண்டணும், அதிக இடம் போகும் — ஆனா ஹோஸ் நிஜமா காலி பண்ணக் கூடிய டேங்க். யோசிக்கறதுக்கு யாரும் உங்களுக்கு காசு கொடுக்காத வேலைக்காக டிசைன் பண்ணியிருக்கீங்க.","s":"draft"},"d.speak_up.section":{"en":"THE ROOM","t":"அந்த இடம்","s":"draft"},"d.speak_up.prompt":{"en":"You know the flush slab is wrong. The owner is standing right there.","t":"ஃபிளஷ் ஸ்லாப் தப்புன்னு உங்களுக்கு தெரியும். ஓனர் அங்கயே நிக்கிறாரு.","s":"draft"},"d.speak_up.opt.quiet":{"en":"Say nothing. He's paying, and he wants it clean","t":"ஒண்ணும் சொல்ல வேண்டாம். காசு கொடுக்கறது அவரு, அவருக்கு நீட்டா வேணும்","s":"draft"},"d.speak_up.opt.mention":{"en":"Mention it once. If he says no, it's on him","t":"ஒரு தடவை சொல்லிடுவேன். அவரு வேண்டாம்னா, அது அவர் பொறுப்பு","s":"draft"},"d.speak_up.opt.insist":{"en":"Tell him plainly: in ten years somebody breaks this open with a hammer","t":"நேரா சொல்லிடுவேன்: பத்து வருஷத்துல யாரோ ஒருத்தர் இதை சுத்தி வெச்சு உடைப்பாரு","s":"draft"},"d.speak_up.reveal.fact":{"en":"Site knowledge is real and almost entirely unspoken. The people who best understand what a buried tank does are furthest down the hierarchy that decides what gets built.","t":"சைட்ல இருக்கற அறிவு நிஜமானது, ஆனா கிட்டத்தட்ட முழுக்க பேசப்படாதது. புதைச்ச டேங்க் என்ன பண்ணும்னு மிக நல்லா புரிஞ்சவங்க தான், என்ன கட்டறதுன்னு முடிவு பண்ற படிநிலைல எல்லாருக்கும் கீழ இருக்காங்க.","s":"draft"},"d.speak_up.reveal.cost":{"en":"Indicative: nothing, except the risk of being seen as difficult by the person who pays you and refers you.","t":"தோராயமா: ஒண்ணும் இல்ல — உங்களுக்கு காசு கொடுக்கற, உங்கள மத்தவங்களுக்கு சொல்ற ஆளு, உங்கள 'தொந்தரவு பண்றவரு'ன்னு நினைக்கற ரிஸ்க் தவிர.","s":"draft"},"d.speak_up.reveal.twist":{"en":"When maistries do speak up, owners frequently agree — the objection was never really about money. But the maistry rarely finds out, because he only raises it once and reads the pause as a no.","t":"மேஸ்திரி வாய் திறந்து சொன்னா, ஓனர்கள் அடிக்கடி ஒத்துக்கறாங்க — அந்த மறுப்பு எப்பவுமே காசைப் பத்தினது இல்ல. ஆனா மேஸ்திரிக்கு அது தெரிய வர்றதே இல்ல, ஏன்னா அவரு ஒரே ஒரு தடவை தான் சொல்வாரு, அந்த மௌனத்தை 'வேண்டாம்'னு புரிஞ்சுப்பாரு.","s":"draft"},"d.speak_up.reveal.lesson":{"en":"The information needed to build this tank well is already on the site. What's missing is a channel where it can be said without professional cost to the person saying it.","t":"இந்த டேங்க்கை நல்லா கட்டறதுக்கு தேவையான தகவல் ஏற்கனவே சைட்லயே இருக்கு. இல்லாதது, அதை சொல்றவருக்கு தொழில்ரீதியா விலை இல்லாம சொல்ல முடியுற ஒரு வழி தான்.","s":"draft"},"d.speak_up.analysis.quiet":{"en":"Rational. You're protecting a livelihood built on referrals, and being the difficult maistry is expensive. The knowledge stays with you and dies there.","t":"நியாயம் தான். வாய்வழி பரிந்துரைல ஓடுற பிழைப்பை காப்பாத்தறீங்க, 'தொந்தரவு பண்ற மேஸ்திரி'ன்னு பேரு வாங்கறது விலை அதிகம். அந்த அறிவு உங்ககிட்டயே தங்கி, அங்கயே செத்துப் போகுது.","s":"draft"},"d.speak_up.analysis.mention":{"en":"You transferred the decision, and with it the responsibility. That's fair — and 'mentioned once, quietly' is a low bar for a permanent outcome.","t":"முடிவை மாத்திட்டீங்க, அதோட பொறுப்பையும். அது நியாயம் தான் — ஆனா நிரந்தரமான ஒரு விளைவுக்கு, 'ஒரு தடவை, மெதுவா சொன்னேன்'ங்கறது ரொம்ப குறைஞ்ச அளவு.","s":"draft"},"d.speak_up.analysis.insist":{"en":"You put a human being into the conversation, which is the only framing that reliably moves an owner. You may also have made this job harder for yourself.","t":"பேச்சுக்குள்ள ஒரு மனுஷனை கொண்டு வந்தீங்க — ஓனரை நிச்சயமா அசைக்கற ஒரே வழி அது தான். அதே நேரம் இந்த வேலையை உங்களுக்கே கஷ்டமாக்கியிருக்கலாம்.","s":"draft"},"d.record.section":{"en":"AFTER","t":"அதுக்கு அப்புறம்","s":"draft"},"d.record.prompt":{"en":"Once it's buried, the only record of what's down there is in your head.","t":"மூடினதுக்கு அப்புறம், கீழ என்ன இருக்குங்கறதுக்கான ஒரே ரெக்கார்ட் உங்க தலைக்குள்ள தான்.","s":"draft"},"d.record.opt.nothing":{"en":"Nothing. I'll remember","t":"ஒண்ணும் வேண்டாம். எனக்கு ஞாபகம் இருக்கும்","s":"draft"},"d.record.opt.photo":{"en":"Take photos on my phone before backfilling","t":"மண் மூடுறதுக்கு முன்னாடி ஃபோன்ல ஃபோட்டோ எடுத்துப்பேன்","s":"draft"},"d.record.opt.mark":{"en":"Photos, and a marker stone set over each cover","t":"ஃபோட்டோ, கூட ஒவ்வொரு கவர் மேலயும் ஒரு அடையாள கல்","s":"draft"},"d.record.reveal.fact":{"en":"There is no as-built record for household sanitation anywhere in this chain. The tank's depth, chamber layout and cover positions exist only as memory, and memory moves away or dies.","t":"இந்த சங்கிலில எங்கயுமே வீட்டு சானிட்டேஷனுக்கு as-built ரெக்கார்ட் கிடையாது. டேங்க்கோட ஆழம், சேம்பர் அமைப்பு, கவர் இடம் — எல்லாம் ஞாபகமா மட்டும் தான் இருக்கு. ஞாபகம் ஊரை விட்டு போயிடும், இல்ல செத்துப் போயிடும்.","s":"draft"},"d.record.reveal.cost":{"en":"Indicative: nil. A phone and ten minutes before the backfill.","t":"தோராயமா: ஒண்ணும் இல்ல. மண் மூடுறதுக்கு முன்னாடி ஒரு ஃபோனும் பத்து நிமிஷமும்.","s":"draft"},"d.record.reveal.twist":{"en":"The first task of most desludging visits is finding the tank. Workers probe the yard with rods, then break the slab where it sounds hollow — a search that routinely takes longer than the emptying.","t":"பெரும்பாலான காலி பண்ற விசிட்ல முதல் வேலை, டேங்க்கை கண்டுபிடிக்கறது தான். தொழிலாளிங்க முத்தம் முழுக்க கம்பி விட்டு குத்திப் பாப்பாங்க, எங்க பொள்ளையா சத்தம் வருதோ அங்க ஸ்லாப்பை உடைப்பாங்க — இந்த தேடல் வழக்கமா காலி பண்றதைவிட அதிக நேரம் எடுக்கும்.","s":"draft"},"d.record.reveal.lesson":{"en":"Twenty-two years is longer than any memory on this site will last. Without a record, the next person starts by guessing, and guessing with a hammer is how the covers you built get destroyed.","t":"இந்த சைட்ல இருக்கற எந்த ஞாபகமும் நிக்கறதைவிட இருபத்திரண்டு வருஷம் நீளம். ரெக்கார்ட் இல்லாட்டி, அடுத்த ஆளு ஊகத்துல தான் ஆரம்பிப்பாரு — சுத்தியோட ஊகிக்கறது தான், நீங்க கட்டின கவர் அழியுற வழி.","s":"draft"},"d.record.analysis.nothing":{"en":"You will remember, for a while. You won't be reachable in 2048, and the house will have changed hands at least once.","t":"உங்களுக்கு ஞாபகம் இருக்கும், கொஞ்ச காலத்துக்கு. 2048-ல உங்கள கண்டுபிடிக்க முடியாது, வீடும் குறைஞ்சது ஒரு தடவையாவது கை மாறியிருக்கும்.","s":"draft"},"d.record.analysis.photo":{"en":"Ten minutes of phone storage becomes the only as-built document this tank will ever have. Send them to the owner — your phone won't survive twenty-two years either.","t":"பத்து நிமிஷ ஃபோன் ஸ்டோரேஜ் தான், இந்த டேங்க்குக்கு எப்பவுமே கிடைக்கப் போற ஒரே as-built டாக்குமெண்ட். அதை ஓனருக்கு அனுப்பி வெச்சுடுங்க — உங்க ஃபோனும் இருபத்திரண்டு வருஷம் தாங்காது.","s":"draft"},"d.record.analysis.mark":{"en":"Photos plus a physical marker. The marker is the part that works, because it speaks to the person standing in the yard with a rod and no information.","t":"ஃபோட்டோ, கூட ஒரு நிஜமான அடையாளம். வேலை செய்யுற பகுதி அந்த அடையாளம் தான் — ஏன்னா முத்தத்துல கம்பியோட, ஒரு தகவலும் இல்லாம நிக்கற ஆளுகிட்ட பேசுறது அது தான்.","s":"draft"},"verdict.safe.title":{"en":"Emptiable","t":"காலி பண்ணக் கூடியது","s":"draft"},"verdict.safe.body":{"en":"A truck can reach this. A hose can clear it. The atmosphere is vented before anyone lifts a cover. In 2048 this is a job, done from the outside, in forty minutes.","t":"இங்க லாரி வர முடியும். ஹோஸ் இதை காலி பண்ண முடியும். யாராவது கவரை தூக்குறதுக்கு முன்னாடியே காத்து வெளியேறியிருக்கும். 2048-ல இது ஒரு வேலை — வெளியே இருந்து, நாப்பது நிமிஷத்துல முடியுற வேலை.","s":"draft"},"verdict.difficult.title":{"en":"Difficult","t":"கஷ்டம்","s":"draft"},"verdict.difficult.body":{"en":"It can be emptied, but not easily, and not every time. Somewhere in here is a gap — the hose doesn't quite reach, or the opening is tight, or the air is bad. Each visit, somebody decides whether to work around it or climb in. Most days they work around it.","t":"காலி பண்ண முடியும், ஆனா சுலபமா இல்ல, எல்லா தடவையும் இல்ல. இதுல எங்கயோ ஒரு இடைவெளி இருக்கு — ஹோஸ் சரியா எட்டல, இல்ல திறப்பு இறுக்கம், இல்ல காத்து சரியில்ல. ஒவ்வொரு தடவையும், அதை சமாளிச்சு வேலை பண்ணலாமா இல்ல உள்ள இறங்கலாமான்னு யாரோ ஒருத்தர் முடிவு பண்றாரு. பெரும்பாலான நாள் சமாளிச்சு பண்றாங்க.","s":"draft"},"verdict.unsafe.title":{"en":"Someone goes in","t":"யாரோ ஒருத்தர் உள்ள இறங்குறாரு","s":"draft"},"verdict.unsafe.body":{"en":"There is no version of emptying this tank that doesn't put a person inside it. Not because anyone chose that — because every route that avoided it was closed by a decision made above ground, years earlier, by someone thinking about something else.","t":"இந்த டேங்க்கை காலி பண்ண, ஒரு மனுஷனை உள்ள இறக்காத வழியே இல்ல. யாரோ அப்படி தேர்ந்தெடுத்ததால இல்ல — அதை தவிர்க்கிற ஒவ்வொரு வழியும், வருஷங்களுக்கு முன்னாடி, தரைக்கு மேல, வேற எதையோ யோசிச்சுட்டு இருந்த ஒருத்தரோட முடிவால மூடப்பட்டதால.","s":"draft"},"verdict.escalation.title":{"en":"And the atmosphere is unvented.","t":"காத்துக்கு வென்ட்டும் இல்ல.","s":"draft"},"verdict.escalation.body":{"en":"This is the specific combination behind most sanitation worker deaths in India: a confined space, no ventilation, and a.owner.name":{"en":"Home owner","t":"मकान मालिक","s":"draft"},"persona.owner.tagline":{"en":"You're paying. You'll live here. You'll do this once.","t":"पैसा आपका है। रहना आपको है। यह काम ज़िंदगी में एक बार करेंगे।","s":"draft"},"persona.owner.seat":{"en":"You have money, a plot, and everyone's opinion. You don't have a vocabulary for what's underground.","t":"आपके पास पैसा है, प्लॉट है, और सबकी राय है। जो ज़मीन के नीचे है, उसके लिए आपके पास शब्द नहीं हैं।","s":"draft"},"persona.architect.name":{"en":"Architect","t":"आर्किटेक्ट","s":"draft"},"persona.architect.tagline":{"en":"You draw it. What you don't draw, nobody builds.","t":"ड्रॉइंग आप बनाते हैं। जो आप नहीं बनाते, वह कोई नहीं बनाता।","s":"draft"},"persona.architect.seat":{"en":"You are hired for the elevation. The sanitation is assumed, unpriced, and entirely yours to get wrong.","t":"आपको एलिवेशन के लिए रखा गया है। सैनिटेशन मान लिया जाता है, उसका कोई दाम नहीं लगता, और गलत होने पर पूरी तरह आपका है।","s":"draft"},"persona.engineer.name":{"en":"Civil Engineer","t":"सिविल इंजीनियर","s":"draft"},"persona.engineer.tagline":{"en":"You sign off. Your stamp is the last technical word.","t":"साइन आप करते हैं। आपकी मुहर आखिरी तकनीकी बात है।","s":"draft"},"persona.engineer.seat":{"en":"You know IS 2470 exists. You also know nobody has ever asked you for it.","t":"आपको पता है कि IS 2470 नाम की चीज़ है। यह भी पता है कि आज तक किसी ने आपसे वह माँगा नहीं।","s":"draft"},"persona.contractor.name":{"en":"Contractor","t":"ठेकेदार","s":"draft"},"persona.contractor.tagline":{"en":"You price it and deliver it. Margin lives in what's invisible.","t":"रेट आप लगाते हैं, काम आप पूरा करते हैं। मार्जिन वहीं छिपा है जो दिखता नहीं।","s":"draft"},"persona.contractor.seat":{"en":"You quoted a number to win the job. Everything below ground is where you find that number again.","t":"काम लेने के लिए आपने एक रेट बोला था। ज़मीन के नीचे का सारा काम वही जगह है जहाँ से वह रेट वापस निकलता है।","s":"draft"},"persona.maistry.name":{"en":"Maistry","t":"मिस्त्री","s":"draft"},"persona.maistry.tagline":{"en":"You actually build it. Your hands, your call, on site.","t":"असल में बनाते आप हैं। आपके हाथ, आपका फैसला, साइट पर।","s":"draft"},"persona.maistry.seat":{"en":"The drawing ran out three lines above the ground. From here it is memory and habit.","t":"ड्रॉइंग ज़मीन से तीन लाइन ऊपर ही खत्म हो गई। यहाँ से आगे बस याददाश्त और आदत है।","s":"draft"},"d.organise.section":{"en":"SETTING UP","t":"शुरुआत","s":"draft"},"d.organise.prompt":{"en":"Who's going to organise this build?","t":"यह मकान बनवाने का इंतज़ाम कौन करेगा?","s":"draft"},"d.organise.opt.maistri":{"en":"A maistry I know — he built my cousin's place","t":"एक जान-पहचान का मिस्त्री — उसी ने मेरे भाई का मकान बनाया था","s":"draft"},"d.organise.opt.contractor":{"en":"A contractor, fixed price, he handles everything","t":"एक ठेकेदार, फिक्स रेट, सब कुछ वही देखेगा","s":"draft"},"d.organise.opt.professional":{"en":"An architect and engineer first, then a contractor","t":"पहले आर्किटेक्ट और इंजीनियर, फिर ठेकेदार","s":"draft"},"d.organise.reveal.fact":{"en":"Most peri-urban homes in this belt are built on trust, not on paper. The maistry route is cheaper and faster, and it produces no document at all.","t":"इस इलाके के ज़्यादातर मकान कागज़ पर नहीं, भरोसे पर बनते हैं। मिस्त्री वाला रास्ता सस्ता और तेज़ है, और उसमें कोई कागज़ बनता ही नहीं।","s":"draft"},"d.organise.reveal.cost":{"en":"Indicative: maistry-led saves roughly 4–7% of build cost. It also removes the only person contractually obliged to think about the tank.","t":"अंदाज़न: मिस्त्री से काम कराने पर लागत का करीब 4–7% बचता है। साथ ही वह इकलौता आदमी भी हट जाता है जिस पर टैंक के बारे में सोचने की कॉन्ट्रैक्ट वाली ज़िम्मेदारी है।","s":"draft"},"d.organise.reveal.twist":{"en":"The cheapest route isn't the one with no professional. It's the one where the professional is hired and then ignored.","t":"सबसे सस्ता रास्ता वह नहीं जिसमें कोई प्रोफेशनल न हो। सबसे सस्ता वह है जिसमें प्रोफेशनल रखा जाए और फिर उसकी सुनी न जाए।","s":"draft"},"d.organise.reveal.lesson":{"en":"A septic tank has no client. Nobody in the room is paying to make it emptiable. Whoever organises the build inherits that silence by default.","t":"सेप्टिक टैंक का कोई क्लाइंट नहीं होता। कमरे में कोई भी इस बात के पैसे नहीं दे रहा कि वह खाली हो सके। जो भी काम का इंतज़ाम करता है, यह चुप्पी अपने आप उसके हिस्से आ जाती है।","s":"draft"},"d.organise.analysis.maistri":{"en":"You chose the relationship over the record. It will probably build you a good house. It leaves nothing behind that explains what's under the driveway.","t":"आपने रिकॉर्ड की जगह रिश्ता चुना। मकान शायद अच्छा ही बनेगा। लेकिन पीछे ऐसा कुछ नहीं छूटेगा जो बताए कि ड्राइववे के नीचे क्या है।","s":"draft"},"d.organise.analysis.contractor":{"en":"You bought a single point of blame. That's real accountability — but only for things written into the quote. Watch what the quote says about the tank.","t":"आपने इल्ज़ाम रखने के लिए एक ही आदमी खरीद लिया। यह असली जवाबदेही है — लेकिन सिर्फ उन चीज़ों की जो एस्टीमेट में लिखी हैं। देखिए कि एस्टीमेट में टैंक के बारे में क्या लिखा है।","s":"draft"},"d.organise.analysis.professional":{"en":"You've put two people in the room whose job is to know. Whether they use that knowledge is the next twenty minutes of this game.","t":"आपने कमरे में दो ऐसे लोग बिठा दिए जिनका काम ही जानना है। वे उस जानकारी का इस्तेमाल करते हैं या नहीं, यही इस गेम के अगले बीस मिनट हैं।","s":"draft"},"d.location.section":{"en":"THE SITE","t":"साइट","s":"draft"},"d.location.prompt":{"en":"Where does the tank go on the site?","t":"साइट पर टैंक कहाँ बैठेगा?","s":"draft"},"d.location.opt.vastu":{"en":"Where vastu allows — southwest is out, so northwest corner","t":"जहाँ वास्तु इजाज़त दे — दक्षिण-पश्चिम तो नहीं चलेगा, तो उत्तर-पश्चिम कोना","s":"draft"},"d.location.opt.behind":{"en":"Behind the house, out of sight","t":"मकान के पीछे, नज़र से दूर","s":"draft"},"d.location.opt.gate":{"en":"Near the gate, where a truck can actually reach","t":"गेट के पास, जहाँ ट्रक सच में पहुँच सके","s":"draft"},"d.location.reveal.fact":{"en":"A desludging truck carries 30 m of hose and needs somewhere to stand. When the tank sits behind a built house, the hose either doesn't reach or has to be dragged through the kitchen.","t":"टैंक खाली करने वाला ट्रक 30 m की होज़ लेकर आता है और उसे खड़े होने की जगह चाहिए। जब टैंक बने हुए मकान के पीछे होता है, तो या तो होज़ पहुँचती नहीं, या उसे रसोई में से खींचकर ले जाना पड़ता है।","s":"draft"},"d.location.reveal.cost":{"en":"Indicative: an unreachable tank adds ₹1,500–4,000 per desludging, every time, forever — and is the single most common reason a worker climbs in instead.","t":"अंदाज़न: जिस टैंक तक पहुँचा न जा सके, उसे खाली कराने में हर बार ₹1,500–4,000 ज़्यादा लगते हैं, हमेशा के लिए — और यही अकेली सबसे आम वजह है कि मज़दूर अंदर उतर जाता है।","s":"draft"},"d.location.reveal.twist":{"en":"Vastu isn't the villain. Vastu plus a compound wall built later is. Most tanks become unreachable years after they were placed.","t":"गलती वास्तु की नहीं है। गलती वास्तु और बाद में बनी कंपाउंड वॉल की मिलीजुली है। ज़्यादातर टैंक जगह तय होने के कई साल बाद पहुँच से बाहर होते हैं।","s":"draft"},"d.location.reveal.lesson":{"en":"Access is decided in the first ten minutes of site planning, by people thinking about the house, not about the tank. It is almost never revisited.","t":"एक्सेस साइट प्लानिंग के पहले दस मिनट में तय हो जाता है, उन लोगों से जो मकान के बारे में सोच रहे हैं, टैंक के बारे में नहीं। उसे दोबारा लगभग कभी नहीं देखा जाता।","s":"draft"},"d.location.analysis.vastu":{"en":"You optimised for the family's sense of rightness about the house. That's a real value. It just happens to be the constraint that most often strands the tank behind a wall.","t":"आपने घरवालों के मन की तसल्ली को आगे रखा। यह भी एक असली बात है। बस यही वह शर्त है जो सबसे ज़्यादा बार टैंक को दीवार के पीछे फँसा देती है।","s":"draft"},"d.location.analysis.behind":{"en":"Out of sight solves today's problem and creates the 2048 one. Ask yourself where the truck stands
