<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<title>Twenty-Two Years</title>
<style>
:root{
  color-scheme: light;
  --bg:#FDFBF7; --card:#FFFFFF; --ink:#1A1614; --ink2:#5C534C; --ink3:#9A918A;
  --line:#E8E1D7; --accent:#C8871B; --accent-soft:#FDF4E3;
  --green:#2E7D4F; --amber:#C8871B; --red:#C0392B;
  --r:14px; --pad:18px; --maxw:520px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{font-size:16px;line-height:1.5;min-height:100dvh}
#app{max-width:var(--maxw);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(253,251,247,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:9px var(--pad);padding-top:max(9px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:9px}
.tb-back{border:0;background:#F0EBE2;color:var(--ink2);font:inherit;font-size:13px;
  font-weight:600;padding:6px 11px;border-radius:99px;cursor:pointer;flex:none}
.tb-seat{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  border:1px solid #EBD5A6;color:#8A5D0E;border-radius:99px;padding:5px 12px;
  font-size:13px;font-weight:700;flex:none}
.tb-seat small{font-weight:600;opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tb-sp{flex:1}
.tb-prog{font-size:12px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.pbar{height:3px;background:var(--line);position:sticky;top:46px;z-index:29}
.pbar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}

/* ---------- generic screen ---------- */
.screen{flex:1;display:flex;flex-direction:column;padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spring{flex:1;min-height:14px}
.hero{text-align:center;padding-top:14px}
.hero .mark{font-size:40px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px;line-height:1.12}
.hero .sub{color:var(--ink2);font-size:15px;margin:0}
.ctawrap{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 62%,rgba(253,251,247,0));
  padding:16px 0 calc(14px + env(safe-area-inset-bottom));margin-top:auto}
.cta{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;
  font-size:17px;font-weight:800;padding:16px;cursor:pointer;transition:transform .08s,opacity .15s}
.cta:active{transform:scale(.99)}
.cta[disabled]{opacity:.35;pointer-events:none}
.cta.ghost{background:transparent;color:var(--ink2);font-weight:600;font-size:14.5px;padding:10px}

/* ---------- language page ---------- */
.langpage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px var(--pad);min-height:100dvh;text-align:center;animation:fade .25s ease}
.lpmark{font-size:44px;line-height:1}
.lptitle{font-size:27px;font-weight:800;letter-spacing:-.8px;margin:10px 0 0;line-height:1.1}
.lpprompt{font-size:16px;color:var(--ink2);margin:18px 0 0;font-weight:600}
.lpalt{font-size:12.5px;color:var(--ink3);margin:7px 0 0;line-height:1.9;max-width:330px}
.lplist{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px;margin-top:22px}
.lpbtn{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 18px;
  font:inherit;cursor:pointer;transition:border-color .15s,transform .08s}
.lpbtn:active{transform:scale(.985);border-color:var(--accent)}
.lpnative{font-size:20px;font-weight:700;line-height:1.5}
.lpen{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.lpen em{font-style:normal;background:#FDECEA;color:var(--red);border-radius:99px;
  padding:1px 7px;font-size:10.5px;font-weight:800;margin-left:4px}
.lpnote{margin-top:22px;max-width:360px;font-size:12px;line-height:1.55;color:#8A5D0E;
  background:var(--accent-soft);border:1px solid #EBD5A6;border-radius:10px;padding:11px 13px}

/* ---------- seat select ---------- */
.seatlist{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.seatcard{display:block;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;font:inherit;cursor:pointer;
  transition:border-color .15s,transform .08s}
.seatcard:active{transform:scale(.99)}
.seatcard.on{border-color:var(--accent);background:var(--accent-soft)}
.sc-top{display:flex;align-items:center;gap:11px}
.sc-ic{font-size:25px}
.sc-nm{font-weight:800;font-size:17px;letter-spacing:-.2px}
.sc-tg{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.sc-mot{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:10px;
  border-top:1px solid var(--line);padding-top:10px}

/* ---------- scene ---------- */
.scene{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-top:16px}
.scene h2{margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:-.3px;
  display:flex;align-items:center;gap:9px}
.scene p{margin:0;font-size:15px;color:var(--ink2);line-height:1.62;white-space:pre-line}

/* ================= THE THREAD =================
   One bounded card per decision. Options are sub-cards inside it. After
   answering, the reveal unfolds from beneath the option that was picked and
   the card closes with a "decided" rule, so it is obvious where one decision
   ends and the next begins.                                                */
.thread{display:flex;flex-direction:column;gap:0;padding-bottom:10px}

/* --- the decision card --- */
.dcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  margin:0 0 12px;overflow:hidden;animation:rise .3s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dcard.done{border-color:var(--line);background:#FCFBF8}
.dcard.live{border-color:#D9CDB8;box-shadow:0 2px 14px rgba(26,22,20,.06)}

.dhead{display:flex;align-items:center;gap:9px;padding:11px 15px;
  border-bottom:1px solid var(--line);background:#FBF8F3}
.dhead .n{width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.dcard.done .dhead .n{background:#D8CFBF;color:#fff}
.dhead .s{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--ink3);
  text-transform:uppercase;flex:1;line-height:1.3}
.dhead .tick{color:var(--green);font-size:14px;font-weight:800}

.dbody{padding:14px 15px 15px}

/* image slot — sits above the text so the picture makes the point first */
.media{margin:-14px -15px 13px;background:#F4F0E9;border-bottom:1px solid var(--line);
  color:var(--ink);line-height:0}
.media img,.media svg{display:block;width:100%;height:auto}
.media.inline{margin:0 0 12px;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;border-bottom:1px solid var(--line)}
.ocard .media.inline{margin:8px 0 0}

.lead{font-size:14.5px;color:var(--ink2);line-height:1.58;margin:0 0 12px}
.asker{font-size:11.5px;font-weight:800;color:var(--accent);margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.7px}
.qtext{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.32;margin:0 0 14px}

/* --- option sub-cards --- */
.opts{display:flex;flex-direction:column;gap:7px}
.ocard{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:#FCFBF9;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
  font:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.ocard:active{transform:scale(.99)}
.ocard.sel{border-color:var(--accent);background:var(--accent-soft)}
.ocard .ic{font-size:20px;flex:none;width:24px;text-align:center;line-height:1.35}
.ocard .tx{flex:1;min-width:0}
.ocard .lb{font-size:15px;line-height:1.4;display:block}
.ocard .nt{font-size:12px;color:var(--ink3);line-height:1.45;display:block;margin-top:3px}
.ocard .thumb{width:54px;height:40px;border-radius:7px;overflow:hidden;flex:none;
  background:#F0EBE2;line-height:0}
.ocard .thumb img,.ocard .thumb svg{width:100%;height:100%;object-fit:cover;display:block}

/* after answering: the pick stays prominent, the rest shrink out of the way */
.ocard.chosen{border-color:var(--accent);background:var(--accent-soft);cursor:default}
.ocard.chosen .lb{font-weight:700}
.ocard.passed{opacity:.45;padding:8px 13px;cursor:default;background:transparent;
  border-style:dashed}
.ocard.passed .lb{font-size:13.5px}
.ocard.passed .ic{font-size:15px}
.chosenmark{margin-left:auto;align-self:center;color:var(--accent);font-size:15px;font-weight:800;flex:none}

/* --- the reveal, unfolding from the chosen option --- */
.unfold{margin:0 0 0 13px;padding:11px 0 0 15px;border-left:2px solid var(--accent-soft);
  position:relative;animation:unfold .34s cubic-bezier(.2,.8,.3,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.unfold:before{content:"";position:absolute;left:-2px;top:0;width:15px;height:13px;
  border-left:2px solid var(--accent-soft);border-bottom:2px solid var(--accent-soft);
  border-bottom-left-radius:9px}

.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:0 0 7px}
.rcard.lead-card{border-color:#EBD5A6;background:#FFFDF8}
.rcard p{margin:0;font-size:14.5px;line-height:1.62;color:var(--ink)}
.rcard p + p{margin-top:9px}
.rcard .muted{color:var(--ink2);font-size:13.5px}
.rcard .alt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:13.5px;color:var(--ink2);line-height:1.58}
.rcard .alt em{font-style:normal;font-weight:800;color:var(--ink3);font-size:10.5px;
  letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:4px}

/* collapsed-by-default depth, so the point lands before the detail */
.more{width:100%;display:flex;align-items:center;gap:8px;background:transparent;
  border:1px dashed var(--line);border-radius:10px;padding:10px 13px;font:inherit;
  font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;margin:0 0 7px;text-align:left}
.more:hover{background:#FCFBF9}
.more .car{margin-left:auto;color:var(--ink3);font-size:11px;transition:transform .2s}
.more.open .car{transform:rotate(180deg)}

/* --- decision terminator --- */
.ddone{display:flex;align-items:center;gap:9px;padding:10px 15px;
  border-top:1px solid var(--line);background:#FBF8F3;font-size:11.5px;font-weight:700;
  color:var(--ink3);letter-spacing:.4px}
.ddone .g{color:var(--green);font-size:13px}
.nextcue{text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);
  letter-spacing:1px;text-transform:uppercase;padding:2px 0 14px}
.nextcue i{display:block;font-style:normal;font-size:15px;color:var(--accent);margin-top:3px}

/* ---------- end screen ---------- */
.fgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);
  background:var(--card);border-radius:99px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.fchip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.fchip .rk{background:var(--accent);color:#fff;border-radius:50%;width:19px;height:19px;
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.field{margin-top:15px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field select{width:100%;font:inherit;font-size:15.5px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);appearance:none}
.consent{margin-top:16px;font-size:12.5px;color:var(--ink3);line-height:1.5;
  border-top:1px solid var(--line);padding-top:13px}

/* ---------- result ---------- */
.verdict{border-radius:var(--r);padding:20px 17px;text-align:center;border:1.5px solid;margin-top:14px}
.verdict.safe{border-color:#A8D5BC;background:#F1F9F4}
.verdict.difficult{border-color:#EBD5A6;background:#FDF7EA}
.verdict.unsafe{border-color:#EFB9B2;background:#FDF2F0}
.verdict .vi{font-size:34px}
.verdict h2{margin:6px 0 8px;font-size:23px;font-weight:800;letter-spacing:-.5px}
.verdict p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.58}
.bars{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.bars > h4{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--ink3)}
.bar{margin-bottom:15px}
.bar:last-child{margin-bottom:0}
.bar .bh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .bh b{font-weight:700}
.bar .bh span{color:var(--ink3);font-variant-numeric:tabular-nums}
.bar .tr{height:7px;background:#F0EBE2;border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease}
.bar small{display:block;color:var(--ink3);font-size:11.5px;margin-top:5px;line-height:1.45}
.escal{margin-top:12px;border:1.5px solid #EFB9B2;background:#FDF2F0;border-radius:var(--r);padding:15px 16px}
.escal h3{margin:0 0 6px;font-size:15.5px;font-weight:800;color:var(--red)}
.escal p{margin:0;font-size:14px;color:var(--ink2);line-height:1.5}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);padding:22px 0 6px;line-height:1.6}
.savenote{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:14px}

/* ---------- Indic typography ---------- */
html[data-script="deva"],html[data-script="orya"],html[data-script="taml"],html[data-script="beng"]{font-size:17px}
html[data-script="deva"] body,html[data-script="orya"] body,
html[data-script="taml"] body,html[data-script="beng"] body{line-height:1.66}
html[data-script="deva"] .qtext,html[data-script="orya"] .qtext,
html[data-script="taml"] .qtext,html[data-script="beng"] .qtext{font-size:19px;line-height:1.5;letter-spacing:0}
html[data-script="deva"] .rcard p,html[data-script="orya"] .rcard p,
html[data-script="taml"] .rcard p,html[data-script="beng"] .rcard p{line-height:1.72}
</style>
</head>
