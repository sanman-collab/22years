किस चीज़ का बनाएँ?","s":"draft"},"d.tanktype.opt.rings":{"en":"Precast concrete rings — fast, cheap, done by evening","t":"प्रीकास्ट कंक्रीट रिंग — तेज़, सस्ता, शाम तक काम खत्म","s":"draft"},"d.tanktype.opt.well":{"en":"Stone-lined, like an old well","t":"पत्थर की चिनाई, पुराने कुएँ की तरह","s":"draft"},"d.tanktype.opt.brick":{"en":"Brick-lined and plastered smooth inside","t":"ईंट की चिनाई और अंदर से चिकना प्लास्टर","s":"draft"},"d.tanktype.opt.twochamber":{"en":"Two chambers with a baffle wall, as per IS 2470","t":"बीच में बैफल वॉल के साथ दो चैंबर, IS 2470 के हिसाब से","s":"draft"},"d.tanktype.reveal.fact":{"en":"A single-compartment tank doesn't settle solids properly. Sludge carries through to the outlet, the soak pit clogs, and the tank needs emptying far more often than it should.","t":"एक ही चैंबर वाले टैंक में ठोस ठीक से नीचे नहीं बैठते। स्लज बहकर आउटलेट तक चला जाता है, सोक पिट जाम हो जाता है, और टैंक ज़रूरत से कहीं ज़्यादा बार खाली कराना पड़ता है।","s":"draft"},"d.tanktype.reveal.cost":{"en":"Indicative: two-chamber costs ₹12,000–20,000 more than rings. It roughly halves desludging frequency over the tank's life.","t":"अंदाज़न: दो-चैंबर वाला टैंक रिंग से ₹12,000–20,000 ज़्यादा पड़ता है। टैंक की पूरी उम्र में वह खाली कराने की संख्या करीब आधी कर देता है।","s":"draft"},"d.tanktype.reveal.twist":{"en":"Rings aren't unsafe because of the material. They're unsafe because the ring diameter decides the opening — and a ring tank almost always ends up with a hole too small for anything but a human body.","t":"रिंग मटीरियल की वजह से खतरनाक नहीं हैं। खतरनाक इसलिए हैं कि रिंग का व्यास ही खुलने वाला मुँह तय कर देता है — और रिंग वाले टैंक में लगभग हमेशा इतना छोटा छेद बचता है कि उसमें आदमी के शरीर के सिवा कुछ नहीं जाता।","s":"draft"},"d.tanktype.reveal.lesson":{"en":"Tank type quietly sets the ceiling on everything downstream: how often it must be opened, what the opening can be, and whether the effluent has anywhere sane to go.","t":"टैंक का टाइप चुपचाप आगे की हर चीज़ की हद तय कर देता है: उसे कितनी बार खोलना पड़ेगा, मुँह कितना बड़ा हो सकता है, और निकलने वाले पानी के जाने के लिए कोई ढंग की जगह है भी या नहीं।","s":"draft"},"d.tanktype.analysis.rings":{"en":"Fast and defensible on cost. But you've just constrained your own next two decisions — the opening and the effluent options narrow sharply from here.","t":"तेज़ है और खर्च के हिसाब से सही ठहराया जा सकता है। लेकिन आपने अपने ही अगले दो फैसले बाँध दिए — यहाँ से मुँह और पानी निकालने के विकल्प तेज़ी से सिकुड़ जाते हैं।","s":"draft"},"d.tanktype.analysis.well":{"en":"Traditional and more generous in section than rings. Stone joints let water and roots move in both directions, though, so expect it to behave more like a pit than a tank.","t":"परंपरागत, और सेक्शन में रिंग से ज़्यादा खुला। पर पत्थर के जोड़ों से पानी और जड़ें दोनों तरफ आ-जा सकती हैं, तो यह टैंक से ज़्यादा एक गड्ढे की तरह चलेगा।","s":"draft"},"d.tanktype.analysis.brick":{"en":"A solid middle. Smooth plaster means less solids clinging, easier emptying. You still only have one compartment, so the outlet will carry sludge.","t":"ठीक-ठाक बीच का रास्ता। चिकना प्लास्टर यानी दीवार पर कम जमाव, खाली करना आसान। पर चैंबर अब भी एक ही है, तो आउटलेट से स्लज बहेगा।","s":"draft"},"d.tanktype.analysis.twochamber":{"en":"The specification that actually exists in Indian standards, and almost never gets built. Everything downstream just got easier — including the effluent options.","t":"वही स्पेसिफिकेशन जो भारतीय मानकों में सच में मौजूद है, और लगभग कभी बनती नहीं। आगे की हर चीज़ अभी आसान हो गई — पानी निकालने के विकल्प भी।","s":"draft"},"d.openings.section":{"en":"THE TOP","t":"ऊपर का हिस्सा","s":"draft"},"d.openings.prompt":{"en":"How do we close the top?","t":"ऊपर से कैसे बंद करें?","s":"draft"},"d.openings.opt.flush":{"en":"One flush slab. Clean finish, nothing sticking up","t":"एक फ्लश स्लैब। साफ फिनिश, कुछ भी ऊपर निकला हुआ नहीं","s":"draft"},"d.openings.opt.small":{"en":"One small opening, about 1½ feet, plastered over later","t":"एक छोटा मुँह, करीब 1½ फुट, बाद में प्लास्टर करके बंद","s":"draft"},"d.openings.opt.covers":{"en":"Two proper covers, 2×2 ft, sitting at ground level","t":"दो ढंग के कवर, 2×2 ft, ज़मीन के लेवल पर","s":"draft"},"d.openings.reveal.fact":{"en":"This is the decision. A 2×2 ft cover at ground level lets a hose and a rake do the work. A 1½ ft hole lets only an arm — or a person — do it. A flush slab means the first step of every desludging is a hammer.","t":"असली फैसला यही है। ज़मीन के लेवल पर 2×2 ft का कवर हो तो काम होज़ और रेक से हो जाता है। 1½ फुट का छेद हो तो सिर्फ हाथ — या पूरा आदमी — ही कर सकता है। फ्लश स्लैब का मतलब है कि हर बार टैंक खाली करने का पहला कदम हथौड़ा है।","s":"draft"},"d.openings.reveal.cost":{"en":"Indicative: two covers with frames add ₹4,000–8,000. That is the cheapest line on this entire list and the one most often deleted.","t":"अंदाज़न: फ्रेम के साथ दो कवर ₹4,000–8,000 और जोड़ते हैं। पूरी लिस्ट में यह सबसे सस्ती लाइन है, और सबसे ज़्यादा बार यही काटी जाती है।","s":"draft"},"d.openings.reveal.twist":{"en":"Small openings are usually chosen for safety — so a child doesn't fall in. The result is a tank that can only be cleaned by putting an adult inside it.","t":"छोटा मुँह आमतौर पर सुरक्षा के लिए ही चुना जाता है — कि बच्चा न गिर जाए। नतीजा यह टैंक है जिसे साफ करने का एक ही तरीका बचता है: एक बड़े आदमी को अंदर उतारना।","s":"draft"},"d.openings.reveal.lesson":{"en":"Almost every case of a worker entering a tank traces back to an opening too small to work through. Not to poverty, not to ignorance — to a hole somebody sized for tidiness.","t":"मज़दूर के टैंक में उतरने का लगभग हर मामला एक ऐसे मुँह तक पहुँचता है जो काम करने के लिए बहुत छोटा था। गरीबी तक नहीं, नासमझी तक नहीं — एक ऐसे छेद तक, जिसका नाप किसी ने सफाई-सुथराई के हिसाब से तय किया था।","s":"draft"},"d.openings.analysis.flush":{"en":"You chose the finish. Understandable — a flush slab looks finished and nothing protrudes into the yard. It also means nobody can open this tank without destroying it first.","t":"आपने फिनिश चुनी। समझ आता है — फ्लश स्लैब पूरा-पूरा लगता है और आँगन में कुछ उभरा हुआ नहीं रहता। इसका यह भी मतलब है कि इस टैंक को कोई तोड़े बिना खोल नहीं सकता।","s":"draft"},"d.openings.analysis.small":{"en":"The compromise, and by far the most common built outcome. It's better than a sealed slab and still too small to clean through. This is the shape most entries happen into.","t":"बीच का रास्ता, और असल में सबसे ज़्यादा यही बनता है। बंद स्लैब से बेहतर है, फिर भी इतना छोटा कि उसमें से सफाई नहीं हो सकती। ज़्यादातर लोग इसी शक्ल के टैंक में उतरते हैं।","s":"draft"},"d.openings.analysis.covers":{"en":"The single highest-value choice available to you. A hose reaches, a rake reaches, and nobody has to. Keep the frames at ground level — raised ones get buried by later landscaping.","t":"आपके सामने मौजूद सबसे कीमती अकेला फैसला। होज़ पहुँच जाती है, रेक पहुँच जाता है, और किसी को उतरना नहीं पड़ता। फ्रेम ज़मीन के लेवल पर ही रखिए — ऊँचे फ्रेम बाद की लैंडस्केपिंग में दब जाते हैं।","s":"draft"},"d.vent.section":{"en":"THE TOP","t":"ऊपर का हिस्सा","s":"draft"},"d.vent.prompt":{"en":"And the vent pipe?","t":"और वेंट पाइप?","s":"draft"},"d.vent.opt.none":{"en":"Skip it. Nobody ever asks for one","t":"छोड़ दीजिए। कोई माँगता ही नहीं","s":"draft"},"d.vent.opt.short":{"en":"A short one, hidden behind the parapet","t":"एक छोटा-सा, पैरापेट के पीछे छिपा हुआ","s":"draft"},"d.vent.opt.proper":{"en":"Full height, above the roof line, with a cowl","t":"पूरी ऊँचाई, छत की लाइन से ऊपर, काउल लगाकर","s":"draft"},"d.vent.reveal.fact":{"en":"A septic tank generates hydrogen sulphide and methane and consumes oxygen. An unvented tank holds that atmosphere indefinitely. Opening the cover does not clear it.","t":"सेप्टिक टैंक में हाइड्रोजन सल्फाइड और मीथेन बनती है और ऑक्सीजन खत्म होती जाती है। जिस टैंक में वेंट नहीं है, वह यह हवा जाने कब तक अंदर रोके रखता है। कवर खोल देने से वह साफ नहीं होती।","s":"draft"},"d.vent.reveal.cost":{"en":"Indicative: a proper vent is ₹1,500–3,000 of PVC. It is the cheapest life-safety item in the entire build.","t":"अंदाज़न: ढंग का वेंट ₹1,500–3,000 का PVC है। पूरे मकान में जान बचाने वाली यह सबसे सस्ती चीज़ है।","s":"draft"},"d.vent.reveal.twist":{"en":"Hydrogen sulphide destroys your sense of smell within seconds at dangerous concentrations. The warning stops exactly when the danger starts — which is why people say 'it didn't smell bad' afterwards.","t":"खतरनाक मात्रा में हाइड्रोजन सल्फाइड कुछ ही सेकंड में सूँघने की ताकत खत्म कर देती है। चेतावनी ठीक उसी वक्त बंद हो जाती है जब खतरा शुरू होता है — इसीलिए लोग बाद में कहते हैं 'बदबू तो नहीं थी'।","s":"draft"},"d.vent.reveal.lesson":{"en":"A vent is not for the smell. It is the only thing standing between a confined space and a breathable one, and it is left off precisely because its benefit is invisible.","t":"वेंट बदबू के लिए नहीं होता। बंद दम घोंटने वाली जगह और साँस लेने लायक जगह के बीच वही अकेली चीज़ खड़ी है, और वह छोड़ी ठीक इसलिए जाती है क्योंकि उसका फायदा दिखता नहीं।","s":"draft"},"d.vent.analysis.none":{"en":"The most common outcome, and the one that turns an awkward job into a fatal one. Everything good you did with the covers is undone by the atmosphere behind them.","t":"सबसे आम नतीजा, और वही जो एक झंझट वाले काम को जानलेवा बना देता है। कवर के साथ आपने जो अच्छा किया, वह उनके पीछे की हवा मिटा देती है।","s":"draft"},"d.vent.analysis.short":{"en":"Better than nothing — there is a path for gas to leave. Hidden behind a parapet it will vent into a pocket of still air, and it will be the first thing sealed during any future renovation.","t":"कुछ न होने से बेहतर — गैस के निकलने का रास्ता तो है। पैरापेट के पीछे छिपा होने से वह ठहरी हुई हवा की जेब में ही खुलेगा, और आगे कभी रेनोवेशन हुआ तो सबसे पहले यही बंद किया जाएगा।","s":"draft"},"d.vent.analysis.proper":{"en":"Correct. Above the roof line, away from windows, with a cowl so it doesn't block. This is the difference between a confined space and a tank.","t":"सही। छत की लाइन से ऊपर, खिड़कियों से दूर, और काउल लगा हुआ ताकि बंद न हो। बंद दम घोंटने वाली जगह और एक टैंक में यही फर्क है।","s":"draft"},"d.effluent.section":{"en":"THE OUTLET","t":"आउटलेट","s":"draft"},"d.effluent.prompt":{"en":"Where does the water leaving the tank go?","t":"टैंक से निकलने वाला पानी कहाँ जाएगा?","s":"draft"},"d.effluent.opt.storm":{"en":"Into the storm drain out front","t":"सामने वाली बरसाती नाली में","s":"draft"},"d.effluent.opt.soak":{"en":"A soak pit right next to the tank","t":"टैंक के बगल में ही एक सोक पिट","s":"draft"},"d.effluent.opt.dispersion":{"en":"A dispersion trench, sized for the soil","t":"मिट्टी के हिसाब से नापी गई डिस्पर्शन ट्रेंच","s":"draft"},"d.effluent.reveal.fact":{"en":"Septic effluent is not treated water. Into a storm drain it becomes an open sewage channel; into an undersized soak pit it clogs, backs up, and forces the tank to be opened years early.","t":"सेप्टिक टैंक से निकला पानी ट्रीट किया हुआ पानी नहीं होता। बरसाती नाली में जाकर वह नाली खुले सीवर में बदल जाती है; छोटे पड़ने वाले सोक पिट में जाकर वह जाम करता है, वापस चढ़ता है, और टैंक को सालों पहले खुलवा देता है।","s":"draft"},"d.effluent.reveal.cost":{"en":"Indicative: a properly sized dispersion trench is ₹15,000–30,000. A clogged soak pit costs a desludging every few months and eventually has to be dug out by hand.","t":"अंदाज़न: सही नाप की डिस्पर्शन ट्रेंच ₹15,000–30,000 की पड़ती है। जाम सोक पिट हर कुछ महीने में एक बार टैंक खाली कराने का खर्च देता है, और आखिर में उसे हाथ से खोदकर निकालना पड़ता है।","s":"draft"},"d.effluent.reveal.twist":{"en":"A soak pit that fails doesn't announce itself. The tank simply fills faster. By the time anyone investigates, the failure is ten years deep and someone is going into the pit to find it.","t":"सोक पिट फेल हो तो वह बताता नहीं। बस टैंक जल्दी-जल्दी भरने लगता है। जब तक कोई जाँच करता है, तब तक खराबी दस साल पुरानी हो चुकी होती है और उसे ढूँढ़ने कोई पिट में उतर रहा होता है।","s":"draft"},"d.effluent.reveal.lesson":{"en":"Where the water goes decides how often the tank is opened. Frequency is exposure. Every avoidable desludging is another entry into somebody's working year.","t":"पानी कहाँ जाता है, यही तय करता है कि टैंक कितनी बार खुलेगा। जितनी बार, उतना एक्सपोज़र। जो एक बार टैंक खाली कराना टाला जा सकता था, वह किसी के काम के साल में एक और बार अंदर उतरना है।","s":"draft"},"d.effluent.analysis.storm":{"en":"It works, immediately and completely, and it moves the problem into the street. Whoever cleans that drain now meets your sewage without knowing it's sewage.","t":"चलता है, फौरन और पूरी तरह, और दिक्कत को सड़क पर धकेल देता है। अब जो भी उस नाली को साफ करेगा, उसका सामना आपके मल-पानी से होगा — बिना यह जाने कि वह मल-पानी है।","s":"draft"},"d.effluent.analysis.soak":{"en":"The standard answer and a reasonable one — if it's sized for the soil and set back from the tank. Most aren't, and the clogging shows up as a tank that mysteriously fills fast.","t":"यही आम जवाब है और ठीक भी — बशर्ते नाप मिट्टी के हिसाब से हो और वह टैंक से थोड़ी दूर हो। ज़्यादातर ऐसे नहीं होते, और जाम इस शक्ल में सामने आता है कि टैंक बिना वजह जल्दी भरने लगता है।","s":"draft"},"d.effluent.analysis.dispersion":{"en":"The right answer where soil allows, and it's only available to you because you built a tank whose outlet water is clean enough to disperse. The earlier choice paid for itself here.","t":"जहाँ मिट्टी इजाज़त दे, वहाँ यही सही जवाब है, और यह विकल्प आपके पास सिर्फ इसलिए है क्योंकि आपने ऐसा टैंक बनाया जिसका निकलने वाला पानी फैलाने लायक साफ है। पहले लिया गया फैसला यहाँ अपनी कीमत वसूल कर गया।","s":"draft"},"d.drawing.section":{"en":"ON PAPER","t":"कागज़ पर","s":"draft"},"d.drawing.prompt":{"en":"What actually goes on the drawing for the tank?","t":"टैंक के लिए ड्रॉइंग पर असल में क्या जाता है?","s":"draft"},"d.drawing.opt.st":{"en":"'ST' with a rectangle. Everyone knows what that means","t":"'ST' और एक चौकोर डिब्बा। सबको पता है इसका मतलब क्या है","s":"draft"},"d.drawing.opt.detail":{"en":"A full section — chambers, covers, vent, invert levels","t":"पूरा सेक्शन — चैंबर, कवर, वेंट, इनवर्ट लेवल","s":"draft"},"d.drawing.reveal.fact":{"en":"On most sanctioned drawings in this region the septic tank appears as two letters and a rectangle. Nothing about compartments, cover size, vent or outlet is drawn — so nothing about them is checked, priced, or built.","t":"इस इलाके की ज़्यादातर मंज़ूर ड्रॉइंग में सेप्टिक टैंक दो अक्षर और एक चौकोर डिब्बा भर होता है। चैंबर, कवर का नाप, वेंट या आउटलेट — कुछ भी नहीं बनाया जाता, इसलिए इनमें से कुछ भी न चेक होता है, न उसका रेट लगता है, न वह बनता है।","s":"draft"},"d.drawing.reveal.cost":{"en":"Indicative: a proper section is one extra sheet and perhaps two hours of drafting time.","t":"अंदाज़न: ढंग के सेक्शन में एक अतिरिक्त शीट और शायद दो घंटे की ड्राफ्टिंग लगती है।","s":"draft"},"d.drawing.reveal.twist":{"en":"The rectangle is not laziness. It's what gets approved fastest. Detailing the tank invites questions from an authority that has no mechanism to evaluate the answer.","t":"वह चौकोर डिब्बा आलस नहीं है। सबसे जल्दी मंज़ूरी उसी की मिलती है। टैंक की डिटेल देने पर उस दफ्तर से सवाल आते हैं जिसके पास जवाब परखने का कोई तरीका ही नहीं है।","s":"draft"},"d.drawing.reveal.lesson":{"en":"What is not drawn is not built, not priced, and not anybody's fault. The rectangle is how a responsibility disappears without anyone deciding to drop it.","t":"जो ड्रॉइंग में नहीं है, वह न बनता है, न उसका रेट लगता है, न किसी की गलती होती है। वह चौकोर डिब्बा वही तरीका है जिससे एक ज़िम्मेदारी बिना किसी के छोड़े गायब हो जाती है।","s":"draft"},"d.drawing.analysis.st":{"en":"You did what the sanction process rewards. The tank is now entirely in the maistry's memory, and that memory has no cover size in it.","t":"आपने वही किया जिसका इनाम मंज़ूरी की प्रक्रिया देती है। टैंक अब पूरा-का-पूरा मिस्त्री की याददाश्त में है, और उस याददाश्त में कवर का नाप है ही नहीं।","s":"draft"},"d.drawing.analysis.detail":{"en":"You created the one artefact that survives everyone on this project. In 2048 somebody can find out what's down there without a hammer.","t":"आपने वह एक चीज़ बना दी जो इस प्रोजेक्ट के हर आदमी के बाद भी बची रहेगी। 2048 में कोई बिना हथौड़े के पता कर सकेगा कि नीचे क्या है।","s":"draft"},"d.oc.section":{"en":"AFTER","t":"बाद में","s":"draft"},"d.oc.prompt":{"en":"The house is ready. Do you go through the Occupancy Certificate?","t":"मकान तैयार है। क्या आप ऑक्यूपेंसी सर्टिफिकेट (OC) की प्रक्रिया से गुज़रेंगे?","s":"draft"},"d.oc.opt.movein":{"en":"Just move in. Nobody in this layout has an OC","t":"बस शिफ्ट हो जाइए। इस लेआउट में किसी के पास OC नहीं है","s":"draft"},"d.oc.opt.getoc":{"en":"Apply for the OC, whatever it takes","t":"OC के लिए अप्लाई कीजिए, जो भी लगे","s":"draft"},"d.oc.reveal.fact":{"en":"The Occupancy Certificate is the only point at which anyone official is supposed to look at what was actually built, including the sanitation, versus what was approved.","t":"ऑक्यूपेंसी सर्टिफिकेट वह इकलौता मौका है जब किसी सरकारी आदमी से यह देखने की उम्मीद की जाती है कि असल में बना क्या है — सैनिटेशन समेत — और मंज़ूर क्या हुआ था।","s":"draft"},"d.oc.reveal.cost":{"en":"Indicative: weeks of follow-up, and in practice a system most owners route around entirely.","t":"अंदाज़न: हफ्तों की भागदौड़, और हकीकत में एक ऐसा सिस्टम जिसे ज़्यादातर मालिक पूरी तरह किनारे से निकाल देते हैं।","s":"draft"},"d.oc.reveal.twist":{"en":"Skipping the OC doesn't only avoid scrutiny — it removes the building from the record. An unrecorded building is one nobody can later be required to fix.","t":"OC छोड़ देने से सिर्फ जाँच नहीं बचती — मकान रिकॉर्ड से ही बाहर हो जाता है। जो मकान रिकॉर्ड में नहीं है, उसे बाद में ठीक करने के लिए किसी को मजबूर नहीं किया जा सकता।","s":"draft"},"d.oc.reveal.lesson":{"en":"Accountability isn't a feeling. It's whether a document exists with somebody's name on it. Every step that skips the paperwork removes a future person's ability to ask why.","t":"जवाबदेही कोई भावना नहीं है। यह इस बात पर टिकी है कि किसी के नाम का कागज़ मौजूद है या नहीं। कागज़ी काम छोड़ने वाला हर कदम किसी आने वाले आदमी से यह पूछने का हक छीन लेता है कि ऐसा क्यों है।","s":"draft"},"d.oc.analysis.movein":{"en":"Pragmatic and near-universal. You've also ensured no independent eye ever compared the tank as built to the tank as approved.","t":"व्यावहारिक, और लगभग सब यही करते हैं। साथ ही आपने पक्का कर दिया कि कोई बाहरी नज़र कभी यह न मिलाए कि जो टैंक बना, वह मंज़ूर हुए टैंक जैसा है या नहीं।","s":"draft"},"d.oc.analysis.getoc":{"en":"Slow, tedious, and the only mechanism in this entire chain where an outsider checks the work. You kept the tank inside the system of record.","t":"धीमा, उबाऊ, और इस पूरी कड़ी में वह इकलौता तरीका जहाँ कोई बाहरी आदमी काम जाँचता है। आपने टैंक को रिकॉर्ड के अंदर रखा।","s":"draft"},"d.client_push.section":{"en":"THE BRIEF","t":"ब्रीफ","s":"draft"},"d.client_push.prompt":{"en":"The client says: \"Sir, don't complicate the sanitation. The maistry knows.\"","t":"क्लाइंट कहता है: \"सर, सैनिटेशन को उलझाइए मत। मिस्त्री को पता है।\"","s":"draft"},"d.client_push.opt.agree":{"en":"Agree. Not worth the argument — I'll focus on the elevation","t":"मान जाइए। बहस के लायक नहीं — मैं एलिवेशन पर ध्यान दूँगा","s":"draft"},"d.client_push.opt.note":{"en":"Put a note on the drawing and move on","t":"ड्रॉइंग पर एक नोट डालकर आगे बढ़ जाइए","s":"draft"},"d.client_push.opt.explain":{"en":"Sit them down and explain who opens this tank in twenty years","t":"उन्हें बिठाकर समझाइए कि बीस साल बाद इस टैंक को खोलेगा कौन","s":"draft"},"d.client_push.reveal.fact":{"en":"Architects are hired and judged on the visible house. Sanitation sits outside the fee conversation, so professional attention drains away from it exactly where it's most needed.","t":"आर्किटेक्ट को दिखने वाले मकान के लिए रखा जाता है और उसी पर परखा जाता है। सैनिटेशन फीस की बातचीत से बाहर रहता है, इसलिए प्रोफेशनल ध्यान ठीक वहीं से हट जाता है जहाँ उसकी सबसे ज़्यादा ज़रूरत है।","s":"draft"},"d.client_push.reveal.cost":{"en":"Indicative: the conversation costs twenty minutes and some goodwill. Losing it costs nothing you'll ever be told about.","t":"अंदाज़न: उस बातचीत में बीस मिनट और थोड़ी-सी सद्भावना लगती है। उसे न करने की कीमत ऐसी है जिसके बारे में आपको कभी बताया ही नहीं जाएगा।","s":"draft"},"d.client_push.reveal.twist":{"en":"Clients almost never refuse the covers and the vent on cost. They refuse them because nobody framed them as being about a person. Framed that way, most say yes.","t":"क्लाइंट कवर और वेंट को खर्च की वजह से लगभग कभी मना नहीं करते। वे इसलिए मना करते हैं क्योंकि किसी ने उन्हें एक आदमी की बात बनाकर नहीं रखा। उस तरह रखने पर ज़्यादातर हाँ कह देते हैं।","s":"draft"},"d.client_push.reveal.lesson":{"en":"The professional's real product here isn't the drawing — it's the one conversation where the invisible worker is named out loud. Skip it and the expertise is simply unused.","t":"यहाँ प्रोफेशनल का असली प्रोडक्ट ड्रॉइंग नहीं है — वह एक बातचीत है जिसमें उस न दिखने वाले मज़दूर का नाम खुलकर लिया जाता है। वह छोड़ दी, तो सारी काबिलियत बस पड़ी रह जाती है।","s":"draft"},"d.client_push.analysis.agree":{"en":"You preserved the relationship and gave up the only leverage you had. The expertise is still in your head, which is precisely where it does no good.","t":"आपने रिश्ता बचा लिया और अपना इकलौता ज़ोर छोड़ दिया। काबिलियत अब भी आपके दिमाग में है, और ठीक वहीं उसका कोई फायदा नहीं।","s":"draft"},"d.client_push.analysis.note":{"en":"A note is a real thing — it survives, it's evidence, it shifts liability. It also gets read by nobody on site. Half a step.","t":"नोट कोई छोटी चीज़ नहीं — वह बचा रहता है, सबूत है, ज़िम्मेदारी सरका देता है। साइट पर उसे कोई नहीं पढ़ता। आधा कदम।","s":"draft"},"d.client_push.analysis.explain":{"en":"You spent your credibility on the part of the project nobody was going to defend. This is what being the professional in the room actually costs.","t":"आपने अपनी साख प्रोजेक्ट के उस हिस्से पर खर्च की जिसका पक्ष कोई नहीं लेने वाला था। कमरे में प्रोफेशनल होने की असल कीमत यही है।","s":"draft"},"d.handover.section":{"en":"TO SITE","t":"साइट तक","s":"draft"},"d.handover.prompt":{"en":"What does the maistry actually get from you?","t":"मिस्त्री को आपसे असल में क्या मिलता है?","s":"draft"},"d.handover.opt.print":{"en":"An A3 print of the plan. He'll work the rest out","t":"प्लान का एक A3 प्रिंट। बाकी वह खुद समझ लेगा","s":"draft"},"d.handover.opt.verbal":{"en":"The print, plus ten minutes on site explaining it","t":"प्रिंट, और साइट पर दस मिनट समझाना","s":"draft"},"d.handover.opt.marked":{"en":"Print, site walk, and I chalk the cover positions myself","t":"प्रिंट, साइट पर चक्कर, और कवर की जगह मैं खुद चॉक से निशान लगाऊँगा","s":"draft"},"d.handover.reveal.fact":{"en":"The gap between a drawing and a built tank is a conversation that usually doesn't happen. The maistry builds from habit wherever the drawing is silent — and on the tank, the drawing is almost always silent.","t":"ड्रॉइंग और बने हुए टैंक के बीच की खाई एक ऐसी बातचीत है जो आमतौर पर होती ही नहीं। जहाँ ड्रॉइंग चुप है, मिस्त्री आदत से बनाता है — और टैंक के मामले में ड्रॉइंग लगभग हमेशा चुप रहती है।","s":"draft"},"d.handover.reveal.cost":{"en":"Indicative: one site visit. Perhaps an hour.","t":"अंदाज़न: साइट का एक चक्कर। शायद एक घंटा।","s":"draft"},"d.handover.reveal.twist":{"en":"Maistries very often know more about tanks than the drawing says, and less about why the details matter. The visit works in both directions — you'll learn the site constraint you drew through.","t":"मिस्त्री अक्सर टैंक के बारे में ड्रॉइंग से ज़्यादा जानते हैं, और यह कम जानते हैं कि डिटेल क्यों मायने रखती है। वह चक्कर दोनों तरफ काम करता है — आपको साइट की वह अड़चन पता चलेगी जिसके ऊपर से आप ड्रॉइंग खींच गए थे।","s":"draft"},"d.handover.reveal.lesson":{"en":"Design intent doesn't travel on paper alone in an oral building culture. If you didn't say it out loud, standing on the spot, you didn't specify it.","t":"जहाँ निर्माण का चलन बोलकर चलता है, वहाँ डिज़ाइन की मंशा अकेले कागज़ पर सफर नहीं करती। अगर आपने मौके पर खड़े होकर, बोलकर नहीं कहा, तो आपने स्पेसिफाई किया ही नहीं।","s":"draft"},"d.handover.analysis.print":{"en":"The drawing is now competing with thirty years of habit and losing. Whatever you detailed about the covers will be built the way the last tank was built.","t":"अब ड्रॉइंग तीस साल की आदत से मुकाबला कर रही है और हार रही है। कवर के बारे में आपने जो भी डिटेल दी, वह पिछले टैंक की तरह ही बनेगी।","s":"draft"},"d.handover.analysis.verbal":{"en":"The ten minutes is the actual specification. This is where intent transfers in a building culture that runs on speech.","t":"असली स्पेसिफिकेशन वही दस मिनट हैं। जो निर्माण का चलन बोलने पर चलता है, उसमें मंशा यहीं से आगे जाती है।","s":"draft"},"d.handover.analysis.marked":{"en":"Chalk on the ground outranks any drawing. You've put the cover positions into the one medium the person casting the slab is actually looking at.","t":"ज़मीन पर लगा चॉक किसी भी ड्रॉइंग से ऊपर है। आपने कवर की जगह उसी माध्यम में डाल दी जिसे स्लैब ढालने वाला आदमी सच में देख रहा है।","s":"draft"},"d.sizing.section":{"en":"THE NUMBERS","t":"हिसाब","s":"draft"},"d.sizing.prompt":{"en":"How do you size the tank?","t":"टैंक का साइज़ कैसे तय करेंगे?","s":"draft"},"d.sizing.opt.thumb":{"en":"Thumb rule. 8×4×5 feet does it for a family","t":"थंब रूल। एक परिवार के लिए 8×4×5 फुट काफी है","s":"draft"},"d.sizing.opt.oversize":{"en":"Build it big. Bigger tank, fewer trips","t":"बड़ा बना दीजिए। टैंक जितना बड़ा, ट्रक के चक्कर उतने कम","s":"draft"},"d.sizing.opt.std":{"en":"IS 2470 — persons × litres × desludging interval","t":"IS 2470 — लोग × लीटर × खाली कराने का अंतराल","s":"draft"},"d.sizing.reveal.fact":{"en":"IS 2470 sizes a tank from occupancy, flow and a chosen desludging interval — typically two to three years. The thumb rule sizes it from what fits the corner of the plot.","t":"IS 2470 टैंक का नाप इससे निकालता है कि कितने लोग हैं, कितना बहाव है और खाली कराने का अंतराल क्या तय किया — आमतौर पर दो से तीन साल। थंब रूल नाप इस हिसाब से निकालता है कि प्लॉट के कोने में क्या फिट हो जाए।","s":"draft"},"d.sizing.reveal.cost":{"en":"Indicative: nil. Correct sizing is arithmetic, not money.","t":"अंदाज़न: शून्य। सही नाप गणित है, पैसा नहीं।","s":"draft"},"d.sizing.reveal.twist":{"en":"Oversizing can make things worse. A very deep tank is no easier to empty and much harder to get out of, and the sludge at the bottom of a 7-foot tank is beyond the reach of any hose held from above.","t":"ज़रूरत से बड़ा बनाना हालत बिगाड़ भी सकता है। बहुत गहरा टैंक खाली करने में आसान नहीं होता और उसमें से निकलना कहीं ज़्यादा मुश्किल होता है, और 7 फुट गहरे टैंक की तली का स्लज ऊपर से पकड़ी किसी भी होज़ की पहुँच से बाहर है।","s":"draft"},"d.sizing.reveal.lesson":{"en":"Capacity is the parameter engineers reach for because it's the one with a formula. Depth and opening size decide the worker's day, and neither appears in the capacity calculation.","t":"इंजीनियर कैपेसिटी पर इसलिए जाते हैं क्योंकि फॉर्मूला उसी का है। मज़दूर का दिन गहराई और मुँह का नाप तय करते हैं, और कैपेसिटी के हिसाब में इनमें से एक भी नहीं आता।","s":"draft"},"d.sizing.analysis.thumb":{"en":"It'll broadly work — thumb rules encode real experience. It just carries no reasoning anyone can check, adjust, or inherit.","t":"मोटे तौर पर चल जाएगा — थंब रूल में असली तजुर्बा भरा होता है। बस उसके पीछे ऐसी कोई वजह नहीं होती जिसे कोई जाँच सके, बदल सके, या आगे ले जा सके।","s":"draft"},"d.sizing.analysis.oversize":{"en":"Generous on capacity and quietly hostile on depth. Ask yourself whether a hose can reach the bottom; if not, you've designed in an entry.","t":"कैपेसिटी में खुले हाथ, और गहराई में चुपचाप दुश्मनी। खुद से पूछिए कि होज़ तली तक पहुँचेगी या नहीं; नहीं पहुँची, तो आपने डिज़ाइन में ही किसी का अंदर उतरना तय कर दिया।","s":"draft"},"d.sizing.analysis.std":{"en":"You used the standard that exists and is almost never invoked. Now hold the desludging interval you assumed — it's the number that justifies everything else.","t":"आपने वह मानक इस्तेमाल किया जो मौजूद है और लगभग कभी लगाया नहीं जाता। अब खाली कराने का जो अंतराल आपने मान लिया है, उस पर टिके रहिए — बाकी सब कुछ उसी नंबर से सही ठहरता है।","s":"draft"},"d.site_visit.section":{"en":"DURING","t":"काम के दौरान","s":"draft"},"d.site_visit.prompt":{"en":"The tank gets cast on a Tuesday. You're on three other sites.","t":"टैंक मंगलवार को ढलेगा। आप तीन और साइटों पर हैं।","s":"draft"},"d.site_visit.opt.photos":{"en":"Ask for photos on WhatsApp","t":"व्हाट्सऐप पर फोटो मँगवा लीजिए","s":"draft"},"d.site_visit.opt.after":{"en":"Go after work, once the slab is on","t":"काम के बाद जाइए, जब स्लैब पड़ चुका हो","s":"draft"},"d.site_visit.opt.during":{"en":"Be there before they cast. That's the only hour it can be fixed","t":"ढलाई से पहले वहाँ रहिए। सुधार का बस वही एक घंटा है","s":"draft"},"d.site_visit.reveal.fact":{"en":"A septic tank is correctable for about one hour — between the shuttering going up and the concrete going in. After that, changing the cover size means demolition.","t":"सेप्टिक टैंक में सुधार करीब एक घंटे तक हो सकता है — शटरिंग खड़ी होने और कंक्रीट पड़ने के बीच। उसके बाद कवर का नाप बदलने का मतलब है तोड़ना।","s":"draft"},"d.site_visit.reveal.cost":{"en":"Indicative: one site visit, timed right.","t":"अंदाज़न: साइट का एक चक्कर, सही वक्त पर।","s":"draft"},"d.site_visit.reveal.twist":{"en":"Photos arrive after the pour, essentially always. The request for photos is genuinely well-intentioned and structurally guaranteed to be too late.","t":"फोटो ढलाई के बाद ही आती हैं, तकरीबन हमेशा। फोटो माँगने की नीयत सचमुच अच्छी होती है, और ढाँचा ही ऐसा है कि वह हमेशा देर से आएगी।","s":"draft"},"d.site_visit.reveal.lesson":{"en":"Supervision has a window, and for underground work that window is measured in hours. Inspection outside the window is documentation, not control.","t":"निगरानी की एक खिड़की होती है, और ज़मीन के नीचे के काम में वह खिड़की घंटों में नापी जाती है। खिड़की के बाहर की जाँच रिकॉर्ड बनाना है, कंट्रोल नहीं।","s":"draft"},"d.site_visit.analysis.photos":{"en":"You'll receive a clear photograph of an irreversible decision. It's a record, not a check.","t":"आपको एक ऐसे फैसले की साफ फोटो मिलेगी जो अब बदल नहीं सकता। यह रिकॉर्ड है, जाँच नहीं।","s":"draft"},"d.site_visit.analysis.after":{"en":"You'll see what was built and be able to raise it. Whether anything changes depends on whether the client will pay to break a slab. They won't.","t":"जो बना है वह आपको दिख जाएगा और आप बात उठा सकेंगे। कुछ बदलेगा या नहीं, यह इस पर है कि क्लाइंट स्लैब तुड़वाने का पैसा देगा या नहीं। नहीं देगा।","s":"draft"},"d.site_visit.analysis.during":{"en":"The only option that can change the outcome. Everything else on this list is you finding out.","t":"नतीजा बदल सकने वाला इकलौता विकल्प। इस लिस्ट की बाकी हर चीज़ में आप बस पता लगाते हैं।","s":"draft"},"d.truck_access.section":{"en":"THE SITE","t":"साइट","s":"draft"},"d.truck_access.prompt":{"en":"Have you checked a desludging truck can actually get here?","t":"आपने देखा है कि टैंक खाली करने वाला ट्रक यहाँ तक सच में आ सकता है?","s":"draft"},"d.truck_access.opt.assume":{"en":"The road's 20 feet wide. It'll manage","t":"सड़क 20 फुट चौड़ी है। आ जाएगा","s":"draft"},"d.truck_access.opt.measure":{"en":"Measure the turning radius and the gate width","t":"टर्निंग रेडियस और गेट की चौड़ाई नाप लीजिए","s":"draft"},"d.truck_access.opt.hose":{"en":"Measure it, and keep the tank within 30 m of where the truck can stand","t":"नापिए, और टैंक को ट्रक के खड़े होने की जगह से 30 m के अंदर रखिए","s":"draft"},"d.truck_access.reveal.fact":{"en":"A desludging truck needs roughly 3 m of width, space to turn, and its suction hose reaches about 30 m at best — less with bends and any lift.","t":"टैंक खाली करने वाले ट्रक को करीब 3 m चौड़ाई चाहिए, मुड़ने की जगह चाहिए, और उसकी सक्शन होज़ बहुत हुआ तो 30 m तक पहुँचती है — मोड़ और ऊँचाई हो तो और कम।","s":"draft"},"d.truck_access.reveal.cost":{"en":"Indicative: nil at design stage. Impossible to fix afterwards.","t":"अंदाज़न: डिज़ाइन के वक्त शून्य। बाद में ठीक करना नामुमकिन।","s":"draft"},"d.truck_access.reveal.twist":{"en":"The access that exists during construction is not the access that will exist later. The road gets narrowed by parking, the gate gets a pillar, the neighbour builds. Design for worse than today.","t":"निर्माण के वक्त जो एक्सेस है, वह आगे रहने वाला एक्सेस नहीं है। सड़क गाड़ियों की पार्किंग से सिकुड़ जाती है, गेट पर पिलर आ जाता है, पड़ोसी मकान बना लेता है। आज से बदतर हालत मानकर डिज़ाइन कीजिए।","s":"draft"},"d.truck_access.reveal.lesson":{"en":"Truck access is a design input that appears on no checklist and in no drawing. When it fails, the fallback is not a smaller truck — it's a person with a bucket.","t":"ट्रक का एक्सेस डिज़ाइन की वह शर्त है जो न किसी चेकलिस्ट में आती है, न किसी ड्रॉइंग में। जब वह फेल होता है, तो पीछे छोटा ट्रक नहीं बचता — एक आदमी और एक बाल्टी बचती है।","s":"draft"},"d.truck_access.analysis.assume":{"en":"Twenty feet today. Ask what it is after both neighbours park. The gap between 'it'll manage' and 'it didn't' is where manual emptying lives.","t":"आज बीस फुट। पूछिए कि दोनों पड़ोसियों की गाड़ियाँ खड़ी होने के बाद कितनी बचेगी। 'आ जाएगा' और 'नहीं आया' के बीच की जगह में ही हाथ से टैंक खाली करना रहता है।","s":"draft"},"d.truck_access.analysis.measure":{"en":"You turned an assumption into a number. That number can now be checked by somebody else, which is the whole point.","t":"आपने एक अंदाज़े को नंबर में बदल दिया। अब उस नंबर को कोई और भी जाँच सकता है, और बात ही यही है।","s":"draft"},"d.truck_access.analysis.hose":{"en":"You designed to the hose, not to the truck. That's the constraint that actually binds, and almost nobody thinks about it.","t":"आपने ट्रक नहीं, होज़ के हिसाब से डिज़ाइन किया। असल अड़चन वही है, और उसके बारे में लगभग कोई नहीं सोचता।","s":"draft"},"d.quote_line.section":{"en":"THE QUOTE","t":"एस्टीमेट","s":"draft"},"d.quote_line.prompt":{"en":"How does the septic tank appear in your quote?","t":"आपके एस्टीमेट में सेप्टिक टैंक कैसे दिखता है?","s":"draft"},"d.quote_line.opt.lumpsum":{"en":"\"Sanitation works — lump sum.\" One line","t":"\"सैनिटेशन वर्क्स — लमसम।\" एक लाइन","s":"draft"},"d.quote_line.opt.optional":{"en":"Base price without covers and vent. Those go in as extras","t":"बेस रेट, कवर और वेंट के बिना। वे एक्स्ट्रा में जाएँगे","s":"draft"},"d.quote_line.opt.itemised":{"en":"Itemised: tank, covers, vent, soak pit — each priced separately","t":"आइटम-वार: टैंक, कवर, वेंट, सोक पिट — हर एक का अलग रेट","s":"draft"},"d.quote_line.reveal.fact":{"en":"A lump-sum line lets the contractor choose the cheapest interpretation, legitimately. The client compared your number to another number; neither of them described the same tank.","t":"लमसम वाली एक लाइन ठेकेदार को पूरे हक के साथ सबसे सस्ता मतलब चुनने देती है। क्लाइंट ने आपके नंबर की तुलना किसी और नंबर से की; उन दोनों में से कोई भी एक ही टैंक की बात नहीं कर रहा था।","s":"draft"},"d.quote_line.reveal.cost":{"en":"Indicative: the covers and vent together are ₹6,000–11,000 — under 1% of a typical build, invisible inside a lump sum.","t":"अंदाज़न: कवर और वेंट मिलाकर ₹6,000–11,000 — आम मकान की लागत का 1% से भी कम, और लमसम के अंदर बिल्कुल गायब।","s":"draft"},"d.quote_line.reveal.twist":{"en":"Itemising can lose you the job, because a competitor's lump sum will look cheaper than your honest total. The market actively penalises the transparent quote.","t":"आइटम-वार रेट देने से काम हाथ से जा सकता है, क्योंकि सामने वाले का लमसम आपके ईमानदार जोड़ से सस्ता दिखेगा। बाज़ार साफ-साफ लिखे एस्टीमेट को सज़ा देता है।","s":"draft"},"d.quote_line.reveal.lesson":{"en":"Competitive quoting drives out exactly the items nobody can see. Unless the safety components are named lines, the bidding process deletes them on everyone's behalf.","t":"रेट की होड़ ठीक उन्हीं चीज़ों को बाहर कर देती है जो किसी को दिखती नहीं। जब तक सुरक्षा वाली चीज़ें नाम लेकर अलग लाइनों में न लिखी हों, बोली की प्रक्रिया उन्हें सबकी तरफ से मिटा देती है।","s":"draft"},"d.quote_line.analysis.lumpsum":{"en":"Standard practice, and it hands you the discretion to build the cheapest compliant tank. You will use it, because your margin is in there.","t":"आम चलन, और इससे आपके हाथ में यह छूट आ जाती है कि सबसे सस्ता चलने लायक टैंक बना दें। आप इस्तेमाल करेंगे भी, क्योंकि आपका मार्जिन वहीं पड़ा है।","s":"draft"},"d.quote_line.analysis.optional":{"en":"The worst of both. You've named the covers and the vent, which makes them a visible cost the client can now consciously decline. Most will.","t":"दोनों का सबसे खराब मेल। आपने कवर और वेंट का नाम ले लिया, जिससे वे दिखने वाला खर्च बन गए जिसे क्लाइंट अब सोच-समझकर मना कर सकता है। ज़्यादातर करेंगे।","s":"draft"},"d.quote_line.analysis.itemised":{"en":"You made the invisible items visible and quotable. It may cost you this job. It's also the only version where the client is genuinely choosing.","t":"आपने न दिखने वाली चीज़ों को दिखने वाला और रेट लगने लायक बना दिया। हो सकता है यह काम हाथ से चला जाए। यही इकलौता तरीका भी है जिसमें क्लाइंट सच में चुन रहा है।","s":"draft"},"d.labour_in_pit.section":{"en":"ON SITE","t":"साइट पर","s":"draft"},"d.labour_in_pit.prompt":{"en":"Someone has to go down and plaster the inside. Today.","t":"किसी को नीचे उतरकर अंदर प्लास्टर करना है। आज ही।","s":"draft"},"d.labour_in_pit.opt.whoever":{"en":"Whoever's free. It's ten minutes","t":"जो भी खाली हो। दस मिनट का काम है","s":"draft"},"d.labour_in_pit.opt.rope":{"en":"Our regular man, with a rope tied around him","t":"अपना पुराना आदमी, कमर में रस्सी बाँधकर","s":"draft"},"d.labour_in_pit.opt.kit":{"en":"Nobody goes down until it's aired out, and he has boots, gloves and a harness","t":"जब तक हवा नहीं निकल जाती कोई नहीं उतरेगा, और उसके पास बूट, दस्ताने और हार्नेस होंगे","s":"draft"},"d.labour_in_pit.reveal.fact":{"en":"The first person to enter the tank isn't the desludger in twenty years — it's a construction worker, this week, plastering it. A new tank is clean, so it feels like it isn't a confined space.","t":"टैंक में सबसे पहले उतरने वाला आदमी बीस साल बाद आने वाला सफाईकर्मी नहीं है — वह इसी हफ्ते प्लास्टर करने वाला निर्माण मज़दूर है। नया टैंक साफ होता है, इसलिए लगता ही नहीं कि यह बंद, दम घोंटने वाली जगह है।","s":"draft"},"d.labour_in_pit.reveal.cost":{"en":"Indicative: a blower and basic PPE is a few thousand rupees, reusable across every job you'll ever run.","t":"अंदाज़न: एक ब्लोअर और बुनियादी PPE कुछ हज़ार रुपये का है, और आपके हर आगे के काम में दोबारा चलेगा।","s":"draft"},"d.labour_in_pit.reveal.twist":{"en":"A rope around the waist is worse than nothing in a real emergency. An unconscious adult cannot be pulled vertically out of a narrow opening by one person — and the rescuer is usually the second casualty.","t":"असली आफत के वक्त कमर में बँधी रस्सी कुछ न होने से भी बुरी है। बेहोश आदमी को एक अकेला आदमी सँकरे मुँह से सीधा ऊपर नहीं खींच सकता — और बचाने वाला आमतौर पर दूसरा शिकार होता है।","s":"draft"},"d.labour_in_pit.reveal.lesson":{"en":"The habits set during construction become the habits of maintenance. If a person goes in casually while the tank is clean, a person will go in when it isn't.","t":"निर्माण के दौरान जो आदत बनती है, वही मेंटेनेंस की आदत बन जाती है। अगर टैंक साफ रहते हुए कोई यूँ ही उतर जाता है, तो गंदा होने पर भी कोई उतरेगा।","s":"draft"},"d.labour_in_pit.analysis.whoever":{"en":"It is ten minutes, and it's almost always fine. 'Almost always fine' is exactly the shape of the risk — the practice is normalised long before the day it isn't.","t":"दस मिनट का ही काम है, और लगभग हमेशा ठीक ही रहता है। खतरे की शक्ल यही है — 'लगभग हमेशा ठीक'। जिस दिन ठीक नहीं रहेगा, उससे बहुत पहले यह आदत आम हो चुकी होती है।","s":"draft"},"d.labour_in_pit.analysis.rope":{"en":"The instinct is right and the mechanism doesn't work. Plan how you'd get him out unconscious; if the answer involves pulling, it isn't a plan.","t":"सोच सही है, तरीका काम नहीं करता। यह तय कीजिए कि बेहोश हालत में उसे बाहर कैसे निकालेंगे; अगर जवाब में खींचना है, तो वह प्लान नहीं है।","s":"draft"},"d.labour_in_pit.analysis.kit":{"en":"You treated a clean new tank as a confined space, which is the only correct reading of it. This is also the moment your crew learns that's the rule.","t":"आपने साफ, नए टैंक को भी बंद दम घोंटने वाली जगह माना, और उसे इसी तरह देखना ही सही है। आपकी टीम भी इसी वक्त सीखती है कि नियम यही है।","s":"draft"},"d.slab_call.section":{"en":"THE TOP","t":"ऊपर का हिस्सा","s":"draft"},"d.slab_call.prompt":{"en":"The drawing says nothing about the top. You're casting tomorrow.","t":"ड्रॉइंग में ऊपर के हिस्से के बारे में कुछ नहीं लिखा। ढलाई कल है।","s":"draft"},"d.slab_call.opt.flush":{"en":"Flush slab. That's how we've always done it","t":"फ्लश स्लैब। हम हमेशा से ऐसे ही करते आए हैं","s":"draft"},"d.slab_call.opt.ask":{"en":"Call the engineer and ask","t":"इंजीनियर को फोन करके पूछिए","s":"draft"},"d.slab_call.opt.covers":{"en":"Leave two covers. Costs me half a bag of cement, saves somebody's day later","t":"दो कवर छोड़ दीजिए। मेरा आधा बोरी सीमेंट लगेगा, आगे किसी का दिन बच जाएगा","s":"draft"},"d.slab_call.reveal.fact":{"en":"Where the drawing is silent, the maistry decides — and this is the single highest-leverage uninstructed decision on the whole site. Nobody will review it, and it is permanent the moment the concrete sets.","t":"जहाँ ड्रॉइंग चुप है, वहाँ मिस्त्री तय करता है — और पूरी साइट पर बिना किसी हुक्म के लिया गया यह सबसे भारी असर वाला फैसला है। इसे कोई जाँचेगा नहीं, और कंक्रीट जमते ही यह हमेशा के लिए पक्का हो जाता है।","s":"draft"},"d.slab_call.reveal.cost":{"en":"Indicative: two cover frames are ₹4,000–8,000 and one extra hour of shuttering.","t":"अंदाज़न: दो कवर फ्रेम ₹4,000–8,000 के, और शटरिंग का एक घंटा ज़्यादा।","s":"draft"},"d.slab_call.reveal.twist":{"en":"Maistries who leave covers often get asked to remove them, because the owner thinks they look unfinished. The safety feature reads as incomplete work.","t":"जो मिस्त्री कवर छोड़ देते हैं, उनसे अक्सर उन्हें हटाने को कहा जाता है, क्योंकि मालिक को लगता है कि काम अधूरा दिख रहा है। सुरक्षा वाली चीज़ अधूरे काम जैसी दिखती है।","s":"draft"},"d.slab_call.reveal.lesson":{"en":"The person with the least formal authority makes the decision with the most consequence, under time pressure, with no instruction and no one to ask. That is the system, not an accident.","t":"जिसके पास सबसे कम आधिकारिक अधिकार है, वही सबसे बड़े नतीजे वाला फैसला लेता है — वक्त के दबाव में, बिना किसी हुक्म के, और बिना किसी से पूछने की गुंजाइश के। यह सिस्टम है, इत्तेफाक नहीं।","s":"draft"},"d.slab_call.analysis.flush":{"en":"Habit, and habit is usually good engineering compressed into muscle memory. Not here — this habit formed when tanks were shallower and nobody costed the person opening them.","t":"आदत, और आदत आमतौर पर अच्छी इंजीनियरिंग ही होती है जो हाथों में बस गई हो। यहाँ नहीं — यह आदत तब बनी जब टैंक कम गहरे होते थे और उन्हें खोलने वाले आदमी का हिसाब कोई नहीं लगाता था।","s":"draft"},"d.slab_call.analysis.ask":{"en":"You escalated an uninstructed decision to the person who should have instructed it. Whether they pick up is the test of whether the chain works at all.","t":"बिना हुक्म वाला फैसला आपने उसी के पास भेजा जिसे हुक्म देना चाहिए था। वह फोन उठाता है या नहीं, यही जाँच है कि यह पूरी कड़ी काम भी करती है या नहीं।","s":"draft"},"d.slab_call.analysis.covers":{"en":"You spent your own margin on somebody you'll never meet. If the owner asks you to plaster over them, this is the argument worth having.","t":"आपने अपना ही मार्जिन ऐसे आदमी पर खर्च किया जिससे आप कभी मिलेंगे नहीं। अगर मालिक उन्हें प्लास्टर से बंद करने को कहे, तो यह बहस करने लायक है।","s":"draft"},"d.depth.section":{"en":"THE DIG","t":"खुदाई","s":"draft"},"d.depth.prompt":{"en":"How deep do you dig?","t":"कितना गहरा खोदेंगे?","s":"draft"},"d.depth.opt.deep":{"en":"As deep as the soil allows. More capacity, fewer complaints","t":"जितना मिट्टी इजाज़त दे। कैपेसिटी ज़्यादा, शिकायतें कम","s":"draft"},"d.depth.opt.standard":{"en":"Standard depth. Deeper than this and a man can't work in it","t":"स्टैंडर्ड गहराई। इससे गहरा हुआ तो आदमी अंदर काम नहीं कर पाएगा","s":"draft"},"d.depth.opt.shallow":{"en":"Shallow and wide. Harder to dig, easier to reach into","t":"कम गहरा और चौड़ा। खोदने में मुश्किल, अंदर हाथ पहुँचाने में आसान","s":"draft"},"d.depth.reveal.fact":{"en":"Depth is chosen for capacity in a tight plot. But suction hoses lose lift with depth, and beyond roughly 2 m the sludge at the bottom stops coming up reliably.","t":"छोटे प्लॉट में गहराई कैपेसिटी के लिए चुनी जाती है। पर गहराई बढ़ने पर सक्शन होज़ की खींच घटती जाती है, और करीब 2 m से नीचे तली का स्लज भरोसे से ऊपर आना बंद कर देता है।","s":"draft"},"d.depth.reveal.cost":{"en":"Indicative: shallow-and-wide costs more to excavate and takes more plot area. It is the trade almost nobody makes.","t":"अंदाज़न: कम गहरा और चौड़ा टैंक खोदने में ज़्यादा खर्चीला है और प्लॉट की ज़्यादा जगह लेता है। यह सौदा लगभग कोई नहीं करता।","s":"draft"},"d.depth.reveal.twist":{"en":"Depth is invisible after backfilling. The desludger arriving in 2048 has no way to know how deep this tank is until the hose comes up empty — and then the decision to climb in gets made in thirty seconds.","t":"मिट्टी भरने के बाद गहराई दिखती नहीं। 2048 में आने वाले सफाईकर्मी के पास यह जानने का कोई तरीका नहीं कि यह टैंक कितना गहरा है, जब तक होज़ खाली ऊपर न आ जाए — और फिर अंदर उतरने का फैसला तीस सेकंड में हो जाता है।","s":"draft"},"d.depth.reveal.lesson":{"en":"Every metre of depth converts a hose job into a body job. Capacity is a number on paper; depth is a number in somebody's lungs.","t":"गहराई का हर मीटर होज़ के काम को शरीर के काम में बदल देता है। कैपेसिटी कागज़ पर एक नंबर है; गहराई किसी के फेफड़ों में एक नंबर है।","s":"draft"},"d.depth.analysis.deep":{"en":"Maximum capacity for the footprint, and you've put the sludge below the reach of suction. This is the geometry that most often ends in an entry.","t":"उतनी ही जगह में सबसे ज़्यादा कैपेसिटी, और आपने स्लज को सक्शन की पहुँच से नीचे पहुँचा दिया। यही वह बनावट है जो सबसे ज़्यादा बार किसी के अंदर उतरने पर खत्म होती है।","s":"draft"},"d.depth.analysis.standard":{"en":"A sound compromise, and notice your own reasoning — you already sized it around a man being in there. Worth asking why he's in there at all.","t":"ठीक-ठाक बीच का रास्ता, और अपनी ही सोच पर गौर कीजिए — आपने नाप ही इस हिसाब से रखा कि अंदर एक आदमी होगा। पूछने लायक है कि वह अंदर है ही क्यों।","s":"draft"},"d.depth.analysis.shallow":{"en":"More digging, more plot, and a tank a hose can actually clear. You optimised for the job nobody pays you to think about.","t":"खुदाई ज़्यादा, प्लॉट ज़्यादा, और एक ऐसा टैंक जिसे होज़ सच में खाली कर सकती है। आपने उस काम के हिसाब से सोचा जिसके बारे में सोचने के पैसे कोई आपको नहीं देता।","s":"draft"},"d.speak_up.section":{"en":"THE ROOM","t":"कमरे में","s":"draft"},"d.speak_up.prompt":{"en":"You know the flush slab is wrong. The owner is standing right there.","t":"आपको पता है कि फ्लश स्लैब गलत है। मालिक ठीक सामने खड़ा है।","s":"draft"},"d.speak_up.opt.quiet":{"en":"Say nothing. He's paying, and he wants it clean","t":"चुप रहिए। पैसा वही दे रहा है, और उसे साफ-सुथरा चाहिए","s":"draft"},"d.speak_up.opt.mention":{"en":"Mention it once. If he says no, it's on him","t":"एक बार कह दीजिए। मना कर दे तो उसकी ज़िम्मेदारी","s":"draft"},"d.speak_up.opt.insist":{"en":"Tell him plainly: in ten years somebody breaks this open with a hammer","t":"सीधे कह दीजिए: दस साल बाद कोई इसे हथौड़े से तोड़कर खोलेगा","s":"draft"},"d.speak_up.reveal.fact":{"en":"Site knowledge is real and almost entirely unspoken. The people who best understand what a buried tank does are furthest down the hierarchy that decides what gets built.","t":"साइट की जानकारी असली होती है और लगभग पूरी तरह अनकही रहती है। दबा हुआ टैंक क्या करता है, यह सबसे अच्छी तरह वही लोग समझते हैं जो यह तय करने वाली सीढ़ी में सबसे नीचे हैं कि बनेगा क्या।","s":"draft"},"d.speak_up.reveal.cost":{"en":"Indicative: nothing, except the risk of being seen as difficult by the person who pays you and refers you.","t":"अंदाज़न: कुछ नहीं, सिवाय इस खतरे के कि जो आदमी पैसा देता है और आगे आपका नाम चलाता है, वह आपको झगड़ालू समझने लगे।","s":"draft"},"d.speak_up.reveal.twist":{"en":"When maistries do speak up, owners frequently agree — the objection was never really about money. But the maistry rarely finds out, because he only raises it once and reads the pause as a no.","t":"जब मिस्त्री बोलते हैं, तो मालिक अक्सर मान जाते हैं — एतराज़ असल में कभी पैसे का था ही नहीं। पर मिस्त्री को यह कम ही पता चलता है, क्योंकि वह बात एक ही बार उठाता है और थोड़ी-सी चुप्पी को ना समझ लेता है।","s":"draft"},"d.speak_up.reveal.lesson":{"en":"The information needed to build this tank well is already on the site. What's missing is a channel where it can be said without professional cost to the person saying it.","t":"इस टैंक को ढंग से बनाने के लिए जो जानकारी चाहिए, वह साइट पर पहले से मौजूद है। कमी उस रास्ते की है जहाँ वह बात कहने वाले को अपने काम का नुकसान उठाए बिना कही जा सके।","s":"draft"},"d.speak_up.analysis.quiet":{"en":"Rational. You're protecting a livelihood built on referrals, and being the difficult maistry is expensive. The knowledge stays with you and dies there.","t":"समझदारी की बात। आप ऐसी रोज़ी बचा रहे हैं जो मुँह-ज़बानी सिफारिशों पर टिकी है, और झगड़ालू मिस्त्री होना महँगा पड़ता है। जानकारी आपके पास ही रह जाती है और वहीं खत्म हो जाती है।","s":"draft"},"d.speak_up.analysis.mention":{"en":"You transferred the decision, and with it the responsibility. That's fair — and 'mentioned once, quietly' is a low bar for a permanent outcome.","t":"आपने फैसला आगे सरका दिया, और उसके साथ ज़िम्मेदारी भी। यह जायज़ है — और जो नतीजा हमेशा के लिए है, उसके लिए 'एक बार धीरे से कह दिया' बहुत नीचा पैमाना है।","s":"draft"},"d.speak_up.analysis.insist":{"en":"You put a human being into the conversation, which is the only framing that reliably moves an owner. You may also have made this job harder for yourself.","t":"आपने बातचीत में एक इंसान को ला खड़ा किया, और मालिक को हिलाने वाला भरोसेमंद तरीका यही अकेला है। हो सकता है आपने यह काम अपने लिए मुश्किल भी कर लिया हो।","s":"draft"},"d.record.section":{"en":"AFTER","t":"बाद में","s":"draft"},"d.record.prompt":{"en":"Once it's buried, the only record of what's down there is in your head.","t":"एक बार दब गया, तो नीचे क्या है इसका इकलौता रिकॉर्ड आपके दिमाग में है।","s":"draft"},"d.record.opt.nothing":{"en":"Nothing. I'll remember","t":"कुछ नहीं। मुझे याद रहेगा","s":"draft"},"d.record.opt.photo":{"en":"Take photos on my phone before backfilling","t":"मिट्टी भरने से पहले फोन में फोटो ले लूँगा","s":"draft"},"d.record.opt.mark":{"en":"Photos, and a marker stone set over each cover","t":"फोटो, और हर कवर के ऊपर एक निशान का पत्थर","s":"draft"},"d.record.reveal.fact":{"en":"There is no as-built record for household sanitation anywhere in this chain. The tank's depth, chamber layout and cover positions exist only as memory, and memory moves away or dies.","t":"इस पूरी कड़ी में घर की सैनिटेशन का ऐज़-बिल्ट रिकॉर्ड कहीं नहीं होता। टैंक की गहराई, चैंबर की बनावट और कवर की जगह सिर्फ याददाश्त में हैं, और याददाश्त या तो कहीं और चली जाती है या खत्म हो जाती है।","s":"draft"},"d.record.reveal.cost":{"en":"Indicative: nil. A phone and ten minutes before the backfill.","t":"अंदाज़न: शून्य। एक फोन, और मिट्टी भरने से पहले दस मिनट।","s":"draft"},"d.record.reveal.twist":{"en":"The first task of most desludging visits is finding the tank. Workers probe the yard with rods, then break the slab where it sounds hollow — a search that routinely takes longer than the emptying.","t":"टैंक खाली करने आने वालों का पहला काम अक्सर टैंक ढूँढ़ना ही होता है। मज़दूर आँगन में सरिया घुसाकर टटोलते हैं, फिर जहाँ खोखली आवाज़ आए वहाँ स्लैब तोड़ते हैं — और यह ढूँढ़ना अक्सर खाली करने से ज़्यादा वक्त लेता है।","s":"draft"},"d.record.reveal.lesson":{"en":"Twenty-two years is longer than any memory on this site will last. Without a record, the next person starts by guessing, and guessing with a hammer is how the covers you built get destroyed.","t":"इस साइट की कोई भी याददाश्त बाईस साल नहीं टिकेगी। रिकॉर्ड न हो तो अगला आदमी अंदाज़े से शुरू करता है, और हथौड़े के साथ लगाया गया अंदाज़ा ही आपके बनाए कवर तोड़ डालता है।","s":"draft"},"d.record.analysis.nothing":{"en":"You will remember, for a while. You won't be reachable in 2048, and the house will have changed hands at least once.","t":"आपको याद रहेगा, कुछ समय तक। 2048 में आप तक कोई पहुँच नहीं पाएगा, और मकान कम से कम एक बार हाथ बदल चुका होगा।","s":"draft"},"d.record.analysis.photo":{"en":"Ten minutes of phone storage becomes the only as-built document this tank will ever have. Send them to the owner — your phone won't survive twenty-two years either.","t":"फोन में दस मिनट में ली गई फोटो ही इस टैंक का इकलौता ऐज़-बिल्ट कागज़ बन जाती है। उन्हें मालिक को भेज दीजिए — आपका फोन भी बाईस साल नहीं चलेगा।","s":"draft"},"d.record.analysis.mark":{"en":"Photos plus a physical marker. The marker is the part that works, because it speaks to the person standing in the yard with a rod and no information.","t":"फोटो और ऊपर से एक असली निशान। काम निशान ही करता है, क्योंकि वह उस आदमी से बात करता है जो हाथ में सरिया लिए, बिना किसी जानकारी के आँगन में खड़ा है।","s":"draft"},"verdict.safe.title":{"en":"Emptiable","t":"खाली हो सकता है","s":"draft"},"verdict.safe.body":{"en":"A truck can reach this. A hose can clear it. The atmosphere is vented before anyone lifts a cover. In 2048 this is a job, done from the outside, in forty minutes.","t":"ट्रक यहाँ तक पहुँच सकता है। होज़ इसे खाली कर सकती है। कवर उठाने से पहले ही अंदर की हवा निकल चुकी होती है। 2048 में यह बस एक काम है, बाहर से, चालीस मिनट में।","s":"draft"},"verdict.difficult.title":{"en":"Difficult","t":"मुश्किल","s":"draft"},"verdict.difficult.body":{"en":"It can be emptied, but not easily, and not every time. Somewhere in here is a gap — the hose doesn't quite reach, or the opening is tight, or the air is bad. Each visit, somebody decides whether to work around it or climb in. Most days they work around it.","t":"खाली हो जाएगा, पर आसानी से नहीं, और हर बार नहीं। कहीं न कहीं एक कमी है — या तो होज़ पूरी नहीं पहुँचती, या मुँह तंग है, या हवा खराब है। हर बार कोई तय करता है कि जुगाड़ से काम चलाए या अंदर उतर जाए। ज़्यादातर दिन जुगाड़ से चल जाता है।","s":"draft"},"verdict.unsafe.title":{"en":"Someone goes in","t":"कोई अंदर उतरता है","s":"draft"},"verdict.unsafe.body":{"en":"There is no version of emptying this tank that doesn't put a person inside it. Not because anyone chose that — because every route that avoided it was
